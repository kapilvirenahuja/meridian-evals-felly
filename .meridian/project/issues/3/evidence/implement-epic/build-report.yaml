        nav_link_added: true

    f2_1_search:
      api_route: 'GET /api/v1/marketplace/mentors'
      filters: ['q', 'category', 'priceMin', 'priceMax', 'rating', 'hasAvailability']
      privacy_enforced: true
      forbidden_fields:
        ['status', 'rejectionReason', 'verificationArtefacts', 'completeness', 'passwordHash']
      redis_cache_ttl: 300
      fire_and_forget_wired:
        admin_service: true
        user_service: true
      frontend:
        components: ['SearchBar', 'MentorFilters', 'MentorCard']
        hook: 'useMentors'

    f2_5_pagination:
      params: ['sort', 'page', 'limit']
      defaults: { page: 1, limit: 12, sort: 'relevance', max_limit: 50 }
      total_pages_computed: true
      sort_options: ['relevance', 'price_asc', 'price_desc', 'rating_desc']
      frontend:
        components: ['PaginationControls', 'SortControl']

    f2_3_profile:
      api_route: 'GET /api/v1/marketplace/mentors/:id'
      verified_returns_200: true
      pending_returns_404: true
      nonexistent_returns_404: true
      redis_cache_ttl: 600
      ssr_page: '/mentors/[id]'
      generate_metadata: true
      not_found_on_404: true

    f2_6_availability:
      availability_display_component: true
      mentor_card_availability_indicator: true
      filter_has_availability: true
      opensearch_document_has_availability: true

    f2_4_recommendations:
      api_route: 'GET /api/v1/marketplace/recommendations'
      auth_required: true
      role_restricted: 'MENTEE'
      no_jwt_returns_401: true
      mentor_role_returns_403: true
      mentee_with_interests_returns_200: true
      empty_interests_returns_empty: true
      max_results: 8
      matching_categories_intersection_only: true
      frontend:
        component: 'RecommendedMentors'
        hook: 'useRecommendations'
        client_side_only: true

