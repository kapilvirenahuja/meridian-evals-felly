          action: created
          summary: 'DTO with @IsEmail validation for forgot-password endpoint'
        - path: 'packages/backend-api/src/auth/dto/reset-password.dto.ts'
          action: created
          summary: 'DTO with @IsString token and @MinLength(8) + @Matches (letter+number) newPassword validation'
      verified: true
      deviation: null

    - step: 3
      description: 'Extend IAuthAdapter interface with F1.3 methods'
      files_modified:
        - path: 'packages/backend-api/src/auth/adapters/auth-adapter.interface.ts'
          action: modified
          summary: 'Added generateResetToken(userId), verifyResetToken(token), updatePassword(userId, newHash), invalidateAllUserRefreshTokens(userId)'
      verified: true
      deviation: null

    - step: 4
      description: 'Add PASSWORD_RESET_TTL_MS constant'
      files_modified:
        - path: 'packages/backend-api/src/common/constants.ts'
          action: modified
          summary: 'Added PASSWORD_RESET_TTL_MS = 60 * 60 * 1000 (60 minutes)'
      verified: true
      deviation: null

    - step: 5
      description: 'Implement F1.3 methods in MockAuthAdapter'
      files_modified:
        - path: 'packages/backend-api/src/auth/adapters/mock-auth.adapter.ts'
          action: modified
          summary: 'Added passwordResetTokens Map (UUID v4, 60-min TTL, single-use), invalidatedUsers Set for user-level session invalidation, generateResetToken, verifyResetToken, updatePassword (stub), invalidateAllUserRefreshTokens. Updated isRefreshTokenInvalidated to check invalidatedUsers by JWT decode.'
      verified: true
      deviation: null

    - step: 6
      description: 'Add forgotPassword and resetPassword to AuthService'
      files_modified:
        - path: 'packages/backend-api/src/auth/auth.service.ts'
          action: modified
          summary: 'forgotPassword: normalizes email, looks up user, generates reset token, logs PASSWORD_RESET_REQUESTED; always returns {success:true}. resetPassword: verifies token, hashes new password, updates DB, invalidates all user sessions, logs PASSWORD_CHANGED.'
      verified: true
      deviation: 'Used PASSWORD_CHANGED audit action (existing enum) instead of PASSWORD_RESET_COMPLETED (not in Prisma schema AuditAction enum)'

    - step: 7
      description: 'Add forgot-password and reset-password endpoints to AuthController'
      files_modified:
        - path: 'packages/backend-api/src/auth/auth.controller.ts'
          action: modified
          summary: 'Added POST /auth/forgot-password → forgotPassword(dto.email) and POST /auth/reset-password → resetPassword(dto.token, dto.newPassword), both HTTP 200'
      verified: true
      deviation: null

    - step: 8
      description: 'Update auth.service.spec.ts mock to include F1.3 adapter methods'
      files_modified:
        - path: 'packages/backend-api/src/auth/__tests__/auth.service.spec.ts'
          action: modified
          summary: 'Added generateResetToken, verifyResetToken, updatePassword, invalidateAllUserRefreshTokens stubs to existing mock adapter to satisfy TypeScript after interface extension'
      verified: true
      deviation: null

    - step: 9
      description: 'Create forgot-password frontend page'
      files_modified:
        - path: 'packages/mentee-web-app/src/app/(auth)/forgot-password/page.tsx'
          action: created
          summary: 'Client component with email form, react-hook-form + zod validation, apiClient POST /auth/forgot-password, success state shows confirmation message (no email enumeration on frontend)'
      verified: true
      deviation: null

    - step: 10
      description: 'Create reset-password frontend page'
      files_modified:
        - path: 'packages/mentee-web-app/src/app/(auth)/reset-password/page.tsx'
          action: created
          summary: 'Client component reading token from URL query param, newPassword + confirmPassword fields with zod validation (>=8 chars, letter+number), apiClient POST /auth/reset-password, 400 handling, success state'
