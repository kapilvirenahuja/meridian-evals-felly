# ─── Thesis ───────────────────────────────────────────────────────────────────
thesis: >
  Felly Club bets that a web-first, admin-curated mentorship marketplace
  covering four underserved verticals — Sport, Entrepreneurship, Business,
  and Entertainment — can capture initial market share by delivering an
  end-to-end session lifecycle (discovery → booking → escrow payment → video
  delivery → ratings → dispute resolution) with multi-currency support across
  India, Switzerland, USA, and Germany, all within a 16-week, €125,000
  fixed-budget delivery, by sequencing foundation-first (identity and trust),
  then transaction-core (sessions and payments), then platform maturity
  (compliance, analytics, acquisition), deferring mobile and advanced features
  to Phase 2.

# ─── Narrative ────────────────────────────────────────────────────────────────
narrative: |
  The sequencing of Felly Club's 10 epics across three horizons is driven by a
  single organising principle: nothing can transact until identity, discovery,
  sessions, and payments form a functioning end-to-end chain. E1 (User Identity
  & Profile Foundation) is the mandatory foundation — every downstream epic
  depends on authenticated, role-assigned users with admin-verified mentor
  profiles. E2 (Mentor Marketplace & Discovery) immediately follows, making
  the curated mentor supply visible and searchable. E3 (Session Lifecycle &
  Video Delivery) and E4 (Payment Processing & Financial Operations) complete
  the near-horizon by turning the marketplace into a transactional platform
  where mentees can discover, book, attend, and pay for sessions. These four
  epics represent the minimum viable transaction loop — without any one of
  them, Felly Club is a directory, not a marketplace.

  The mid-horizon shifts focus to platform integrity and operational control.
  E5 (Ratings, Reviews & Dispute Resolution) closes the trust feedback loop
  that differentiates Felly Club from competitors without quality signals.
  E6 (Platform Administration & Operations) delivers the admin portal that
  the curated-marketplace model depends on — mentor onboarding approvals,
  commission configuration, payout management, and dispute resolution all
  require operational tooling. E7 (Communications & Notification Centre)
  replaces the mock email notifications used by E3 and E4 with branded
  SendGrid delivery and an in-app notification centre, ensuring real users
  receive reliable, professional communications before the platform goes
  live. E8 (Regulatory Compliance & Data Security) implements GDPR consent
  management (including the per-session recording consent gate resolved in
  pre-lock), PCI DSS validation, right-to-deletion, and security hardening
  — all mandatory for legal operation in EU markets (Germany, Switzerland)
  and India.

  The far-horizon delivers growth and visibility capabilities that depend on
  stable transaction data. E9 (Analytics & Performance Dashboards) provides
  persona-specific dashboards for mentors (earnings, ratings), mentees
  (session history, spending), and admin (GMV, session volume, quality KPIs).
  E10 (Referral Programme & User Acquisition) launches the organic growth
  channel — referral link generation, attribution tracking, and reward
  fulfilment on first completed session. Both epics read from the session,
  payment, and user data produced by the near- and mid-horizon epics, making
  their late sequencing both a dependency requirement and a risk-reduction
  strategy.

  A key pre-lock resolution removes mobile app delivery from the MVP scope,
  making Felly Club web-only (mentee web app + admin portal) for the initial
  launch. This eliminates the React Native technology decision (I-01), reduces
  the delivery surface, and focuses the €125,000 budget on a single channel
  with full end-to-end quality. Mobile delivery is deferred to Phase 2
  alongside mentor self-registration, AI/ML recommendations, subscription
  pricing, and other post-MVP capabilities.

