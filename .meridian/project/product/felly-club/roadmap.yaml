# ─── Feasibility ──────────────────────────────────────────────────────────────
feasibility:
  - epic_ref: "E1"
    epic_name: "User Identity & Profile Foundation"
    risk_level: "medium"
    technical_risks:
      - "KeyCloak integration complexity — realm configuration, client registration, and RBAC role mapping for 3 personas"
      - "Social login OAuth flow (Google and Apple) on top of KeyCloak identity brokering; Apple requires paid Developer account"
      - "Admin-driven mentor onboarding with file uploads (verification artefacts) — storage, validation, and admin review queue built from scratch"
    blockers: []
    sequencing_constraints: >
      E1 is the mandatory foundation — no other epic can begin until E1's auth,
      profile, and RBAC layers are stable. Must ship in W1–W3.
    architecture_impact: >
      Establishes IAM foundation (KeyCloak, JWT, RBAC, API gateway auth middleware),
      file storage infrastructure (verification artefacts), and user/mentor_profile
      data model schema referenced by all subsequent epics.

  - epic_ref: "E2"
    epic_name: "Mentor Marketplace & Discovery"
    risk_level: "medium"
    technical_risks:
      - "Elasticsearch setup, index design, and event-driven sync pipeline — broken sync produces stale search results"
      - "Category taxonomy consistency — rule-based recommendations require enforced enum categories, not free-text"
      - "Empty-state handling for new marketplace with potentially thin mentor supply at launch"
    blockers: []
    sequencing_constraints: >
      Depends on E1 for verified mentor profiles. E3 depends on E2 for mentor
      discovery before session booking.
    architecture_impact: >
      Introduces Elasticsearch as a second data store alongside the relational
      database. Requires an index sync strategy. Pagination pattern established
      here is reused across E9 analytics views.

  - epic_ref: "E3"
    epic_name: "Session Lifecycle & Video Delivery"
    risk_level: "high"
    technical_risks:
      - "Video provider API integration (Zoom preferred for MVP) — meeting creation, recording callbacks, webhook delivery"
      - "Session state machine with 8 states and multiple transition triggers — state bugs can leave sessions in inconsistent states"
      - "Auto-recording with 3-day TTL, admin-only access, and GDPR per-session consent gate at session join"
      - "GDPR recording consent (I-05 resolved) — per-session explicit consent mechanism required for both parties before recording starts"
    blockers:
      - "I-05 RESOLVED: Per-session explicit consent required. E3 join flow must include a consent gate for both mentor and mentee before recording begins."
    sequencing_constraints: >
      Depends on E1 and E2. E4 payment capture triggers on session booking and
      completion. E5 depends on E3 completion state. E7 mocks are used during E3
      and replaced after E7 ships.
    architecture_impact: >
      Introduces the session state machine, webhook ingestion layer for video
      provider events, recording storage infrastructure with TTL lifecycle policies,
      and the notification interface that E7 must implement.

  - epic_ref: "E4"
    epic_name: "Payment Processing & Financial Operations"
    risk_level: "high"
    technical_risks:
      - "Stripe escrow via delayed capture (7-day limit) — sessions scheduled >7 days ahead require re-authorisation strategy"
      - "Dual Stripe account architecture — separate Stripe India (INR) and Stripe Global (USD/CHF/EUR) with different settlement rails"
      - "Stripe Connect mentor onboarding — handled in E4 scope per pre-lock resolution, not E1"
      - "Webhook reliability — idempotent processing, signature validation, dead-letter queuing for failed events"
    blockers:
      - "CB-2 RESOLVED: Separate Stripe India entity for INR and global Stripe account for USD/CHF/EUR. Dual-account routing required."
      - "CB-3 RESOLVED: Stripe Connect mentor onboarding kept out of E1. Handled as part of E4 or as a separate setup step."
    sequencing_constraints: >
      Depends on E3 for session booking and completion triggers. E5 refunds depend
      on E4. E6 financial operations depend on E4 data model. E9 reads E4 financial
      records.
    architecture_impact: >
      Introduces Stripe with Payment Intents (escrow), Stripe Connect (mentor payouts),
      dual-account routing (India/Global), and financial data model (transactions,
      escrow records, payout queue, commission ledger).

  - epic_ref: "E5"
    epic_name: "Ratings, Reviews & Dispute Resolution"
    risk_level: "medium"
    technical_risks:
      - "Auto-flagging triggers must be idempotent — duplicate flags or missed triggers degrade quality monitoring"
      - "Session recording 3-day TTL creates a hard window for dispute evidence access; disputes must be filed within retention period"
      - "Abuse reporting scope and triage — resolution workflow must remain distinct from dispute resolution"
    blockers: []
    sequencing_constraints: >
      Depends on E3 (completed session state) and E4 (dispute-triggered refunds).
      Sequenced to mid-bucket after E3 and E4 are stable.
    architecture_impact: >
      Introduces rating/review data model, auto-flagging event pipeline, and dispute
      state machine. Reads session recordings from E3's storage. Triggers E4 refund
      API on dispute resolution.

  - epic_ref: "E6"
    epic_name: "Platform Administration & Operations"
    risk_level: "medium"
    technical_risks:
      - "Strapi CMS integration adds a third persistent data store; template sync between Strapi and SendGrid (E7)"
      - "Configuration changes (commission rates, policies) must apply only to NEW sessions — version-at-capture semantics required"
      - "Platform-wide admin search against production tables needs read replicas and query timeout limits"
    blockers: []
    sequencing_constraints: >
      Admin session management depends on E3, financial operations on E4, dispute UI
      on E5. System configuration (commission rates, policies) is needed by E3/E4 —
      stubbed defaults used until E6 delivers dynamic config.
    architecture_impact: >
      Adds Strapi CMS as third persistence layer. Establishes system configuration
      service as shared dependency. Version-at-capture pattern for commission rates.
      Admin portal is a separate frontend with KeyCloak RBAC admin role auth.

  - epic_ref: "E7"
    epic_name: "Communications & Notification Centre"
    risk_level: "low"
    technical_risks:
      - "Replacing mock notifications from E3/E4 with SendGrid — requires clean notification interface abstraction"
      - "Firebase Cloud Messaging for push notifications — device token registration and silent failure handling (web-only for MVP)"
      - "SendGrid deliverability — domain authentication (SPF, DKIM, DMARC) setup needed in Sprint 1"
    blockers: []
    sequencing_constraints: >
      Depends on E1 for user preferences. De-mocks E3 and E4 notifications — should
      ship before E3/E4 reach production to avoid mocked notifications for real users.
    architecture_impact: >
      Introduces Twilio SendGrid and FCM as communication infrastructure. Establishes
      notification service as a shared platform component. In-app notification centre
      adds notifications data model.

  - epic_ref: "E8"
    epic_name: "Regulatory Compliance & Data Security"
    risk_level: "high"
    technical_risks:
      - "Right-to-deletion cascade across all data stores (relational DB, Elasticsearch, S3, SendGrid, notifications)"
      - "TPDP (India) rules partially notified — GDPR-equivalent controls used as baseline per pre-lock resolution"
      - "Encryption at rest (AES-256) requires key management infrastructure; field-level vs database-level decision"
      - "Recording consent audit — must verify E3's per-session consent gate is GDPR-compliant"
    blockers:
      - "CB-1 RESOLVED: Per-session explicit GDPR consent required for recording. E3 join flow implements consent gate. E8 audits compliance."
    sequencing_constraints: >
      Depends on E1 (identity for right-to-deletion) and E4 (PCI DSS audit of
      tokenisation). Must be validated in staging before production launch.
      Security hardening (TLS, JWT, secure headers) should begin in Sprint 1 as
      infrastructure provisioning.
    architecture_impact: >
      Adds deletion orchestrator as cross-cutting compliance component. Cookie consent
      requires frontend changes across all pages. JWT security audit may require E1
      auth changes. Compliance audit trail adds logging infrastructure shared with E9.

  - epic_ref: "E9"
    epic_name: "Analytics & Performance Dashboards"
    risk_level: "low"
    technical_risks:
      - "Dashboard queries on production tables without read replicas degrade platform performance"
      - "Analytics data consistency depends on accuracy of E1/E3/E4 data — incorrect upstream data produces misleading dashboards"
      - "Schedule risk — E9 is far-bucket and depends on upstream epics delivering on time"
    blockers: []
    sequencing_constraints: >
      Depends on E1, E3, and E4 for stable data models. Read replicas and summary
      tables should be provisioned from day one. Dashboard development can proceed
      in parallel using mocked API responses.
    architecture_impact: >
      Introduces summary tables (pre-computed aggregates). Dashboard API must be
      isolated from write-path APIs. Admin KPI dashboard shares E6's admin portal
      infrastructure.

  - epic_ref: "E10"
    epic_name: "Referral Programme & User Acquisition"
    risk_level: "low"
    technical_risks:
      - "Referral attribution through registration flow — parameter must survive browser close and OAuth redirect"
      - "Reward fulfilment pipeline (session completion → payment confirmation → attribution check → reward) — silent failures block rewards"
      - "Minimal fraud guards (self-referral block, email verification, reward cap) needed without a full fraud detection system"
    blockers: []
    sequencing_constraints: >
      Depends on E1 (registration for attribution) and E4 (first paid session for
      reward trigger). Referral parameter handling must be built into E1's registration
      flow as a hook.
    architecture_impact: >
      Adds referral tracking service and event consumer for session completion events.
      Minimal new infrastructure — referral links stored in relational database.
      Reward configuration hooks into E6's system configuration.

# ─── Critical Blockers ────────────────────────────────────────────────────────
critical_blockers:
  - id: "CB-1"
    description: >
      I-05 — Session recording consent for GDPR: Mandatory auto-recording
      without an explicit GDPR-compliant consent mechanism at session start
      may violate GDPR Article 7 in Germany and Switzerland. Affects E3
      (session join flow) and E8 (GDPR compliance implementation).
    affected_epics: ["E3", "E8"]
    status: "resolved"
    resolution: >
      Follow GDPR guidelines — implement per-session explicit consent
      mechanism at session start. Both mentor and mentee must consent before
      recording begins. E3 session join flow updated to include a consent
      gate; E8 compliance scope updated to audit per-session consent.

  - id: "CB-2"
    description: >
      Stripe India account structure: INR domestic payment routing may require
      a separate Stripe India entity with different API endpoints, onboarding,
      and settlement rails than the global Stripe account. Architecture-defining
      decision for E4 — a wrong initial choice requires significant rework.
    affected_epics: ["E4"]
    status: "resolved"
    resolution: >
      Assume separate Stripe accounts — Stripe India entity for INR domestic
      transactions and a global Stripe account for USD/CHF/EUR. E4 architecture
      must support dual-account routing from the start.

  - id: "CB-3"
    description: >
      Stripe Connect scope gap: Mentor payout infrastructure (E4) requires
      mentors to complete Stripe Connect onboarding (identity verification,
      bank account linking), but this step was not included in E1's scope.
      Mentors without Connect onboarding cannot receive payouts.
    affected_epics: ["E1", "E4"]
    status: "resolved"
    resolution: >
      Keep Stripe Connect mentor onboarding out of E1 scope. Handle as part
      of E4 (Payment Processing) or as a distinct mentor setup step. E1
      remains focused on identity and profile foundation only.

# ─── Open Questions ───────────────────────────────────────────────────────────
open_questions:
  - id: "OQ-1"
    question: >
      What is the legal basis for auto-recording all sessions in GDPR markets
      (Germany, Switzerland)? Does blanket ToS consent at registration suffice,
      or is per-session explicit consent required under GDPR Article 7?
    affected_epics: ["E3", "E8"]
    status: "resolved"
    resolution: >
      Follow GDPR guidelines — per-session explicit consent required.
      Both parties must consent before recording begins at each session.

  - id: "OQ-2"
    question: >
      Technology stack decisions (React Native vs Swift/Kotlin for mobile;
      Node.js vs Next.js for backend; API gateway vendor) are deferred to
      architecture phase. These decisions affect E1 social login, E3 video
      join flow, and E7 push notification infrastructure.
    affected_epics: ["E1", "E2", "E3", "E7"]
    status: "resolved"
    resolution: >
      Mobile removed from MVP scope entirely — MVP is web-only (mentee web
      app + admin portal). React Native decision (I-01) no longer relevant
      for MVP. Backend and API gateway decisions deferred to architecture
      phase.

  - id: "OQ-3"
    question: >
      Can a single Stripe account handle INR domestic transactions alongside
      USD, CHF, EUR transactions? Or does the India market require a separate
      Stripe India account with different onboarding and settlement rails?
    affected_epics: ["E4"]
    status: "resolved"
    resolution: >
      Assume separate Stripe accounts — Stripe India entity for INR
      domestic transactions and a global Stripe account for USD/CHF/EUR.

  - id: "OQ-4"
    question: >
      The current E1 scope does not include Stripe Connect identity
      verification and bank account linking as a mentor setup step, but
      mentors cannot receive payouts (E4) without completing Connect
      onboarding. Should Stripe Connect onboarding be added to E1 or E4?
    affected_epics: ["E1", "E4"]
    status: "resolved"
    resolution: >
      Keep Stripe Connect mentor onboarding out of E1. Handle separately
      as part of E4 payment epic or as a distinct setup step.

  - id: "OQ-5"
    question: >
      How should system configuration changes (commission rates, cancellation
      policies) behave for in-flight sessions — sessions booked under the old
      rate but not yet completed?
    affected_epics: ["E4", "E6"]
    status: "resolved"
    resolution: >
      Config changes (commission rates, cancellation policies) apply only to
      NEW sessions booked after the change. In-flight sessions retain the
      rates and policies under which they were booked.

  - id: "OQ-6"
    question: >
      What specific obligations does India's DPDP Act (2023, partially
      notified as of early 2026) impose on Felly Club's India operations?
      Are GDPR-equivalent controls sufficient?
    affected_epics: ["E8"]
    status: "resolved"
    resolution: >
      Use GDPR-equivalent controls (consent, deletion, portability) as
      sufficient for India operations at MVP. No additional India-specific
      data localisation needed for MVP launch.

  - id: "OQ-7"
    question: >
      If a dispute is filed against a session whose recording will expire
      within 24 hours, can the admin preserve the recording (pausing TTL
      deletion) for the duration of dispute resolution?
    affected_epics: ["E5", "E8"]
    status: "resolved"
    resolution: >
      No recording preservation or TTL extension mechanism needed. Platform
      includes a disclaimer that disputes must be filed within the recording
      retention period (3 days). Users are informed that recordings expire
      and disputes must be submitted before expiry.

