# ─── Assumptions ──────────────────────────────────────────────────────────────
assumptions:
  - "MVP is web-only — mentee web app and admin portal; mobile app removed from MVP scope per pre-lock resolution and deferred to Phase 2"
  - "Admin-driven mentor onboarding only in MVP; mentor self-registration deferred to Phase 2"
  - "Personalization is rule-based string matching; no AI/ML recommendation engine in MVP"
  - "Session recordings accessible only to admin for dispute resolution; user playback deferred to Phase 2"
  - "Per-session explicit GDPR consent required for session recording — both mentor and mentee must consent before recording begins"
  - "Admin portal is web-only; no mobile admin access in MVP"
  - "English-only in MVP; multi-language support deferred to Phase 2"
  - "Pay-per-session model only; subscriptions and bundles deferred to Phase 2"
  - "Stripe confirmed as payment provider — separate Stripe India account for INR domestic transactions and global Stripe account for USD/CHF/EUR"
  - "Stripe Connect mentor onboarding handled in E4 (Payment Processing), not E1 (Identity Foundation)"
  - "Configuration changes (commission rates, cancellation policies) apply only to NEW sessions — in-flight sessions retain their original rates"
  - "GDPR-equivalent controls (consent, deletion, portability) sufficient for India (TPDP) operations at MVP; no additional data localisation needed"
  - "Disputes must be filed within the session recording retention period (3 days); no recording preservation or TTL extension mechanism"
  - "Backend and API gateway technology decisions deferred to architecture phase; React Native decision no longer relevant for web-only MVP"
  - "MVP categories limited to Sport, Entrepreneurship, Business, and Entertainment; Academia deferred to Phase 2"
  - "Video conferencing via Zoom API integration (preferred for MVP); Google Meet as potential fallback"
  - "Mentor pricing bands (min/max per duration) are admin-configurable platform parameters — values set via admin portal, not fixed at vision stage"
  - "Referral reward type and value are admin-configurable platform parameters — programme workflow specified, incentive details configured at implementation"
