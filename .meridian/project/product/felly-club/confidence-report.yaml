# Felly Club — Epic Confidence Report
# Mode: Epic Confidence Scoring (Mode 3)
# Assessed independently from drafting context, feasibility data, and intermediate reasoning.

confidence_report:
  assessed_at: "2026-03-26T08:30:00Z"
  assessed_by: "judge"
  product_yaml_path: "/Users/kapilahuja/cto/builder/meridian-evals-felly/.meridian/project/product/felly-club/product.yaml"
  epics_yaml_path: "/Users/kapilahuja/cto/builder/meridian-evals-felly/.meridian/project/product/felly-club/epics.yaml"

  # ─── Strategic Goal Reference Index ────────────────────────────────────────
  strategic_goals_index:
    - id: SG-01
      goal: "Build a trusted, admin-curated mentor marketplace with domain verification and quality signals"
      success_metrics:
        - metric: "Mentor verification rate"
          target: "100% of listed mentors are admin-verified with verified badge"
        - metric: "Mentor profile completeness"
          target: "All active mentor profiles include bio, expertise category, pricing, availability, and at least one verification artefact"
      covered_by_epics: ["E1", "E2", "E6"]

    - id: SG-02
      goal: "Deliver seamless end-to-end session lifecycle from discovery through post-session engagement"
      success_metrics:
        - metric: "Session completion rate"
          target: "85% or higher of accepted sessions completed without cancellation or no-show"
        - metric: "Booking workflow completion"
          target: "End-to-end flow operational with under 3% drop-off at each stage"
      covered_by_epics: ["E3", "E7"]

    - id: SG-03
      goal: "Establish transparent multi-currency financial operations with escrow-backed payments"
      success_metrics:
        - metric: "Payment processing success rate"
          target: "99% or higher across all 4 currencies"
        - metric: "Mentor payout timeliness"
          target: "100% of earned payouts processed within defined payout schedule"
      covered_by_epics: ["E4"]

    - id: SG-04
      goal: "Ensure platform trust through ratings, dispute resolution, and quality monitoring"
      success_metrics:
        - metric: "Dispute resolution timeliness"
          target: "100% of submitted disputes reviewed by admin within 72 hours"
        - metric: "Quality flagging automation"
          target: "All ratings below 3 stars auto-flagged; all mentors with 3 or more cancellations auto-flagged"
      covered_by_epics: ["E5"]

    - id: SG-05
      goal: "Drive mentee acquisition through referral programme and deliver actionable analytics to all personas"
      success_metrics:
        - metric: "Referral programme activation"
          target: "Referral link generation and reward fulfilment operational at launch"
        - metric: "Analytics dashboard coverage"
          target: "Mentor, mentee, and admin dashboards live with all BRD-defined KPIs"
      covered_by_epics: ["E9", "E10"]

    - id: SG-06
      goal: "Achieve regulatory and security compliance across all target geographies"
      success_metrics:
        - metric: "Regulatory compliance coverage"
          target: "GDPR consent management, TPDP compliance, PCI DSS tokenisation, and right-to-deletion workflows operational"
      covered_by_epics: ["E8"]

  # ─── Epic Assessments ───────────────────────────────────────────────────────
  epic_assessments:

    - epic_id: "E1"
      epic_name: "User Identity & Profile Foundation"
      strategic_goal_ref: "SG-01"
      scenario_to_metric_coverage:
        rating: "full"
        evidence: >
          Scenario 2 tests admin-driven mentor onboarding with all required profile fields (bio, expertise
          category, pricing, availability, LinkedIn link as verification artefact) — directly exercises the
          'Mentor profile completeness' metric. Scenario 3 tests admin approval flow that results in verified
          badge assignment on the mentor's public profile — directly exercises the 'Mentor verification rate'
          metric. Both SG-01 success metrics have at least one scenario that produces observable evidence
          toward their targets.
        covered_metrics:
          - "Mentor verification rate — Scenario 3: admin approval → verified badge on public profile"
          - "Mentor profile completeness — Scenario 2: onboarding captures bio, expertise, pricing, availability, verification artefact"
        uncovered_metrics: []
      falsifiability:
        rating: "strong"
        evidence: >
          FC1 ('mentee cannot log in after registration') is observable via a login attempt — binary pass/fail.
          FC2 ('mentor profile appears verified to mentees without admin approval') is observable by inspecting
          the profile status visible to mentees — binary. FC3 ('RBAC does not enforce persona boundaries') is
          binary-testable by attempting cross-role access. All three failure conditions are unambiguous and
          independently verifiable.
      coverage_gaps: []
      confidence: "high"
      rationale: >
        E1 has full scenario coverage of both SG-01 success metrics — the admin verification workflow and
        mentor profile completeness are both directly tested in success scenarios. All failure conditions are
        strongly falsifiable. This epic is the identity foundation that every downstream epic depends on;
        high confidence is appropriate and warranted.

    - epic_id: "E2"
      epic_name: "Mentor Marketplace & Discovery"
      strategic_goal_ref: "SG-01"
      scenario_to_metric_coverage:
        rating: "full"
        evidence: >
          Scenario 1 confirms verified mentors appear in the listing with a visible verified badge — evidence
          that the platform surfaces verification status correctly. Failure Condition 2 tests that unverified
          or admin-rejected mentors do NOT appear in search results — a binary enforcement check for the
          'Mentor verification rate' metric's intent (only admin-verified mentors are visible to mentees).
          Scenario 3 tests the mentor detail profile page and confirms all required completeness fields are
          present (bio, expertise categories, verification artefacts, verified badge, pricing for both
          durations, availability calendar preview) — direct coverage of 'Mentor profile completeness'.
        covered_metrics:
          - "Mentor verification rate — FC2: unverified profiles must not appear in listing or search"
          - "Mentor profile completeness — Scenario 3: all required fields verified on profile detail page"
        uncovered_metrics: []
      falsifiability:
        rating: "strong"
        evidence: >
          FC1 ('zero results in a populated category') is binary-testable by querying a known-populated
          category. FC2 ('unverified profiles appear in search') is binary — either the trust filter works
          or it does not. FC3 ('recommendations show unrelated category mentors') is binary — either
          category matching works or it does not. All conditions are independently observable.
      coverage_gaps:
        - >
          E2 validates the DISPLAY and ENFORCEMENT of verification signals but depends on E1 for creating
          them. E2's coverage of SG-01 metrics is additive (ensures marketplace enforces verification) but
          not a substitute for E1's foundational coverage.
      confidence: "high"
      rationale: >
        E2 fully covers SG-01 metrics from the discovery-enforcement perspective — verified badges are
        surfaced in listings, unverified mentors are filtered out, and all profile completeness fields are
        verifiable on the detail page. Strong falsifiability across all failure conditions. The dependency
        on E1 for creating verification data is expected and structurally sound.

    - epic_id: "E3"
      epic_name: "Session Lifecycle & Video Delivery"
      strategic_goal_ref: "SG-02"
      scenario_to_metric_coverage:
        rating: "partial"
        evidence: >
          Scenarios 1–3 cover the complete booking workflow end-to-end: request → acceptance → slot
          selection → video delivery, exercising all stages that the 'Booking workflow completion' metric
          measures (under 3% drop-off per stage). Scenario 4 covers cancellation policy enforcement.
          However, neither the 85% session completion rate (SM1) nor the 3% drop-off threshold (SM2) can
          be directly tested via functional scenarios — these are behavioral/operational metrics that emerge
          from usage patterns over time, not from any single functional test case. The scenarios demonstrate
          that the infrastructure enabling these metrics is fully operational; they cannot assert the
          numeric thresholds themselves.
        covered_metrics:
          - "Booking workflow completion — Scenarios 1–3 exercise all lifecycle stages (request, acceptance, scheduling, video delivery)"
        uncovered_metrics:
          - "Session completion rate (85% threshold) — behavioral metric; not scenario-testable; emerges from usage data"
          - "Booking workflow completion (3% drop-off threshold) — quantitative threshold; not scenario-testable; requires funnel analytics over live traffic"
      falsifiability:
        rating: "strong"
        evidence: >
          FC1 ('mentor never receives notification') is binary — notification either arrives or it does not.
          FC2 ('virtual room fails to launch') is binary — video connection either succeeds or fails.
          FC3 ('recordings accessible to non-admin users') is binary — access control either enforces admin-
          only or it does not. FC4 ('cancellation bypasses policy') is binary — policy enforcement either
          triggers or it does not. All four conditions are independently and objectively verifiable.
      coverage_gaps:
        - >
          The 85% session completion rate and <3% drop-off per stage are operational metrics. No functional
          scenario can produce evidence toward these numeric thresholds before deployment. This gap is
          inherent to the metric type — not a deficiency in epic design. A monitoring and analytics
          capability (E9) is positioned to track these metrics post-launch.
      confidence: "high"
      rationale: >
        E3 demonstrates the complete session lifecycle in functional scenarios, covering each stage of the
        booking workflow that the SG-02 metrics measure. Strong falsifiability with four binary-testable
        failure conditions. The partial coverage of SG-02's numeric thresholds is an inherent limitation
        of behavioral metric testing — not a structural gap in the epic. High confidence is appropriate
        given the comprehensiveness of the functional scenario coverage and failure condition strength.

    - epic_id: "E4"
      epic_name: "Payment Processing & Financial Operations"
      strategic_goal_ref: "SG-03"
      scenario_to_metric_coverage:
        rating: "partial"
        evidence: >
          Scenario 1 tests payment capture and escrow hold for a USD-denominated session. Scenario 2 tests
          commission deduction and mentor payout queue trigger upon session completion. Scenario 3 tests
          multi-currency processing (EUR mentee, INR-priced mentor) via Stripe. Scenario 4 tests refund
          processing for cancelled sessions. Together, these scenarios cover all critical payment flows.
          However, the 99% payment processing success rate (SM1) and 100% payout timeliness (SM2) cannot
          be directly tested via scenarios — these are operational metrics requiring volume and time-series
          measurement, not individual transaction tests.
        covered_metrics:
          - "Payment processing success rate — Scenarios 1, 3 exercise payment capture and multi-currency processing"
          - "Mentor payout timeliness — Scenario 2 tests payout queue trigger upon session completion"
        uncovered_metrics:
          - "Payment processing success rate (99% threshold) — requires volume and statistical measurement; not scenario-testable"
          - "Mentor payout timeliness (100% within schedule) — requires time-series tracking over real payouts; not scenario-testable"
      falsifiability:
        rating: "strong"
        evidence: >
          FC1 ('session completed but payment not released to payout queue') is binary — either the payout
          queue entry exists post-completion or it does not. FC2 ('session cancelled but mentee charged
          without refund') is binary — either the refund is issued or it is not. FC3 ('raw card data stored
          instead of tokenisation') is binary — either card data is stored (FAIL) or only tokens are stored
          (PASS). All three conditions are independently verifiable with concrete evidence.
      coverage_gaps:
        - >
          The 99% payment success rate and 100% payout timeliness are operational thresholds requiring
          production volume. This gap is inherent to the metric type and cannot be closed by functional
          scenarios. E9's admin KPI dashboard is positioned to provide the payout and payment monitoring
          data needed to validate these thresholds post-launch.
      confidence: "high"
      rationale: >
        E4 covers all core payment flows (capture, escrow, multi-currency, commission, refund, payout) with
        direct scenarios. Strong falsifiability with three binary-testable failure conditions including a
        PCI DSS security check. The partial coverage of SG-03's numeric thresholds is inherent to operational
        metric testing. High confidence is appropriate given comprehensive functional coverage.

    - epic_id: "E5"
      epic_name: "Ratings, Reviews & Dispute Resolution"
      strategic_goal_ref: "SG-04"
      scenario_to_metric_coverage:
        rating: "partial"
        evidence: >
          Scenario 2 tests the <3-star auto-flagging trigger and admin visibility in the quality monitoring
          dashboard — directly exercises the 'Quality flagging automation' metric for the star-rating
          component. Scenario 3 tests the end-to-end dispute submission and admin resolution workflow with
          session recording access — exercises the 'Dispute resolution timeliness' metric's process (though
          not the 72-hour SLA). However, the success metric for 'Quality flagging automation' has two
          distinct components: (1) ratings below 3 stars auto-flagged, and (2) mentors with 3 or more
          cancellations auto-flagged. ONLY component (1) is tested by a scenario. The cancellation
          auto-flagging has NO corresponding success scenario. The 72-hour dispute resolution SLA is an
          operational threshold that cannot be tested by a functional scenario.
        covered_metrics:
          - "Quality flagging automation (ratings <3 stars) — Scenario 2 tests auto-flag trigger and admin queue appearance"
          - "Dispute resolution timeliness (process) — Scenario 3 tests end-to-end dispute workflow and recording access"
        uncovered_metrics:
          - "Quality flagging automation (3+ cancellations auto-flag) — no success scenario tests this specific trigger; this is a functional requirement with a functional scenario gap"
          - "Dispute resolution timeliness (72-hour SLA) — operational metric; not scenario-testable"
      falsifiability:
        rating: "strong"
        evidence: >
          FC1 ('no rating prompt after completed session') is binary — either the prompt appears or it does
          not. FC2 ('<3-star rating not auto-flagged') is binary — either the flag appears in the admin
          queue or it does not. FC3 ('admin cannot access recording within 3-day retention') is binary —
          either recording is accessible to admin or it is not. All three conditions are unambiguous.
      coverage_gaps:
        - >
          FUNCTIONAL GAP: The 'Quality flagging automation' success metric explicitly requires auto-flagging
          of mentors with 3 or more cancellations. This is a distinct, testable feature with no corresponding
          success scenario in E5. This is not a behavioral metric gap — it is a missing functional scenario
          for a specified feature. The auto-flagging threshold (3 cancellations) should have a scenario
          mirroring Scenario 2's structure: mentor accumulates 3 cancellations → auto-flagged in quality
          monitoring dashboard.
        - >
          OPERATIONAL GAP: The 72-hour dispute resolution SLA is an operational metric requiring admin
          process measurement, not a functional scenario. This gap is expected.
      confidence: "medium"
      rationale: >
        E5 has strong falsifiability but a notable functional scenario gap: the cancellation auto-flagging
        feature is an explicit component of the SG-04 success metric and has no corresponding success
        scenario. This is not a behavioral metric limitation — it is a testable functional requirement
        (mentor has 3+ cancellations → system auto-flags → admin sees in dashboard) that was omitted from
        the scenario set. This reduces confidence to medium. The star-rating auto-flagging and dispute
        resolution workflow are well-covered.

    - epic_id: "E6"
      epic_name: "Platform Administration & Operations"
      strategic_goal_ref: "SG-01"
      scenario_to_metric_coverage:
        rating: "weak"
        evidence: >
          E6's three scenarios test admin UX capabilities: (1) viewing mentor list with verification status
          filters and editing profiles, (2) changing commission rates with correct application to new
          transactions, and (3) viewing and processing the payout queue. Scenario 1 supports the admin's
          ability to manage the verification workflow, but does not test whether 100% of listed mentors
          are verified (SG-01 SM1). No scenario tests mentor profile completeness (SG-01 SM2). E6's
          contribution to SG-01 is operational infrastructure — it enables the admin to manage and maintain
          the verification process, but its scenarios validate admin UX rather than SG-01 metric achievement.
          Furthermore, Scenarios 2 and 3 are more directly aligned with SG-03 (commission configuration,
          payout management) than SG-01 — the strategic_goal_ref assignment undersells E6's cross-cutting
          nature.
        covered_metrics:
          - "Mentor verification rate (operational enablement) — Scenario 1 confirms admin can view and edit verification status"
        uncovered_metrics:
          - "Mentor verification rate (100% target) — no scenario tests that 100% of listed mentors are verified"
          - "Mentor profile completeness — no scenario tests profile completeness validation"
      falsifiability:
        rating: "strong"
        evidence: >
          FC1 ('admin cannot access admin portal or shown wrong dashboard') is binary — either the admin
          portal loads for admin users or it does not. FC2 ('configuration changes do not take effect') is
          binary — either the new commission rate is applied to subsequent payments or the old rate is.
          FC3 ('admin portal shows stale data') is binary — either admin and operational data are consistent
          or they diverge. All three conditions are independently verifiable.
      coverage_gaps:
        - >
          E6 is assigned to SG-01 but its scenarios primarily validate admin operational UX and system
          configuration capabilities. The SG-01 success metrics (verification rate at 100%, profile
          completeness) are not directly tested by E6 scenarios. E1 and E2 provide the primary SG-01
          metric coverage; E6 provides supporting operational infrastructure.
        - >
          E6's cross-cutting scope (user management, session oversight, financial operations, configuration)
          spans SG-01, SG-03, and SG-04. The single strategic_goal_ref assignment to SG-01 does not fully
          represent the epic's contribution to platform success metrics across multiple strategic goals.
      confidence: "medium"
      rationale: >
        E6 is operationally critical but its SG-01 metric coverage from scenarios is weak — admin portal
        UX scenarios validate operational tooling, not the verification rate or profile completeness metrics
        directly. Strong falsifiability is present. Medium confidence reflects the weak direct coverage of
        the referenced strategic goal's metrics, acknowledging that E6's true value is cross-cutting
        operational enablement that supports SG-01, SG-03, and SG-04 indirectly. E1 and E2 are primary
        for SG-01 metric coverage.

    - epic_id: "E7"
      epic_name: "Communications & Notification Centre"
      strategic_goal_ref: "SG-02"
      scenario_to_metric_coverage:
        rating: "weak"
        evidence: >
          E7's scenarios test communication infrastructure: (1) SendGrid email and in-app notification
          after booking confirmation, (2) in-app notification centre rendering and interaction, and (3)
          post-session engagement email 24 hours after completion. Scenario 3's engagement prompt partially
          justifies the SG-02 alignment ('discovery through post-session engagement' is the SG-02 goal),
          but the SG-02 success metrics — session completion rate ≥ 85% and booking workflow completion
          with <3% drop-off — are not addressed by any E7 scenario. Communication delivery does not
          directly produce evidence toward session completion rate or booking funnel metrics. E3 is the
          primary coverage vehicle for both SG-02 metrics.
        covered_metrics:
          - "Post-session engagement (qualitative) — Scenario 3 tests the engagement prompt mechanism that supports repeat bookings"
        uncovered_metrics:
          - "Session completion rate (85%) — not tested by communication scenarios"
          - "Booking workflow completion (3% drop-off) — not tested by communication scenarios"
      falsifiability:
        rating: "strong"
        evidence: >
          FC1 ('transactional emails not delivered or land in spam') is observable via delivery monitoring
          — binary pass/fail at the delivery level. FC2 ('notification centre shows no notifications') is
          binary — either notifications appear or they do not. FC3 ('replacing mock notifications causes
          regressions in booking/payment flow') is binary — either the workflow still functions end-to-end
          or it does not after the notification upgrade. All three conditions are independently verifiable.
      coverage_gaps:
        - >
          E7's scenarios do not produce direct evidence toward either SG-02 success metric. The session
          completion rate and booking workflow completion metrics are operational/behavioral outcomes driven
          by E3's session lifecycle infrastructure, not by E7's notification infrastructure. The SG-02
          alignment is justified by the 'post-session engagement' component of the SG-02 goal statement,
          but the actual success metrics have no corresponding scenarios in E7.
        - >
          The post-session engagement prompt (Scenario 3) contributes to repeat booking intent but cannot
          demonstrate impact on completion rates or drop-off percentages via functional scenarios.
      confidence: "medium"
      rationale: >
        E7 has strong falsifiability and correctly implements communication infrastructure, but its scenario
        coverage of SG-02 success metrics is weak. The SG-02 alignment is justified by the 'post-session
        engagement' narrative, but the two measurable SG-02 metrics (session completion rate, booking
        drop-off) are not addressed in E7's scenarios. Medium confidence reflects the weak metric coverage
        while acknowledging E7's role in completing the SG-02 lifecycle narrative.

    - epic_id: "E8"
      epic_name: "Regulatory Compliance & Data Security"
      strategic_goal_ref: "SG-06"
      scenario_to_metric_coverage:
        rating: "partial"
        evidence: >
          The SG-06 success metric names four required capabilities: GDPR consent management, TPDP
          compliance, PCI DSS tokenisation, and right-to-deletion workflows. Scenario 1 directly tests
          GDPR cookie consent with granular opt-in/opt-out for EU users. Scenario 2 directly tests the
          right-to-deletion workflow (account deletion with cascading data removal). Scenario 3 directly
          tests PCI DSS compliance by verifying no raw card data is present on the platform. Three of
          four named requirements have direct scenario coverage. TPDP (India) compliance is not explicitly
          tested by any success scenario — it is referenced in the description but absent from the scenario
          set.
        covered_metrics:
          - "GDPR consent management — Scenario 1 tests cookie consent banner with granular opt-in/opt-out and persistence"
          - "PCI DSS tokenisation — Scenario 3 tests absence of raw card data across storage, logs, and transmission"
          - "Right-to-deletion workflows — Scenario 2 tests account deletion and cascading data removal"
        uncovered_metrics:
          - "TPDP compliance — no scenario explicitly tests India-specific data protection requirements; mentioned in description only"
      falsifiability:
        rating: "strong"
        evidence: >
          FC1 ('cookie consent banner absent or choices not respected') is binary — either the banner
          appears for EU users and consent is stored/respected, or it does not. FC2 ('right-to-deletion
          leaves personal data in database') is binary — either data is removed or it is not (database
          inspection confirms). FC3 ('API served over HTTP or data stored unencrypted') is binary — either
          TLS 1.2+ is enforced and AES-256 encryption is applied, or it is not. All three are unambiguous
          and independently verifiable.
      coverage_gaps:
        - >
          TPDP (India) compliance has no success scenario. The BRD describes it as 'alignment of data
          handling practices with emerging Indian data protection requirements' — less prescriptive than
          GDPR or PCI DSS. The absence of a dedicated scenario means TPDP compliance cannot be
          scenario-verified, only asserted through architecture review.
      confidence: "high"
      rationale: >
        E8 achieves direct scenario coverage for three of the four named SG-06 regulatory requirements
        (GDPR consent, right-to-deletion, PCI DSS). All failure conditions are strongly falsifiable via
        binary tests. The TPDP gap is noted but the requirement is less prescriptive and TPDP compliance
        is an emerging standard without specific, testable requirements enumerated in the BRD. High
        confidence is appropriate given the depth of coverage for the three primary compliance requirements
        and the inherent vagueness of TPDP at MVP stage.

    - epic_id: "E9"
      epic_name: "Analytics & Performance Dashboards"
      strategic_goal_ref: "SG-05"
      scenario_to_metric_coverage:
        rating: "full"
        evidence: >
          SG-05 has two success metrics: (1) Referral programme activation and (2) Analytics dashboard
          coverage. E9 covers SM2 ('Analytics dashboard coverage — Mentor, mentee, and admin dashboards
          live with all BRD-defined KPIs'): Scenario 1 tests the mentor performance dashboard (earnings,
          sessions, completion rate, ratings, upcoming sessions), Scenario 2 tests the admin KPI dashboard
          (GMV, active users, session volume, quality metrics, revenue metrics), and Scenario 3 tests
          the mentee activity dashboard (session history, spend, categories, ratings). All three persona
          dashboards are exercised. SM1 (referral programme activation) is intentionally owned by E10;
          this is by design and not a gap in E9.
        covered_metrics:
          - "Analytics dashboard coverage (SM2) — Scenarios 1–3 test all three persona dashboards with BRD-defined KPIs"
        uncovered_metrics:
          - "Referral programme activation (SM1) — intentionally covered by E10, not E9"
      falsifiability:
        rating: "strong"
        evidence: >
          FC1 ('mentor earnings dashboard shows incorrect amounts vs actual payouts') is binary — either
          dashboard amounts match payment records or they do not (cross-reference is straightforward).
          FC2 ('admin KPI dashboard shows zero or stale data despite active platform') is binary — either
          live data appears or stale/null data appears. FC3 ('dashboard loads cause performance degradation')
          is observable (monitor response times for other platform actions during dashboard load) — binary
          pass/fail against a performance threshold. All three conditions are independently verifiable.
      coverage_gaps:
        - >
          SM1 (Referral programme activation) is not covered by E9 scenarios — this is by design, as E10
          owns that metric. Both SG-05 success metrics are covered across the E9 + E10 pair; no metric
          is dropped.
      confidence: "high"
      rationale: >
        E9 achieves full scenario coverage of its assigned SG-05 metric (analytics dashboard coverage)
        with all three persona dashboards tested. The SM1 gap is by design — E10 holds that metric.
        Strong falsifiability with binary-testable failure conditions including a data consistency check
        and performance check. High confidence is appropriate.

    - epic_id: "E10"
      epic_name: "Referral Programme & User Acquisition"
      strategic_goal_ref: "SG-05"
      scenario_to_metric_coverage:
        rating: "full"
        evidence: >
          SG-05 SM1 ('Referral programme activation — link generation and reward fulfilment operational
          at launch') is directly tested: Scenario 1 tests unique referral link generation and display
          for registered mentees (link generation operational). Scenario 2 tests the end-to-end referral
          attribution and reward fulfilment when a referred user completes their first paid session (reward
          fulfilment operational). Scenario 3 tests admin configurability of the reward type and value,
          confirming the programme is configurable at launch. All components of SM1 are covered. SM2
          (analytics dashboard coverage) is intentionally owned by E9; this is by design, not a gap.
        covered_metrics:
          - "Referral programme activation (SM1) — Scenarios 1 and 2 test link generation and reward fulfilment end-to-end"
          - "Referral admin configurability — Scenario 3 tests admin reward configuration"
        uncovered_metrics:
          - "Analytics dashboard coverage (SM2) — intentionally covered by E9, not E10"
      falsifiability:
        rating: "strong"
        evidence: >
          FC1 ('new user signs up through referral link but referral not attributed to referrer') is binary
          — either the referral attribution record exists or it does not. FC2 ('referred user completes
          first session but referrer does not receive reward') is binary — either the reward is issued or
          it is not. Both conditions are concrete, observable, and independently verifiable.
      coverage_gaps:
        - >
          SM2 (Analytics dashboard coverage) is not covered by E10 scenarios — this is by design, as E9
          owns that metric. Both SG-05 success metrics are covered across the E9 + E10 pair; no metric
          is dropped.
      confidence: "high"
      rationale: >
        E10 achieves full scenario coverage of its assigned SG-05 metric (referral programme activation)
        with link generation, attribution, reward fulfilment, and admin configurability all tested.
        Strong falsifiability with two binary-testable failure conditions. The SM2 gap is by design.
        High confidence is appropriate.

  # ─── Summary ────────────────────────────────────────────────────────────────
  summary:
    total_epics: 10
    confidence_breakdown:
      high: 7
      medium: 3
      low: 0
    high_confidence_epics: ["E1", "E2", "E3", "E4", "E8", "E9", "E10"]
    medium_confidence_epics: ["E5", "E6", "E7"]
    low_confidence_epics: []
    overall_health: "GOOD"
    overall_health_rationale: >
      7 of 10 epics score HIGH confidence, indicating strong scenario-to-metric coverage and binary-
      testable failure conditions across the majority of the epic portfolio. No epic scores LOW
      confidence. The three MEDIUM epics reflect specific, addressable gaps rather than systemic issues.

    key_risks:
      - id: "CR-01"
        epic: "E5"
        severity: "medium"
        description: >
          The 'Quality flagging automation' success metric (SG-04) requires auto-flagging of mentors
          with 3 or more cancellations, but E5 has no success scenario testing this trigger. This is
          a functional gap — not a behavioral metric limitation — and represents a verifiable feature
          requirement with missing scenario coverage. Risk: the cancellation auto-flagging feature may
          be under-specified or omitted during implementation.
        recommendation: >
          Add a success scenario to E5: a mentor accumulates 3 cancellations → system auto-flags the
