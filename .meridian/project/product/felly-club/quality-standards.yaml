# ─── Quality Standards per QP Dimension ──────────────────────────────────────
# Each dimension maps QP profile levels to concrete tools, thresholds, and processes.
# Derived from product.yaml profiles.quality_profile + architecture.yaml stack.

standards:

  # QP-1: Testing Depth — Level 3 (Layered Testing)
  # Unit + integration + basic e2e for critical paths. CI on every PR. Coverage tracked (60–80%).
  testing:
    qp_level: 3
    strategy: >
      Layered testing with unit tests for all business logic, integration tests for NestJS
      module interactions and API controllers, and e2e tests for the critical user journeys:
      session booking-to-payment flow, mentor discovery, admin dispute resolution, and GDPR
      deletion. CI runs unit and integration tests on every PR. E2e tests run against the
      staging environment post-deploy. Code coverage tracked via Jest built-in reporter with
      an 80% target for PaymentModule, SessionModule, and ComplianceModule (financial and
      compliance-critical paths), and a 70% overall project target.
    frameworks:
      - "Jest 29.x — unit and integration tests for all NestJS backend modules"
      - "React Testing Library 14.x — unit tests for Next.js React components (mentee web app, admin portal)"
      - "Playwright 1.4x — e2e browser automation for critical mentee and admin flows"
      - "Supertest 6.x — HTTP-level integration tests for NestJS controller and guard layers"
    coverage_target: "70% overall; 80% for PaymentModule, SessionModule, and ComplianceModule"
    test_types:
      - "unit"
      - "integration"
      - "e2e"
    automation: >
      GitHub Actions pipeline runs Jest unit and integration tests on every PR (pull_request trigger)
      as a required status check — PR merge is blocked on test failure. Playwright e2e tests run
      against the staging environment post-deploy (workflow_run trigger after staging deployment).
      Jest coverage report generated with --coverage flag; jest-coverage-comment action posts a
      coverage diff summary on each PR. E2e test results published as GitHub Actions test report
      artefact. Coverage thresholds enforced in jest.config.ts — build fails if global threshold
      or module-level threshold (PaymentModule, SessionModule, ComplianceModule) is breached.

  # QP-2: Code Quality Standards — Level 3 (Enforced Standards)
  # Linter + formatter + pre-commit hooks + static analysis + PR review with checklist +
  # documented conventions + design pattern guidelines.
  code_quality:
    qp_level: 3
    linter: >
      ESLint 9.x with @typescript-eslint/eslint-plugin (strict mode). Active rules:
      @typescript-eslint/no-explicit-any (error), @typescript-eslint/no-unused-vars (error),
      @typescript-eslint/explicit-function-return-type (warn), no-console (warn — replaced by Pino logger),
      prefer-const (error), eqeqeq (error), no-return-await (error), import/no-cycle (error —
      enforces NestJS module boundary discipline). Husky pre-commit hook runs lint-staged
      (eslint --fix on staged TypeScript files) before every commit.
    formatter: >
      Prettier 3.x enforced across all TypeScript, JSON, and YAML files via .prettierrc:
      printWidth 100, singleQuote true, trailingComma es5, semi true, tabWidth 2, arrowParens always.
      Husky pre-commit hook runs lint-staged (prettier --write on staged files). Formatting diff
      check runs in CI (prettier --check) — PR merge blocked if formatting violations found.
    static_analysis: >
      CodeQL (GitHub Advanced Security) — JavaScript/TypeScript security query suite runs on every
      PR and main branch push. Results surfaced in GitHub Security tab. Critical and high severity
      CodeQL findings block PR merge (required status check). Medium severity findings require
      manual dismissal with written justification before merge. CodeQL alert triage owner:
      engineering lead.
    review_process: >
      Minimum 1 reviewer required for all PRs. Minimum 2 reviewers required for changes to
      PaymentModule, ComplianceModule, AuthModule, and any database migration file.
      PR review checklist enforced via GitHub PR template:
      (1) Unit or integration tests added or updated for all changed logic,
      (2) OpenAPI @ApiOperation and @ApiResponse decorators added for new or changed NestJS endpoints,
      (3) No hardcoded secrets, API keys, or credentials — all secrets sourced from AWS Secrets Manager,
      (4) Error handling complete — no unhandled promise rejections, all Prisma calls in try/catch or
          wrapped in NestJS HttpException filters,
      (5) Audit log entry added for any financial operation (payment, payout, refund, escrow event),
      (6) GDPR-sensitive fields redacted from Pino logger redaction paths if new PII fields introduced,
      (7) Prisma migration file reviewed for irreversibility (no column drops without data migration plan).
    conventions: >
      Coding conventions documented in CONTRIBUTING.md and enforced via ESLint rules:
      NestJS module boundaries enforced — no cross-module direct Prisma imports; use injected
      service classes only. Prisma transactions (@prisma/client.$transaction) required for all
      writes spanning multiple tables. DTOs required for all API request and response shapes
      (class-validator decorators mandatory for request DTOs). No raw SQL queries — Prisma ORM
      only (Prisma.$queryRaw permitted only for analytics read-only queries with explicit review).
      Service layer owns all business logic — controllers handle HTTP binding only.
      All async operations must handle errors explicitly via try/catch or RxJS catchError.
      XState state machine transitions must never be called directly outside SessionModule.
      Financial amounts stored as integer cents (no floating point) in PostgreSQL.
    design_patterns:
      - "Repository pattern via Prisma service injection — no direct PrismaClient in controllers or resolvers"
      - "Factory pattern for XState session state machine instantiation in SessionModule"
      - "Strategy pattern for Stripe currency routing — CurrencyRouter service selects Stripe India vs Stripe Global client"
      - "Observer / event-driven pattern via BullMQ — service methods enqueue jobs; workers handle side effects asynchronously"
      - "DTO validation via class-validator decorators on all NestJS controller request inputs (ValidationPipe globally applied)"
      - "Saga pattern for GDPR DeletionOrchestrator — each deletion step recorded in deletion_log before execution; idempotent retry"

  # QP-3: Documentation Level — Level 3 (Comprehensive)
  # OpenAPI specs, architecture diagrams, ADRs, runbooks for common operations,
  # onboarding guide for new developers.
  documentation:
    qp_level: 3
    api_docs: >
      OpenAPI 3.1 specification auto-generated via @nestjs/swagger decorators on all NestJS
      controllers. Every endpoint annotated with @ApiOperation (summary + description),
      @ApiResponse (all response codes), @ApiBody (request DTO schema), and @ApiBearerAuth
      (authenticated endpoints). Swagger UI served at /api/docs in dev and staging environments
      (disabled in production). API spec exported as openapi.json during GitHub Actions CI build
      and committed to docs/api/openapi.json for schema drift tracking via git diff.
    architecture_docs: >
      Architecture Decision Records (ADRs) in docs/adr/ using Michael Nygard template:
      Context, Decision, Status (Proposed | Accepted | Deprecated | Superseded), Consequences.
      ADR required for: any technology selection, database schema design decision, significant
      refactoring, and any departure from the architecture.yaml patterns.
      System context diagram (C4 Level 1) and container diagram (C4 Level 2) maintained in
      docs/architecture/ as Mermaid diagrams (rendered natively in GitHub markdown).
      Architecture overview at docs/architecture/README.md referencing architecture.yaml as
      the authoritative source. Diagrams updated alongside any architectural change PR.
    runbooks: >
      Operational runbooks in docs/runbooks/ each following the format:
      trigger conditions, prerequisites, step-by-step resolution, verification steps, rollback procedure,
      escalation contacts. Required runbooks:
      (1) database-migration-rollback.md — Prisma migrate down procedure and data recovery steps,
      (2) stripe-webhook-reprocessing.md — failed Stripe webhook event redelivery via Stripe dashboard
          and manual BullMQ job re-enqueue,
      (3) bullmq-dead-letter-queue.md — investigating and retrying dead-letter jobs in Redis,
      (4) keycloak-account-compromise.md — invalidating sessions and rotating credentials for a compromised account,
      (5) gdpr-deletion-request.md — step-by-step GDPR right-to-deletion execution via DeletionOrchestrator,
      (6) recording-emergency-deletion.md — immediately purging a session recording from S3 before TTL,
      (7) ecs-task-scaling.md — manual task count adjustment, health check debugging, and service recovery.
    onboarding: >
      Developer onboarding guide in docs/onboarding.md covering:
      (1) Local development environment setup via Docker Compose (all services: Postgres, Redis,
          OpenSearch, KeyCloak, Strapi started with docker-compose up),
      (2) Environment variable configuration — .env.local template with placeholder values
          (never commit; production values sourced from AWS Secrets Manager),
      (3) NestJS module structure and dependency injection conventions (refer to AuthModule as canonical example),
      (4) Prisma workflow: npx prisma migrate dev (schema changes), npx prisma generate (type refresh),
          npx prisma studio (local data browser),
      (5) KeyCloak realm import for local auth (realm export file in infra/keycloak/),
      (6) Stripe test mode configuration (test API keys, webhook CLI for local webhook testing),
      (7) Feature branch workflow — branch naming, PR template, required status checks.
      Target: new developer running the full local stack and submitting first PR within 1 day.

  # QP-4: CI/CD Maturity — Level 3 (Continuous Delivery)
  # Automated build + test + deploy to staging. Production deploy via manual approval.
  # Multiple environments (dev, staging, prod). Database migrations automated.
  ci_cd:
    qp_level: 3
    pipeline: >
      GitHub Actions — multi-stage pipeline: lint (ESLint + Prettier check) → typecheck
      (tsc --noEmit) → test (Jest unit + integration, coverage threshold enforced) →
      security (CodeQL analysis, npm audit --audit-level=high) → build (Docker image build
      and push to Amazon ECR) → deploy (ECS service update). Each stage is a separate
      GitHub Actions job with explicit dependencies. All stages must pass before deploy job runs.
    environments:
      - "dev — deploys automatically on every PR merge to main branch; uses AWS dev infrastructure (separate RDS and ECS cluster); Vercel preview deployments auto-created for each PR branch"
      - "staging — deploys automatically on git tag push matching v* pattern; used for QA, integration testing, and client demos; Playwright e2e suite runs post-deploy"
      - "production — deploys via manual approval gate in GitHub Actions environment protection rules; requires sign-off from engineering lead; deployment notifications sent to Slack"
    deployment_strategy: >
      Backend-api and background-workers: blue-green deployment via ECS service update with
      minimum healthy percent 100% and maximum percent 200% — ECS registers new tasks,
      validates health check (GET /health returns HTTP 200), then deregisters old tasks.
      Zero-downtime deploy. Database migrations (Prisma migrate deploy) run as an ECS
      task override (one-off task) before the service update starts — migrations must be
      backward-compatible with the running old version.
      Frontends (mentee-web-app and admin-portal): Vercel atomic deployments — instant
      switch with instant rollback via Vercel dashboard or CLI (vercel rollback).
    feature_flags: null
    infrastructure_as_code: >
      AWS CloudFormation — declarative stacks for: VPC and networking, ECS clusters and services,
      RDS PostgreSQL instances, ElastiCache Redis, OpenSearch Service, S3 buckets and lifecycle
      policies, API Gateway HTTP API and Lambda Authorizer, IAM roles and policies, CloudWatch
      Alarms, and SNS topics. IaC stored in infra/cloudformation/ directory with one stack per
      service group. Environments parameterized via CloudFormation stack parameters (dev.json,
      staging.json, prod.json parameter files). Stack diffs reviewed in PR via cfn-diff comment
      before apply. CloudFormation stack changes deployed via GitHub Actions workflow with
      explicit AWS credentials from GitHub Actions OIDC (no static AWS access keys).

  # QP-5: Observability Maturity — Level 3 (Monitored)
  # Structured logging + application metrics + alerting on key thresholds +
  # operational visibility dashboard.
  observability:
    qp_level: 3
    logging: >
      Structured JSON logging via Pino 9.x integrated into NestJS via nestjs-pino (pino-http
      middleware for HTTP request/response logging). All log entries include: timestamp,
      level, service (NestJS module name), requestId (UUID correlation ID injected per HTTP
      request via NestJS middleware), userId (JWT sub claim — hashed for PII compliance),
      sessionId (when session context is available in the request), duration_ms (HTTP handlers),
      status_code (HTTP responses), and error (structured object with name, message, stack —
      never string concatenation). GDPR-sensitive fields (email, name, phone, IP address)
      redacted via Pino redactPaths configuration — never logged in plain text.
      Financial operation logs tagged with a financial:true field for CloudWatch Insights
      queries and dedicated 7-year retention log group (separate from 30-day application logs).
      Log level: ERROR and WARN always shipped; INFO in production; DEBUG in dev and staging only.
      Logs shipped to AWS CloudWatch Logs via ECS Firelens log router (Fluent Bit sidecar).
    monitoring: >
      AWS CloudWatch Metrics dashboards for operational visibility:
      (1) API Health Dashboard — API Gateway request count, p50/p95/p99 latency per endpoint,
          4xx rate (client errors), 5xx rate (server errors), ECS task CPU and memory utilization.
      (2) Session Operations Dashboard — session_created_count, session_completed_count,
          session_cancelled_count, session_disputed_count (custom CloudWatch metrics published
          from SessionModule via aws-cloudwatch-metrics).
      (3) Payment Operations Dashboard — payment_success_count and payment_failure_count per
          currency (INR, USD, CHF, EUR), payout_processed_count, refund_processed_count,
          Stripe webhook delivery failure rate.
      (4) Infrastructure Dashboard — RDS DatabaseConnections (alarm threshold: 80% of max),
          RDS CPUUtilization, ElastiCache CacheHitRate and CurrConnections, OpenSearch
          ClusterStatus (red/yellow alarm), BullMQ queue depth per queue.
    alerting: >
      AWS CloudWatch Alarms → SNS topic → PagerDuty on-call escalation for:
      (1) API Gateway p95 latency > 500ms sustained for 5 consecutive 1-minute periods,
      (2) API Gateway 5xx error rate > 1% over a 5-minute window,
      (3) RDS CPU utilization > 80% for 10 consecutive minutes,
      (4) ECS backend-api running task count below minimum (2) for any 1-minute period,
      (5) BullMQ failed job count > 10 in any 10-minute window (payments and session queues),
      (6) KeyCloak ECS task count below 2 (auth service degradation),
      (7) CloudWatch Logs metric filter for PAYMENT_FAILURE severity ERROR (immediate alert),
      (8) OpenSearch cluster status yellow or red.
      Non-critical alerts (warning level) routed to Slack engineering channel, not PagerDuty.
    tracing: >
      AWS X-Ray distributed tracing for full request path: API Gateway → NestJS backend-api
      → RDS/ElastiCache/OpenSearch/S3/Stripe/Zoom external calls.
      aws-xray-sdk-node integrated into NestJS via a global HTTP interceptor that starts a
      segment per inbound request and propagates the X-Amzn-Trace-Id header.
      X-Ray subsegments created for: Prisma database queries (annotated with table name and
      operation type), BullMQ job enqueue (annotated with queue name and job type),
      Stripe API calls (annotated with Stripe operation and currency), Zoom API calls,
      and S3 operations. Sampling rules: 5% of normal traffic sampled; 100% of requests
      resulting in 5xx errors sampled (error-based sampling rule in X-Ray console).

  # QP-6: Accessibility Standard — Level 2 (Basic)
  # Semantic HTML, alt text for images, keyboard navigable for primary flows.
  # No formal WCAG compliance target in MVP. BRD specifies browser/mobile compatibility only.
  accessibility:
    qp_level: 2
    standard: "none — no WCAG compliance target in MVP; browser and mobile version compatibility only"
    testing: >
      No automated accessibility CI testing at QP-2 level. Manual verification checklist applied
      during PR review for UI changes:
      (1) Semantic HTML structure — header, nav, main, footer elements used appropriately,
      (2) Alt text present for all mentor profile images and verification artefact thumbnails,
      (3) Form inputs have associated labels via htmlFor or aria-labelledby,
      (4) Keyboard navigation functional for primary booking flow (tab order, visible focus indicators,
          focus management after modal open and close),
      (5) Color contrast for primary text on background meets a minimum ratio (not formally audited,
          but Tailwind CSS default palette and shadcn/ui theme use accessible contrast ratios).
      shadcn/ui components (Dialog, DropdownMenu, Select, Popover) are built on Radix UI primitives
      which provide ARIA roles, keyboard interaction, and focus trapping by default — no additional
      ARIA configuration required for these components.
    audit_cadence: "none"

  # QP-7: Security Testing — Level 3 (SAST + Dependencies)
  # SAST (CodeQL) in CI + dependency scanning (Dependabot + npm audit) + secret scanning +
  # security-focused PR review checklist.
  security_testing:
    qp_level: 3
    dependency_scanning: >
      GitHub Dependabot configured for npm across all packages (mentee-web-app, admin-portal,
      backend-api, background-workers). Dependabot version update PRs generated weekly for
      minor and patch updates. Security advisory PRs generated immediately on CVE publication.
      Engineering team SLA: security PRs reviewed and merged within 48 hours of creation;
      critical CVEs within 24 hours. npm audit run in GitHub Actions CI pipeline on every
      PR — build fails on high or critical severity vulnerabilities (--audit-level=high flag).
      Dependabot auto-merge enabled for patch-level updates that pass all CI checks.
    sast: >
      CodeQL (GitHub Advanced Security) with the JavaScript/TypeScript security-extended
      query suite. Runs on every PR and on main branch push. Scan scope: NestJS backend-api,
      background-workers, mentee-web-app, and admin-portal. Results surfaced in GitHub
      Security tab and as inline PR annotations. Critical and high severity findings block
      PR merge (required status check configured in branch protection rules). Medium severity
      findings require the PR author to add a written dismissal justification in the GitHub
      Security finding before merge. CodeQL finding triage reviewed by engineering lead weekly.
    dast: null
    pen_testing: "none"
    secret_scanning: >
      GitHub Secret Scanning (Advanced Security) enabled for all repositories — detects
      committed API keys, Stripe keys, Zoom credentials, SendGrid API keys, Firebase service
      account JSON, and AWS credentials. Alerts route to repository admins with immediate
      remediation required (rotate and revoke the leaked secret within 4 hours).
      Pre-commit hooks via Husky run detect-secrets on every commit using a maintained
      .secrets.baseline file — commits blocked if unreviewed potential secrets are detected.
      Environment variable discipline enforced: .env and .env.local files in .gitignore;
      all production and staging secrets sourced from AWS Secrets Manager injected into ECS
      tasks at runtime via ECS secret injection (no static environment variables for credentials).
      Stripe and Zoom API key rotation target: 90 days (documented in security runbook).

