epics:
  - id: "E1"
    name: "Identity and Access Foundation"
    strategic_goal_ref: "SG-01"
    description: "Establish the authentication, authorization, and identity management foundation for all three personas (mentee, mentor, admin) using KeyCloak. Delivers SSO, MFA, RBAC, and social login as shared infrastructure that every downstream epic depends on."
    bucket: "near"
    priority: "P1"
    effort: "M"
    depends_on: []
    foundation_investment: true
    github_issue_ref: "TBD"
    ltm_citations:
      - "/Users/kapilahuja/.meridian/core/memory/knowledge/domain-taxonomy/user-management.md"
      - "/Users/kapilahuja/.meridian/core/memory/standards/templates/epic-schema.md"
      - "/Users/kapilahuja/.meridian/core/memory/standards/agent-lifecycle/epic-management-rules.md"
    intent:
      p1: "Today there is no identity layer for Felly Club. Mentees, mentors, and administrators have no way to create accounts, authenticate securely, or receive role-appropriate access to platform features. Without this foundation, no other platform capability can function — search requires knowing who is searching, payments require knowing who is paying, and admin operations require elevated privileges. The three-persona model (PP-3 = 5, Multi-Sided Platform) demands role-based access control from day one, not as a retrofit."
      p2: "After this epic ships, all three personas can register accounts (email/password or social login via Google/Apple), authenticate with MFA where required, and receive role-appropriate access to the platform. Mentees see mentee flows, mentors see mentor dashboards, and administrators access the admin panel — all governed by KeyCloak-managed RBAC policies. Session management handles secure token refresh, device-aware sessions, and forced logout capabilities. Every downstream epic can delegate identity verification to this shared infrastructure rather than building its own."
      p3: "This epic is the prerequisite for the entire MVP launch (SG-01). Without authenticated identity and role separation, the platform cannot distinguish between a mentee browsing mentors, a mentor managing availability, and an admin approving applications. The multi-sided marketplace model collapses without trust in identity — and that trust begins with hardened authentication (NFR-2 = 3) and multi-factor verification (PP-7 = 4, Regulated Commerce). Every other epic in the roadmap declares a dependency on E1, making this the single most critical foundation investment."
    constraints:
      in_scope: "KeyCloak integration for SSO with email/password and social login (Google, Apple). Multi-factor authentication via TOTP with optional SMS fallback. Role-based access control for three roles: mentee, mentor, admin. Secure session management with token refresh and expiry. Password reset and account recovery flows. Registration flows for mentee and mentor personas with email verification."
      out_of_scope: "Mentor domain verification and credentialing (handled in E2). Admin user creation workflow beyond initial seed admin. Enterprise SSO/SAML integration. Biometric authentication. Hardware security keys (WebAuthn/FIDO2). Directory sync with external IdPs. Profile management beyond basic identity fields (name, email, avatar)."
      must_not_break: "None at this stage — foundational epic."
    success_scenarios:
      - "Given a new user visiting the platform, when they complete the registration form with valid email and password, then they receive a verification email within 60 seconds and can log in after clicking the verification link."
      - "Given a registered mentee, when they attempt to access the admin panel URL, then they receive a 403 Forbidden response and are redirected to their mentee dashboard."
      - "Given a user with MFA enabled, when they enter correct credentials without a TOTP code, then they are prompted for the second factor and cannot access the platform until it is provided."
    failure_conditions:
      - "A user can access role-restricted resources (mentor dashboard, admin panel) without holding the corresponding role in KeyCloak."
      - "Session tokens do not expire or refresh correctly, allowing stale sessions to persist beyond the configured timeout."
      - "Registration or login flows take more than 5 seconds end-to-end under normal load, creating unacceptable friction for general consumer users (PP-1 = 4)."

  - id: "E2"
    name: "Mentor Onboarding and Credentialing"
    strategic_goal_ref: "SG-02"
    description: "Enable domain experts in Sport, Entertainment, Business, and Entrepreneurship to register as mentors, submit credentials for domain verification, build public profiles, and receive approval through a structured admin workflow. This is the supply-side activation engine for the marketplace."
    bucket: "near"
    priority: "P1"
    effort: "M"
    depends_on: ["E1"]
    foundation_investment: false
    github_issue_ref: "TBD"
    ltm_citations:
      - "/Users/kapilahuja/.meridian/core/memory/knowledge/domain-taxonomy/user-management.md"
      - "/Users/kapilahuja/.meridian/core/memory/knowledge/domain-taxonomy/commerce.md"
      - "/Users/kapilahuja/.meridian/core/memory/standards/templates/epic-schema.md"
      - "/Users/kapilahuja/.meridian/core/memory/standards/agent-lifecycle/epic-management-rules.md"
    intent:
      p1: "The mentorship marketplace faces a critical cold-start problem: without credible, domain-verified mentors in Sport and Entertainment — verticals no existing platform serves — mentees have no reason to join. Today, accomplished professionals in these domains have no structured channel to offer mentorship. Existing platforms like MentorCruise and ADPList focus on tech and design, leaving sport coaches, entertainment industry veterans, and entrepreneurship advisors without a curated onboarding path. The vision targets 50 domain-verified mentors within 8 weeks of launch, which requires a frictionless yet rigorous onboarding pipeline."
      p2: "After this epic ships, domain experts can register as mentors, select their verticals (Sport, Entertainment, Business, Entrepreneurship), submit credentials for verification (certifications, experience documentation, portfolio links), set their session rates within platform-defined pricing bands, configure their availability, and build a public profile with a domain-verified badge. Administrators can review applications, verify credentials, approve or reject mentors with feedback, and manage the mentor pipeline through a structured workflow. The end-to-end flow from application to approved public profile is operational."
      p3: "This epic directly serves SG-02 — establishing mentor supply in underserved verticals. The 50-mentor target within 8 weeks is only achievable if the onboarding experience is smooth enough for non-technical domain experts (PP-1 = 4, General Consumer) and rigorous enough to establish the credibility that differentiates Felly Club from platforms with self-reported profiles. Domain verification badges are a core differentiator listed in the vision — without them, Felly Club is just another mentorship listing site. This epic also feeds SG-01 by populating the supply side that the discovery and booking epics depend on."
    constraints:
      in_scope: "Mentor registration flow with vertical selection (Sport, Entertainment, Business, Entrepreneurship). Credential submission for domain verification (certifications, experience, portfolio). Admin review and approval workflow with approve/reject/request-more-info states. Public mentor profile with bio, verticals, credentials, pricing, availability, and domain-verified badge. Pricing band configuration per mentor within platform-defined ranges. Availability management (weekly schedule, blocked dates)."
      out_of_scope: "Automated credential verification via third-party APIs (manual admin review for MVP). AI-powered mentor matching or recommendation. Mentor content publishing (blogs, courses). Mentor performance analytics beyond basic profile views (handled in E10). Mentor-to-mentor networking or community features. Bulk mentor import tools."
      must_not_break: "E1 authentication and RBAC — mentor onboarding must use existing KeyCloak roles, not create parallel auth flows."
    success_scenarios:
      - "Given a domain expert visiting the platform, when they complete the mentor registration form with credentials and submit for review, then their application appears in the admin approval queue within 30 seconds and they receive a confirmation email."
      - "Given an admin reviewing a mentor application, when they approve the application with domain verification, then the mentor's public profile becomes visible in search results with a domain-verified badge within 5 minutes."
      - "Given an approved mentor, when they set their session rate to a value outside the platform-defined pricing band, then the system rejects the rate and displays the valid range."
    failure_conditions:
      - "A mentor profile becomes publicly visible and searchable before admin approval is granted."
      - "Domain-verified badges are displayed on mentor profiles that have not completed the credential verification workflow."
      - "The mentor onboarding flow requires more than 10 minutes to complete for a prepared applicant, creating friction that deters supply-side acquisition."

  - id: "E3"
    name: "Mentor Discovery and Search"
    strategic_goal_ref: "SG-01"
    description: "Deliver Elasticsearch-powered mentor discovery with faceted filtering by domain vertical, rating, pricing, availability, and language. Enables mentees to find and evaluate mentors across Sport, Entertainment, Business, and Entrepreneurship verticals."
    bucket: "near"
    priority: "P1"
    effort: "M"
    depends_on: ["E1", "E2"]
    foundation_investment: false
    github_issue_ref: "TBD"
    ltm_citations:
      - "/Users/kapilahuja/.meridian/core/memory/knowledge/domain-taxonomy/search.md"
      - "/Users/kapilahuja/.meridian/core/memory/standards/templates/epic-schema.md"
      - "/Users/kapilahuja/.meridian/core/memory/standards/agent-lifecycle/epic-management-rules.md"
    intent:
      p1: "Mentees currently have no way to discover mentors on the platform. Without a structured discovery mechanism, even a well-stocked mentor supply is invisible to the demand side. The vision identifies 'no standardized discovery mechanism for domain-specific mentors' as a core pain point. Existing competitors either offer basic text search (MentorCruise) or rely on manually curated lists (ADPList). Mentees in niche verticals like Sport and Entertainment need domain-aware filtering that understands their specific needs — filtering by sport discipline, entertainment sub-domain, pricing range, language, and availability."
      p2: "After this epic ships, mentees can search for mentors using full-text queries and refine results through faceted filters: domain vertical, sub-domain specialization, rating, price range, availability windows, language, and geographic proximity. Search results display mentor cards with key information (name, verified badge, rating, price, next available slot) enabling quick evaluation. Autocomplete guides mentees toward valid searches. The search experience is responsive and performs well across devices (PP-2 = 3, Multi-Channel Responsive), with sub-500ms query response times (NFR-3 = 3)."
      p3: "Discovery is the bridge between mentor supply (SG-02) and marketplace transactions (SG-01). Without effective search, the marketplace cannot function regardless of how many mentors are onboarded. The Elasticsearch-powered approach supports the scale trajectory from initial 50 mentors to thousands, with relevance tuning capability that improves as usage data accumulates. This is a critical path item for the MVP — session booking (E4) and payment (E5) are meaningless without mentees first finding mentors."
    constraints:
      in_scope: "Elasticsearch index for approved mentor profiles. Full-text search across mentor name, bio, and credentials. Faceted filtering by domain vertical, sub-domain, rating, price range, availability, language, and country. Mentor card display in search results with key attributes. Autocomplete and typeahead for search queries. Sort options (relevance, rating, price, availability). Responsive search UI across desktop and mobile browsers."
      out_of_scope: "AI-powered mentor-mentee matching algorithms (out of scope per vision). Semantic or vector-based search. Personalized search ranking based on mentee behavior. Saved searches or search alerts. Geographic map-based discovery. Search analytics dashboard (handled in E10)."
      must_not_break: "E2 mentor profiles — search indexes must reflect current approved mentor data without lag beyond 5 minutes."
    success_scenarios:
      - "Given a mentee searching for 'sport coaching', when they apply the Sport vertical filter and set a price range of EUR 30-80, then only approved mentors matching both criteria appear in results within 500ms."
      - "Given a mentee typing 'entre' in the search bar, when autocomplete activates, then suggestions including 'Entrepreneurship' and matching mentor names appear within 200ms."
      - "Given 50 approved mentors across four verticals, when a mentee searches without filters, then results are ranked by relevance with domain-verified mentors receiving a visible boost."
    failure_conditions:
      - "Search returns mentors who are not approved or whose profiles are incomplete, exposing unverified content to mentees."
      - "Faceted filter counts are inaccurate — showing 12 mentors for a filter combination that actually yields 8 results."
      - "Search latency exceeds 1 second for standard queries, degrading the discovery experience below consumer expectations (PP-1 = 4)."

  - id: "E4"
    name: "Session Booking and Video Delivery"
    strategic_goal_ref: "SG-01"
    description: "Enable mentees to book 30-minute or 60-minute sessions with mentors, manage scheduling with calendar integration, and conduct sessions via Zoom SDK-powered in-platform video delivery. Covers the full session lifecycle from booking through completion."
    bucket: "near"
    priority: "P1"
    effort: "L"
    depends_on: ["E1", "E2", "E3"]
    foundation_investment: false
    github_issue_ref: "TBD"
    ltm_citations:
      - "/Users/kapilahuja/.meridian/core/memory/knowledge/domain-taxonomy/commerce.md"
      - "/Users/kapilahuja/.meridian/core/memory/standards/templates/epic-schema.md"
      - "/Users/kapilahuja/.meridian/core/memory/standards/agent-lifecycle/epic-management-rules.md"
    intent:
      p1: "Today there is no mechanism for mentees to book sessions with mentors or for those sessions to be delivered. The marketplace has supply (E2) and discovery (E3) but no transaction mechanism — the equivalent of a store with products on shelves but no checkout counter. Scheduling across time zones (India, Switzerland, USA, Germany — PP-4 = 3) adds complexity that manual coordination cannot handle. Existing competitors either lack built-in video (MentorCruise, GrowthMentor redirect to external tools) or offer phone-only delivery (Clarity.fm). The vision positions built-in video delivery as a core differentiator."
      p2: "After this epic ships, mentees can view a mentor's available time slots (synced from mentor availability settings), select a 30-minute or 60-minute session format, book a session with automatic timezone conversion, and receive confirmation with calendar invites. Mentors receive booking notifications and can manage their upcoming sessions. Both parties join sessions through Zoom SDK embedded in the platform — no external tool switching required. Sessions can be rescheduled or cancelled according to configurable policies (e.g., 24-hour cancellation window). Optional session recording is available with mutual consent. The session lifecycle flows from booked to in-progress to completed, triggering downstream events (payment release in E5, rating prompt in E6)."
      p3: "Session booking and delivery is the core transaction of the marketplace and the centerpiece of SG-01. Without it, Felly Club is a directory, not a marketplace. The Zoom SDK integration eliminates the friction of switching to external video tools — a differentiator over MentorCruise and GrowthMentor. The session lifecycle also creates the trigger events that downstream epics depend on: payment release (E5) fires on session completion, and the rating prompt (E6) fires post-session. This epic transforms Felly Club from a listing platform into a functional marketplace."
    constraints:
      in_scope: "Session booking flow for 30-minute and 60-minute formats. Mentor availability display with timezone-aware slot selection. Google Calendar integration for calendar invites. Booking confirmation, reminder, and cancellation notifications. Zoom SDK integration for in-platform video sessions. Session rescheduling and cancellation with configurable policies. Optional session recording with mutual consent toggle. Session lifecycle state machine: booked, confirmed, in-progress, completed, cancelled, no-show."
      out_of_scope: "Group mentorship sessions or cohort-based programs (out of scope per vision). Calendar integration beyond Google Calendar (out of scope per vision). Custom video infrastructure — MVP uses Zoom SDK only (out of scope per vision). AI-generated session notes or transcription. Session replay or on-demand recording access. Recurring session scheduling (weekly standing sessions)."
      must_not_break: "E1 authentication — session access must enforce that only the booked mentor and mentee can join. E2 mentor profiles — availability displayed in booking must reflect current mentor settings. E3 search — session booking actions initiated from search results must preserve search context for back navigation."
    success_scenarios:
      - "Given a mentee viewing a mentor's profile, when they select an available 60-minute slot on a future date, then a booking is created with a calendar invite sent to both parties and the slot is marked unavailable for other mentees within 30 seconds."
      - "Given a booked session starting in 5 minutes, when the mentee clicks 'Join Session', then the Zoom SDK loads within the platform and connects both parties without requiring an external Zoom application or account."
      - "Given a mentee requesting cancellation 48 hours before a session, when the cancellation policy allows 24-hour notice, then the session is cancelled, the slot is released back to the mentor's availability, and both parties receive cancellation confirmation."
    failure_conditions:
      - "Two mentees successfully book the same time slot with the same mentor — a double-booking occurs."
      - "Session video fails to connect for either party and no fallback or error guidance is provided, leaving users stranded."
      - "Timezone conversion errors cause sessions to display at wrong times for users in different countries, leading to missed sessions."
      - "Session lifecycle state transitions allow invalid paths (e.g., a cancelled session transitioning to completed)."

  - id: "E5"
    name: "Payment Processing and Escrow"
    strategic_goal_ref: "SG-03"
    description: "Implement PayU-powered payment processing with escrow hold-and-release, multi-currency support across four countries, platform commission calculation, mentor payouts, and refund workflows. Delivers the financial trust infrastructure that differentiates Felly Club."
    bucket: "near"
    priority: "P1"
    effort: "L"
    depends_on: ["E1", "E4"]
    foundation_investment: false
    github_issue_ref: "TBD"
    ltm_citations:
      - "/Users/kapilahuja/.meridian/core/memory/knowledge/domain-taxonomy/payments.md"
      - "/Users/kapilahuja/.meridian/core/memory/standards/templates/epic-schema.md"
      - "/Users/kapilahuja/.meridian/core/memory/standards/agent-lifecycle/epic-management-rules.md"
    intent:
      p1: "Today there is no mechanism to process payments, hold funds in escrow during sessions, calculate platform commissions, or pay mentors. The marketplace has sessions (E4) but no financial layer — mentees cannot pay and mentors cannot earn. This is not merely a feature gap but a trust gap: without escrow-based payment protection, mentees risk paying for no-show mentors and mentors risk delivering sessions without receiving payment. Existing competitors lack escrow (MentorCruise, ADPList) or use per-minute billing without session guarantees (Clarity.fm). The multi-country operation (India, Switzerland, USA, Germany) adds multi-currency complexity that most competitors avoid entirely."
      p2: "After this epic ships, mentees can pay for sessions at booking time with funds held in escrow until session completion. Upon session completion, the platform automatically calculates the 10-20% commission, releases the mentor's share, and records the transaction. Multi-currency support handles EUR, USD, CHF, and INR with transparent conversion. Refund workflows process full and partial refunds for cancelled or disputed sessions. Mentor payouts are processed on a configurable schedule (weekly or bi-weekly) with payout history and earnings dashboards. The entire payment flow is PCI DSS compliant through PayU's gateway — the platform never handles raw card data."
      p3: "This epic is central to SG-03 — delivering trust and transparency as core differentiators. Escrow protection is the financial mechanism that backs the platform's quality guarantee: mentees pay only for completed sessions, and mentors are guaranteed payment for delivered sessions. The 10-20% commission model generates platform revenue (target: EUR 8-15 per session). Multi-currency support enables the four-country launch (SG-01) without forcing currency conversion onto users. PCI DSS compliance through PayU aligns with SG-04's regulatory compliance goals. Without this epic, Felly Club has no revenue model and no financial trust mechanism."
    constraints:
      in_scope: "PayU integration for card payments and local payment methods. Escrow hold-and-release tied to session lifecycle (hold at booking, release at completion). Multi-currency support for EUR, USD, CHF, and INR. Platform commission calculation at configurable 10-20% rates. Mentor payout processing on weekly/bi-weekly schedules. Full and partial refund workflows for cancellations and disputes. Transaction history and earnings dashboards for mentors. Payment confirmation and receipt emails. Idempotent payment requests to prevent duplicate charges."
      out_of_scope: "Subscription or recurring billing models. Multiple payment gateway failover (PayU only for MVP). Installment payment plans. Direct bank transfer (ACH/SEPA) — only gateway-supported methods. Cryptocurrency or alternative payment methods. Advanced fraud detection beyond PayU's built-in tools. Automated tax calculation and filing per jurisdiction."
      must_not_break: "E1 authentication — payment flows must enforce authenticated sessions only. E4 session lifecycle — payment state transitions must align with session state transitions (escrow release on completion, refund on cancellation)."
    success_scenarios:
      - "Given a mentee booking a session priced at EUR 75, when they complete the payment form, then EUR 75 is charged and held in escrow, the mentor sees the booking as 'paid and held', and the mentee receives a payment confirmation email with escrow details."
      - "Given a completed session with a EUR 75 charge and 15% commission, when the session status transitions to 'completed', then EUR 63.75 is released to the mentor's payout balance and EUR 11.25 is recorded as platform revenue within 24 hours."
      - "Given a session cancelled by the mentee within the cancellation policy window, when the cancellation is processed, then the full escrowed amount is refunded to the mentee's original payment method within 5 business days."
    failure_conditions:
      - "Funds are released from escrow before session completion, removing the trust guarantee for mentees."
      - "Commission calculation produces incorrect amounts, either overcharging mentors or undercharging the platform."
      - "A payment failure during booking leaves the session in a booked state without payment — a mentee holds a slot without paying."
      - "Mentor payouts fail silently with no notification or retry mechanism, eroding mentor trust."

  - id: "E6"
    name: "Quality Assurance and Ratings"
    strategic_goal_ref: "SG-03"
    description: "Implement post-session rating and review system, mentor quality scoring, domain-verified badge management, and dispute initiation workflow. Builds the trust and quality layer that sustains marketplace health and differentiates Felly Club from platforms with no quality accountability."
    bucket: "mid"
    priority: "P2"
    effort: "M"
    depends_on: ["E4", "E5"]
    foundation_investment: false
    github_issue_ref: "TBD"
    ltm_citations:
      - "/Users/kapilahuja/.meridian/core/memory/knowledge/domain-taxonomy/commerce.md"
      - "/Users/kapilahuja/.meridian/core/memory/standards/templates/epic-schema.md"
      - "/Users/kapilahuja/.meridian/core/memory/standards/agent-lifecycle/epic-management-rules.md"
    intent:
      p1: "Completed sessions currently generate no quality signal. Without ratings, mentees cannot distinguish between excellent and mediocre mentors, mentors receive no structured feedback, and the platform cannot identify quality problems before they damage reputation. ADPList's free model struggles with quality control at scale precisely because volunteer mentors lack accountability mechanisms. MentorCruise offers basic ratings but no domain-verified quality framework. The vision positions quality assurance and transparent ratings as core differentiators — mentees should be able to trust that a 4.5-star mentor in the Sport vertical actually delivers value."
      p2: "After this epic ships, mentees are prompted to rate sessions after completion (1-5 stars plus optional text review). Ratings aggregate into mentor quality scores visible on profiles and in search results. Mentors with consistently high ratings earn quality badges alongside their domain-verified badges. Mentees can initiate disputes for problematic sessions (no-show, misrepresentation, inappropriate behavior) through a structured workflow that routes to admin resolution. NPS surveys collect broader satisfaction data. The quality system creates a feedback loop: good mentors gain visibility, poor mentors are flagged for review, and mentees can make informed booking decisions."
      p3: "This epic serves SG-03 — trust and transparency as core differentiators. The target of less than 5% dispute rate and greater than 80% of mentees rating 4+ stars within 3 months is only achievable if quality mechanisms are baked into the platform, not bolted on. Ratings drive the virtuous cycle that sustains a marketplace: quality mentors attract mentees, mentee reviews attract more mentors, and visible quality signals reduce the trust barrier for new users. Without this epic, Felly Club has no mechanism to enforce quality or surface trust signals — fundamentally undermining the value proposition."
    constraints:
      in_scope: "Post-session rating prompt (1-5 stars, optional text review). Mentor quality score aggregation and display on profiles and search results. Review moderation by admin (profanity filter, admin approval queue). Dispute initiation workflow for mentees (no-show, misrepresentation, inappropriate behavior). Dispute routing to admin resolution queue. NPS survey delivery post-session. Quality badge assignment based on rating thresholds. Verified purchase badge on reviews (only rated by mentees who completed sessions)."
      out_of_scope: "AI-generated review summaries or sentiment analysis. Photo or video reviews. ML-based fake review detection. Automated dispute resolution. Mentor response to reviews. Review incentive programs. Multi-dimensional ratings (separate scores for content quality, communication, punctuality)."
      must_not_break: "E4 session lifecycle — rating prompts must trigger only on completed sessions, never on cancelled or in-progress sessions. E5 payment flows — dispute initiation must not automatically trigger refunds; admin resolution determines financial outcome."
    success_scenarios:
      - "Given a mentee who just completed a session, when 15 minutes have elapsed since session end, then they receive a rating prompt via email and in-platform notification, and can submit a 1-5 star rating with optional text review."
      - "Given a mentor with 10 completed sessions and an average rating of 4.7 stars, when a mentee views their profile, then the aggregate rating, review count, and quality badge are displayed prominently alongside the domain-verified badge."
      - "Given a mentee experiencing a no-show, when they initiate a dispute within 24 hours, then the dispute appears in the admin resolution queue with session details, payment information, and a structured resolution form."
    failure_conditions:
      - "Ratings are displayed on mentor profiles before moderation review, allowing inappropriate or fraudulent reviews to be publicly visible."
      - "Mentees who did not complete a session with a mentor can submit ratings for that mentor, undermining review credibility."
      - "Dispute initiation triggers an automatic refund without admin review, bypassing the structured resolution process."

  - id: "E7"
    name: "Compliance and Data Protection"
    strategic_goal_ref: "SG-04"
    description: "Implement multi-geography regulatory compliance as a built-in platform capability: GDPR consent management, India TPDP compliance, PCI DSS scope management through PayU, data export and deletion (right to be forgotten), and immutable audit logging across all compliance-relevant actions."
    bucket: "near"
    priority: "P1"
    effort: "M"
    depends_on: ["E1"]
    foundation_investment: true
    github_issue_ref: "TBD"
    ltm_citations:
      - "/Users/kapilahuja/.meridian/core/memory/knowledge/domain-taxonomy/user-management.md"
      - "/Users/kapilahuja/.meridian/core/memory/knowledge/domain-taxonomy/payments.md"
      - "/Users/kapilahuja/.meridian/core/memory/standards/templates/epic-schema.md"
      - "/Users/kapilahuja/.meridian/core/memory/standards/agent-lifecycle/epic-management-rules.md"
    intent:
      p1: "Felly Club operates across four countries spanning three distinct regulatory regimes: GDPR (EU/Switzerland), India TPDP (India), and US state-level privacy laws (USA/Germany also under GDPR). The platform handles highly sensitive data (NFR-7 = 4) including financial transactions, personal conversations in sessions, and PII across jurisdictions. Without compliance infrastructure built in from the start, the platform faces regulatory penalties, data protection incidents, and loss of user trust. The vision explicitly calls out zero compliance violations in the first 6 months as a success metric — compliance cannot be a retrofit, it must be a foundation."
      p2: "After this epic ships, the platform enforces GDPR-compliant consent collection during registration (granular consent for data processing, marketing, session recording). Users can exercise data portability (export personal data in machine-readable format) and right to be forgotten (data deletion with audit trail). India TPDP consent requirements are met for Indian users. PCI DSS compliance is managed through PayU's payment gateway — the platform never stores raw card data. All compliance-relevant actions (consent changes, data access, admin operations, payment events) are captured in an immutable audit log with tamper-evident storage. Cookie consent and privacy policy acceptance flows are operational across all jurisdictions."
      p3: "This epic directly serves SG-04 — achieving multi-geography compliance as a built-in capability. NFR-5 = 4 (Multi-Regime Compliance) and NFR-7 = 4 (Highly Sensitive Data) make this a non-negotiable foundation investment. A compliance violation in any of the four operating countries could shut down operations, incur fines (GDPR: up to 4% of annual turnover), and destroy the trust that the entire marketplace depends on. By building compliance into the platform fabric rather than bolting it on later, Felly Club establishes a competitive advantage — most competitors (MentorCruise, ADPList) operate primarily in single regulatory regimes and have not addressed multi-geography compliance."
    constraints:
      in_scope: "GDPR consent collection during registration with granular opt-in for data processing, marketing, and session recording. India TPDP consent requirements for Indian users. Data export (personal data in JSON/CSV format) and data deletion (right to be forgotten with audit trail). Cookie consent management across jurisdictions. Privacy policy and terms of service acceptance flows. Immutable audit logging for compliance-relevant actions (consent changes, data access, admin operations). PCI DSS scope management through PayU gateway — no raw card data storage. Audit log query interface for admin."
      out_of_scope: "Automated regulatory reporting to authorities. Legal counsel integration or legal document generation. WCAG AA accessibility compliance (deferred per QP-6 = 2). SOC2 or ISO 27001 certification processes. Automated GDPR data protection impact assessments. Cross-border data transfer mechanism management (standard contractual clauses)."
      must_not_break: "E1 authentication — consent collection integrates with registration flows without disrupting the signup experience. E5 payments — PCI DSS scope management must not interfere with PayU payment processing."
    success_scenarios:
      - "Given a new user registering from Germany, when they reach the consent step, then they see GDPR-compliant granular consent options (data processing, marketing, session recording) with clear explanations, and can proceed only after providing required consents."
      - "Given a registered user requesting data export, when they submit the request through their account settings, then they receive a downloadable file containing all their personal data in JSON format within 72 hours."
      - "Given an admin investigating a compliance concern, when they query the audit log for a specific user's consent history, then they see an immutable, timestamped record of all consent grants, revocations, and data access events."
    failure_conditions:
      - "User data is processed without valid consent, or consent records are incomplete or missing for any user in any jurisdiction."
      - "Audit log entries can be modified or deleted, rendering the compliance trail unreliable."
      - "A data deletion request leaves residual personal data in any system component (search index, analytics, backups beyond retention period)."

  - id: "E8"
    name: "Platform Communications"
    strategic_goal_ref: "SG-01"
    description: "Deliver the notification and messaging infrastructure for the platform: SendGrid transactional emails, FCM push notifications, and in-app messaging between mentors and mentees. Covers the full session lifecycle communication chain from booking confirmation through post-session follow-up."
    bucket: "mid"
    priority: "P2"
    effort: "M"
    depends_on: ["E1", "E4"]
    foundation_investment: false
    github_issue_ref: "TBD"
    ltm_citations:
      - "/Users/kapilahuja/.meridian/core/memory/knowledge/domain-taxonomy/personalization.md"
      - "/Users/kapilahuja/.meridian/core/memory/knowledge/domain-taxonomy/user-management.md"
      - "/Users/kapilahuja/.meridian/core/memory/standards/templates/epic-schema.md"
      - "/Users/kapilahuja/.meridian/core/memory/standards/agent-lifecycle/epic-management-rules.md"
    intent:
      p1: "The platform currently has no communication layer. Sessions are booked (E4) and payments are processed (E5), but users receive no confirmations, reminders, or updates. Without notifications, mentees miss sessions they booked, mentors are unaware of new bookings, and both parties lack a channel to coordinate before sessions. The marketplace lifecycle depends on timely communication at every stage: booking confirmation, session reminders, cancellation notices, payment receipts, payout confirmations, and rating prompts. Additionally, mentors and mentees need a way to exchange messages before sessions (clarify goals, share preparation materials) without resorting to external channels."
      p2: "After this epic ships, the platform delivers transactional emails via SendGrid for all lifecycle events (booking confirmation, session reminders at 24h and 1h, cancellation notices, payment receipts, payout confirmations, rating prompts). Push notifications via FCM provide real-time alerts for time-sensitive events (session starting soon, new booking, message received). In-app messaging enables mentor-mentee conversation threads tied to booked sessions — mentees can share goals and questions before sessions, and mentors can send follow-up materials after. Notification preferences allow users to control which channels they receive communications on."
      p3: "Communications are essential infrastructure for SG-01 — the MVP cannot function without lifecycle notifications. A marketplace where users miss sessions, do not receive payment confirmations, or cannot communicate with each other before sessions will fail regardless of how good the booking and payment flows are. The session completion rate target (greater than 85%) depends directly on reminder effectiveness. In-app messaging reduces dependency on external communication tools and keeps session context within the platform, contributing to the trust-driven experience that underpins SG-03."
    constraints:
      in_scope: "SendGrid integration for transactional email templates (booking confirmation, session reminders, cancellation, payment receipt, payout confirmation, rating prompt). FCM integration for push notifications (new booking, session starting, new message). In-app messaging between mentors and mentees tied to session context. Notification preference management (per-channel opt-in/opt-out). Email template system with platform branding. Session reminder scheduling (24-hour and 1-hour before session)."
      out_of_scope: "Marketing email campaigns or bulk email sends. SMS notifications. Advanced drip campaigns or behavioral trigger sequences. Chat features beyond session-context messaging (no general social messaging). Notification analytics or A/B testing of message content. In-app notification center with history and read/unread states (basic for MVP)."
      must_not_break: "E1 authentication — messaging must enforce that only matched mentor-mentee pairs can communicate. E4 session lifecycle — notification triggers must align with session state transitions. E7 compliance — marketing communications must respect GDPR consent; transactional emails are exempt."
    success_scenarios:
      - "Given a mentee who just booked a session, when the booking is confirmed, then they receive a confirmation email via SendGrid within 2 minutes containing session details, mentor name, date/time in their timezone, and a calendar link."
      - "Given a session scheduled for 2pm, when it is 1pm, then both the mentor and mentee receive a push notification via FCM and an email reminder with a 'Join Session' link."
      - "Given a mentee with a booked session, when they send a message to their mentor through in-app messaging, then the mentor receives the message in their inbox and a push notification within 30 seconds."
    failure_conditions:
      - "Session reminders fail to deliver, and no retry or fallback mechanism alerts users — leading to preventable no-shows."
      - "In-app messages are visible to users outside the mentor-mentee pair for that session, violating privacy expectations."
      - "Notification volume overwhelms users because preference controls are absent or non-functional, leading to opt-out from all communications."

  - id: "E9"
    name: "Referral and Acquisition Engine"
    strategic_goal_ref: "SG-05"
    description: "Build the referral-driven acquisition system with unique referral link generation, tracking, configurable reward mechanics, and attribution analytics. Leverages niche community network effects in Sport, Entertainment, Business, and Entrepreneurship verticals to reduce customer acquisition cost."
    bucket: "mid"
    priority: "P2"
    effort: "M"
    depends_on: ["E1", "E5"]
    foundation_investment: false
    github_issue_ref: "TBD"
    ltm_citations:
      - "/Users/kapilahuja/.meridian/core/memory/knowledge/domain-taxonomy/commerce.md"
      - "/Users/kapilahuja/.meridian/core/memory/knowledge/domain-taxonomy/personalization.md"
      - "/Users/kapilahuja/.meridian/core/memory/standards/templates/epic-schema.md"
      - "/Users/kapilahuja/.meridian/core/memory/standards/agent-lifecycle/epic-management-rules.md"
    intent:
      p1: "Felly Club currently has no organic acquisition mechanism beyond direct traffic. In niche verticals like Sport and Entertainment, traditional digital marketing is expensive and poorly targeted — the communities are tight-knit and trust word-of-mouth over advertising. Without a referral engine, the platform must rely entirely on paid acquisition, which is unsustainable at EUR 50K budget. The vision targets greater than 30% of new mentee signups from referrals within 3 months, with CAC below EUR 15 — achievable only with a structured referral system that leverages the network effects inherent in niche communities."
      p2: "After this epic ships, every registered user (mentee and mentor) has a unique referral link they can share. When a referred user signs up and completes their first session, the referrer receives a configurable reward (platform credit, discount on next session, or cash equivalent). Referral attribution tracks the full funnel: link click, signup, first session, and reward disbursement. Both mentors and mentees can refer new users, creating a dual-sided acquisition loop. An attribution analytics dashboard shows referral performance (links generated, conversion rates, reward costs, CAC by referral source) for admin monitoring."
      p3: "This epic directly serves SG-05 — building a referral-driven acquisition engine. Niche communities in Sport and Entertainment have strong internal networks: athletes know athletes, coaches know coaches, entertainers know entertainers. A referral system that rewards these connections converts community trust into platform growth at a fraction of paid acquisition cost. The dual-sided referral (mentors refer mentees, mentees refer mentees, mentees refer mentors) creates the network effect flywheel that marketplace businesses depend on. Without this epic, Felly Club's growth is capped by its marketing budget rather than its community value."
    constraints:
      in_scope: "Unique referral link generation for every registered user. Referral tracking across the full funnel (click, signup, first session completion). Configurable reward mechanics (platform credit, session discount, cash equivalent). Reward disbursement tied to referral milestone (first completed session). Dual-sided referral support (mentors and mentees can both refer). Referral attribution analytics dashboard for admin. Anti-fraud measures (self-referral prevention, duplicate detection)."
      out_of_scope: "Affiliate marketing programs with external partners. Multi-tier or pyramid referral structures (referrer of referrer rewards). Social media integration for one-click sharing. Referral leaderboards or gamification. Automated referral campaign emails. Integration with external analytics platforms (Google Analytics UTM tracking is separate)."
      must_not_break: "E1 authentication — referral links must work for unauthenticated visitors and properly attribute after signup. E5 payments — reward disbursement as platform credit must integrate with the payment balance system without creating accounting inconsistencies."
    success_scenarios:
      - "Given a registered mentee, when they access their referral link from their dashboard and share it, then the link contains a unique tracking code and the referral dashboard shows the link as 'generated'."
      - "Given a new user clicking a referral link, when they sign up and complete their first session, then the referrer receives the configured reward (e.g., EUR 10 platform credit) and both parties receive notification of the successful referral."
      - "Given an admin viewing the referral analytics dashboard, when they filter by the last 30 days, then they see total referral links generated, conversion rate (click to signup to first session), total rewards disbursed, and effective CAC for referred users."
    failure_conditions:
      - "Referral attribution is lost during the signup flow — a user clicks a referral link but the referrer receives no credit after the referred user completes their first session."
      - "Self-referral or duplicate referral fraud is possible, allowing users to game the reward system."
      - "Reward disbursement fails or creates negative balances in the payment system, causing accounting discrepancies."

  - id: "E10"
    name: "Admin Operations and Analytics"
    strategic_goal_ref: "SG-01"
    description: "Deliver the admin panel for platform operations (mentor approval pipeline, dispute management, financial oversight, user management) and role-specific analytics dashboards for administrators, mentors, and mentees. Provides the operational tooling required to run a multi-sided marketplace."
    bucket: "mid"
    priority: "P2"
    effort: "L"
    depends_on: ["E2", "E4", "E5", "E6"]
    foundation_investment: false
    github_issue_ref: "TBD"
    ltm_citations:
      - "/Users/kapilahuja/.meridian/core/memory/knowledge/domain-taxonomy/commerce.md"
      - "/Users/kapilahuja/.meridian/core/memory/knowledge/domain-taxonomy/user-management.md"
      - "/Users/kapilahuja/.meridian/core/memory/standards/templates/epic-schema.md"
      - "/Users/kapilahuja/.meridian/core/memory/standards/agent-lifecycle/epic-management-rules.md"
    intent:
      p1: "The platform currently has no operational tooling for administrators. Mentor approvals (E2) create a queue but admins have no dashboard to manage it efficiently. Disputes (E6) are initiated but route to a queue that has no management interface. Financial transactions (E5) are processed but there is no oversight dashboard showing revenue, payouts, and anomalies. As the marketplace scales, manual operational processes become unsustainable — the Platform Administrator persona (PP-3 = 5) needs purpose-built tooling for multi-geography marketplace operations. Similarly, mentors need earnings and performance visibility, and mentees need session history and spending oversight."
      p2: "After this epic ships, administrators have a unified operations panel covering: mentor approval pipeline (pending, approved, rejected with filtering and bulk actions), dispute management (open disputes, resolution workflow, outcome tracking), financial oversight (revenue dashboard, payout status, commission tracking, anomaly flagging), user management (search, view, suspend, delete users), and platform health metrics (active users, sessions, completion rates). Mentors have a dashboard showing earnings history, upcoming payouts, session statistics, and rating trends. Mentees have a dashboard showing session history, spending summary, and upcoming bookings. All dashboards are role-gated through E1's RBAC."
      p3: "This epic supports SG-01 by providing the operational infrastructure required to run the marketplace post-launch. A marketplace without admin tooling is a marketplace that cannot scale — every mentor approval, dispute resolution, and financial reconciliation becomes a manual, error-prone process. The analytics dashboards also support SG-03 (trust and transparency) by giving mentors visibility into their earnings and ratings, and mentees visibility into their spending and session quality. For the Platform Administrator persona, this epic transforms ad-hoc operations into structured, efficient workflows that enable confident decision-making across four countries."
    constraints:
      in_scope: "Admin panel with mentor approval pipeline (list, filter, approve, reject, request-info). Dispute management interface (open disputes, assign, resolve, track outcomes). Financial oversight dashboard (revenue, payouts, commissions, refunds, anomaly indicators). User management (search, view details, suspend, reactivate, delete). Platform health metrics dashboard (active users, sessions booked, sessions completed, completion rate, revenue). Mentor dashboard (earnings, payouts, session stats, rating history). Mentee dashboard (session history, spending, upcoming bookings). Role-gated access through E1 RBAC."
      out_of_scope: "Advanced analytics with ML-based predictions (churn, LTV) — out of scope per vision. Real-time streaming analytics. Custom report builder. Data warehouse integration. White-label analytics for enterprise clients. Automated alerting rules (admin checks dashboards manually for MVP). Export to BI tools (Tableau, Looker)."
      must_not_break: "E1 RBAC — dashboard access must be strictly role-gated. E2 mentor approval — admin panel must reflect current approval queue without lag. E5 financial data — dashboards must show accurate, consistent financial figures matching actual transaction records. E6 disputes — dispute management must show current dispute states matching the dispute workflow."
    success_scenarios:
      - "Given an admin logging into the admin panel, when they navigate to the mentor approval queue, then they see all pending applications with submission date, vertical, and credential summary, and can approve or reject each application with a single action."
      - "Given a mentor logging into their dashboard, when they view the earnings section, then they see total earnings, pending payouts, completed payouts, and a per-session earnings breakdown that matches their actual transaction history."
      - "Given an admin viewing the financial oversight dashboard, when they check the daily revenue summary, then the total matches the sum of all commission amounts from completed sessions for that day, with no discrepancies."
    failure_conditions:
      - "Financial figures displayed on admin dashboards do not match actual transaction records, creating trust issues in operational reporting."
      - "Admin actions (approve mentor, resolve dispute) do not propagate to the affected entities in real-time — e.g., approving a mentor in the panel does not make their profile searchable."
      - "Role-gating fails, allowing mentors or mentees to access admin panel views or other users' dashboards."
