epics:
  # ─── E1: Foundation ─────────────────────────────────────────────────────────
  - id: "E1"
    name: "User Identity & Profile Foundation"
    strategic_goal_ref: "SG-01"
    description: >
      Establishes the core identity layer for all three personas — mentees,
      mentors, and platform admin — through KeyCloak-backed registration,
      authentication, and profile management. Provides admin-driven mentor
      onboarding with domain verification and verified badges, forming the
      trust and identity foundation every subsequent epic depends on.
    bucket: "near"
    priority: "P1"
    effort: "M"
    depends_on: []
    foundation_investment: true
    github_issue_ref: "TBD"
    ltm_citations:
      - "~/.meridian/core/memory/knowledge/domain-taxonomy/user-management.md"
      - "~/.meridian/core/memory/knowledge/project-profiling/product-profile.md"
      - "~/.meridian/core/memory/standards/templates/epic-schema.md"
      - "~/.meridian/core/memory/standards/agent-lifecycle/epic-management-rules.md"
    intent:
      p1: >
        Today, aspiring individuals across Sport, Entrepreneurship, Business,
        and Entertainment have no standardised way to discover or connect with
        credible mentors. Accomplished professionals lack a structured channel
        to offer their expertise. There is no shared identity layer that
        verifies mentor credentials, manages mentee profiles, or gives
        platform administrators the tools to curate supply quality. Without
        this foundation, every downstream capability — discovery, booking,
        payment — has no verified user to operate on.
      p2: >
        After this epic ships, mentees can self-register via email or social
        login, create profiles with their interests and goals, and browse the
        platform as authenticated users. Platform administrators can onboard
        mentors through a guided workflow that captures bio, expertise
        category, pricing, availability, and verification artefacts
        (LinkedIn, portfolio, proof-of-expertise). Mentors receive verified
        badges upon admin approval, and their profiles display trust signals
        visible to mentees. All three personas — mentee, mentor, admin — have
        distinct authenticated experiences with role-based access control.
      p3: >
        This epic directly enables SG-01: "Build a trusted, admin-curated
        mentor marketplace with domain verification and quality signals."
        The admin-curated onboarding model is Felly Club's primary
        differentiator against free platforms with inconsistent quality
        (ADPList) and transactional platforms without verification
        (Clarity.fm). By establishing verified identity as the first
        deliverable, every subsequent epic inherits a trust layer — mentor
        discovery shows verified badges, session booking involves verified
        parties, and payment flows operate between known entities.
    constraints:
      in_scope: >
        Mentee self-registration with email and social login (Google, Apple)
        via KeyCloak; admin-driven mentor onboarding workflow with profile
        creation, expertise category assignment (Sport, Entrepreneurship,
        Business, Entertainment), pricing and availability setup, and
        verification artefact upload (LinkedIn, portfolio, proof-of-expertise);
        admin verification review and verified badge assignment; mentor and
        mentee profile view and edit; role-based access control for three
        personas (mentee, mentor, admin); session management with JWT tokens;
        password reset and recovery flows; profile completeness indicators.
      out_of_scope: >
        Mentor self-registration (deferred to Phase 2); MFA beyond KeyCloak
        defaults; SSO/SAML enterprise integration; bulk user import; user
        analytics and audit trail beyond login events; social login providers
        beyond Google and Apple; profile photo advanced editing (cropping,
        filters); directory sync with external identity providers.
      must_not_break: >
        None at this stage — foundational epic.
    success_scenarios:
      - >
        Given a new visitor on the Felly Club web app, when they complete
        the registration form with valid email and password, then they
        receive a verification email, confirm their account, and land on
        their mentee dashboard with profile completion prompts.
      - >
        Given a platform administrator logged into the admin portal, when
        they initiate mentor onboarding and fill in the mentor's bio,
        expertise category (e.g., Sport), pricing (e.g., $50/30min),
        availability slots, and upload a LinkedIn profile link as
        verification, then the mentor profile is created in "pending
        verification" status and appears in the admin review queue.
      - >
        Given an admin reviewing a pending mentor profile, when they approve
        the profile after verifying credentials, then the mentor's profile
        status changes to "verified," a verified badge appears on their
        public profile, and the mentor can log in and see their dashboard.
    failure_conditions:
      - >
        A mentee completes registration but cannot log in or access their
        dashboard — the identity flow is broken end-to-end.
      - >
        A mentor profile is created without admin verification and appears
        as "verified" to mentees — the trust layer is bypassed.
      - >
        Role-based access control does not enforce persona boundaries — a
        mentee can access admin functions or a mentor can access another
        mentor's private data.

  # ─── E2: Marketplace Discovery ──────────────────────────────────────────────
  - id: "E2"
    name: "Mentor Marketplace & Discovery"
    strategic_goal_ref: "SG-01"
    description: >
      Delivers the mentor discovery experience — listing, search, filtering,
      detailed profile views, and rule-based personalised recommendations —
      enabling mentees to find and evaluate mentors across Sport,
      Entrepreneurship, Business, and Entertainment categories.
    bucket: "near"
    priority: "P1"
    effort: "M"
    depends_on: ["E1"]
    foundation_investment: false
    github_issue_ref: "TBD"
    ltm_citations:
      - "~/.meridian/core/memory/knowledge/domain-taxonomy/search.md"
      - "~/.meridian/core/memory/knowledge/domain-taxonomy/commerce.md"
      - "~/.meridian/core/memory/knowledge/domain-taxonomy/personalization.md"
      - "~/.meridian/core/memory/knowledge/project-profiling/product-profile.md"
      - "~/.meridian/core/memory/standards/agent-lifecycle/epic-management-rules.md"
    intent:
      p1: >
        Mentees currently have no standardised way to discover mentors across
        niche domains like Sport or Entertainment. Existing platforms
        (MentorCruise, GrowthMentor) serve only tech and business verticals,
        while transactional platforms (Clarity.fm, Cameo) offer no structured
        search, filtering, or quality signals. A mentee looking for a sports
        mentor or an entertainment industry guide has no single destination
        with searchable, filterable, and comparable mentor profiles — they
        rely on fragmented word-of-mouth or generic social media searches.
      p2: >
        After this epic ships, mentees can browse a paginated mentor listing
        with category tabs (Sport, Entrepreneurship, Business, Entertainment),
        use advanced search with filters (expertise area, price range,
        availability, rating, language), view detailed mentor profiles with
        bio, credentials, verified badge, pricing, availability calendar,
        and session history. Rule-based recommendations surface relevant
        mentors by matching mentee interests to mentor expertise categories.
        Mentees can evaluate and compare mentors before deciding whom to
        book — the discovery-to-decision journey is complete within the
        platform.
      p3: >
        This epic is central to SG-01's vision of a "trusted, admin-curated
        mentor marketplace." Discovery is the primary value unlock for
        mentees — without it, verified mentors exist in the system but are
        invisible. The cross-domain coverage (Sport, Entrepreneurship,
        Business, Entertainment) is Felly Club's key differentiator, and
        this epic makes that coverage navigable. PP-1 level 4 (General
        Consumer) demands an intuitive, mobile-first search experience
        with progressive disclosure, while PP-5 level 3 (Bidirectional)
        indicates Elasticsearch as the search infrastructure for scalable
        discovery across a growing mentor catalog.
    constraints:
      in_scope: >
        Paginated mentor listing with category-based navigation (Sport,
        Entrepreneurship, Business, Entertainment); full-text search across
        mentor names, bios, and expertise tags via Elasticsearch; advanced
        filtering by expertise category, price range, availability, rating,
        and verified status; detailed mentor profile page with bio,
        credentials, verification artefacts, pricing per duration (30min,
        60min), availability calendar preview, and session count; rule-based
        personalised recommendations matching mentee stated interests to
        mentor expertise categories (string matching); search results
        responsive across web and mobile; empty state handling for categories
        with no mentors.
      out_of_scope: >
        AI/ML recommendation engine (deferred to Phase 2 — MVP uses
        rule-based matching only); mentor comparison tool; saved/favourite
        mentors list; mentor availability booking from the discovery page
        (booking is in E3); search analytics dashboard; autocomplete/
        typeahead (may be added if effort permits but not committed);
        mentor ranking by revenue or platform promotion.
      must_not_break: >
        E1 user authentication and profile data — mentor profiles displayed
        in search must reflect the verified status and profile data from E1
        without data inconsistency.
    success_scenarios:
      - >
        Given a logged-in mentee with stated interest in "Entrepreneurship,"
        when they navigate to the mentor marketplace page, then they see a
        paginated list of verified mentors in the Entrepreneurship category,
        each showing name, photo, expertise summary, verified badge, price
        per session, and average rating.
      - >
        Given a mentee on the marketplace page, when they enter "sports
        coaching" in the search bar and apply a price filter of "$50–$100
        per session," then the results show only verified Sport-category
        mentors whose pricing falls within the selected range, with matching
        terms highlighted.
      - >
        Given a mentee viewing a mentor's detailed profile, when they review
        the profile page, then they see the mentor's full bio, expertise
        categories, verification artefacts (LinkedIn link, portfolio),
        verified badge, pricing for 30-minute and 60-minute sessions,
        availability calendar preview, and total completed session count.
    failure_conditions:
      - >
        A mentee searches for mentors in a populated category but receives
        zero results — the search index is out of sync with mentor data.
      - >
        Unverified or admin-rejected mentor profiles appear in search
        results or the marketplace listing — the trust filter is broken.
      - >
        Rule-based recommendations show mentors from categories unrelated
        to the mentee's stated interests — the matching logic does not
        function correctly.

  # ─── E3: Session Lifecycle ──────────────────────────────────────────────────
  - id: "E3"
    name: "Session Lifecycle & Video Delivery"
    strategic_goal_ref: "SG-02"
    description: >
      Implements the complete session lifecycle — from session request and
      mentor acceptance through slot selection, video session delivery via
      Zoom or Google Meet integration, auto-recording with 3-day retention,
      and post-session status tracking. Delivers the core transactional
      experience that connects mentees with mentors in real-time.
    bucket: "near"
    priority: "P1"
    effort: "L"
    depends_on: ["E1", "E2"]
    foundation_investment: false
    github_issue_ref: "TBD"
    ltm_citations:
      - "~/.meridian/core/memory/knowledge/domain-taxonomy/commerce.md"
      - "~/.meridian/core/memory/knowledge/project-profiling/product-profile.md"
      - "~/.meridian/core/memory/standards/agent-lifecycle/epic-management-rules.md"
    intent:
      p1: >
        Even with verified mentors discoverable on the platform, there is no
        way to actually conduct a mentorship session. The gap between
        discovering a mentor and receiving guidance is entirely unstructured —
        mentees and mentors would need to coordinate scheduling, video calls,
        and session logistics outside the platform through email, calendar
        invites, and third-party video tools. This fragmentation creates
        friction, drops conversions, and makes it impossible for the platform
        to ensure session quality, enforce cancellation policies, or capture
        the session data needed for trust and payment flows downstream.
      p2: >
        After this epic ships, a mentee can request a session with a
        discovered mentor, selecting their preferred duration (30 or 60
        minutes). The mentor receives the request and can accept or decline.
        On acceptance, both parties enter a slot selection flow where the
        mentee picks from the mentor's available calendar slots. Once a slot
        is confirmed, both receive reminders. At session time, both join a
        virtual session room powered by Zoom or Google Meet integration,
        with auto-recording enabled for dispute resolution purposes (admin-
        only access, 3-day retention). Cancellation and rescheduling follow
        platform-defined policies. After the session completes, both parties
        see the session marked as completed in their dashboards.
      p3: >
        This epic is the primary delivery against SG-02: "Deliver seamless
        end-to-end session lifecycle from discovery through post-session
        engagement." The session is Felly Club's core product — without it,
        the platform is a directory, not a marketplace. The full lifecycle
        management (request → acceptance → scheduling → video → completion)
        is a key differentiator against Cameo (short video messages, not
        sessions) and Clarity.fm (per-minute billing, no structured
        scheduling). PP-5 level 3 (Bidirectional) confirms the need for
        deep integration with video providers (Zoom/Google Meet) including
        recording callbacks and calendar events.
    constraints:
      in_scope: >
        Session request workflow (mentee selects duration and sends request
        to mentor); mentor accept/decline flow with reason capture on
        decline; slot selection from mentor's available calendar after
        acceptance; session reminders (email-based — notifications mocked
        until E7 delivers in-app notification centre); cancellation and
        rescheduling with platform-defined policy enforcement (admin-
        configurable via E6); session status tracking (requested, accepted,
        scheduled, in-progress, completed, cancelled, no-show); virtual
        session room with Zoom or Google Meet API integration; auto-session
        recording with 3-day retention and admin-only access; session
        history view for mentees and mentors in their dashboards.
      out_of_scope: >
        Group mentoring sessions (deferred to Phase 2 — one-on-one only);
        in-platform messaging or chat between mentor and mentee (deferred to
        Phase 2 — communication via session request and platform
        notifications only); session recording user playback (deferred to
        Phase 2 — recordings are admin-only for dispute resolution);
        long-term mentorship programmes (deferred to Phase 2); proprietary
        video infrastructure (uses Zoom/Google Meet APIs); payment
        processing for sessions (handled by E4); post-session ratings
        (handled by E5); in-app notification centre (handled by E7 —
        email-based notifications used as interim).
      must_not_break: >
        E1 user authentication — session participants must be authenticated
        users with valid roles (mentee requesting, mentor accepting). E2
        mentor profile data — session request must reference a verified
        mentor whose profile and availability data are consistent with
        what was displayed during discovery.
    success_scenarios:
      - >
        Given a mentee viewing a verified mentor's profile, when they click
        "Request Session" and select a 60-minute duration, then the mentor
        receives a session request notification (email), and the session
        appears as "requested" in both the mentee's and mentor's dashboards.
      - >
        Given a mentor who has accepted a session request, when the mentee
        selects an available 60-minute slot from the mentor's calendar, then
        both parties see the session as "scheduled" with date, time, and
        duration confirmed, and both receive a calendar reminder email 24
        hours before the session.
      - >
        Given a scheduled session at its start time, when both the mentee
        and mentor click "Join Session," then they enter a virtual session
        room powered by Zoom or Google Meet, auto-recording starts, and the
        session status changes to "in-progress."
      - >
        Given a mentee who needs to cancel a scheduled session, when they
        cancel within the platform's cancellation policy window, then the
        session status changes to "cancelled," the mentor is notified, and
        the calendar slot is freed for future booking.
    failure_conditions:
      - >
        A mentee completes a session request but the mentor never receives
        the notification — the request workflow is broken and sessions
        cannot proceed.
      - >
        A scheduled session's virtual room fails to launch or connect to
        the video provider — the core deliverable (video mentorship) is
        non-functional.
      - >
        Session recordings are accessible to mentees or mentors rather than
        admin-only — the privacy constraint is violated, creating regulatory
        and trust risk.
      - >
        Cancellation or rescheduling bypasses platform policy — a mentee
        cancels outside the policy window without consequences, or a mentor
        declines without the decline being tracked.

  # ─── E4: Payments ───────────────────────────────────────────────────────────
  - id: "E4"
    name: "Payment Processing & Financial Operations"
    strategic_goal_ref: "SG-03"
    description: >
      Implements Stripe-powered payment processing with escrow-backed session
      payments, platform commission deduction (10–20%), multi-currency support
      (INR, USD, CHF, EUR), refund processing, and automated mentor payout
      management — establishing the financial backbone of the marketplace.
    bucket: "near"
    priority: "P1"
    effort: "L"
    depends_on: ["E3"]
    foundation_investment: false
    github_issue_ref: "TBD"
    ltm_citations:
      - "~/.meridian/core/memory/knowledge/domain-taxonomy/payments.md"
      - "~/.meridian/core/memory/knowledge/project-profiling/product-profile.md"
      - "~/.meridian/core/memory/standards/agent-lifecycle/epic-management-rules.md"
    intent:
      p1: >
        Without a payment layer, Felly Club cannot monetise sessions or
        compensate mentors. Mentees have no way to pay for sessions within
        the platform, forcing off-platform payment arrangements that
        eliminate trust, make disputes unresolvable, and remove the
        platform's revenue stream. Mentors have no structured payout
        mechanism, reducing their incentive to participate. The two-sided
        marketplace cannot sustain itself without transparent, escrow-backed
        financial operations that protect both parties and capture platform
        commission.
      p2: >
        After this epic ships, when a mentee books a session, payment is
        captured via Stripe and held in escrow until session completion.
        Upon completion, the platform deducts its commission (10–20%,
        admin-configurable) and the remaining amount is queued for mentor
        payout. Mentees can pay in their local currency (INR, USD, CHF,
        or EUR) with Stripe handling conversion. Refund processing is
        available for cancelled sessions per platform policy. Mentors see
        their earnings, pending payouts, and payout history in their
        dashboard. The admin can monitor all financial transactions,
        configure commission rates, and manage payout schedules.
      p3: >
        This epic delivers SG-03: "Establish transparent multi-currency
        financial operations with escrow-backed payments." The escrow model
        is a key trust differentiator — unlike Clarity.fm's per-minute
        billing or ADPList's free model, Felly Club holds funds until
        session completion, protecting mentees from no-shows and mentors
        from non-payment. Multi-currency support across 4 currencies from
        day one (PP-4 level 3, Multi-Country) is essential for the
        target geographies (India, Switzerland, USA, Germany). NFR-7
        level 4 (Sensitive data) mandates tokenised payment processing
        via Stripe to avoid PCI DSS scope expansion.
    constraints:
      in_scope: >
        Stripe payment gateway integration for session payment capture;
        escrow flow — payment captured on booking, held until session
        completion, released to mentor payout queue after commission
        deduction; platform commission calculation and deduction (10–20%,
        admin-configurable rate); multi-currency support for INR, USD, CHF,
        and EUR via Stripe; refund processing for cancelled sessions per
        platform cancellation policy; mentor payout management — earnings
        calculation, payout queue, payout processing via Stripe Connect or
        equivalent; mentor earnings dashboard (earnings, pending payouts,
        payout history); payment webhook handling for asynchronous Stripe
        events; tokenised payment processing (no raw card data stored on
        platform).
      out_of_scope: >
        Subscription or bundle pricing (deferred to Phase 2 — pay-per-
        session only); multiple payment gateway support or gateway failover;
        saved payment methods for repeat purchases; fraud detection beyond
        Stripe's built-in Radar; invoice generation; payment analytics
        dashboard (covered in E9); tax calculation and filing per
        jurisdiction; cryptocurrency payments; installment payments.
      must_not_break: >
        E3 session lifecycle — payment capture must integrate with session
        status transitions (booking triggers payment, completion triggers
        payout queue, cancellation triggers refund evaluation) without
        breaking the session state machine. E1 user authentication —
        payment operations must be tied to authenticated users with correct
        role enforcement (mentees pay, mentors receive payouts, admin
        configures rates).
    success_scenarios:
      - >
        Given a mentee booking a confirmed session with a mentor priced at
        $100/60min, when the mentee enters their payment details and
        confirms, then Stripe captures the $100 payment, the session status
        includes "payment captured," and the funds are held in escrow (not
        released to the mentor).
      - >
        Given a completed session where the mentee paid $100 and the
        platform commission is 15%, when the session is marked as completed,
        then $85 is queued for mentor payout and $15 is recorded as
        platform revenue, visible in the mentor's earnings dashboard and
        the admin financial view.
      - >
        Given a mentee in Germany paying in EUR for a session priced by a
        mentor in INR, when the payment is processed, then Stripe handles
        the currency conversion, the mentee is charged in EUR, and the
        mentor's payout is calculated in their configured currency.
      - >
        Given a session cancelled within the platform's refund-eligible
        window, when the admin or system processes the cancellation, then
        the escrowed payment is refunded to the mentee's original payment
        method and the session's financial status shows "refunded."
    failure_conditions:
      - >
        A mentee completes a session but the escrowed payment is not
        released to the mentor payout queue — mentors are not compensated
        for delivered sessions.
      - >
        A session is cancelled and the mentee is charged without receiving
        a refund — the escrow protection fails and mentee trust is broken.
      - >
        Raw card data is stored on the platform instead of using Stripe
        tokenisation — PCI DSS scope is expanded and data security is
        compromised.

  # ─── E5: Trust & Quality ────────────────────────────────────────────────────
  - id: "E5"
    name: "Ratings, Reviews & Dispute Resolution"
    strategic_goal_ref: "SG-04"
    description: >
      Delivers the platform trust framework — post-session ratings and
      reviews, quality monitoring with auto-flagging, dispute resolution
      supported by admin-accessible session recordings, mentor verification
      status enforcement, and abuse reporting — ensuring marketplace
      integrity and continuous quality improvement.
    bucket: "mid"
    priority: "P1"
    effort: "M"
    depends_on: ["E3", "E4"]
    foundation_investment: false
    github_issue_ref: "TBD"
    ltm_citations:
      - "~/.meridian/core/memory/knowledge/domain-taxonomy/commerce.md"
      - "~/.meridian/core/memory/knowledge/project-profiling/product-profile.md"
      - "~/.meridian/core/memory/standards/agent-lifecycle/epic-management-rules.md"
    intent:
      p1: >
        After sessions are delivered and payments processed, the platform
        has no mechanism for quality feedback, accountability, or dispute
        resolution. Mentees cannot rate or review their experience, making
        it impossible for future mentees to make informed booking decisions.
        Poor-quality mentors face no consequences, and excellent mentors
        receive no recognition. When disputes arise — no-shows, session
        quality disagreements, or misconduct — there is no structured
        resolution process. The absence of quality signals erodes the
        trust that the admin-curated model was designed to create.
      p2: >
        After this epic ships, mentees can rate completed sessions (1–5
        stars) and leave written reviews visible on the mentor's profile.
        Ratings below 3 stars are auto-flagged for admin review. Mentors
        with 3 or more cancellations are auto-flagged for quality
        monitoring. Mentees or mentors can submit disputes for completed
        sessions, which admin resolves using the session recording (3-day
        retention, admin-only access from E3). Abuse reports can be filed
        by either party. The quality monitoring dashboard gives admin
        visibility into flagged mentors, pending disputes, and platform-
        wide quality trends.
      p3: >
        This epic delivers SG-04: "Ensure platform trust through ratings,
        dispute resolution, and quality monitoring." Trust is the
        differentiator that separates a curated marketplace from a
        directory. ADPList's free model has inconsistent quality because
        there's no accountability loop. Clarity.fm has no dispute
        resolution or session recordings. Felly Club's combination of
        ratings, auto-flagging, and recording-backed dispute resolution
        creates a trust flywheel — quality mentors earn visibility through
        ratings, poor-quality mentors are flagged and reviewed, and
        disputes are resolved with evidence rather than he-said-she-said.
    constraints:
      in_scope: >
        Post-session rating system (1–5 stars) with optional written review;
        ratings displayed on mentor profile page (average rating, review
        count, individual reviews); auto-flagging of ratings below 3 stars
        for admin review; auto-flagging of mentors with 3 or more
        cancellations; dispute submission workflow (mentee or mentor can
        file a dispute for a completed session with reason and description);
        admin dispute resolution interface with access to session recording
        from E3; dispute status tracking (submitted, under review, resolved);
        abuse reporting for inappropriate behaviour; quality monitoring
        dashboard for admin showing flagged mentors, pending disputes, and
        quality metrics.
      out_of_scope: >
        AI-powered sentiment analysis of reviews; automated dispute
        resolution without admin involvement; review responses by mentors;
        review incentives (request review after delivery); photo or video
        reviews; multi-dimensional ratings (separate scores for quality,
        punctuality, etc.); review moderation beyond admin approval;
        reputation scoring or ranking algorithms based on ratings.
      must_not_break: >
        E3 session lifecycle — ratings and disputes reference completed
        sessions and must not alter session status or recording access
        controls. E4 payment status — dispute resolution may trigger
        refunds but must not bypass the payment refund workflow established
        in E4. E1 user profiles — ratings and reviews must display alongside
        mentor profile data from E1 without data conflicts.
    success_scenarios:
      - >
        Given a mentee whose session has been marked as completed, when they
        navigate to the session detail page, then they see a rating prompt
        (1–5 stars) and an optional text review field, and upon submission,
        the rating appears on the mentor's public profile.
      - >
        Given a mentee who rates a session 2 stars, when the rating is
        submitted, then the system auto-flags the session for admin review,
        and the admin sees the flagged session in their quality monitoring
        dashboard with the mentee's rating and review text.
      - >
        Given a mentee who files a dispute for a completed session, when
        the admin opens the dispute in the admin portal, then they can view
        the dispute details, access the session recording (if within 3-day
        retention), and mark the dispute as resolved with an outcome
        (refund, warning, no action).
    failure_conditions:
      - >
        A completed session has no rating prompt — mentees cannot provide
        feedback and the quality loop is broken.
      - >
        A rating below 3 stars is submitted but not auto-flagged — the
        quality monitoring system fails to surface problematic sessions.
      - >
        An admin resolving a dispute cannot access the session recording
        within the 3-day retention window — the evidence-based resolution
        process is non-functional.

  # ─── E6: Platform Administration ────────────────────────────────────────────
  - id: "E6"
    name: "Platform Administration & Operations"
    strategic_goal_ref: "SG-01"
    description: >
      Delivers the unified admin portal for platform operations — user
      lifecycle management, session oversight, financial operations
      monitoring, system configuration (commission rates, pricing bands,
      cancellation policies), content management (communication templates,
      help centre), and platform-wide operational controls. This is an
      explicitly cross-cutting capability per product.yaml scope, spanning
      user management, session, financial, and content domains, with the
      admin persona as the single owner. The cross-cutting scope is
      justified because product.yaml names "Administrative Controls &
      Platform Operations" and "System Configuration & Content Management"
      as unified admin-facing capabilities.
    bucket: "mid"
    priority: "P1"
    effort: "L"
    depends_on: ["E1", "E3", "E4"]
    foundation_investment: false
    github_issue_ref: "TBD"
    ltm_citations:
      - "~/.meridian/core/memory/knowledge/domain-taxonomy/user-management.md"
      - "~/.meridian/core/memory/knowledge/domain-taxonomy/commerce.md"
      - "~/.meridian/core/memory/knowledge/domain-taxonomy/payments.md"
      - "~/.meridian/core/memory/knowledge/project-profiling/product-profile.md"
      - "~/.meridian/core/memory/standards/agent-lifecycle/epic-management-rules.md"
    intent:
      p1: >
        Without a unified admin portal, platform operations require direct
        database access or ad-hoc tools for every operational task — managing
        users, monitoring sessions, reviewing financial transactions,
        configuring platform parameters, and managing content. The admin
        persona (Platform Admin — Operations Manager) identified in the
        product vision currently has no dedicated interface to perform their
        curated marketplace role. Manual processes for mentor verification,
        dispute handling, payout management, and system configuration create
        operational bottlenecks that undermine the admin-curated quality
        model Felly Club is built on.
      p2: >
        After this epic ships, platform administrators access a
        comprehensive web-based admin portal with modules for: user
        management (view, edit, suspend, deactivate mentees and mentors),
        mentor management (onboarding queue, verification status, profile
        editing), session management (session list with status filters,
        session detail view, cancellation override), financial operations
        (transaction list, payout queue management, refund processing,
        revenue summary), system configuration (commission rate setting,
        pricing bands, cancellation policy parameters, feature toggles),
        and content management (communication email templates, help centre
        content via Strapi CMS integration). All operations are performed
        through a guided web interface with no direct database access
        required.
      p3: >
        This epic is critical to SG-01 because the "admin-curated" model
        depends entirely on admin having effective operational tools. It
        also supports SG-04 by providing the admin interface for dispute
        resolution and quality monitoring. PP-3 level 5 (Multi-Sided
        Platform) confirms the admin as a first-class persona with distinct
        workflows and dashboards. The admin portal is the operational
        backbone that enables every other epic's admin-dependent function
        — without it, mentor onboarding approvals (E1), dispute resolution
        (E5), payout management (E4), and quality monitoring (E5) all
        require workarounds.
    constraints:
      in_scope: >
        Web-based admin portal with role-restricted access; user lifecycle
        management (list, search, view, edit, suspend, deactivate mentees
        and mentors); mentor onboarding review queue and verification
        workflow; session management dashboard (list, filter by status,
        view details, cancellation override); financial operations view
        (transaction list, payout queue, refund processing interface,
        revenue summary); system configuration panel (commission rate
        10–20%, pricing band min/max per duration, cancellation policy
        parameters, feature toggles); content management via Strapi CMS
        integration (communication templates, help centre articles, FAQ);
        platform-wide search across users, sessions, and transactions.
      out_of_scope: >
        Mobile admin access (deferred to Phase 2 — admin portal is web-
        only); advanced analytics and reporting beyond operational views
        (covered in E9); automated workflows (auto-suspend on threshold
        breach — manual admin action in MVP); API management or developer
        portal; audit logging of admin actions (covered in E8 compliance);
        white-label or multi-tenant admin configuration.
      must_not_break: >
        E1 user profiles — admin edits to user profiles must be reflected
        consistently across the platform. E3 session data — admin session
        management must not corrupt session state machine transitions. E4
        financial data — admin financial operations must not create
        inconsistencies in payment records or payout calculations.
    success_scenarios:
      - >
        Given a platform admin logged into the admin portal, when they
        navigate to the mentor management section, then they see a list
        of all mentors with status filters (pending, verified, suspended),
        and can click on any mentor to view and edit their full profile
        including verification status.
      - >
        Given a platform admin in the system configuration panel, when they
        change the platform commission rate from 15% to 18%, then all new
        session payments processed after the change apply the 18% commission
        rate, while existing escrowed payments retain their original rate.
      - >
        Given a platform admin in the financial operations view, when they
        view the payout queue, then they see all pending mentor payouts
        with amount, mentor name, session reference, and can trigger payout
        processing or flag individual payouts for review.
    failure_conditions:
      - >
        A platform admin cannot access the admin portal or is shown a
        mentee/mentor dashboard instead — role-based routing to the admin
        experience is broken.
      - >
        Changes made in the system configuration panel (commission rates,
        cancellation policies) do not take effect for new transactions —
        the configuration system is disconnected from the operational
        system.
      - >
        The admin portal displays stale or inconsistent data (e.g., a
        session shows as "scheduled" in admin but "completed" in the
        mentor's dashboard) — data synchronisation between the admin view
        and the operational system is broken.

  # ─── E7: Communications ─────────────────────────────────────────────────────
  - id: "E7"
    name: "Communications & Notification Centre"
    strategic_goal_ref: "SG-02"
    description: >
      Implements the platform communication layer — transactional email
      delivery via Twilio SendGrid, in-app notification centre, and
      post-session engagement prompts — replacing mock email notifications
      used by E3 and E4 with a full communication infrastructure supporting
      the session lifecycle and user engagement.
    bucket: "mid"
    priority: "P2"
    effort: "M"
    depends_on: ["E1"]
    foundation_investment: false
    github_issue_ref: "TBD"
    ltm_citations:
      - "~/.meridian/core/memory/knowledge/domain-taxonomy/personalization.md"
      - "~/.meridian/core/memory/knowledge/project-profiling/product-profile.md"
      - "~/.meridian/core/memory/standards/agent-lifecycle/epic-management-rules.md"
    intent:
      p1: >
        E3 (Session Lifecycle) and E4 (Payments) deliver their core flows
        with basic email notifications, but the platform lacks a structured
        communication infrastructure. There is no centralised notification
        centre where users can review their activity, no templated email
        system for consistent branding across transactional messages, and
        no post-session engagement mechanism to drive repeat bookings. Users
        must rely on checking their dashboards manually or watching for
        individual emails that may be inconsistently formatted or land in
        spam folders.
      p2: >
        After this epic ships, all transactional emails (session requests,
        confirmations, reminders, payment receipts, payout notifications)
        are delivered through Twilio SendGrid with branded, templated
        formatting. Users have an in-app notification centre accessible
        from any page, showing unread and historical notifications for
        session updates, payment events, and platform announcements. Post-
        session engagement prompts encourage mentees to book follow-up
        sessions or explore new mentors. Email delivery replaces any mock
        notifications from E3 and E4, and the notification centre provides
        a persistent, in-platform record of all user-relevant events.
      p3: >
        This epic completes SG-02's vision of "seamless end-to-end session
        lifecycle from discovery through post-session engagement." The
        "post-session engagement" aspect specifically requires communication
        infrastructure that nudges mentees back into the booking flow.
        PP-1 level 4 (General Consumer) expects reliable, well-designed
        notifications — transactional emails and in-app alerts are table
        stakes for consumer platforms. This epic also de-mocks the basic
        email notifications used by E3 and E4, fulfilling Rule 3 (Mocks
        as Phased Delivery) from the epic management rules.
    constraints:
      in_scope: >
        Twilio SendGrid integration for transactional email delivery;
        branded email templates for session lifecycle events (request sent,
        accepted, declined, scheduled, reminder, completed, cancelled),
        payment events (payment captured, refund processed, payout sent),
        and account events (welcome, password reset, verification); in-app
        notification centre with unread count badge, notification list
        (newest first), mark as read, and notification type filtering;
        push notification infrastructure via Firebase Cloud Messaging (FCM)
        for mobile app; post-session engagement prompts (email suggesting
        follow-up booking or new mentor exploration after session
        completion); notification preferences per user (opt-in/opt-out for
        non-essential notifications).
      out_of_scope: >
        In-platform messaging or chat between users (deferred to Phase 2);
        SMS communication (deferred — email covers all transactional
        communication in MVP); complex drip campaigns or marketing
        automation; AI-generated notification content; multi-language
        notification templates (English-only in MVP); advanced support
        ticket system or live chat (deferred to Phase 2 — FAQ and help
        centre only).
      must_not_break: >
        E1 user authentication and preferences — notification delivery must
        respect user opt-out preferences and target authenticated users. E3
        session lifecycle — replacing mock notifications must not disrupt
        session status transitions or the booking workflow.
    success_scenarios:
      - >
        Given a mentee who has just booked a session, when the booking is
        confirmed, then the mentee receives a branded confirmation email
        via SendGrid with session details (mentor name, date, time,
        duration) and sees a notification in their in-app notification
        centre.
      - >
        Given a mentee on any page of the platform, when they click the
        notification bell icon, then they see a notification centre panel
        showing their unread notifications (newest first), each with a
        summary and timestamp, and they can mark notifications as read.
      - >
        Given a mentee whose session completed 24 hours ago, when the
        engagement prompt triggers, then the mentee receives an email
        suggesting they book a follow-up session with the same mentor or
        explore other mentors in their interest categories.
    failure_conditions:
      - >
        Transactional emails for critical events (session confirmations,
        payment receipts) are not delivered or land in spam consistently —
        the primary communication channel is unreliable.
      - >
        The in-app notification centre shows no notifications despite active
        session and payment events occurring — the notification pipeline is
        disconnected from platform events.
      - >
        Replacing mock notifications from E3 and E4 with SendGrid-delivered
        emails introduces regressions in the session booking or payment
        workflow — the communication upgrade breaks existing flows.

  # ─── E8: Compliance ─────────────────────────────────────────────────────────
  - id: "E8"
    name: "Regulatory Compliance & Data Security"
    strategic_goal_ref: "SG-06"
    description: >
      Implements cross-geography regulatory compliance (GDPR for EU markets,
      TPDP for India, PCI DSS for payment data) and platform security
      hardening (AES-256 encryption at rest, TLS 1.2+ in transit, JWT
      token security) — ensuring the platform meets legal obligations
      across all four target geographies before market launch.
    bucket: "mid"
    priority: "P1"
    effort: "M"
    depends_on: ["E1", "E4"]
    foundation_investment: false
    github_issue_ref: "TBD"
    ltm_citations:
      - "~/.meridian/core/memory/knowledge/project-profiling/product-profile.md"
      - "~/.meridian/core/memory/knowledge/project-profiling/nfr-profile.md"
      - "~/.meridian/core/memory/standards/agent-lifecycle/epic-management-rules.md"
    intent:
      p1: >
        Felly Club targets four jurisdictions — India, Switzerland, USA,
        and Germany — each with distinct data protection regulations. The
        platform processes PII (names, emails, professional credentials),
        financial data (payment transactions, escrow balances), and session
        recordings (video content). Without explicit compliance mechanisms,
        the platform risks regulatory penalties, user trust violations, and
        potential market exclusion. GDPR (EU) mandates consent management,
        data portability, and right-to-deletion. TPDP (India) has emerging
        data protection requirements. PCI DSS governs payment data
        handling. Currently, no workflow exists for users to exercise their
        data rights or for the platform to demonstrate compliance.
      p2: >
        After this epic ships, the platform implements cookie consent
        management with granular opt-in/opt-out per cookie category for
        EU users (Germany, Switzerland). Users can exercise right-to-
        deletion (account deletion with cascading data removal), data
        export (download personal data in machine-readable format), and
        data access requests. PCI DSS compliance is validated through
        Stripe tokenisation (no raw card data on platform), and payment
        data handling follows PCI-compliant patterns established in E4.
        Platform security is hardened with AES-256 encryption at rest
        for all sensitive data, TLS 1.2+ enforced for all data in transit,
        and JWT token security with proper expiry and refresh mechanisms.
        Privacy policy and terms of service are accessible platform-wide.
      p3: >
        This epic delivers SG-06: "Achieve regulatory and security
        compliance across all target geographies." Without compliance,
        Felly Club cannot legally operate in the EU (Germany, Switzerland)
        or process payments securely. NFR-5 level 3 (Standard Compliance)
        and NFR-7 level 4 (Sensitive Data) from the product profile confirm
        that compliance is not optional — it's a market-entry requirement.
        PP-4 level 3 (Multi-Country) targeting 4 jurisdictions creates a
        compliance surface that must be addressed before launch, not
        retroactively.
    constraints:
      in_scope: >
        GDPR compliance: cookie consent banner with granular opt-in/opt-out
        per category, privacy policy page, right-to-deletion workflow
        (account deletion with cascading data removal across all platform
        data), data export workflow (user downloads personal data in JSON/
        CSV format), data access request interface; TPDP (India) compliance:
        alignment of data handling practices with emerging Indian data
        protection requirements; PCI DSS compliance validation: audit of
        Stripe tokenisation implementation from E4, verification that no
        raw card data is stored or logged on platform; platform security
        hardening: AES-256 encryption at rest for sensitive data fields
        (PII, financial data), TLS 1.2+ enforcement for all API and web
        traffic, JWT token security audit (expiry, refresh, revocation),
        secure headers (CSP, HSTS, X-Frame-Options); audit logging of
        admin actions and data access events for compliance evidence.
      out_of_scope: >
        HIPAA compliance (not applicable — no healthcare data); SOX
        compliance (not applicable — not a public company); advanced
        penetration testing or third-party security audit; DPIA (Data
        Protection Impact Assessment) documentation; cross-border data
        transfer mechanisms (SCCs, BCRs) — deferred unless legally
        required before MVP launch; ISO 27001 certification; security
        operations centre (SOC) setup; WAF (Web Application Firewall)
        configuration beyond basic cloud provider defaults.
      must_not_break: >
        E1 user authentication — security hardening must not break login
        flows or session management. E4 payment processing — PCI DSS
        audit must not interfere with active payment processing or require
        architectural changes to the Stripe integration.
    success_scenarios:
      - >
        Given a user in Germany visiting the platform for the first time,
        when the landing page loads, then a cookie consent banner appears
        with granular opt-in/opt-out options per category (essential,
        analytics, marketing), and the user's choice is persisted and
        respected across subsequent page loads.
      - >
        Given a registered mentee who requests account deletion, when they
        confirm the deletion through the right-to-deletion workflow, then
        their account is deactivated, all personal data (profile, session
        history, payment records) is scheduled for deletion within the
        GDPR-mandated timeframe, and they receive a confirmation email.
      - >
        Given the platform's payment data handling, when a PCI DSS
        compliance audit is performed, then no raw card data (PAN, CVV,
        expiry) is found stored, logged, or transmitted by the platform —
        all card data is handled exclusively through Stripe tokenisation.
    failure_conditions:
      - >
        The cookie consent banner does not appear for EU users, or user
        consent choices are not respected — GDPR cookie consent requirement
        is violated.
      - >
        A user exercises right-to-deletion but their personal data remains
        in the platform's database or logs — data deletion is incomplete
        and GDPR compliance is broken.
      - >
        Platform API traffic is served over HTTP instead of TLS 1.2+ or
        sensitive data is stored unencrypted — the security baseline is
        not met.

  # ─── E9: Analytics ──────────────────────────────────────────────────────────
  - id: "E9"
    name: "Analytics & Performance Dashboards"
    strategic_goal_ref: "SG-05"
    description: >
      Delivers persona-specific analytics dashboards — mentor performance
      dashboard (earnings, session stats, ratings), mentee activity dashboard
      (session history, spending, favourite categories), and platform-level
      admin KPI dashboard (GMV, session volume, user growth, quality metrics)
      — providing actionable insights for all three personas.
    bucket: "long"
    priority: "P2"
    effort: "M"
    depends_on: ["E1", "E3", "E4"]
    foundation_investment: false
    github_issue_ref: "TBD"
    ltm_citations:
      - "~/.meridian/core/memory/knowledge/project-profiling/product-profile.md"
      - "~/.meridian/core/memory/standards/agent-lifecycle/epic-management-rules.md"
    intent:
      p1: >
        With sessions being delivered and payments flowing, all three
        personas lack visibility into their own performance and the
        platform's health. Mentors cannot see their earnings trends,
        session completion rates, or how their ratings compare over time.
        Mentees cannot review their session history, spending patterns,
        or track their engagement with the platform. Platform admin has
        no aggregated view of key business metrics — gross merchandise
        value (GMV), session volume, user growth, retention, or quality
        distribution. Without analytics, decision-making for all personas
        is blind, and the platform cannot demonstrate traction to
        stakeholders.
      p2: >
        After this epic ships, mentors see a performance dashboard showing
        total earnings, session count, completion rate, average rating
        trend, and upcoming sessions. Mentees see an activity dashboard
        with session history, total spend, sessions by category, and
        mentor recommendations based on past activity. Platform admin
        accesses a KPI dashboard with GMV (total and by period), active
        users (mentors and mentees), session volume (by status, category,
        and geography), quality metrics (average rating, dispute rate,
        flagged mentor count), and revenue metrics (commission earned,
        payout volume). All dashboards refresh on page load with data
        sourced from existing session, payment, and user records.
      p3: >
        This epic delivers the analytics dimension of SG-05: "Drive mentee
        acquisition through referral programme and deliver actionable
        analytics to all personas." Analytics serve each persona's decision
        loop — mentors optimise pricing and availability based on
        performance data, mentees make informed booking decisions from
        their history, and admin monitors platform health for operational
        and strategic decisions. PP-3 level 5 (Multi-Sided Platform)
        confirms that each persona needs a distinct analytics view tailored
        to their role and incentives.
    constraints:
      in_scope: >
        Mentor performance dashboard: total earnings, session count,
        completion rate, average rating over time, cancellation count,
        upcoming session list; mentee activity dashboard: session history
        with mentor, date, duration, and rating given, total spend by
        period, sessions by category breakdown; platform admin KPI
        dashboard: GMV (total and time-series), active user counts (mentors,
        mentees), session volume by status and category, quality metrics
        (average platform rating, dispute count, flagged mentor count),
        revenue metrics (commission earned, payout volume, refund volume);
        data sourced from existing session, payment, and user tables — no
        separate analytics data warehouse; dashboard refresh on page load.
      out_of_scope: >
        Advanced analytics (cohort analysis, retention metrics, revenue
        forecasting, LTV, churn prediction — all deferred to Phase 2);
        real-time streaming analytics; data warehouse or ETL pipeline;
        exportable reports (CSV/PDF); customisable dashboard widgets;
        A/B testing analytics; search analytics; comparison benchmarks
        (how a mentor compares to platform average).
      must_not_break: >
        E1 user profiles, E3 session data, and E4 payment records — all
        dashboards read from these data sources and must not modify them.
        Dashboard queries must not degrade platform performance for
        concurrent users.
    success_scenarios:
      - >
        Given a mentor logged into their dashboard, when they navigate
        to the performance section, then they see their total earnings,
        total sessions completed, session completion rate, average rating,
        and a list of upcoming scheduled sessions — all reflecting current
        data from completed sessions and payments.
      - >
        Given a platform admin logged into the admin portal, when they
        navigate to the KPI dashboard, then they see current-period GMV,
        total active mentors and mentees, session volume breakdown by
        status (completed, cancelled, no-show), and quality metrics
        (average rating, open disputes, flagged mentors) — all sourced
        from live platform data.
      - >
        Given a mentee logged into their dashboard, when they navigate to
        the activity section, then they see their session history sorted
        by date, showing mentor name, session duration, category, rating
        they gave, and cumulative spend — enabling them to track their
        mentorship engagement.
    failure_conditions:
      - >
        A mentor's earnings dashboard shows amounts that do not match
        their actual completed session payouts — the data is inconsistent
        with the payment system.
      - >
        The admin KPI dashboard shows zero or stale data despite active
        sessions and transactions on the platform — the dashboard is
        disconnected from live data.
      - >
        Dashboard page loads cause noticeable performance degradation for
        other users on the platform — analytics queries are not optimised
        and impact the production database.

  # ─── E10: Referral & Acquisition ────────────────────────────────────────────
  - id: "E10"
    name: "Referral Programme & User Acquisition"
    strategic_goal_ref: "SG-05"
    description: >
      Implements the mentee referral programme — unique referral link
      generation, referral tracking, and reward fulfilment on the referred
      user's first completed session — providing an organic acquisition
      channel to drive platform growth across target geographies.
    bucket: "long"
    priority: "P2"
    effort: "S"
    depends_on: ["E1", "E4"]
    foundation_investment: false
    github_issue_ref: "TBD"
    ltm_citations:
      - "~/.meridian/core/memory/knowledge/domain-taxonomy/personalization.md"
      - "~/.meridian/core/memory/knowledge/project-profiling/product-profile.md"
      - "~/.meridian/core/memory/standards/agent-lifecycle/epic-management-rules.md"
    intent:
      p1: >
        The two-sided marketplace faces a classic cold-start problem —
        without mentees, mentors have no incentive to stay; without
        mentors, mentees cannot find value. Paid acquisition is constrained
        by the €125,000 fixed budget, and organic growth through word-of-
        mouth alone is slow and unmeasurable. There is no structured
        mechanism for existing satisfied mentees to bring in new users, and
        no way to attribute new sign-ups to referral sources. The platform
        needs a low-cost, trackable acquisition channel that leverages
        existing user satisfaction to drive growth.
      p2: >
        After this epic ships, every registered mentee has a unique referral
        link accessible from their dashboard. When a new user signs up
        through a referral link, the referral is tracked and attributed to
        the referring mentee. When the referred user completes their first
        paid session, the referrer receives a reward (admin-configurable
        type and value). The referral dashboard shows each mentee their
        referral link, total referrals sent, sign-ups from referrals, and
        rewards earned. Admin can configure the referral reward type and
        value through the system configuration panel (E6).
      p3: >
        This epic delivers the acquisition dimension of SG-05: "Drive
        mentee acquisition through referral programme." The referral
        programme directly addresses the marketplace cold-start risk
        identified in the product vision — it creates a self-reinforcing
        growth loop where satisfied mentees recruit new mentees at no
        marginal cost to the platform. PP-6 level 3 (Market-Ready v1)
        targeting real paying customers across 4 geographies confirms that
        organic acquisition channels need to be operational at launch.
    constraints:
      in_scope: >
        Unique referral link generation per registered mentee; referral
        link sharing (copy to clipboard, share via social/email); referral
        tracking — attribution of new sign-ups to referring mentee via
        referral link parameter; reward trigger on referred user's first
        completed paid session; referral reward fulfilment (admin-
        configurable reward type and value via E6's system configuration);
        mentee referral dashboard showing referral link, total referrals,
        sign-ups, completed sessions, and rewards earned; admin referral
        analytics (total referrals, conversion rate, rewards issued).
      out_of_scope: >
        Complex referral tiers (multi-level referral rewards — deferred to
        Phase 2); mentor referral programme (mentors referring other
        mentors); referral fraud detection; time-limited referral
        campaigns; referral leaderboards or gamification; A/B testing of
        referral reward values; referral programme for non-mentee personas.
      must_not_break: >
        E1 user registration — referral tracking must integrate with the
        registration flow without adding friction or breaking the sign-up
        experience. E4 payment processing — reward fulfilment must not
        interfere with session payment or payout flows.
    success_scenarios:
      - >
        Given a registered mentee on their dashboard, when they navigate to
        the referral section, then they see their unique referral link with
        a copy-to-clipboard button and a summary of their referral activity
        (total referrals, sign-ups, rewards earned).
      - >
        Given a new visitor who clicks a referral link, when they complete
        registration and subsequently complete their first paid session,
        then the referring mentee is credited with a successful referral
        and receives the configured reward, visible in their referral
        dashboard.
      - >
        Given a platform admin in the system configuration panel, when they
        set the referral reward to "$10 account credit," then all future
        successful referrals issue the $10 reward to the referring mentee
        upon the referred user's first completed session.
    failure_conditions:
      - >
        A new user signs up through a referral link but the referral is not
        attributed to the referring mentee — the tracking mechanism is
        broken.
      - >
        A referred user completes their first paid session but the referrer
        does not receive the configured reward — the reward fulfilment
        pipeline fails.
