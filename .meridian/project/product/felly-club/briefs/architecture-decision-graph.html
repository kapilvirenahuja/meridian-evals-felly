const width = window.innerWidth;
const height = window.innerHeight;
const nodeMap = {};
GRAPH_DATA.nodes.forEach(n => nodeMap[n.id] = n);

const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
svg.setAttribute('width', width);
svg.setAttribute('height', height);
document.body.appendChild(svg);

const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
svg.appendChild(defs);
const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
marker.setAttribute('id', 'arrow');
marker.setAttribute('viewBox', '0 -4 8 8');
marker.setAttribute('refX', 20);
marker.setAttribute('markerWidth', 6);
marker.setAttribute('markerHeight', 6);
marker.setAttribute('orient', 'auto');
const markerPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
markerPath.setAttribute('d', 'M0,-4L8,0L0,4');
markerPath.setAttribute('fill', '#555');
marker.appendChild(markerPath);
defs.appendChild(marker);

const gMain = document.createElementNS('http://www.w3.org/2000/svg', 'g');
svg.appendChild(gMain);
const gLinks = document.createElementNS('http://www.w3.org/2000/svg', 'g');
const gNodes = document.createElementNS('http://www.w3.org/2000/svg', 'g');
gMain.appendChild(gLinks);
gMain.appendChild(gNodes);

let transform = { x: 0, y: 0, k: 1 };
let dragging = false, dragStart = null, panStart = null;
let dragNode = null;

svg.addEventListener('mousedown', e => {
  if (e.target === svg || e.target === gMain || e.target === gLinks) {
    panStart = { x: e.clientX - transform.x, y: e.clientY - transform.y };
  }
});
svg.addEventListener('mousemove', e => {
  if (panStart && !dragNode) {
    transform.x = e.clientX - panStart.x;
    transform.y = e.clientY - panStart.y;
    gMain.setAttribute('transform', `translate(${transform.x},${transform.y}) scale(${transform.k})`);
  }
});
svg.addEventListener('mouseup', () => { panStart = null; });
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const s = e.deltaY > 0 ? 0.92 : 1.08;
  const newK = Math.max(0.15, Math.min(5, transform.k * s));
  const mx = e.clientX, my = e.clientY;
  transform.x = mx - (mx - transform.x) * (newK / transform.k);
  transform.y = my - (my - transform.y) * (newK / transform.k);
  transform.k = newK;
  gMain.setAttribute('transform', `translate(${transform.x},${transform.y}) scale(${transform.k})`);
}, { passive: false });

const nodes = GRAPH_DATA.nodes.map(n => ({
  ...n, x: width/2 + (Math.random()-0.5)*600, y: height/2 + (Math.random()-0.5)*400,
  vx: 0, vy: 0, r: TYPE_RADIUS[n.type] || 8
}));
const nodeById = {};
nodes.forEach(n => nodeById[n.id] = n);
const links = GRAPH_DATA.edges.filter(e => nodeById[e.source] && nodeById[e.target]).map(e => ({
  ...e, sourceNode: nodeById[e.source], targetNode: nodeById[e.target]
}));

const linkEls = [];
links.forEach(l => {
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.classList.add('link');
  line.setAttribute('stroke', EDGE_COLORS[l.label] || '#555');
  line.setAttribute('marker-end', 'url(#arrow)');
  line.dataset.source = l.source;
  line.dataset.target = l.target;
  line.dataset.label = l.label;
  gLinks.appendChild(line);
  l.el = line;
  linkEls.push(l);
});

const nodeEls = [];
nodes.forEach(n => {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.classList.add('node');
  g.dataset.id = n.id;
  g.dataset.type = n.type;
  const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  circle.setAttribute('r', n.r);
  circle.setAttribute('fill', TYPE_COLORS[n.type] || '#888');
  circle.setAttribute('stroke', TYPE_COLORS[n.type] || '#888');
  circle.setAttribute('fill-opacity', n.type === 'decision' ? 0.25 : 0.15);
  circle.style.setProperty('--glow', TYPE_COLORS[n.type]);
  g.appendChild(circle);
  const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  text.setAttribute('dx', n.r + 4);
  text.setAttribute('dy', 3);
  const shortLabel = n.label.length > 35 ? n.label.substring(0, 33) + '...' : n.label;
  text.textContent = shortLabel;
  text.setAttribute('font-size', n.type === 'decision' ? '10px' : '8px');
  text.setAttribute('fill', n.type === 'decision' ? '#fff' : '#aaa');
  g.appendChild(text);
  gNodes.appendChild(g);
  n.el = g;
  n.circleEl = circle;
  nodeEls.push(n);

  let ndx = 0, ndy = 0;
  g.addEventListener('mousedown', e => {
    e.stopPropagation();
    dragNode = n;
    n.fx = n.x; n.fy = n.y;
    ndx = n.x - (e.clientX - transform.x) / transform.k;
    ndy = n.y - (e.clientY - transform.y) / transform.k;
  });
  svg.addEventListener('mousemove', e => {
    if (dragNode === n) {
      n.fx = (e.clientX - transform.x) / transform.k + ndx;
      n.fy = (e.clientY - transform.y) / transform.k + ndy;
      n.x = n.fx; n.y = n.fy;
    }
  });
  svg.addEventListener('mouseup', () => {
    if (dragNode === n) { delete n.fx; delete n.fy; dragNode = null; }
  });

  g.addEventListener('mouseenter', e => {
    highlightConnected(n.id);
    const tt = document.getElementById('tooltip');
    let html = `<div class="tt-label">${n.label}</div>`;
    html += `<div class="tt-type">${n.type} ${n.group ? '/ ' + n.group : ''}</div>`;
    if (n.properties) {
      const p = n.properties;
      if (p.level !== undefined) html += `<div class="tt-body">Level: ${p.level} — ${p.label_text || ''}</div>`;
      if (p.path) html += `<div class="tt-body">${p.path}</div>`;
      if (p.resolution) html += `<div class="tt-body">${p.resolution}</div>`;
      if (p.reason) html += `<div class="tt-body">${p.reason}</div>`;
      if (p.alternatives_rejected) html += `<div class="tt-body">Rejected: ${p.alternatives_rejected.join(', ')}</div>`;
    }
    const connected = links.filter(l => l.source === n.id || l.target === n.id);
    if (connected.length > 0) {
      html += `<div class="tt-body" style="margin-top:6px;color:#888">${connected.length} connection${connected.length>1?'s':''}</div>`;
      const quotes = connected.filter(l => l.properties && l.properties.quote).slice(0, 2);
      quotes.forEach(l => { html += `<div class="tt-quote">"${l.properties.quote}"</div>`; });
    }
    tt.innerHTML = html;
    tt.style.opacity = 1;
    tt.style.left = Math.min(e.clientX + 16, width - 400) + 'px';
    tt.style.top = Math.min(e.clientY + 16, height - 200) + 'px';
  });
  g.addEventListener('mouseleave', () => {
    clearHighlight();
    document.getElementById('tooltip').style.opacity = 0;
  });
});

function highlightConnected(nodeId) {
  const connNodes = new Set([nodeId]);
  links.forEach(l => {
    if (l.source === nodeId) connNodes.add(l.target);
    if (l.target === nodeId) connNodes.add(l.source);
  });
  nodes.forEach(n => {
    n.el.classList.toggle('dimmed', !connNodes.has(n.id));
    n.el.classList.toggle('highlighted', connNodes.has(n.id));
  });
  linkEls.forEach(l => {
    const conn = l.source === nodeId || l.target === nodeId;
    l.el.classList.toggle('dimmed', !conn);
    l.el.classList.toggle('highlighted', conn);
  });
}
function clearHighlight() {
  nodes.forEach(n => { n.el.classList.remove('dimmed', 'highlighted'); });
  linkEls.forEach(l => { l.el.classList.remove('dimmed', 'highlighted'); });
}

function updateVisibility() {
  nodes.forEach(n => { n.el.style.display = activeFilters.has(n.type) ? '' : 'none'; });
  linkEls.forEach(l => {
    const sn = nodeById[l.source], tn = nodeById[l.target];
    l.el.style.display = (activeFilters.has(sn.type) && activeFilters.has(tn.type)) ? '' : 'none';
  });
}

// force simulation
const alpha = { value: 1, decay: 0.0015, min: 0.001 };
const centerX = width / 2, centerY = height / 2;

function tick() {
  if (alpha.value < alpha.min) { requestAnimationFrame(tick); return; }
  alpha.value *= (1 - alpha.decay);

  // center gravity
  nodes.forEach(n => {
    if (n.fx !== undefined) { n.x = n.fx; n.y = n.fy; return; }
    n.vx += (centerX - n.x) * 0.0003;
    n.vy += (centerY - n.y) * 0.0003;
  });

  // group clustering
  const groupCenters = {};
  const groupMap = { product_profile: {x:-250,y:-180}, nfr_profile: {x:-250,y:0}, quality_profile: {x:-250,y:180},
    ltm_patterns: {x:250,y:-250}, ltm_stacks: {x:350,y:-120}, ltm_data: {x:350,y:40}, ltm_platforms: {x:350,y:160}, ltm_operations: {x:350,y:280},
    pre_lock: {x:-100,y:300}, constraints: {x:-100,y:-300},
    architecture_pattern: {x:0,y:-60}, language: {x:-50,y:0}, api_design: {x:50,y:0}, messaging: {x:0,y:60}, business_logic: {x:-50,y:60}, compliance: {x:50,y:60}, infrastructure: {x:0,y:120}, payments: {x:50,y:120},
    frontend: {x:150,y:-180}, backend: {x:0,y:0}, data: {x:0,y:180}, platform: {x:150,y:180}, operations: {x:-150,y:180}, rejected: {x:200,y:300}
  };
  nodes.forEach(n => {
    if (n.fx !== undefined) return;
    const gc = groupMap[n.group];
    if (gc) {
      n.vx += (centerX + gc.x - n.x) * 0.003;
      n.vy += (centerY + gc.y - n.y) * 0.003;
    }
  });

  // link spring
  links.forEach(l => {
    const s = l.sourceNode, t = l.targetNode;
    const dx = t.x - s.x, dy = t.y - s.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const ideal = 100;
    const f = (dist - ideal) * 0.0008;
    const fx = dx / dist * f, fy = dy / dist * f;
    if (s.fx === undefined) { s.vx += fx; s.vy += fy; }
    if (t.fx === undefined) { t.vx -= fx; t.vy -= fy; }
  });

  // repulsion
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist2 = dx*dx + dy*dy || 1;
      if (dist2 > 90000) continue;
      const f = 800 / dist2;
      const fx = dx * f, fy = dy * f;
      if (a.fx === undefined) { a.vx -= fx; a.vy -= fy; }
      if (b.fx === undefined) { b.vx += fx; b.vy += fy; }
    }
  }

  // integrate
  nodes.forEach(n => {
    if (n.fx !== undefined) return;
    n.vx *= 0.85; n.vy *= 0.85;
    n.x += n.vx; n.y += n.vy;
  });

  // render
  nodes.forEach(n => {
    n.el.setAttribute('transform', `translate(${n.x},${n.y})`);
  });
  linkEls.forEach(l => {
    const s = l.sourceNode, t = l.targetNode;
    l.el.setAttribute('x1', s.x); l.el.setAttribute('y1', s.y);
    l.el.setAttribute('x2', t.x); l.el.setAttribute('y2', t.y);
  });

  requestAnimationFrame(tick);
}

// kick alpha on interaction
svg.addEventListener('mousedown', () => { alpha.value = Math.max(alpha.value, 0.3); });

document.getElementById('stats').innerHTML = `${nodes.length} nodes &middot; ${links.length} edges`;
transform.x = 0; transform.y = 0; transform.k = 1;
gMain.setAttribute('transform', `translate(0,0) scale(1)`);
tick();
</script>
