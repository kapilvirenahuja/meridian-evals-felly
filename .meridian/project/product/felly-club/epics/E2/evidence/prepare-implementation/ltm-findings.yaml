# ─── Gaps Identified ──────────────────────────────────────────────────────────

gaps:
  - id: 'GAP-01'
    category: 'search-infrastructure'
    description: 'No LTM knowledge for @opensearch-project/opensearch Node.js client SDK patterns'
    impact: >
      HIGH — E2's primary new infrastructure dependency. MarketplaceRepository needs to:
      (1) Create/manage the mentor search index, (2) Index mentor profiles on create/update,
      (3) Execute search queries with filters and pagination.
      LTM covers search-engines.md conceptually but no concrete NestJS + OpenSearch integration patterns.
    mitigation: >
      Use @opensearch-project/opensearch npm package (OpenSearch-compatible Elasticsearch client).
      Standard CRUD pattern: client.index(), client.search(), client.delete().
      Wrap in a MarketplaceSearchService with injectable mock for tests.

  - id: 'GAP-02'
    category: 'bullmq-patterns'
    description: 'No LTM knowledge for BullMQ 5.x setup patterns in NestJS'
    impact: >
      MEDIUM — E2 requires SearchSyncWorker to keep OpenSearch in sync with PostgreSQL.
      Architecture specifies BullMQ for async side effects. No NestJS + BullMQ integration
      patterns in LTM (messaging-queues.md is conceptual only).
    mitigation: >
      Use @nestjs/bull or bullmq package directly. Queue: 'search-sync'.
      Producer: AdminService/UserService enqueues on mentor profile create/update/approve.
      Consumer: SearchSyncWorker in a separate NestJS app or background module.
      NOTE: E2 may implement SearchSyncWorker as a stub (enqueue but not process)
      if background worker setup is deferred. Verify with plan.yaml scope.

  - id: 'GAP-03'
    category: 'search-index-design'
    description: 'No LTM or existing codebase patterns for Elasticsearch/OpenSearch index mapping design'
    impact: >
      MEDIUM — Index field mapping affects search quality and query performance.
      Fields needed: id, userId, headline, bio, expertiseCategories[], yearsOfExperience,
      hourlyRate, verifiedBadge, status, pricingTiers[]{priceInCents, durationMinutes},
      availabilityDays[], completeness. Field types: text (analyzed) for bio/headline,
      keyword for categories/status, integer/float for price/experience.
    mitigation: >
      Define index mapping in MarketplaceSearchService.createIndex().
      Use keyword type for filterable fields (expertiseCategories, status, verifiedBadge).
      Use text type with standard analyzer for full-text fields (bio, headline).
      Use range queries for priceInCents filter.

  - id: 'GAP-04'
    category: 'ioredis-caching-patterns'
    description: 'No LTM knowledge for ioredis caching patterns in NestJS for search result caching'
    impact: >
      LOW-MEDIUM — Architecture specifies Redis caching for repeated search queries.
      Redis is already in the stack (docker-compose, .env REDIS_URL) but no ioredis usage
      in E1 codebase (REDIS_URL is defined but not consumed by any E1 code).
    mitigation: >
      Use ioredis (already listed in architecture.yaml stack). NestJS @nestjs/cache-manager
      or direct ioredis client injection. Cache key pattern: 'marketplace:search:{hash(filters)}'.
      TTL: 5 minutes for search results.

  - id: 'GAP-05'
    category: 'pagination-ui-patterns'
    description: 'No existing pagination components in mentee-web-app'
    impact: >
      LOW — E2 mentor listing requires pagination. No reusable pagination component exists
      in the frontend. Must be built from scratch using Tailwind + shadcn/ui primitives.
    mitigation: 'Build PaginationControls component using @radix-ui primitives or plain Tailwind. Standard cursor/offset pagination pattern.'

  - id: 'GAP-06'
    category: 'session-count-and-rating-fields'
    description: 'MentorProfile has no session_count or average_rating fields. E2 profile page shows these.'
    impact: >
      MEDIUM — E2 mentor detail page spec requires session count and rating display.
      Sessions are E3 scope; ratings are E5 scope. These fields don't exist in the
      current Prisma schema.
    mitigation: >
      Two options:
      (A) Add denormalized session_count (INT, default 0) and average_rating (FLOAT, nullable)
          to MentorProfile in a new Prisma migration now. These remain 0/null until E3/E5 populate them.
      (B) Omit these fields from E2 UI and add as 'Coming soon' placeholders.
      RECOMMENDATION: Option A — add fields to schema now with default values. Zero technical risk,
      and E2 profile page can display "0 sessions" and no rating (or hide rating section).
      This prevents a schema migration mid-E3/E5 that touches the mentor_profiles table.
