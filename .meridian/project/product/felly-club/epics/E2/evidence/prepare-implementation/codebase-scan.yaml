# ─── Development Conventions ─────────────────────────────────────────────────

conventions:
  - name: 'Module naming'
    detail: 'domain.module.ts, domain.controller.ts, domain.service.ts, domain.repository.ts'
    example: 'auth.module.ts, admin.controller.ts, user.repository.ts'

  - name: 'Test file placement'
    detail: '__tests__/ subdirectory within each domain module folder; *.spec.ts suffix'
    example: 'src/auth/__tests__/auth.service.spec.ts'

  - name: 'DTO placement'
    detail: 'dto/ subdirectory within each domain module; *.dto.ts suffix'
    example: 'src/auth/dto/register.dto.ts'

  - name: 'Decorator usage'
    detail: 'class-validator decorators on all DTOs; class-transformer for transforms'
    example: '@IsEmail(), @IsString(), @MinLength(8) in register.dto.ts'

  - name: 'Guard usage pattern'
    detail: "@UseGuards(JwtAuthGuard, RolesGuard) on controller class or method; @Roles('ADMIN') for role restriction"
    example: 'AdminController uses class-level @UseGuards and @Roles'

  - name: 'CurrentUser decorator'
    detail: 'Extract user from JWT payload via @CurrentUser() user: JwtPayload'
    example: 'UserController.me(@CurrentUser() user: JwtPayload)'

  - name: 'Repository pattern'
    detail: 'Service → Repository → PrismaService. Services contain business logic; repositories contain DB queries'
    example: 'UserService → UserRepository → PrismaService'

  - name: 'Module imports'
    detail: 'forwardRef() used to break circular dependency between AuthModule ↔ UserModule'
    example: 'auth.module.ts: forwardRef(() => UserModule)'

  - name: 'Error handling'
    detail: 'NestJS HttpException subclasses (NotFoundException, ForbiddenException, ConflictException, BadRequestException)'
    example: "throw new NotFoundException('User not found')"

  - name: 'Audit logging'
    detail: 'prisma.auditLog.create() called after significant mutations'
    example: 'createMentor writes MENTOR_APPLICATION_SUBMITTED audit log'

