prisma_schema:
  path: 'packages/backend-api/prisma/schema.prisma'
  database: 'PostgreSQL 16'
  migration_dir: 'packages/backend-api/prisma/migrations'
  first_migration: '20260327062544_init'

  enums:
    - name: 'UserRole'
      values: ['MENTEE', 'MENTOR', 'ADMIN']
      note: 'Also mirrored in @felly/shared-types (packages/shared-types/src/enums/user-role.enum.ts)'

    - name: 'UserStatus'
      values: ['PENDING_EMAIL_VERIFICATION', 'ACTIVE', 'SUSPENDED', 'DELETED']

    - name: 'MentorProfileStatus'
      values:
        [
          'INCOMPLETE',
          'PENDING_REVIEW',
          'ACTIVE',
          'SUSPENDED',
          'DRAFT',
          'PENDING_VERIFICATION',
          'VERIFIED',
          'REJECTED',
        ]
      note: 'E2 must filter on VERIFIED status to show only approved mentors in marketplace'

    - name: 'ExpertiseCategory'
      values:
        [
          'SOFTWARE_ENGINEERING',
          'PRODUCT_MANAGEMENT',
          'DESIGN',
          'DATA_SCIENCE',
          'BUSINESS',
          'MARKETING',
          'OTHER',
          'SPORT',
          'ENTREPRENEURSHIP',
          'ENTERTAINMENT',
        ]
      note: 'E2 uses these as category tabs and filters. Also mirrored in shared-types'

    - name: 'ArtefactType'
      values: ['RESUME', 'LINKEDIN_URL', 'PORTFOLIO_URL', 'CERTIFICATION', 'GITHUB_URL', 'DOCUMENT']

    - name: 'AuditAction'
      values:
        [
          'USER_REGISTERED',
          'EMAIL_VERIFIED',
          'USER_LOGGED_IN',
          'USER_LOGGED_OUT',
          'PASSWORD_CHANGED',
          'PASSWORD_RESET_REQUESTED',
          'PROFILE_UPDATED',
          'MENTOR_APPLICATION_SUBMITTED',
          'MENTOR_APPLICATION_APPROVED',
          'MENTOR_APPLICATION_REJECTED',
        ]

  models:
    - name: 'User'
      table: 'users'
      key_fields:
        [
          'id (uuid)',
          'email (unique)',
          'role (UserRole)',
          'status (UserStatus)',
          'firstName',
          'lastName',
          'avatarUrl',
        ]
      relations: ['menteeProfile (1-1)', 'mentorProfile (1-1)', 'auditLogs (1-N)']

    - name: 'MenteeProfile'
      table: 'mentee_profiles'
