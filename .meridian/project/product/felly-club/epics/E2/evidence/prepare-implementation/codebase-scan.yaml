# ─── Auth Patterns ────────────────────────────────────────────────────────────

auth_patterns:
  adapter_interface: 'packages/backend-api/src/auth/adapters/auth-adapter.interface.ts'
  current_adapter: 'MockAuthAdapter (packages/backend-api/src/auth/adapters/mock-auth.adapter.ts)'
  di_token: 'AUTH_ADAPTER_TOKEN (packages/backend-api/src/common/constants.ts)'
  swap_plan: "Comment in auth.module.ts: '// E11: change to: useClass: KeyCloakAuthAdapter'"

  jwt_payload_shape:
    sub: 'userId (uuid)'
    email: 'string'
    realm_access.roles: "string[] — contains 'MENTEE' | 'MENTOR' | 'ADMIN'"
    iss: "'felly-club-mock'"
    aud: "'felly-club-api'"

  token_config:
    access_expiry: '15m (JWT_ACCESS_EXPIRY constant)'
    refresh_expiry: '7d (JWT_REFRESH_EXPIRY constant)'
    bcrypt_rounds: 12
    secret: "JWT_SECRET env var (defaults to 'mock-secret' in dev)"

  guards:
    - name: 'JwtAuthGuard'
      extends: "AuthGuard('jwt') (passport-jwt)"
      usage: '@UseGuards(JwtAuthGuard, RolesGuard)'
    - name: 'RolesGuard'
      usage: "Paired with @Roles('ADMIN') decorator; reads realm_access.roles from JwtPayload"

  e2_reuse:
    - 'MarketplaceController: use @UseGuards(JwtAuthGuard, RolesGuard) on authenticated endpoints'
    - 'Public mentor listing (browse) MAY be unauthenticated per architecture — verify with product spec'
    - 'Rule-based recommendations endpoint requires authenticated mentee (reads mentee interests)'

