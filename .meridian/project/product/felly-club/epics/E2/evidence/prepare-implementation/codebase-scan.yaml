    - name: 'MentorProfile'
      table: 'mentor_profiles'
      key_fields:
        [
          'id',
          'userId (unique)',
          'status (MentorProfileStatus)',
          'headline',
          'bio',
          'expertiseCategories (ExpertiseCategory[])',
          'yearsOfExperience',
          'linkedinUrl',
          'hourlyRate',
          'completeness',
          'verifiedBadge',
        ]
