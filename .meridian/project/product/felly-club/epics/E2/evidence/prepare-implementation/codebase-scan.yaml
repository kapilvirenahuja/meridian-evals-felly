# ─── Backend API — NestJS Modules ─────────────────────────────────────────────

backend_modules:
  - name: 'AppModule'
    path: 'packages/backend-api/src/app.module.ts'
    role: 'Root module. Imports: LoggerModule(nestjs-pino), PrismaModule, HealthModule, AuthModule, UserModule, AdminModule'
    imports_for_e2: 'MarketplaceModule will be added here'

  - name: 'AuthModule'
    path: 'packages/backend-api/src/auth/auth.module.ts'
    role: 'JWT authentication, RBAC guards, MockAuthAdapter (DI-swappable). Exports: AuthService, JwtAuthGuard, RolesGuard, PassportModule, AUTH_ADAPTER_TOKEN'
    key_exports:
      - 'JwtAuthGuard (packages/backend-api/src/auth/guards/jwt-auth.guard.ts)'
      - 'RolesGuard (packages/backend-api/src/auth/guards/roles.guard.ts)'
      - 'CurrentUser decorator (packages/backend-api/src/auth/decorators/current-user.decorator.ts)'
      - 'Roles decorator (packages/backend-api/src/auth/decorators/roles.decorator.ts)'
      - 'JwtPayload interface (packages/backend-api/src/auth/interfaces/jwt-payload.interface.ts)'
    reuse_in_e2: 'Import JwtAuthGuard + RolesGuard for MarketplaceModule route protection'

  - name: 'UserModule'
    path: 'packages/backend-api/src/user/user.module.ts'
    role: 'User and profile CRUD. Exports: UserService. Provides: UserController, UserRepository'
    key_exports:
      - 'UserService (packages/backend-api/src/user/user.service.ts)'
    reuse_in_e2: 'MarketplaceModule needs UserService to resolve mentee interests for recommendations'

  - name: 'AdminModule'
    path: 'packages/backend-api/src/admin/admin.module.ts'
    role: 'Admin mentor onboarding, verification queue, user management. Provides: AdminController, AdminService, AdminRepository. Imports: PrismaModule, AuthModule'
    key_exports:
      - 'AdminService (packages/backend-api/src/admin/admin.service.ts)'

  - name: 'PrismaModule'
    path: 'packages/backend-api/src/prisma/prisma.module.ts'
    role: 'Prisma client singleton. Exports PrismaService. Consumed by AdminModule; UserModule consumes via UserRepository'
    key_exports:
      - 'PrismaService (packages/backend-api/src/prisma/prisma.service.ts)'
    reuse_in_e2: 'MarketplaceRepository will inject PrismaService for mentor profile queries'

  - name: 'HealthModule'
    path: 'packages/backend-api/src/health/health.module.ts'
    role: 'GET /health endpoint. No deps on domain modules'

