# ─── Testing Framework ────────────────────────────────────────────────────────

testing:
  framework: 'Jest 29.7.0'
  runner_config: 'packages/backend-api/package.json (jest block)'
  transform: 'ts-jest 29.2.5 with tsconfig.test.json'
  test_pattern: '<rootDir>/src/**/*.spec.ts'
  coverage_dir: './coverage'
  test_env: 'node'

  coverage_config:
    threshold:
      branches: 70
      functions: 80
      lines: 80
      statements: 80
    collect_from:
      - 'src/auth/auth.service.ts'
      - 'src/auth/auth.controller.ts'
      - 'src/auth/adapters/mock-auth.adapter.ts'
      - 'src/user/user.service.ts'
      - 'src/user/user.repository.ts'
    note: 'Coverage scope is currently limited to auth + user. E2 must add marketplace coverage files'

  existing_test_files:
    - 'packages/backend-api/src/auth/__tests__/auth.service.spec.ts'
    - 'packages/backend-api/src/auth/__tests__/auth.controller.spec.ts'
    - 'packages/backend-api/src/auth/__tests__/login.spec.ts'
    - 'packages/backend-api/src/auth/__tests__/mock-auth.adapter.spec.ts'
    - 'packages/backend-api/src/auth/__tests__/password-reset.spec.ts'
    - 'packages/backend-api/src/auth/__tests__/rbac.spec.ts'
    - 'packages/backend-api/src/user/__tests__/profile.spec.ts'
    - 'packages/backend-api/src/user/__tests__/user.repository.spec.ts'
    - 'packages/backend-api/src/user/__tests__/user.service.spec.ts'
    - 'packages/backend-api/src/admin/__tests__/mentor-onboarding.spec.ts'
    - 'packages/backend-api/src/admin/__tests__/verification.spec.ts'

  mocking_pattern: |
    Pattern from E1 tests:
    1. Use @nestjs/testing (Test.createTestingModule) for unit tests
    2. Mock service/repository dependencies with jest.fn() objects
    3. Provide mocks via { provide: ServiceClass, useValue: mockObj }
    4. No supertest/HTTP-level integration tests (all unit tests with mocked deps)
    5. Mock Prisma: { provide: PrismaService, useValue: mockPrismaService }
    6. MockAuthAdapter injected via { provide: AUTH_ADAPTER_TOKEN, useValue: mockAuthAdapter }
    NOTE: STM LRN-002 flags this pattern as debt — prefers API-level mocking over in-code adapters

