      relations: ['pricingTiers (1-N)', 'availabilitySlots (1-N)', 'verificationArtefacts (1-N)']

    - name: 'MentorPricingTier'
      table: 'mentor_pricing_tiers'
      key_fields: ['id', 'mentorProfileId', 'name', 'priceInCents', 'durationMinutes', 'isActive']
