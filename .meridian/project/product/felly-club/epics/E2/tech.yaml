# ─── STM Learnings Applied ────────────────────────────────────────────────────

stm_learnings_applied:
  - id: 'LRN-001'
    title: 'CORS must be enabled in backend main.ts for dev environment'
    status: 'no_action_needed'
    detail: >
      CORS was already enabled in main.ts as part of E1 (app.enableCors with
      FRONTEND_URL env var and credentials: true). E2 does NOT modify main.ts for CORS.
      The existing configuration covers all new E2 endpoints under /api/v1/marketplace/*.

  - id: 'LRN-002'
    title: 'Use API-level cached response mocking, not in-code mocks'
    status: 'applied'
    detail: >
      MarketplaceSearchService defines an ISearchAdapter interface. Two implementations:
      (1) OpenSearchAdapter — uses @opensearch-project/opensearch client with OPENSEARCH_URL env var.
          Used when SEARCH_PROVIDER=opensearch (production, CI, or local with docker).
      (2) PrismaSearchAdapter — uses Prisma ILIKE queries + manual scoring as a fallback.
          Used when SEARCH_PROVIDER=prisma (default for local dev without Docker).
      The adapter is injected via NestJS DI token (SEARCH_ADAPTER_TOKEN), selected by env var.
      Business logic in MarketplaceService NEVER knows which adapter is active.
      This follows LRN-002: same code path in dev and prod, no in-code mocks, no Docker required
      for basic local dev. OpenSearch docker service is optional for local dev (recommended for
      full-text search fidelity testing, but not required).
      Redis caching follows the same pattern: REDIS_URL env var. When REDIS_URL is unset,
      RedisService degrades gracefully (cache miss on every call, no errors).
      Initial index seeding (OpenSearch only) via onModuleInit() bulk sync on first start.

# ─── Project Structure ────────────────────────────────────────────────────────

project_structure:
  root: 'felly-club/'
  package_manager: 'pnpm 9.x'
  workspace_config: 'pnpm-workspace.yaml'
  node_version: '20 LTS'

  root_files_modified:
    - path: 'docker-compose.yml'
      change: >
        ADD opensearch service block:
          opensearch:
            image: opensearchproject/opensearch:2
            container_name: felly_opensearch
            environment:
              - discovery.type=single-node
              - DISABLE_SECURITY_PLUGIN=true
              - ES_JAVA_OPTS=-Xms256m -Xmx256m
            ports:
              - "9200:9200"
            healthcheck:
              test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
              interval: 30s
              timeout: 10s
              retries: 3
        Note: DISABLE_SECURITY_PLUGIN=true is safe for local dev only.
        Prod uses AWS OpenSearch Service with VPC security (no security plugin needed).

  packages:
    - name: 'packages/backend-api'
      new_directories:
        - 'src/marketplace/'
        - 'src/marketplace/adapters/'
        - 'src/marketplace/dto/'
        - 'src/marketplace/__tests__/'
      new_files:
        - path: 'src/marketplace/marketplace.module.ts'
          purpose: '@Module — imports PrismaModule, AuthModule, UserModule; provides controller, service, repository, search service, recommendations service, redis service; exports MarketplaceSearchService (imported by AdminModule for index sync)'
        - path: 'src/marketplace/marketplace.controller.ts'
          purpose: 'REST routes: GET /marketplace/mentors, GET /marketplace/mentors/:id, GET /marketplace/categories, GET /marketplace/recommendations'
        - path: 'src/marketplace/adapters/search-adapter.interface.ts'
          purpose: 'ISearchAdapter interface: search(query, filters, pagination) → SearchResult, indexMentor(id), removeMentor(id), bulkSync(). Injected via SEARCH_ADAPTER_TOKEN.'
        - path: 'src/marketplace/adapters/opensearch.adapter.ts'
          purpose: 'OpenSearchAdapter implements ISearchAdapter. Uses @opensearch-project/opensearch client. Selected when SEARCH_PROVIDER=opensearch.'
        - path: 'src/marketplace/adapters/prisma-search.adapter.ts'
          purpose: 'PrismaSearchAdapter implements ISearchAdapter. Uses Prisma ILIKE queries + manual scoring. Selected when SEARCH_PROVIDER=prisma (default). No external dependencies. indexMentor/removeMentor/bulkSync are no-ops.'
        - path: 'src/marketplace/marketplace.service.ts'
          purpose: 'Orchestrates search (check Redis cache → call MarketplaceSearchService → cache result), mentor detail fetch (from Prisma + cache), recommendations delegation to RecommendationsService'
        - path: 'src/marketplace/marketplace.repository.ts'
          purpose: 'Prisma queries for verified mentor profiles: findVerifiedMentorById (with pricingTiers + availabilitySlots), countVerifiedByCategory (for category tabs), findAllVerifiedForSync (for bulk OpenSearch sync)'
        - path: 'src/marketplace/marketplace.search.service.ts'
          purpose: 'OpenSearch @opensearch-project/opensearch client wrapper. Methods: onModuleInit (create index if not exists; bulk sync if empty), searchMentors (query + filters + pagination), indexMentor (upsert document), removeMentorFromIndex (delete document), updateMentorInIndex (partial update), bulkIndexMentors (initial sync)'
        - path: 'src/marketplace/recommendations.service.ts'
          purpose: 'Rule-based matching: intersect mentee MenteeProfile.interests (ExpertiseCategory[]) with MentorProfile.expertiseCategories; sort by overlap count desc; limit to RECOMMENDATIONS_LIMIT (8). Falls back to empty array if mentee has no interests.'
        - path: 'src/marketplace/redis.service.ts'
          purpose: 'ioredis wrapper for search result caching. Methods: get(key), set(key, value, ttlSeconds), del(key), delPattern (SCAN-based wildcard invalidation for cache busting on index sync). REDIS_URL from @nestjs/config.'
        - path: 'src/marketplace/dto/mentor-search-query.dto.ts'
          purpose: 'Query params DTO: @IsOptional fields — q (string), category (ExpertiseCategory enum), priceMin (number integer), priceMax (number integer), rating (number 1-5), hasAvailability (boolean), sort (MentorSortOrder enum: relevance|price_asc|price_desc|rating_desc), page (number min 1, default 1), limit (number min 1 max 50, default 12)'
        - path: 'src/marketplace/dto/public-mentor-profile.dto.ts'
          purpose: 'Response DTO for all public marketplace endpoints. @Expose() on: id, firstName, lastName, headline, bio, expertiseCategories, yearsOfExperience, linkedinUrl, photoKey, verifiedBadge, pricingTiers, availabilitySlots, sessionCount, averageRating. @Exclude() on all private fields: status, rejectionReason, verifiedAt, completeness, verificationArtefacts, passwordHash.'
        - path: 'src/marketplace/dto/category-count.dto.ts'
          purpose: "Response DTO: { category: ExpertiseCategory | 'ALL'; count: number }"
        - path: 'src/marketplace/dto/recommendation-result.dto.ts'
          purpose: 'Response DTO: { mentor: PublicMentorProfileDto; matchingCategories: ExpertiseCategory[] }'
        - path: 'src/marketplace/__tests__/marketplace.service.spec.ts'
          purpose: 'Unit tests: search routing, Redis cache hit/miss, mentor detail assembly, privacy enforcement (no private fields in response)'
        - path: 'src/marketplace/__tests__/marketplace.controller.spec.ts'
          purpose: 'Unit tests: route guards (public vs auth), query param validation, response DTO shape'
        - path: 'src/marketplace/__tests__/recommendations.service.spec.ts'
          purpose: 'Unit tests: category intersection logic, overlap count sorting, empty interests → empty array, unverified mentor excluded'
        - path: 'src/marketplace/__tests__/marketplace.search.service.spec.ts'
          purpose: 'Unit tests: OpenSearch client mocked via jest.fn(); index creation, document upsert, search query construction, bulk sync (all assertions on mock calls)'
        - path: 'src/marketplace/__tests__/redis.service.spec.ts'
          purpose: 'Unit tests: ioredis client mocked; get/set/del/delPattern assertions'
      modified_files:
        - path: 'src/app.module.ts'
          change: 'Add MarketplaceModule to imports array (after AdminModule)'
        - path: 'src/admin/admin.module.ts'
          change: 'Add MarketplaceModule to imports array to access MarketplaceSearchService for async fire-and-forget index sync'
        - path: 'src/admin/admin.service.ts'
          change: 'Inject MarketplaceSearchService; after approveMentor() success, call void this.marketplaceSearchService.indexMentor(mentorProfile.id).catch((e) => this.logger.error(e)); after rejectMentor(), call void this.marketplaceSearchService.removeMentorFromIndex(id).catch(...)  — fire-and-forget, no HTTP response blocking'
        - path: 'src/user/user.service.ts'
          change: 'Inject MarketplaceSearchService (optional, via forwardRef if circular); after updateMentorProfile() success, call void this.marketplaceSearchService.updateMentorInIndex(profile.id).catch(...) — fire-and-forget'
        - path: 'jest.config.ts'
          change: "Add 'src/marketplace/**/*.ts' to collectCoverageFrom (exclude *.spec.ts, *.module.ts, *dto.ts)"
        - path: 'prisma/schema.prisma'
          change: >
            Add to MentorProfile model:
              sessionCount    Int    @default(0)   // denormalized; updated by E3 SessionModule after session completion
              averageRating   Float  @default(0)   // denormalized; updated by E5 RatingsModule after review submission
            These fields are read-only from E2's perspective — E2 displays them, E3/E5 write them.
        - path: '.env (and .env.local.example)'
          change: >
            Add:
              OPENSEARCH_URL=http://localhost:9200
              OPENSEARCH_INDEX_NAME=mentor_profiles
            (REDIS_URL=redis://localhost:6379 is already present from E1)
      migrations:
        - name: 'add_marketplace_fields'
          command: 'npx prisma migrate dev --name add_marketplace_fields'
          sql_summary: |
            ALTER TABLE "mentor_profiles"
              ADD COLUMN "session_count" INTEGER NOT NULL DEFAULT 0,
              ADD COLUMN "average_rating" DOUBLE PRECISION NOT NULL DEFAULT 0;
          safe_to_run_on_existing_data: true
          reversible: true

    - name: 'packages/mentee-web-app'
      new_directories:
        - 'src/app/(app)/mentors/'
        - 'src/components/marketplace/'
      new_files:
        - path: 'src/app/(app)/mentors/page.tsx'
          purpose: >
            SSR mentor listing page. Server component fetches initial verified mentor list and
            category counts via direct API calls (with no-cache for fresh data). Client
            components handle interactive search/filter/sort/pagination state via TanStack Query
            (invalidate and re-fetch on filter change). Renders: CategoryTabs, SearchBar,
            MentorFilters, SortControl, MentorCard grid, PaginationControls.
            RecommendedMentors section rendered client-side (requires auth check).
            generateMetadata: title "Find Your Mentor | Felly Club".
        - path: 'src/app/(app)/mentors/[id]/page.tsx'
          purpose: >
            SSR mentor detail page. Server component fetches mentor profile by ID.
            Returns 404 if mentor not found or not verified (INV-E2-01 enforcement).
            Renders: photo, name, headline, bio, verified badge, expertise categories,
            years of experience, LinkedIn link, pricing tiers, AvailabilityDisplay,
            session stats (count + rating), CTA button ('Coming Soon' placeholder until E3).
            generateMetadata: title "{firstName} {lastName} — {headline} | Felly Club".
            SEO-indexable (B2.3.6 requirement met by SSR).
        - path: 'src/components/marketplace/MentorCard.tsx'
          purpose: "Mentor listing card component. Props: mentor (IPublicMentorProfile), matchingCategories? (for recommendation context). Displays: photo (Next.js Image), name, headline, top 2 expertise category badges, verified badge icon, min price, availability indicator (green dot 'Available' or grey 'Schedule not set'), average rating (star icon + number or 'No ratings yet'). Links to /mentors/[mentor.id]."
        - path: 'src/components/marketplace/CategoryTabs.tsx'
          purpose: "Horizontal tab navigation. Uses @radix-ui/react-tabs (Tabs, TabsList, TabsTrigger). Props: categoryCounts (IMentorCategoryCount[]), selected (ExpertiseCategory|'ALL'), onChange. Renders 'All' tab + one tab per ExpertiseCategory enum value, each showing category label + count badge. Scrollable on mobile."
        - path: 'src/components/marketplace/SearchBar.tsx'
          purpose: 'Search input with submit. Props: defaultValue (string), onSearch (query: string) => void. Controlled input with lucide-react Search icon. Submits on Enter key and search button click. Clears with × button when non-empty.'
        - path: 'src/components/marketplace/MentorFilters.tsx'
          purpose: "Filter panel (collapsible on mobile). Props: filters (IMarketplaceFilters), onChange (Partial<IMarketplaceFilters>) => void. Sections: Price Range (two number inputs: min/max in dollars), Rating Threshold (@radix-ui/react-select 1-5 stars), Availability (@radix-ui/react-checkbox 'Available only'). 'Clear all' button resets all filters to undefined."
        - path: 'src/components/marketplace/SortControl.tsx'
          purpose: "Sort select dropdown. Uses @radix-ui/react-select. Props: value (MentorSortOrder), onChange. Options: 'relevance' → 'Most Relevant', 'price_asc' → 'Price: Low to High', 'price_desc' → 'Price: High to Low', 'rating_desc' → 'Highest Rated'."
        - path: 'src/components/marketplace/PaginationControls.tsx'
          purpose: "Page navigation. Props: page, totalPages, totalCount, pageSize, onPageChange. Displays 'Showing X–Y of Z mentors'. Renders: prev button (disabled on page 1), up to 5 page number buttons, next button (disabled on last page). Resets to page 1 when filters change (parent controls this via state reset)."
        - path: 'src/components/marketplace/AvailabilityDisplay.tsx'
          purpose: "Weekly availability schedule for mentor detail page. Props: availabilitySlots (IAvailabilitySlot[]). Groups by dayOfWeek (0=Sunday…6=Saturday). Formats each slot as e.g. 'Monday: 9:00 AM – 5:00 PM' (UTC label shown, no timezone conversion in E2). Shows 'Not accepting sessions' if slots array is empty."
        - path: 'src/components/marketplace/RecommendedMentors.tsx'
          purpose: "Recommendation section. Props: recommendations (IRecommendationResult[]). Renders up to 8 MentorCards with matchingCategories prop passed through (displayed as 'Matches your interest in Sport, Business' below the card). Only rendered when recommendations.length > 0. Section heading: 'Recommended for You'."
        - path: 'src/components/marketplace/EmptyState.tsx'
          purpose: 'Empty state UI. Props: title (string), message (string), actionLabel? (string), onAction? () => void. Used for: no search results, empty category, no recommendations available.'
        - path: 'src/hooks/useMentors.ts'
          purpose: "TanStack Query hook. useQuery key: ['mentors', filters, sort, page, limit]. Calls GET /api/v1/marketplace/mentors with params serialized from IMarketplaceFilters. Returns { data: IMentorSearchResponse, isLoading, error }."
        - path: 'src/hooks/useMentorDetail.ts'
          purpose: "TanStack Query hook. useQuery key: ['mentor', id]. Calls GET /api/v1/marketplace/mentors/:id. Returns { data: IPublicMentorProfile, isLoading, error }. staleTime: 5 minutes."
        - path: 'src/hooks/useRecommendations.ts'
          purpose: "TanStack Query hook. useQuery key: ['recommendations']. Calls GET /api/v1/marketplace/recommendations. enabled: isAuthenticated (user has token). Returns { data: IRecommendationResult[], isLoading }."
        - path: 'src/hooks/useCategoryCount.ts'
          purpose: "TanStack Query hook. useQuery key: ['categories']. Calls GET /api/v1/marketplace/categories. staleTime: 10 minutes. Returns { data: IMentorCategoryCount[] }."
      modified_files:
        - path: 'src/app/(app)/layout.tsx'
          change: "Add '/mentors' navigation link to AppSidebar/AppNav for authenticated users"

    - name: 'packages/shared-types'
      new_files:
        - path: 'src/types/marketplace.types.ts'
          purpose: >
            New interfaces for E2 marketplace feature:
            IPublicMentorProfile, IPublicPricingTier, IMarketplaceFilters,
            IMentorSearchResponse, IRecommendationResult, IMentorCategoryCount.
            MentorSortOrder enum exported as string union type.
      modified_files:
        - path: 'src/index.ts'
          change: "Add export * from './types/marketplace.types'"

