# ─── Data Model ───────────────────────────────────────────────────────────────

data_model:
  engine: 'Prisma ORM 5.x'
  database: 'PostgreSQL 16'
  schema_path: 'packages/backend-api/prisma/schema.prisma'

  prisma_migration:
    name: 'add_marketplace_fields'
    description: 'Adds denormalized session_count and average_rating to MentorProfile for E2 marketplace display'
    affected_model: 'MentorProfile'
    new_fields:
      - name: 'sessionCount'
        prisma_type: 'Int'
        default: '@default(0)'
        purpose: "Denormalized count of completed sessions. Read by E2 for profile display (B2.3.3). Written by E3 SessionModule after session completion. Zero until E3 ships — displays as 'New mentor' in UI."
        db_column: 'session_count'
      - name: 'averageRating'
        prisma_type: 'Float'
        default: '@default(0)'
        purpose: "Denormalized average rating score (0.0–5.0). Read by E2 for profile display and rating filter. Written by E5 RatingsModule after review submission. Zero until E5 ships — displays as 'No ratings yet' in UI."
        db_column: 'average_rating'
    migration_is_safe: true
    rollback_plan: 'Remove the two columns; default values mean no data loss risk'
    note: 'E2 MarketplaceModule is read-only for these fields. E3/E5 write them.'

  opensearch_index:
    name_env: 'OPENSEARCH_INDEX_NAME'
    default_name: 'mentor_profiles'
    alias: 'mentor_profiles_alias'
    note: >
      Index alias (mentor_profiles_alias) is used for all queries, enabling zero-downtime
      reindexing via alias swap (architecture NFR: OpenSearch scalable without reindexing).
      On first startup, MarketplaceSearchService.onModuleInit() creates the index + alias
      if they don't exist, then performs bulk sync of all VERIFIED MentorProfiles.
    dynamic: 'false'
    mappings:
      properties:
        id:
          type: 'keyword'
          note: 'MentorProfile.id (UUID). Source of truth for document identity.'
        firstName:
          type: 'text'
          analyzer: 'standard'
          fields:
            keyword: { type: 'keyword', ignore_above: 256 }
        lastName:
          type: 'text'
          analyzer: 'standard'
          fields:
            keyword: { type: 'keyword', ignore_above: 256 }
        headline:
          type: 'text'
          analyzer: 'standard'
          note: 'Nullable — maps to MentorProfile.headline'
        bio:
          type: 'text'
          analyzer: 'standard'
        expertiseCategories:
          type: 'keyword'
          note: "Array of ExpertiseCategory enum values (e.g. ['SPORT', 'ENTREPRENEURSHIP'])"
        yearsOfExperience:
          type: 'integer'
          note: 'Nullable — maps to MentorProfile.yearsOfExperience'
        verifiedBadge:
          type: 'boolean'
          note: 'Invariant: always true in index (INV-E2-01 enforcement at index time)'
        status:
          type: 'keyword'
          note: "Invariant: always 'VERIFIED' in index. MarketplaceSearchService.indexMentor() only indexes VERIFIED profiles."
        linkedinUrl:
          type: 'keyword'
          index: false
          note: 'Stored but not searchable — returned in search results for display'
        photoKey:
          type: 'keyword'
          index: false
          note: 'S3 object key — stored for display, not searchable'
        minPriceInCents:
          type: 'integer'
          note: 'Denormalized: min(pricingTiers.priceInCents) where isActive=true. Used for price range filter and price sort. Null if no active pricing tiers.'
        hasAvailability:
          type: 'boolean'
          note: 'Denormalized: count(availabilitySlots) > 0. Used for availability filter (B2.6.3).'
        sessionCount:
          type: 'integer'
          note: 'From MentorProfile.sessionCount (new E2 Prisma field)'
        averageRating:
          type: 'float'
          note: 'From MentorProfile.averageRating (new E2 Prisma field). 0.0 until E5 ships.'
        completeness:
          type: 'integer'
        updatedAt:
          type: 'date'
    search_pattern:
      full_text:
        type: 'multi_match'
        fields: ['firstName^3', 'lastName^3', 'headline^2', 'bio^1', 'expertiseCategories^1.5']
        query_type: 'best_fields'
        fuzziness: 'AUTO'
        note: 'Applied only when q param is provided. Empty q returns all verified mentors.'
      mandatory_filter:
        bool_filter:
          - term: { verifiedBadge: true }
          - term: { status: 'VERIFIED' }
        note: 'Always applied — enforces INV-E2-01 at search layer.'
      optional_filters:
        - name: 'category_filter'
          applies_when: 'category param provided'
          query: '{ terms: { expertiseCategories: [<category>] } }'
        - name: 'price_range_filter'
          applies_when: 'priceMin or priceMax param provided'
          query: '{ range: { minPriceInCents: { gte: <priceMin * 100>, lte: <priceMax * 100> } } }'
        - name: 'rating_filter'
          applies_when: 'rating param provided'
          query: '{ range: { averageRating: { gte: <rating> } } }'
        - name: 'availability_filter'
          applies_when: 'hasAvailability=true param provided'
          query: '{ term: { hasAvailability: true } }'
      sort_options:
        relevance: '[ { _score: desc } ]  (default when q provided)'
        price_asc: '[ { minPriceInCents: asc }, { _score: desc } ]'
        price_desc: '[ { minPriceInCents: desc }, { _score: desc } ]'
        rating_desc: '[ { averageRating: desc }, { _score: desc } ]'
        default_no_query: '[ { averageRating: desc }, { sessionCount: desc } ]'
      pagination:
        from: '(page - 1) * limit'
        size: 'limit (default 12, max 50)'

  shared_types_additions:
    file: 'packages/shared-types/src/types/marketplace.types.ts'
    interfaces:
      - name: 'IPublicMentorProfile'
        fields: >
          id: string; firstName: string; lastName: string; headline: string | null;
          bio: string; expertiseCategories: ExpertiseCategory[];
          yearsOfExperience: number | null; linkedinUrl: string | null;
          photoKey: string | null; verifiedBadge: boolean;
          pricingTiers: IPublicPricingTier[]; availabilitySlots: IPublicAvailabilitySlot[];
          sessionCount: number; averageRating: number
        note: 'Never includes: status, rejectionReason, verifiedAt, completeness, verificationArtefacts'

      - name: 'IPublicPricingTier'
        fields: 'id: string; durationMinutes: number; priceInCents: number; name: string | null; isActive: boolean'

      - name: 'IPublicAvailabilitySlot'
        fields: 'id: string; dayOfWeek: number; startTimeUtc: string; endTimeUtc: string'

      - name: 'IMarketplaceFilters'
        fields: >
          q?: string; category?: ExpertiseCategory; priceMin?: number; priceMax?: number;
          rating?: number; hasAvailability?: boolean;
          sort?: 'relevance' | 'price_asc' | 'price_desc' | 'rating_desc';
          page?: number; limit?: number

      - name: 'IMentorSearchResponse'
        fields: 'mentors: IPublicMentorProfile[]; total: number; page: number; limit: number; totalPages: number'

      - name: 'IRecommendationResult'
        fields: 'mentor: IPublicMentorProfile; matchingCategories: ExpertiseCategory[]'

      - name: 'IMentorCategoryCount'
        fields: "category: ExpertiseCategory | 'ALL'; count: number"

# ─── Components ───────────────────────────────────────────────────────────────

components:
  # ── Backend NestJS Module ──────────────────────────────────────────────────

  - id: 'MarketplaceModule'
    type: 'nestjs-module'
    package: 'packages/backend-api'
    responsibility: >
      E2 domain module. Encapsulates all mentor marketplace and discovery logic.
      Provides the MarketplaceController (4 public/protected endpoints), MarketplaceService
      (cache-orchestrated data access), MarketplaceRepository (Prisma queries, verified-only),
      MarketplaceSearchService (OpenSearch CRUD + search), RecommendationsService (rule-based
      category matching), and RedisService (ioredis cache operations).
      Exports MarketplaceSearchService so AdminModule can trigger async index sync on
      mentor approve/reject without circular dependency.
    key_files:
      - path: 'src/marketplace/marketplace.module.ts'
        purpose: '@Module({ imports: [PrismaModule, AuthModule, UserModule], providers: [MarketplaceController, MarketplaceService, MarketplaceRepository, MarketplaceSearchService, RecommendationsService, RedisService], exports: [MarketplaceSearchService] })'
    public_api:
      exports:
        [
          'MarketplaceSearchService — imported by AdminModule for index sync on mentor lifecycle events',
        ]
    invariants_enforced:
      - 'INV-E2-01: MarketplaceSearchService.indexMentor() validates status===VERIFIED before indexing. MarketplaceRepository only queries {status: VERIFIED, verifiedBadge: true}.'
      - 'INV-E2-02: PublicMentorProfileDto uses @Exclude() on all private fields (status, rejectionReason, verifiedAt, completeness, verificationArtefacts, passwordHash).'

  - id: 'MarketplaceController'
    type: 'nestjs-controller'
    package: 'packages/backend-api'
    responsibility: >
      REST controller at /marketplace prefix. Four endpoints:
      (1) GET /marketplace/mentors — public, optional JWT, full-text search + filters + pagination
      (2) GET /marketplace/mentors/:id — public, optional JWT, single verified mentor profile
      (3) GET /marketplace/categories — public, category list with verified mentor counts
      (4) GET /marketplace/recommendations — JWT required + MENTEE role, personalized recommendations
    key_files:
      - path: 'src/marketplace/marketplace.controller.ts'
        purpose: >
          @Controller('marketplace') @UseGuards(JwtAuthGuard) (class-level, with optional
          override per route). GET /mentors: @ApiOperation, query params via @Query() MentorSearchQueryDto,
          calls marketplaceService.searchMentors(). GET /mentors/:id: @Param('id'), calls
          marketplaceService.getMentorById(), throws NotFoundException if not found.
          GET /categories: calls marketplaceService.getCategoryCounts(). GET /recommendations:
          @UseGuards(JwtAuthGuard, RolesGuard) @Roles(UserRole.MENTEE), @CurrentUser() menteePayload,
          calls marketplaceService.getRecommendations(menteePayload.sub).
      - path: 'src/marketplace/dto/mentor-search-query.dto.ts'
        purpose: 'Query params DTO with class-validator decorators for type coercion and validation'
    route_table:
      - method: 'GET'
        path: '/api/v1/marketplace/mentors'
        auth: 'optional (no guard on this route — public browsing allowed)'
        query_params: 'q?, category?, priceMin?, priceMax?, rating?, hasAvailability?, sort?, page?, limit?'
        response: 'IMentorSearchResponse (paginated IPublicMentorProfile[])'
      - method: 'GET'
        path: '/api/v1/marketplace/mentors/:id'
        auth: 'optional (public profile page — accessible without login)'
        response: 'IPublicMentorProfile (404 if mentor not found or not VERIFIED)'
      - method: 'GET'
        path: '/api/v1/marketplace/categories'
        auth: 'optional (public)'
        response: "IMentorCategoryCount[] (all ExpertiseCategory values + 'ALL' with verified mentor counts)"
      - method: 'GET'
        path: '/api/v1/marketplace/recommendations'
        auth: 'required — JwtAuthGuard + RolesGuard + @Roles(MENTEE)'
        response: 'IRecommendationResult[] (up to 8 personalized recommendations)'

  - id: 'MarketplaceService'
    type: 'nestjs-service'
    package: 'packages/backend-api'
    responsibility: >
      Business orchestration layer for the marketplace. Routes search requests through
      the cache layer (Redis) then OpenSearch. Assembles full mentor profiles from Prisma
      for detail endpoint (OpenSearch stores summary data only; pricing + availability
      come from Prisma for the detail page). Delegates recommendation logic to
      RecommendationsService. Manages cache TTLs and invalidation.
    key_files:
      - path: 'src/marketplace/marketplace.service.ts'
        purpose: >
          searchMentors(dto): check Redis cache → call MarketplaceSearchService.searchMentors() →
          cache result (TTL 300s) → return IMentorSearchResponse.
          getMentorById(id): check Redis cache → call MarketplaceRepository.findVerifiedMentorById()
          (Prisma, full data with pricingTiers + availabilitySlots) → cache (TTL 600s) → map to PublicMentorProfileDto.
          getCategoryCounts(): check Redis cache → call MarketplaceRepository.countVerifiedByCategory() → cache (TTL 300s).
          getRecommendations(menteeUserId): call UserService.getMenteeInterests(userId) → call
          RecommendationsService.getRecommendations(interests) → return IRecommendationResult[].
    interfaces:
      - 'MarketplaceRepository (Prisma queries)'
      - 'MarketplaceSearchService (OpenSearch operations)'
      - 'RedisService (cache read/write)'
      - 'RecommendationsService (recommendation logic)'
      - 'UserService (mentee interests lookup for recommendations)'

  - id: 'MarketplaceRepository'
    type: 'nestjs-service'
    package: 'packages/backend-api'
    responsibility: >
      Prisma data access for MarketplaceModule. All queries include the mandatory
      { status: VERIFIED, verifiedBadge: true } filter (INV-E2-01 enforcement at DB layer).
      Provides: verified mentor by ID (with all relations), category counts, bulk fetch
      for OpenSearch initial sync.
    key_files:
      - path: 'src/marketplace/marketplace.repository.ts'
        purpose: >
          findVerifiedMentorById(id: string): prisma.mentorProfile.findFirst where
          { id, status: VERIFIED, verifiedBadge: true }, include { pricingTiers, availabilitySlots }.
          countVerifiedByCategory(): prisma.mentorProfile.groupBy({by: ['expertiseCategories'], where: {status: VERIFIED}}) — returns counts per category.
          findAllVerifiedForSync(): prisma.mentorProfile.findMany({ where: {status: VERIFIED, verifiedBadge: true}, include: {pricingTiers, availabilitySlots} }) — used by bulk sync on startup.
    note: >
      countVerifiedByCategory with PostgreSQL array unnesting: ExpertiseCategory[] is a
      Postgres array. Counts per category use a raw SQL query with unnest() since Prisma
      cannot groupBy on array fields. Use prisma.$queryRaw (permitted for analytics per
      quality-standards.yaml code_quality.conventions).

  - id: 'MarketplaceSearchService'
    type: 'nestjs-service'
    package: 'packages/backend-api'
    responsibility: >
      OpenSearch @opensearch-project/opensearch client wrapper. Implements OnModuleInit
      for startup index check and bulk sync. Provides methods for indexing, updating,
      removing, and searching mentor documents. Enforces INV-E2-01 by validating
      status===VERIFIED before every indexMentor() call. URL configured via
      OPENSEARCH_URL env var (LRN-002 pattern).
    key_files:
      - path: 'src/marketplace/marketplace.search.service.ts'
        purpose: >
          Constructor: reads OPENSEARCH_URL and OPENSEARCH_INDEX_NAME via ConfigService;
          creates @opensearch-project/opensearch Client({ node: OPENSEARCH_URL }).
          onModuleInit(): checkIndexExists() → if not, createIndex(mappings) and createAlias() →
          checkIndexCount() → if empty, call bulkIndexMentors().
          searchMentors(dto: MentorSearchQueryDto): builds bool query (multi_match for q,
          filter clause for mandatory VERIFIED + optional filters, sort, from/size pagination) →
          calls client.search({ index: alias, body: query }) → maps hits to IMentorSearchResponse.
          indexMentor(mentorProfileId): fetches from Prisma via MarketplaceRepository,
          validates status===VERIFIED (throws if not), maps to OpenSearch document,
          calls client.index({ index: OPENSEARCH_INDEX_NAME, id: mentorProfileId, body: doc }).
          removeMentorFromIndex(id): client.delete({ index, id }) with ignore 404.
          updateMentorInIndex(id): fetch from Prisma, re-index (same as indexMentor).
          bulkIndexMentors(): fetch all from MarketplaceRepository.findAllVerifiedForSync(),
          build bulk body, call client.bulk().
    interfaces:
      - 'MarketplaceRepository (for data fetch during index/sync)'
      - 'ConfigService (@nestjs/config for OPENSEARCH_URL, OPENSEARCH_INDEX_NAME)'
    exported: true
    note: >
      Exported from MarketplaceModule so AdminModule can inject it for fire-and-forget
      async sync: void this.marketplaceSearchService.indexMentor(id).catch(err => this.logger.error(err)).

  - id: 'RecommendationsService'
    type: 'nestjs-service'
    package: 'packages/backend-api'
    responsibility: >
      Rule-based recommendation engine. Matches mentee's stated interest categories
      (ExpertiseCategory[]) to verified mentor expertise categories via Prisma query
      (NOT OpenSearch — direct DB match for simplicity and correctness).
      Sorts by overlap count descending. Returns up to RECOMMENDATIONS_LIMIT (8) results
      with matchingCategories array for display (INV-E2-04: only stated interests, no tracking).
    key_files:
      - path: 'src/marketplace/recommendations.service.ts'
        purpose: >
          getRecommendations(menteeUserId: string): calls UserService to get mentee interests
          (ExpertiseCategory[]) → if empty, return [] → Prisma query:
          mentorProfile.findMany({ where: { status: VERIFIED, verifiedBadge: true,
          expertiseCategories: { hasSome: menteeInterests } }, include: { pricingTiers, availabilitySlots },
          take: RECOMMENDATIONS_LIMIT * 3 }) → sort by overlap count desc →
          take first RECOMMENDATIONS_LIMIT → map to IRecommendationResult[] with
          matchingCategories = intersection(mentor.expertiseCategories, menteeInterests).
    constants:
      RECOMMENDATIONS_LIMIT: 8
    invariants_enforced:
      - 'INV-E2-01: where clause includes status: VERIFIED, verifiedBadge: true'
      - 'INV-E2-04: matching uses only mentee.interests (explicit) — no browsing history or implicit signals'

  - id: 'RedisService'
    type: 'nestjs-service'
    package: 'packages/backend-api'
    responsibility: >
      ioredis client wrapper for search result caching in MarketplaceModule.
      Provides TTL-based get/set and pattern-based cache invalidation.
      Cache keys and TTLs defined as constants.
    key_files:
      - path: 'src/marketplace/redis.service.ts'
        purpose: >
          Constructor: creates ioredis Redis({ lazyConnect: true }) from REDIS_URL env var.
          get(key): redis.get(key) → JSON.parse or null.
          set(key, value, ttlSeconds): redis.setex(key, ttlSeconds, JSON.stringify(value)).
          del(key): redis.del(key).
          delPattern(pattern): SCAN-based iteration (redis.scan cursor MATCH pattern COUNT 100)
          collecting all matching keys, then redis.del(...keys) in batch.
          Connection errors are caught and logged; cache miss is returned gracefully
          (never throws — cache failures degrade to uncached but do not break the API).
    cache_keys:
      - key: 'marketplace:mentors:search:{sha256(queryString)}'
        ttl: '300 seconds (5 minutes)'
        invalidated_on: "indexMentor, removeMentorFromIndex (via delPattern 'marketplace:mentors:search:*')"
      - key: 'marketplace:mentor:{mentorProfileId}:profile'
        ttl: '600 seconds (10 minutes)'
        invalidated_on: 'indexMentor, removeMentorFromIndex (direct del by key)'
      - key: 'marketplace:categories:counts'
        ttl: '300 seconds (5 minutes)'
        invalidated_on: 'indexMentor, removeMentorFromIndex (direct del by key)'

  # ── Frontend Pages & Components ────────────────────────────────────────────

  - id: 'MentorsPage'
    type: 'nextjs-page'
    package: 'packages/mentee-web-app'
    responsibility: >
      SSR marketplace listing page at /mentors. Satisfies F2.1, F2.2, F2.4, F2.5, F2.6
      (listing card availability indicator). Server component fetches initial verified mentor
      list and category counts (no-store fetch) for SEO-visible initial HTML.
      Client state (search, filters, sort, pagination) handled by TanStack Query hooks in
      'use client' sub-components to avoid full page re-render. RecommendedMentors section
      is client-only (requires auth check; excluded from SSR for privacy).
    key_files:
      - path: 'src/app/(app)/mentors/page.tsx'
        purpose: 'Next.js page component. generateMetadata for SEO title. Server data fetch → pass to client components.'
    interfaces:
      - 'useMentors hook (TanStack Query, client-side filter updates)'
      - 'useCategoryCount hook (initial from server, refreshed client-side)'
      - 'useRecommendations hook (client-only, requires auth)'

  - id: 'MentorDetailPage'
    type: 'nextjs-page'
    package: 'packages/mentee-web-app'
    responsibility: >
      SSR mentor public profile page at /mentors/[id]. Satisfies F2.3 and F2.6
      (detailed availability schedule). Server component fetches full IPublicMentorProfile
      by ID. Returns 404 (notFound()) if mentor not found or not VERIFIED. Renders complete
      profile with SEO-optimised metadata (B2.3.6: stable shareable URL + crawlable content).
      'Request Session' CTA shows 'Coming Soon' placeholder state until E3 ships.
    key_files:
      - path: 'src/app/(app)/mentors/[id]/page.tsx'
        purpose: "Dynamic route. generateMetadata: title '{firstName} {lastName} — {headline} | Felly Club'. Server-side notFound() for unverified/missing mentors."
    interfaces:
      - 'useMentorDetail hook (for client-side data refresh)'
      - 'AvailabilityDisplay component'

  - id: 'MentorCard'
    type: 'react-component'
    package: 'packages/mentee-web-app'
    responsibility: >
      Reusable mentor listing card. Used in search results, category listings, and
      recommendation section. Displays compact mentor summary with availability indicator
      (B2.6.1) and rating. Supports matchingCategories prop for recommendation context
      badges (B2.4.2).
    key_files:
      - path: 'src/components/marketplace/MentorCard.tsx'
        purpose: 'Props: mentor: IPublicMentorProfile, matchingCategories?: ExpertiseCategory[]. Links to /mentors/[mentor.id].'
    interfaces:
      - 'IPublicMentorProfile (from @felly/shared-types)'

  - id: 'CategoryTabs'
    type: 'react-component'
    package: 'packages/mentee-web-app'
    responsibility: >
      Accessible category navigation tabs for marketplace landing page (F2.2). Uses
      @radix-ui/react-tabs for keyboard navigation and ARIA semantics. Displays 'All' tab
      plus one tab per ExpertiseCategory enum value with mentor count badges.
    key_files:
      - path: 'src/components/marketplace/CategoryTabs.tsx'
        purpose: "Props: categoryCounts: IMentorCategoryCount[], selected: ExpertiseCategory|'ALL', onChange: (ExpertiseCategory|'ALL') => void"
    interfaces:
      - 'IMentorCategoryCount (from @felly/shared-types)'
      - 'ExpertiseCategory enum (from @felly/shared-types)'

  - id: 'MentorFilters'
    type: 'react-component'
    package: 'packages/mentee-web-app'
    responsibility: >
      Filter panel for F2.1 (price range, rating threshold) and F2.6 (availability filter).
      Collapsible on mobile. 'Clear all' resets all filters. Uses @radix-ui/react-select
      for rating and @radix-ui/react-checkbox for availability.
    key_files:
      - path: 'src/components/marketplace/MentorFilters.tsx'
        purpose: 'Props: filters: IMarketplaceFilters, onChange: (Partial<IMarketplaceFilters>) => void'
    interfaces:
      - 'IMarketplaceFilters (from @felly/shared-types)'

  - id: 'AvailabilityDisplay'
    type: 'react-component'
    package: 'packages/mentee-web-app'
    responsibility: >
      Detailed weekly availability schedule for mentor detail page (F2.6 B2.6.2).
      Groups availability slots by day of week, formats times as human-readable ranges.
      Shows 'Not accepting sessions' empty state if slots array is empty.
    key_files:
      - path: 'src/components/marketplace/AvailabilityDisplay.tsx'
        purpose: 'Props: availabilitySlots: IPublicAvailabilitySlot[]. Day labels: Sun/Mon/Tue/Wed/Thu/Fri/Sat.'
    interfaces:
      - 'IPublicAvailabilitySlot (from @felly/shared-types)'

  - id: 'RecommendedMentors'
    type: 'react-component'
    package: 'packages/mentee-web-app'
    responsibility: >
      Personalized recommendation section for authenticated mentees (F2.4). Renders
      up to 8 MentorCards with matchingCategories prop for 'Matches your interest in...'
      badges (B2.4.2). Hidden when recommendations array is empty or user is not
      authenticated (B2.4.4).
    key_files:
      - path: 'src/components/marketplace/RecommendedMentors.tsx'
        purpose: 'Props: recommendations: IRecommendationResult[]. Wraps useRecommendations hook internally.'
    interfaces:
      - 'IRecommendationResult (from @felly/shared-types)'

  - id: 'PaginationControls'
    type: 'react-component'
    package: 'packages/mentee-web-app'
    responsibility: >
      Page navigation for search results (F2.5 B2.5.1). Displays 'Showing X–Y of Z mentors'
      count indicator. Prev/next + numbered page buttons (up to 5 visible).
      Pagination resets to page 1 when filters change (controlled externally by parent).
    key_files:
      - path: 'src/components/marketplace/PaginationControls.tsx'
        purpose: 'Props: page, totalPages, totalCount, pageSize, onPageChange: (page: number) => void'

  - id: 'SortControl'
    type: 'react-component'
    package: 'packages/mentee-web-app'
    responsibility: >
      Sort dropdown for search results (F2.5 B2.5.2). Uses @radix-ui/react-select.
      Options: Relevance, Price Low-to-High, Price High-to-Low, Rating Highest.
      Changing sort resets pagination to page 1 (parent handles via state).
    key_files:
      - path: 'src/components/marketplace/SortControl.tsx'
        purpose: "Props: value: IMarketplaceFilters['sort'], onChange: (sort: IMarketplaceFilters['sort']) => void"

# ─── Feature Mapping ──────────────────────────────────────────────────────────

feature_mapping:
  F2.1:
    name: 'Mentor Search & Filtering'
    backend_components:
      - component: 'MarketplaceController'
        role: 'GET /marketplace/mentors — accepts q, category, priceMin, priceMax, rating, hasAvailability query params via MentorSearchQueryDto'
      - component: 'MarketplaceService'
        role: 'Cache-first search orchestration (Redis → OpenSearch)'
      - component: 'MarketplaceSearchService'
        role: 'Builds OpenSearch bool query with multi_match + filter clauses; enforces VERIFIED filter on every query (INV-E2-01)'
      - component: 'RedisService'
        role: 'Caches search results by query hash (TTL 300s)'
    frontend_components:
      - component: 'MentorsPage'
        role: 'Hosts search state; passes filters to useMentors hook'
      - component: 'SearchBar'
        role: 'Free-text query input; B2.1.1'
      - component: 'MentorFilters'
        role: 'Price range, rating threshold, availability filter inputs; B2.1.3, B2.1.4, B2.1.5'
      - component: 'MentorCard'
        role: 'Displays each search result'
    shared_types: ['IMarketplaceFilters', 'IMentorSearchResponse', 'IPublicMentorProfile']
    invariants: ['INV-E2-01 (VERIFIED only)', 'INV-E2-02 (no private data in results)']

  F2.2:
    name: 'Category-Based Marketplace Navigation'
    backend_components:
      - component: 'MarketplaceController'
        role: 'GET /marketplace/categories — returns all ExpertiseCategory values with verified mentor counts'
      - component: 'MarketplaceRepository'
        role: 'countVerifiedByCategory(): raw SQL with unnest() to count per ExpertiseCategory enum value'
      - component: 'RedisService'
        role: 'Caches category counts (TTL 300s)'
    frontend_components:
      - component: 'MentorsPage'
        role: 'Hosts selected category state; passes to CategoryTabs and to useMentors filter'
      - component: 'CategoryTabs'
        role: 'Renders category tabs with counts; B2.2.1, B2.2.2, B2.2.3'
      - component: 'EmptyState'
        role: 'Shown when selected category has zero verified mentors (B2.2.3)'
    shared_types: ['IMentorCategoryCount', 'ExpertiseCategory enum']
    invariants: ['INV-E2-01', 'INV-E2-03 (categories from enum, not user-defined)']

  F2.3:
    name: 'Mentor Public Profile Page'
    backend_components:
      - component: 'MarketplaceController'
        role: 'GET /marketplace/mentors/:id — returns full IPublicMentorProfile; 404 if not VERIFIED'
      - component: 'MarketplaceService'
        role: 'Fetches from Prisma (full data with pricing + availability) — NOT from OpenSearch (OpenSearch is for search, not profile authority)'
      - component: 'MarketplaceRepository'
        role: 'findVerifiedMentorById: includes pricingTiers + availabilitySlots; returns null for unverified'
      - component: 'PublicMentorProfileDto'
        role: '@Exclude() enforcement: verificationArtefacts, status, rejectionReason, completeness excluded (INV-E2-02)'
    frontend_components:
      - component: 'MentorDetailPage'
        role: 'SSR profile page at /mentors/[id]; notFound() for unverified; SEO metadata (B2.3.6)'
      - component: 'AvailabilityDisplay'
        role: 'Weekly schedule section on profile page (B2.3.4, F2.6 B2.6.2)'
    shared_types: ['IPublicMentorProfile', 'IPublicPricingTier', 'IPublicAvailabilitySlot']
    invariants: ['INV-E2-01 (profile inaccessible for unverified)', 'INV-E2-02 (no private data)']

  F2.4:
    name: 'Rule-Based Mentor Recommendations'
    backend_components:
      - component: 'MarketplaceController'
        role: 'GET /marketplace/recommendations — JwtAuthGuard + @Roles(MENTEE) required'
      - component: 'MarketplaceService'
        role: 'Calls UserService to get mentee interests, then delegates to RecommendationsService'
      - component: 'RecommendationsService'
        role: 'Prisma hasSome query on expertiseCategories; sort by overlap count; limit 8; maps to IRecommendationResult with matchingCategories'
    frontend_components:
      - component: 'MentorsPage'
        role: 'Renders RecommendedMentors section above search results (client-side only)'
      - component: 'RecommendedMentors'
        role: 'Recommendation section with matching interest context badges (B2.4.2); hidden for unauth users (B2.4.4)'
    shared_types: ['IRecommendationResult']
    invariants:
      ['INV-E2-01 (verified only)', 'INV-E2-04 (stated interests only, no behavioral tracking)']

  F2.5:
    name: 'Search Result Pagination & Sorting'
    backend_components:
      - component: 'MarketplaceController'
        role: 'GET /marketplace/mentors accepts sort, page, limit query params via MentorSearchQueryDto'
      - component: 'MarketplaceSearchService'
        role: 'Maps sort enum to OpenSearch sort clause; applies from=(page-1)*limit, size=limit pagination to OpenSearch query'
    frontend_components:
      - component: 'PaginationControls'
        role: "Prev/next/page buttons; 'Showing X–Y of Z mentors' display (B2.5.1, B2.5.3)"
      - component: 'SortControl'
        role: 'Sort dropdown; changing sort resets to page 1 (B2.5.2)'
      - component: 'MentorsPage'
        role: 'Coordinates state: when filter or sort changes → reset page to 1'
    shared_types:
      [
        'IMentorSearchResponse (includes total, page, totalPages)',
        'IMarketplaceFilters (sort, page, limit fields)',
      ]

  F2.6:
    name: 'Mentor Availability Display'
    backend_components:
      - component: 'MarketplaceRepository'
        role: 'findVerifiedMentorById includes availabilitySlots in Prisma query; countVerifiedByCategory is unaffected'
      - component: 'MarketplaceSearchService'
        role: 'Denormalizes hasAvailability (count(availabilitySlots) > 0) into OpenSearch document for availability filter'
    frontend_components:
      - component: 'MentorCard'
        role: "Compact availability indicator: green 'Available' or grey 'Schedule not set' (B2.6.1)"
      - component: 'AvailabilityDisplay'
        role: 'Detailed weekly schedule on /mentors/[id] profile page (B2.6.2)'
      - component: 'MentorFilters'
        role: "Availability checkbox filter: 'Available only' (B2.6.3)"
    shared_types: ['IPublicMentorProfile (availabilitySlots field)', 'IPublicAvailabilitySlot']

# ─── Design Decisions ─────────────────────────────────────────────────────────

design_decisions:
  - id: 'DD-E2-01'
    title: 'Search adapter interface with env-based provider selection (LRN-002)'
    choice: >
      ISearchAdapter interface with two implementations:
      (1) OpenSearchAdapter — @opensearch-project/opensearch client, OPENSEARCH_URL env var.
      (2) PrismaSearchAdapter — Prisma ILIKE queries, no external dependency.
      SEARCH_PROVIDER env var selects: 'opensearch' (prod, CI) or 'prisma' (local dev default).
      Injected via NestJS DI token SEARCH_ADAPTER_TOKEN — same pattern as AUTH_ADAPTER_TOKEN from E1.
    rationale: >
      Architecture.yaml TP7 mandates AWS OpenSearch Service for production. LRN-002 requires
      that local dev works WITHOUT Docker or external services — app code is identical in dev
      and prod, only env config changes. PrismaSearchAdapter provides degraded but functional
      search (ILIKE, no relevance scoring) for local dev. OpenSearch docker service is OPTIONAL
      for local dev — recommended for full-text fidelity testing but not required to start the app.
      This eliminates the Docker dependency that blocked E1 local testing.
    constraints_from: 'architecture.yaml TP7, NFR-3 (< 1s search), LRN-002'

  - id: 'DD-E2-02'
    title: 'Redis caching for search results (ioredis, TTL 5 min)'
    choice: 'Cache search results in Redis with SHA256-hashed query key and 5-minute TTL. Cache mentor profiles with 10-minute TTL. Cache category counts with 5-minute TTL.'
    rationale: >
      Architecture.yaml NFR performance requirement: 'Mentor discovery search results returned
      < 1s via OpenSearch with Redis cache hit for repeated queries.' Repeated searches with
      the same filters (common on discovery pages) return instantly from Redis, avoiding
      round-trip latency to OpenSearch. ioredis is TypeScript-native (no @types needed),
      high performance, and REDIS_URL is already defined from E1.
    constraints_from: 'architecture.yaml NFR performance, dependency-resolution-report library list'
    cache_invalidation_note: 'Cache is invalidated via delPattern on mentor index changes (approve/reject) to prevent stale results (INV-E2-05).'

  - id: 'DD-E2-03'
    title: 'Rule-based recommendations via Prisma query, not OpenSearch'
    choice: 'RecommendationsService uses Prisma MentorProfile.findMany({ expertiseCategories: { hasSome: menteeInterests } }) for recommendation matching, not an OpenSearch query.'
    rationale: >
      Rule-based category matching (exact enum value intersection) is a simple set operation
      that Prisma handles efficiently with PostgreSQL's && array operator (hasSome).
      Using OpenSearch for this would add query complexity without benefit — there is no
      relevance scoring needed, just category overlap counting. Prisma is authoritative for
      profile data; OpenSearch is used for user-generated free-text search. This also avoids
      potential index sync lag affecting recommendation quality (INV-E2-04 requires accurate
      category-based matching).
    constraints_from: 'features.yaml INV-E2-04, dependency-resolution-report ADR-ARCH-002'

  - id: 'DD-E2-04'
    title: 'SSR for /mentors and /mentors/[id] pages'
    choice: 'Next.js Server Components (App Router) for the marketplace listing and mentor detail pages. TanStack Query used for client-side filter updates without full page reloads.'
    rationale: >
      Architecture.yaml 'mentee-web-app deployment unit' explicitly requires SSR for mentor
      discovery and profile pages for SEO indexability. Feature F2.3 B2.3.6 requires profile
      pages to be indexable by external search engines. App Router Server Components render
      initial HTML server-side (SEO-visible). TanStack Query handles incremental client-side
      updates without breaking SSR. Client-only components (RecommendedMentors) avoid SSR
      to prevent auth-sensitive data leakage in server-rendered HTML.
    constraints_from: 'architecture.yaml mentee-web-app component, features.yaml B2.3.6'

  - id: 'DD-E2-05'
    title: 'Fire-and-forget OpenSearch sync from AdminService (no BullMQ in E2)'
    choice: 'AdminService.approveMentor() and rejectMentor() call MarketplaceSearchService.indexMentor() / removeMentorFromIndex() asynchronously via void promise.catch(log). No BullMQ for E2.'
    rationale: >
      Architecture TP4 calls for BullMQ SearchSyncWorker, but BullMQ is not yet set up
      and is scoped to the background-workers epic. For E2, the dependency-resolution-report
      constraint 'E2 must not block admin API calls' is satisfied by fire-and-forget async.
      OpenSearch indexing is fast (< 100ms) and failures are non-critical (cache invalidation
      + eventual consistency via next search). BullMQ SearchSyncWorker extraction to
      background-workers is deferred to E9/background-infrastructure epic.
      UserService.updateMentorProfile() also triggers async fire-and-forget index update
      to keep search index fresh (INV-E2-05: changes reflected without admin manual sync).
    constraints_from: 'dependency-resolution-report ADR-ARCH-003, features.yaml INV-E2-05'
    future_state: 'BullMQ SearchSyncWorker extraction planned for background-workers epic (E9+)'

  - id: 'DD-E2-06'
    title: 'Prisma detail query as profile authority, not OpenSearch'
    choice: 'GET /marketplace/mentors/:id fetches from Prisma (full profile with pricingTiers + availabilitySlots), not from OpenSearch. OpenSearch is used only for search/listing queries.'
    rationale: >
      OpenSearch document is a denormalized summary snapshot for search efficiency.
      Pricing tiers and availability slots are detailed relational data best served from
      Prisma with full relational integrity. OpenSearch index may have up to ~5s sync lag
      (architecture technical risk); using Prisma for the detail endpoint avoids showing
      stale pricing/availability data on the most decision-critical page (B2.3.2 pricing
      accuracy, INV-E2-05 profile consistency). The Redis cache on the detail endpoint
      provides the latency benefit.
    constraints_from: 'features.yaml INV-E2-05, B2.3.2'

  - id: 'DD-E2-07'
    title: 'sessionCount and averageRating as denormalized MentorProfile fields'
    choice: 'Add session_count and average_rating fields directly to MentorProfile table. E3 SessionModule writes sessionCount; E5 RatingsModule writes averageRating. E2 reads them.'
    rationale: >
      Avoids cross-module aggregate queries in the marketplace hot path (would require
      joining sessions or ratings tables). Denormalized fields are synchronized by the
      producing module (E3/E5) as part of their domain operations. E2 can filter and sort
      by these fields efficiently in both Prisma and OpenSearch without aggregation overhead.
      Both fields default to 0 so E2 can ship before E3/E5 without null handling complexity.
    constraints_from: 'features.yaml B2.3.3, B2.1.4 (rating filter)'

  - id: 'DD-E2-08'
    title: 'Public endpoints for listing and detail; authentication only for recommendations'
    choice: 'GET /marketplace/mentors, GET /marketplace/mentors/:id, and GET /marketplace/categories are public (no JWT required). GET /marketplace/recommendations requires JwtAuthGuard + MENTEE role.'
    rationale: >
      Mentor listing and profiles must be discoverable without login to support SEO (B2.3.6)
      and reduce friction in the discovery journey. Unauthenticated visitors represent potential
      sign-up conversions — requiring login to browse would create unnecessary friction.
      Recommendations require auth because they read the mentee's interests from their profile
      (the JWT provides mentee identity); unauthenticated users have no interests to match
      (F2.4 B2.4.4 explicitly excludes unauthenticated visitors from recommendations).
    constraints_from: 'features.yaml B2.3.6, B2.4.4, INV-E2-01'

# ─── Dev Setup ────────────────────────────────────────────────────────────────

dev_setup:
  prerequisites:
    - 'E1 fully implemented and merged to develop (confirmed: git log d8d05f3)'
    - 'pnpm 9.x installed (node 20 LTS)'
    - 'packages/backend-api/.env exists with E1 variables (DATABASE_URL, JWT_SECRET, etc.)'
    - 'Docker Desktop is OPTIONAL — only needed for OpenSearch fidelity testing. Without Docker, set SEARCH_PROVIDER=prisma (default)'

  steps:
    - step: 1
      title: 'Add OpenSearch service to docker-compose.yml (OPTIONAL for local dev)'
      action: >
        Add the following service block to docker-compose.yml alongside the existing
        postgres and redis services:
          opensearch:
            image: opensearchproject/opensearch:2
            container_name: felly_opensearch
            environment:
              - discovery.type=single-node
              - DISABLE_SECURITY_PLUGIN=true
              - ES_JAVA_OPTS=-Xms256m -Xmx256m
            ports:
              - "9200:9200"
            healthcheck:
              test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
              interval: 30s
              timeout: 10s
              retries: 3
      note: >
        OPTIONAL for local dev. If Docker is not available, skip this step and use
        SEARCH_PROVIDER=prisma (default). The PrismaSearchAdapter provides degraded
        but functional search without OpenSearch. For full-text fidelity testing,
        run docker-compose up -d opensearch and set SEARCH_PROVIDER=opensearch.

    - step: 2
      title: 'Install new E2 backend dependencies'
      command: |
        pnpm --filter @felly/backend-api add @opensearch-project/opensearch@^2.3.0 ioredis@^5.3.2
      note: 'ioredis v5 includes built-in TypeScript types — no separate @types/ioredis needed.'

    - step: 3
      title: 'Install new E2 frontend dependencies'
      command: |
        pnpm --filter @felly/mentee-web-app add @radix-ui/react-tabs@^1.0.4 @radix-ui/react-select@^2.1.0 @radix-ui/react-checkbox@^1.1.1

    - step: 4
      title: 'Add E2 environment variables to backend-api .env'
      action: >
        Add to packages/backend-api/.env (and packages/backend-api/.env.local.example):
          SEARCH_PROVIDER=prisma
          OPENSEARCH_URL=http://localhost:9200
          OPENSEARCH_INDEX_NAME=mentor_profiles
        Note: SEARCH_PROVIDER=prisma is the default for local dev (no Docker needed).
        Set SEARCH_PROVIDER=opensearch when running with docker-compose OpenSearch.
        REDIS_URL=redis://localhost:6379 is already present from E1 — RedisService
        degrades gracefully if Redis is unavailable (cache miss, no errors).

    - step: 5
      title: 'Start services (PostgreSQL required, Docker optional)'
      action: >
        Option A (no Docker): Ensure PostgreSQL is running (brew services start postgresql@16).
        SEARCH_PROVIDER=prisma (default) — no OpenSearch or Redis needed.
        Option B (with Docker): docker-compose up -d — starts postgres, redis, opensearch.
        Set SEARCH_PROVIDER=opensearch in .env.
      verify: "PostgreSQL: psql -d felly_club -c 'SELECT 1;'. OpenSearch (if used): curl http://localhost:9200/_cluster/health"

    - step: 6
      title: 'Run Prisma migration for E2 schema additions'
      command: |
        cd packages/backend-api
        npx prisma migrate dev --name add_marketplace_fields
        npx prisma generate
      expected_output: "Migration 'add_marketplace_fields' applied. New fields session_count and average_rating added to mentor_profiles table."

    - step: 7
      title: 'Start all development servers'
      command: 'pnpm dev'
      note: >
        Starts backend-api (:3000), mentee-web-app (:3001), admin-portal (:3002) concurrently.
        On first start, MarketplaceSearchService.onModuleInit() will:
        (1) Create the mentor_profiles OpenSearch index + alias if not exists
        (2) If the index is empty, bulk sync all VERIFIED MentorProfiles from Prisma
        This may take a few seconds on first boot — check backend logs for 'OpenSearch index sync complete'.

    - step: 8
      title: 'Verify OpenSearch index is populated'
      command: 'curl http://localhost:9200/mentor_profiles/_count'
      expected_output: "{ 'count': N } where N = number of VERIFIED mentors in DB (0 if no mentors verified yet)"
      note: 'Use the admin portal to approve a mentor, then verify count increases to 1.'

  service_ports:
    backend_api: 3000
    mentee_web_app: 3001
    admin_portal: 3002
    postgres: 5432
    redis: 6379
    opensearch: 9200

  api_docs:
    swagger_ui: 'http://localhost:3000/api/docs (dev and staging only)'
    new_endpoints:
      - 'GET /api/v1/marketplace/mentors — search, filter, paginate verified mentors'
      - 'GET /api/v1/marketplace/mentors/:id — public mentor profile'
      - 'GET /api/v1/marketplace/categories — category list with verified mentor counts'
      - 'GET /api/v1/marketplace/recommendations — personalized recommendations (auth required)'

  cors_note: 'CORS is already enabled for FRONTEND_URL in main.ts from E1 (LRN-001 — no action needed).'

# ─── Quality Gates ────────────────────────────────────────────────────────────

quality_gates:
  commands:
    lint:
      command: 'pnpm lint'
      config: '.eslintrc.json (root) with @typescript-eslint strict mode'
      must_pass: true
      note: 'ESLint 8.57.0 — no-explicit-any errors on all new marketplace/*.ts files'

    typecheck:
      command: 'pnpm typecheck'
      config: 'tsconfig.base.json (strict: true, noImplicitAny: true, emitDecoratorMetadata: true)'
      must_pass: true
      note: "All new DTOs, interfaces, and service methods must be fully typed. No 'any' allowed."

    test:
      command: 'pnpm test'
      runner: 'Jest 29.7.0 with ts-jest'
      must_pass: true
      coverage:
        command: 'pnpm test -- --coverage'
        thresholds: '70% branches, 80% functions/lines/statements (overall). E2 marketplace files included in collectCoverageFrom.'
        add_to_jest_config: >
          In packages/backend-api/jest.config.ts, add to collectCoverageFrom:
            'src/marketplace/marketplace.service.ts',
            'src/marketplace/marketplace.controller.ts',
            'src/marketplace/marketplace.repository.ts',
            'src/marketplace/marketplace.search.service.ts',
            'src/marketplace/recommendations.service.ts',
            'src/marketplace/redis.service.ts'
      ci_service_note: >
        GitHub Actions CI (.github/workflows/ci.yml) already starts postgres + redis services
        for the test job. For E2, add opensearch service to the test job:
          opensearch:
            image: opensearchproject/opensearch:2
            ports: ['9200:9200']
            env: { discovery.type: single-node, DISABLE_SECURITY_PLUGIN: 'true', ES_JAVA_OPTS: '-Xms256m -Xmx256m' }
            options: --health-cmd "curl -sf http://localhost:9200/_cluster/health" --health-interval 30s

    build:
      command: 'pnpm build'
      must_pass: true
      note: 'Next.js production build for both frontends + TypeScript compile for backend-api'

  pre_commit:
    tool: 'Husky 9.1.6 + lint-staged 15.2.10'
    actions: 'ESLint --fix + Prettier --write on staged *.ts, *.tsx files'
    note: 'Pre-commit hooks run automatically — no changes needed from E1 config'

  pr_review_checklist_additions:
    - 'PublicMentorProfileDto has @Exclude() on all private MentorProfile fields (INV-E2-02 compliance)'
    - 'All marketplace endpoints with public access verified to not expose private data via manual test'
    - 'MarketplaceSearchService.indexMentor() validates status===VERIFIED before indexing'
    - 'RecommendationsService does NOT use any behavioral tracking data (INV-E2-04)'
    - 'New Prisma migration file reviewed — add_marketplace_fields uses DEFAULT 0 (backward compatible)'
    - 'OPENSEARCH_URL is read from env var via ConfigService, never hardcoded'
    - 'Redis cache key patterns match the invalidation logic (del/delPattern on index changes)'

# ─── Open Questions ───────────────────────────────────────────────────────────

open_questions:
  - id: 'OQ-E2-01'
    question: >
      E11 (Production Integration) only scopes KeyCloak + Stripe adapter swaps.
      OpenSearch, Redis, and email delivery adapter transitions are not explicitly
      owned by any epic. Who owns the "run all adapters against real services in
      staging" integration test pass before production launch?
    impact: >
      Without explicit ownership, the OpenSearch production adapter (built in E2),
      Redis production config, and email delivery integration may never be validated
      against real infrastructure in a staging environment. Risk: production launch
      discovers integration issues that were never tested.
    options:
      - 'Expand E11 scope to cover ALL adapter swaps (OpenSearch, Redis, email, SMS) — not just KeyCloak + Stripe'
      - 'Create a dedicated pre-launch integration testing epic (E12) that validates all adapters against staging infrastructure'
      - 'Add integration test gates to each epic that introduces an adapter (E2 owns OpenSearch staging validation, E7 owns email)'
