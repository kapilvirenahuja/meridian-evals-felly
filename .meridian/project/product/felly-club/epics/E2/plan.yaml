    depends_on: ['F2.3']
    scope_items:
      - item: "AvailabilityDisplay component — groups IPublicAvailabilitySlot[] by dayOfWeek (0=Sunday…6=Saturday); formats each slot as 'DayName: HH:MM AM – HH:MM PM'; shows 'Not accepting sessions' when slots array is empty"
        key_files:
          - path: 'packages/mentee-web-app/src/components/marketplace/AvailabilityDisplay.tsx'
            action: 'new'

      - item: "MentorCard — add compact availability indicator: green dot + 'Available' text when mentor.availabilitySlots.length > 0; grey dot + 'Schedule not set' when empty"
        key_files:
          - path: 'packages/mentee-web-app/src/components/marketplace/MentorCard.tsx'
            action: 'modified'

      - item: "MentorFilters — add 'Available only' @radix-ui/react-checkbox section; when checked sets hasAvailability: true in IMarketplaceFilters, when unchecked removes the field"
        key_files:
          - path: 'packages/mentee-web-app/src/components/marketplace/MentorFilters.tsx'
            action: 'modified'

      - item: 'Mentor detail page — render AvailabilityDisplay component in a dedicated availability section below pricing'
        key_files:
          - path: 'packages/mentee-web-app/src/app/(app)/mentors/[id]/page.tsx'
            action: 'modified'

      - item: 'MarketplaceSearchService.indexMentor — ensure hasAvailability boolean field (availabilitySlots.length > 0) is computed and included in every OpenSearch document body before upsert'
        key_files:
          - path: 'packages/backend-api/src/marketplace/marketplace.search.service.ts'
            action: 'modified'

    exit_gate: >
      MentorCard on http://localhost:3001/mentors renders a green 'Available' indicator for a mentor
      that has at least one availabilitySlot configured, and a grey 'Schedule not set' indicator for
      a mentor with zero availability slots.
      http://localhost:3001/mentors/{id} renders an AvailabilityDisplay section showing the mentor's
      weekly schedule grouped by day (e.g., 'Monday: 10:00 AM – 2:00 PM') for a mentor with slots.
      http://localhost:3001/mentors/{id} renders 'Not accepting sessions' in the availability section
      for a mentor with no availability slots configured.
      GET /api/v1/marketplace/mentors?hasAvailability=true returns HTTP 200 with only mentors whose
      availabilitySlots count > 0 — mentors with zero slots are absent from the results.
      GET /api/v1/marketplace/mentors?hasAvailability=true when no mentors have availability slots
      returns HTTP 200 with { mentors: [], total: 0 } (not 404 or 500).
      All unit tests pass: pnpm test --filter @felly/backend-api.
    scenario_gate:
      scenario_ids: ['SC-E2-035', 'SC-E2-036', 'SC-E2-037']
      count: 3

  - order: 6
    feature_id: 'F2.4'
    name: 'Rule-Based Mentor Recommendations'
    description: >
      Delivers the 'Recommended for You' section for authenticated mentees with stated interests.
      RecommendationsService uses Prisma MentorProfile.findMany({ expertiseCategories: { hasSome:
      menteeInterests } }) — NOT OpenSearch — for accurate set-intersection matching (DD-E2-03).
      Results are sorted by overlap count (intersection of mentee interests and mentor expertiseCategories)
      descending, limited to RECOMMENDATIONS_LIMIT=8, and returned as IRecommendationResult[] where
      each item includes the full IPublicMentorProfile and a matchingCategories array (the intersection —
      INV-E2-04: only stated interests, no behavioural tracking). GET /api/v1/marketplace/recommendations
      requires JwtAuthGuard + @Roles(MENTEE). RecommendedMentors component renders on the /mentors
      page client-side only (auth check before display). Completes quality gates: coverage config
      added, all pnpm lint/typecheck/test/build checks pass.
    depends_on: ['F2.6']
    scope_items:
      - item: 'RecommendationsService — getRecommendations(menteeUserId): fetch mentee interests via UserService.findById; if interests empty return []; Prisma hasSome query on expertiseCategories with status=VERIFIED filter; sort by intersection count desc; limit to RECOMMENDATIONS_LIMIT=8; map to IRecommendationResult with matchingCategories = intersection(mentor.expertiseCategories, menteeInterests)'
        key_files:
          - path: 'packages/backend-api/src/marketplace/recommendations.service.ts'
            action: 'new'
          - path: 'packages/backend-api/src/marketplace/dto/recommendation-result.dto.ts'
            action: 'new'

      - item: 'MarketplaceModule — add RecommendationsService to providers'
        key_files:
          - path: 'packages/backend-api/src/marketplace/marketplace.module.ts'
            action: 'modified'

      - item: 'GET /marketplace/recommendations endpoint — @UseGuards(JwtAuthGuard, RolesGuard) @Roles(UserRole.MENTEE) at method level; @CurrentUser() menteePayload; delegates to MarketplaceService.getRecommendations(menteePayload.sub)'
        key_files:
          - path: 'packages/backend-api/src/marketplace/marketplace.controller.ts'
            action: 'modified'
          - path: 'packages/backend-api/src/marketplace/marketplace.service.ts'
            action: 'modified'

      - item: "RecommendedMentors component — renders 'Recommended for You' section heading + up to 8 MentorCards with matchingCategories prop (displayed as 'Matches your interest in Sport, Business' below card); hidden when recommendations.length === 0; useRecommendations TanStack Query hook (GET /api/v1/marketplace/recommendations, enabled: isAuthenticated)"
        key_files:
          - path: 'packages/mentee-web-app/src/components/marketplace/RecommendedMentors.tsx'
            action: 'new'
          - path: 'packages/mentee-web-app/src/hooks/useRecommendations.ts'
            action: 'new'

      - item: 'Mentors page — render RecommendedMentors section above search results, client-side only (auth check prevents SSR of auth-sensitive recommendation data)'
        key_files:
          - path: 'packages/mentee-web-app/src/app/(app)/mentors/page.tsx'
            action: 'modified'

      - item: 'Coverage config — add marketplace/*.ts files to jest.config.ts collectCoverageFrom (exclude *.spec.ts, *.module.ts, *dto.ts)'
        key_files:
          - path: 'packages/backend-api/jest.config.ts'
            action: 'modified'

      - item: 'Unit tests — RecommendationsService (category intersection logic, overlap sort, empty interests returns [], unverified mentor excluded via status=VERIFIED where clause); MarketplaceController recommendations route (401 no JWT, 403 MENTOR role, 200 MENTEE role)'
        key_files:
          - path: 'packages/backend-api/src/marketplace/__tests__/recommendations.service.spec.ts'
            action: 'new'
          - path: 'packages/backend-api/src/marketplace/__tests__/marketplace.controller.spec.ts'
            action: 'modified'

    exit_gate: >
      GET /api/v1/marketplace/recommendations with no Authorization header returns HTTP 401.
      GET /api/v1/marketplace/recommendations with valid MENTOR JWT returns HTTP 403.
      GET /api/v1/marketplace/recommendations with valid MENTEE JWT (mentee has interests
      [SPORT, BUSINESS]) returns HTTP 200 with IRecommendationResult[] where:
        (a) every mentor has status=VERIFIED;
        (b) each result has { mentor: IPublicMentorProfile, matchingCategories: ExpertiseCategory[] };
        (c) matchingCategories contains only the intersection of mentee interests and mentor
            expertiseCategories — not the mentor's full category list (INV-E2-04).
      GET /api/v1/marketplace/recommendations with valid MENTEE JWT where mentee has no interests
      returns HTTP 200 with empty array [].
      Results array length never exceeds 8 items.
      http://localhost:3001/mentors renders 'Recommended for You' section with mentor cards for an
      authenticated mentee who has interests set in their profile.
      http://localhost:3001/mentors shows NO 'Recommended for You' section for an unauthenticated visitor.
      pnpm test --filter @felly/backend-api passes with >= 70% branch coverage and >= 80%
      function/line/statement coverage on marketplace service files.
      pnpm lint passes (no ESLint errors on any new marketplace/*.ts or *.tsx file).
      pnpm typecheck passes (no TypeScript errors across all packages).
      pnpm build passes (Next.js production build + backend-api TypeScript compile succeed).
    scenario_gate:
      scenario_ids: ['SC-E2-024', 'SC-E2-025', 'SC-E2-026', 'SC-E2-027', 'SC-E2-028', 'SC-E2-029']
      count: 6

