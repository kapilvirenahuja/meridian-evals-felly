# ─── Prerequisites (Phase 0) ──────────────────────────────────────────────────

prerequisites:
  name: 'Phase 0 — E2 Infrastructure & Adapter Scaffolding'
  description: >
    Installs new E2 library dependencies (@opensearch-project/opensearch, ioredis for backend;
    @radix-ui/react-tabs, @radix-ui/react-select, @radix-ui/react-checkbox for frontend),
    extends docker-compose.yml with the OpenSearch 2.x service on port 9200, runs the Prisma
    migration that adds session_count and average_rating fields to the mentor_profiles table,
    documents the SEARCH_PROVIDER/OPENSEARCH_URL/OPENSEARCH_INDEX_NAME env vars, scaffolds
    the ISearchAdapter interface with OpenSearchAdapter (SEARCH_PROVIDER=opensearch) and
    PrismaSearchAdapter (SEARCH_PROVIDER=prisma, default) implementations via the
    SEARCH_ADAPTER_TOKEN DI token (mirrors AUTH_ADAPTER_TOKEN pattern from E1), and extends
    shared-types with all E2 marketplace interfaces. No user-facing endpoints — pure
    infrastructure that all E2 execution steps depend on.
  scope_items:
    - item: 'Install new backend-api dependencies: @opensearch-project/opensearch@^2.3.0 and ioredis@^5.3.2'
      key_files:
        - path: 'packages/backend-api/package.json'
          action: 'modified'
        - path: 'pnpm-lock.yaml'
          action: 'modified'

    - item: 'Install new mentee-web-app dependencies: @radix-ui/react-tabs@^1.0.4, @radix-ui/react-select@^2.1.0, @radix-ui/react-checkbox@^1.1.1'
      key_files:
        - path: 'packages/mentee-web-app/package.json'
          action: 'modified'

    - item: 'Add OpenSearch 2.x service block to docker-compose.yml (image: opensearchproject/opensearch:2, port 9200, DISABLE_SECURITY_PLUGIN=true, ES_JAVA_OPTS=-Xms256m -Xmx256m, discovery.type=single-node, healthcheck via curl /_cluster/health)'
      key_files:
        - path: 'docker-compose.yml'
          action: 'modified'

    - item: 'Document E2 environment variables in backend-api .env.local.example: SEARCH_PROVIDER=prisma, OPENSEARCH_URL=http://localhost:9200, OPENSEARCH_INDEX_NAME=mentor_profiles'
      key_files:
        - path: 'packages/backend-api/.env.local.example'
          action: 'modified'

    - item: 'Extend shared-types with E2 marketplace interfaces: IPublicMentorProfile, IPublicPricingTier, IPublicAvailabilitySlot, IMarketplaceFilters, IMentorSearchResponse, IRecommendationResult, IMentorCategoryCount; export MentorSortOrder as string union'
      key_files:
        - path: 'packages/shared-types/src/types/marketplace.types.ts'
          action: 'new'
        - path: 'packages/shared-types/src/index.ts'
          action: 'modified'

    - item: 'Scaffold ISearchAdapter interface and SEARCH_ADAPTER_TOKEN; implement OpenSearchAdapter (uses @opensearch-project/opensearch client, selected when SEARCH_PROVIDER=opensearch) and PrismaSearchAdapter (ILIKE queries, no-op index methods, selected when SEARCH_PROVIDER=prisma — default)'
      key_files:
        - path: 'packages/backend-api/src/marketplace/adapters/search-adapter.interface.ts'
          action: 'new'
        - path: 'packages/backend-api/src/marketplace/adapters/opensearch.adapter.ts'
          action: 'new'
        - path: 'packages/backend-api/src/marketplace/adapters/prisma-search.adapter.ts'
          action: 'new'

    - item: 'Prisma schema migration — add sessionCount Int @default(0) and averageRating Float @default(0) fields to MentorProfile model; run npx prisma migrate dev --name add_marketplace_fields && npx prisma generate'
      key_files:
        - path: 'packages/backend-api/prisma/schema.prisma'
          action: 'modified'
        - path: 'packages/backend-api/prisma/migrations/'
          action: 'new'

  exit_gate: >
    pnpm install succeeds — @opensearch-project/opensearch@^2.3.0 and ioredis@^5.3.2 resolvable
    in packages/backend-api; @radix-ui/react-tabs, @radix-ui/react-select, @radix-ui/react-checkbox
    resolvable in packages/mentee-web-app.
    docker-compose up -d starts opensearch container on port 9200 with healthy status
    (curl http://localhost:9200/_cluster/health returns HTTP 200 with { status: "green" or "yellow" }).
    Prisma migration add_marketplace_fields applies successfully — session_count INTEGER DEFAULT 0
    and average_rating DOUBLE PRECISION DEFAULT 0 columns exist in the mentor_profiles table
    (psql: SELECT column_name FROM information_schema.columns WHERE table_name='mentor_profiles'
    returns session_count and average_rating).
    SEARCH_PROVIDER, OPENSEARCH_URL, OPENSEARCH_INDEX_NAME documented in .env.local.example.
    search-adapter.interface.ts exports ISearchAdapter interface and SEARCH_ADAPTER_TOKEN symbol.
    pnpm typecheck passes on packages/shared-types with new IPublicMentorProfile, IMentorSearchResponse,
    IRecommendationResult, IMentorCategoryCount, IMarketplaceFilters interfaces exported.
    pnpm build succeeds on all packages with no TypeScript errors.

# ─── Execution Order ───────────────────────────────────────────────────────────

execution_order:
  - order: 1
    feature_id: 'F2.2'
    name: 'Category-Based Marketplace Navigation'
    description: >
      Delivers the full MarketplaceModule scaffold (module, controller, service, repository,
      RedisService) and the GET /api/v1/marketplace/categories endpoint returning all
      ExpertiseCategory values with verified-mentor counts. Mentees can navigate the /mentors
      page via expertise category tabs — each tab shows the count of VERIFIED mentors in that
      category, the default 'All' tab shows the aggregate, and empty categories display a
      helpful empty state. Sets the structural foundation that all subsequent E2 features
      extend.
    depends_on: []
    scope_items:
      - item: 'MarketplaceModule scaffold — @Module wiring PrismaModule, AuthModule, UserModule imports; provides MarketplaceController, MarketplaceService, MarketplaceRepository, RedisService; GET /marketplace/categories implemented'
        key_files:
          - path: 'packages/backend-api/src/marketplace/marketplace.module.ts'
            action: 'new'
          - path: 'packages/backend-api/src/marketplace/marketplace.controller.ts'
            action: 'new'
          - path: 'packages/backend-api/src/marketplace/marketplace.service.ts'
            action: 'new'
          - path: 'packages/backend-api/src/marketplace/marketplace.repository.ts'
            action: 'new'
          - path: 'packages/backend-api/src/marketplace/dto/category-count.dto.ts'
            action: 'new'

      - item: 'RedisService — ioredis wrapper with get/set(TTL)/del/delPattern(SCAN-based) methods; graceful degradation when REDIS_URL is unset (cache miss, no errors)'
        key_files:
          - path: 'packages/backend-api/src/marketplace/redis.service.ts'
            action: 'new'

      - item: 'Register MarketplaceModule in AppModule imports array (after AdminModule)'
        key_files:
          - path: 'packages/backend-api/src/app.module.ts'
            action: 'modified'

      - item: "Mentors listing page scaffold at /mentors — SSR server component fetches initial categories; CategoryTabs renders 'All' + one tab per ExpertiseCategory with count badge; EmptyState component for zero-mentor categories"
        key_files:
          - path: 'packages/mentee-web-app/src/app/(app)/mentors/page.tsx'
            action: 'new'
          - path: 'packages/mentee-web-app/src/components/marketplace/CategoryTabs.tsx'
            action: 'new'
          - path: 'packages/mentee-web-app/src/components/marketplace/EmptyState.tsx'
            action: 'new'
          - path: 'packages/mentee-web-app/src/hooks/useCategoryCount.ts'
            action: 'new'

      - item: 'Add /mentors navigation link to AppNav/AppSidebar for authenticated users'
        key_files:
          - path: 'packages/mentee-web-app/src/app/(app)/layout.tsx'
            action: 'modified'

      - item: 'Unit tests for MarketplaceController categories route (guard status, response shape) and RedisService (ioredis mocked: get/set/del/delPattern assertions)'
        key_files:
          - path: 'packages/backend-api/src/marketplace/__tests__/marketplace.controller.spec.ts'
            action: 'new'
          - path: 'packages/backend-api/src/marketplace/__tests__/redis.service.spec.ts'
            action: 'new'

    exit_gate: >
      GET /api/v1/marketplace/categories returns HTTP 200 with JSON array of
      { category: ExpertiseCategory | 'ALL', count: number } covering every ExpertiseCategory
      enum value plus the 'ALL' aggregate.
      Category counts reflect only mentors with status=VERIFIED and verifiedBadge=true —
      draft, pending, rejected, and suspended profiles are excluded from counts.
      /mentors page renders at http://localhost:3001/mentors with 'All' tab selected by default
      and each ExpertiseCategory tab displaying its verified mentor count.
      Clicking a category tab updates the mentor listing to show only that category (client-side
      state update without full page reload).
      Selecting a category with zero verified mentors shows EmptyState component with a message
      prompting the user to explore other categories.
      All unit tests pass: pnpm test --filter @felly/backend-api.
    scenario_gate:
      scenario_ids: ['SC-E2-011', 'SC-E2-012', 'SC-E2-013']
      count: 3

  - order: 2
    feature_id: 'F2.1'
    name: 'Mentor Search & Filtering'
    description: >
      Delivers the core mentor discovery engine via GET /api/v1/marketplace/mentors. Implements
      MarketplaceSearchService with full OpenSearch multi_match BM25 search (SEARCH_PROVIDER=opensearch)
      and PrismaSearchAdapter ILIKE fallback (SEARCH_PROVIDER=prisma, default for local dev without
      Docker). Multi-criteria filters — expertise category, price range (minPriceInCents),
      rating threshold (averageRating), and availability status (hasAvailability) — are applied
      as OpenSearch bool filter clauses with mandatory VERIFIED + verifiedBadge=true enforcement
      on every query (INV-E2-01). Redis caches search results with 5-minute TTL keyed by SHA256
      of query string. Private fields (status, rejectionReason, verificationArtefacts, completeness)
      excluded from all responses via PublicMentorProfileDto @Exclude() (INV-E2-02). AdminService
      and UserService wired for fire-and-forget OpenSearch index sync on mentor approve/reject/update
      (INV-E2-05). MarketplaceSearchService onModuleInit creates index + alias and bulk syncs all
      VERIFIED profiles on first startup.
    depends_on: ['F2.2']
    scope_items:
      - item: 'MarketplaceSearchService — @opensearch-project/opensearch Client (OPENSEARCH_URL env); onModuleInit: create mentor_profiles index + alias if absent, bulk sync if empty; searchMentors (bool query: mandatory VERIFIED filter + optional category/price/rating/availability filters + multi_match on firstName^3/lastName^3/headline^2/bio^1/expertiseCategories^1.5); indexMentor (validates status===VERIFIED before upsert); removeMentorFromIndex (delete with ignore 404); updateMentorInIndex; bulkIndexMentors'
        key_files:
          - path: 'packages/backend-api/src/marketplace/marketplace.search.service.ts'
            action: 'new'

      - item: 'MarketplaceModule — add MarketplaceSearchService to providers and exports; export so AdminModule can inject for async sync'
        key_files:
          - path: 'packages/backend-api/src/marketplace/marketplace.module.ts'
            action: 'modified'

      - item: 'GET /marketplace/mentors endpoint — MentorSearchQueryDto validates q?, category?, priceMin?, priceMax?, rating?, hasAvailability?, returns IMentorSearchResponse'
        key_files:
          - path: 'packages/backend-api/src/marketplace/marketplace.controller.ts'
            action: 'modified'
          - path: 'packages/backend-api/src/marketplace/marketplace.service.ts'
            action: 'modified'
          - path: 'packages/backend-api/src/marketplace/marketplace.repository.ts'
            action: 'modified'
          - path: 'packages/backend-api/src/marketplace/dto/mentor-search-query.dto.ts'
            action: 'new'
          - path: 'packages/backend-api/src/marketplace/dto/public-mentor-profile.dto.ts'
            action: 'new'

      - item: 'Wire MarketplaceModule into AdminModule; AdminService injects MarketplaceSearchService for fire-and-forget async sync: void this.marketplaceSearchService.indexMentor(id).catch(logger.error) on approveMentor(); void this.marketplaceSearchService.removeMentorFromIndex(id).catch(...) on rejectMentor()'
        key_files:
          - path: 'packages/backend-api/src/admin/admin.module.ts'
            action: 'modified'
          - path: 'packages/backend-api/src/admin/admin.service.ts'
            action: 'modified'

      - item: 'UserService injects MarketplaceSearchService (optional, forwardRef if circular); fire-and-forget void this.marketplaceSearchService.updateMentorInIndex(profile.id).catch(...) after updateMentorProfile() success'
        key_files:
          - path: 'packages/backend-api/src/user/user.service.ts'
            action: 'modified'

      - item: "SearchBar (controlled input, submit on Enter/click, clear with × button), MentorFilters (price range min/max inputs, rating @radix-ui/react-select, availability @radix-ui/react-checkbox, 'Clear all' button), MentorCard (photo, name, headline, top-2 category badges, verified badge, min price, availability indicator, rating), useMentors TanStack Query hook (GET /api/v1/marketplace/mentors with serialized IMarketplaceFilters)"
        key_files:
          - path: 'packages/mentee-web-app/src/components/marketplace/SearchBar.tsx'
            action: 'new'
          - path: 'packages/mentee-web-app/src/components/marketplace/MentorFilters.tsx'
            action: 'new'
          - path: 'packages/mentee-web-app/src/components/marketplace/MentorCard.tsx'
            action: 'new'
          - path: 'packages/mentee-web-app/src/hooks/useMentors.ts'
            action: 'new'
          - path: 'packages/mentee-web-app/src/app/(app)/mentors/page.tsx'
            action: 'modified'

      - item: 'Unit tests — MarketplaceService (search routing, Redis cache hit returns cached value, cache miss calls OpenSearch, getMentorById privacy enforcement: status/rejectionReason/verificationArtefacts absent); MarketplaceSearchService (OpenSearch client mocked via jest.fn(): index creation, search query structure, document upsert, bulk sync invocation)'
        key_files:
          - path: 'packages/backend-api/src/marketplace/__tests__/marketplace.service.spec.ts'
            action: 'new'
          - path: 'packages/backend-api/src/marketplace/__tests__/marketplace.search.service.spec.ts'
            action: 'new'

    exit_gate: >
      GET /api/v1/marketplace/mentors with no params returns HTTP 200 with all VERIFIED mentors;
      response shape includes { mentors: IPublicMentorProfile[], total: number }.
      GET /api/v1/marketplace/mentors?q=sport returns HTTP 200 with only VERIFIED mentors whose
      name, bio, headline, or expertiseCategories match 'sport'.
      GET /api/v1/marketplace/mentors?category=SPORT returns only mentors with SPORT in
      expertiseCategories.
      GET /api/v1/marketplace/mentors?priceMin=50&priceMax=100 returns mentors with at least
      one pricing tier between $50–$100 per session.
      GET /api/v1/marketplace/mentors?rating=4 returns mentors with averageRating >= 4.0.
      GET /api/v1/marketplace/mentors?category=SPORT&priceMin=50&rating=4 returns mentors
      matching ALL three criteria simultaneously (AND logic).
      A mentor with status=PENDING_VERIFICATION or status=REJECTED never appears in results.
      Response JSON objects for mentors NEVER contain fields: status, rejectionReason,
      verificationArtefacts, completeness, or passwordHash.
      SearchBar, MentorFilters panel, and MentorCard grid render on http://localhost:3001/mentors.
      All unit tests pass: pnpm test --filter @felly/backend-api.
    scenario_gate:
      scenario_ids:
        [
          'SC-E2-001',
          'SC-E2-002',
          'SC-E2-003',
          'SC-E2-004',
          'SC-E2-005',
          'SC-E2-006',
          'SC-E2-007',
          'SC-E2-008',
          'SC-E2-009',
          'SC-E2-010',
          'SC-E2-038',
        ]
      count: 11

  - order: 3
    feature_id: 'F2.5'
    name: 'Search Result Pagination & Sorting'
    description: >
      Extends GET /api/v1/marketplace/mentors with page (default 1, min 1), limit (default 12,
      min 1, max 50), and sort (relevance | price_asc | price_desc | rating_desc) query parameters.
      OpenSearch query maps sort enum to sort clause (relevance→_score desc, price_asc→minPriceInCents asc,
      price_desc→minPriceInCents desc, rating_desc→averageRating desc) and applies from=(page-1)*limit,
      size=limit pagination. Response includes total, page, totalPages, and limit fields.
      PaginationControls and SortControl components rendered on the /mentors listing page; changing
      sort or any filter resets pagination to page 1 via parent state coordination.
    depends_on: ['F2.1']
    scope_items:
      - item: 'MentorSearchQueryDto — add @IsEnum(MentorSortOrder) @IsOptional sort field, @IsInt @Min(1) @IsOptional page field (default 1), @IsInt @Min(1) @Max(50) @IsOptional limit field (default 12)'
        key_files:
          - path: 'packages/backend-api/src/marketplace/dto/mentor-search-query.dto.ts'
            action: 'modified'

      - item: 'MarketplaceSearchService.searchMentors — map MentorSortOrder enum to OpenSearch sort array; apply from=(page-1)*limit and size=limit to every search query; include total hits in IMentorSearchResponse'
        key_files:
          - path: 'packages/backend-api/src/marketplace/marketplace.search.service.ts'
            action: 'modified'

      - item: 'MarketplaceService.searchMentors — thread page/limit/sort through to MarketplaceSearchService; populate totalPages=Math.ceil(total/limit) in returned IMentorSearchResponse'
        key_files:
          - path: 'packages/backend-api/src/marketplace/marketplace.service.ts'
            action: 'modified'

      - item: "PaginationControls — 'Showing X–Y of Z mentors' label; prev/next buttons (disabled on first/last page); up to 5 page number buttons; onPageChange callback; SortControl — @radix-ui/react-select with options: Relevance, Price Low–High, Price High–Low, Highest Rated; onSortChange callback"
        key_files:
          - path: 'packages/mentee-web-app/src/components/marketplace/PaginationControls.tsx'
            action: 'new'
          - path: 'packages/mentee-web-app/src/components/marketplace/SortControl.tsx'
            action: 'new'

      - item: 'Mentors page — wire PaginationControls and SortControl; on sort or filter change reset page state to 1'
        key_files:
          - path: 'packages/mentee-web-app/src/app/(app)/mentors/page.tsx'
            action: 'modified'

    exit_gate: >
      GET /api/v1/marketplace/mentors?page=1&limit=2 returns HTTP 200 with at most 2 mentors
      and response fields: { mentors, total, page: 1, limit: 2, totalPages }.
      GET /api/v1/marketplace/mentors?page=2&limit=2 returns the NEXT 2 mentors — no mentor ID
      from page=1 appears in page=2 results.
      GET /api/v1/marketplace/mentors?sort=price_asc returns mentors ordered by minPriceInCents
      ascending (first result has lowest minimum price).
      GET /api/v1/marketplace/mentors?sort=rating_desc returns mentors ordered by averageRating
      descending (first result has highest average rating).
      GET /api/v1/marketplace/mentors?sort=price_desc returns mentors ordered by minPriceInCents
      descending.
      /mentors page renders PaginationControls showing 'Showing X–Y of Z mentors' and SortControl
      dropdown with 4 options at http://localhost:3001/mentors.
      Selecting a sort option or applying a filter while on page 2 resets page state to 1 (confirmed
      by page indicator showing 'page 1').
      All unit tests pass: pnpm test --filter @felly/backend-api.
    scenario_gate:
      scenario_ids: ['SC-E2-030', 'SC-E2-031', 'SC-E2-032', 'SC-E2-033', 'SC-E2-034']
      count: 5

  - order: 4
    feature_id: 'F2.3'
    name: 'Mentor Public Profile Page'
    description: >
      Delivers the mentor public profile page at /mentors/[id] (SSR, SEO-indexable) and the
      GET /api/v1/marketplace/mentors/:id endpoint. Profile fetched from Prisma — not OpenSearch —
      to serve authoritative full data including pricingTiers and availabilitySlots relational records
      (DD-E2-06). Returns HTTP 404 for non-existent or non-VERIFIED mentor IDs (INV-E2-01 at detail
      layer). Profile page renders mentor photo, name, headline, bio, expertiseCategories, yearsOfExperience,
      verified badge, LinkedIn link, all active pricingTiers (duration + price), sessionCount ('New mentor'
      placeholder if zero), averageRating ('No ratings yet' if zero until E5), and 'Coming Soon' CTA
