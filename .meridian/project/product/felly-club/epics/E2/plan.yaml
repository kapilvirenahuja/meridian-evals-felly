    name: 'Mentor Availability Display'
    description: >
      Surfaces mentor availability in two contexts and adds an availability filter.
      MentorCard in the listing grid gains a compact availability indicator: green dot 'Available'
      for mentors with at least one availabilitySlot, grey 'Schedule not set' for mentors with none.
