# ─── Scenarios ─────────────────────────────────────────────────────────────────

scenarios:
  # ── F2.1: Mentor Search & Filtering ────────────────────────────────────────

  - id: 'SC-E2-001'
    feature_ref: 'F2.1'
    behavior_ref: 'B2.1.1'
    description: 'Free-text search returns verified mentors matching name, bio, headline, or expertise tags'
    expected_behavior: >
      A mentee enters a search term that matches a verified mentor's name.
      The system returns that mentor in the results. The mentee then searches
      for a keyword present only in another mentor's bio. That mentor also
      appears in results. All returned mentors have admin-verified status.
    pass_criteria:
      - 'Search by mentor name returns the matching verified mentor'
      - 'Search by bio keyword returns mentors whose bio contains the keyword'
      - 'Search by headline term returns mentors with matching headlines'
      - 'Search by expertise tag returns mentors tagged with that expertise'
      - 'No unverified, rejected, suspended, or draft mentor profiles appear in results'
      - 'Results are ranked by relevance to the search query'
    automation: 'automated'

  - id: 'SC-E2-002'
    feature_ref: 'F2.1'
    behavior_ref: 'B2.1.1'
    description: 'Empty search query returns all verified mentors as an unfiltered listing'
    expected_behavior: >
      A mentee submits a search with an empty query string. The system
      returns all verified mentors in the marketplace without any search
      filtering applied.
    pass_criteria:
      - 'Empty query returns the complete set of verified mentors'
      - 'Result count matches the total number of verified mentors in the system'
      - 'No unverified mentors appear in the unfiltered listing'
    automation: 'automated'

  - id: 'SC-E2-003'
    feature_ref: 'F2.1'
    behavior_ref: 'B2.1.1'
    description: 'Search query with no matches returns an empty state with helpful message'
    expected_behavior: >
      A mentee searches for a term that matches no verified mentor data.
      The system returns zero results with an informative empty state
      message suggesting alternative actions (e.g., broaden search terms,
      browse categories).
    pass_criteria:
      - 'Zero results are returned for a non-matching query'
      - 'An empty state message is displayed that is user-friendly and non-technical'
      - 'The mentee is offered alternative navigation paths (browse categories, clear search)'
    automation: 'hybrid'
    manual_element: 'Verify the empty state message is helpful, non-technical, and offers clear alternative navigation paths'

  - id: 'SC-E2-004'
    feature_ref: 'F2.1'
    behavior_ref: 'B2.1.2'
    description: 'Category filter shows all platform-defined categories and filters results correctly'
    expected_behavior: >
      A mentee opens the filter panel and sees all platform-defined
      expertise categories listed. The mentee selects 'Sport' — only
      mentors with Sport expertise appear. The mentee additionally selects
      'Business' — mentors with Sport OR Business expertise appear. Deselecting
      both categories returns the unfiltered listing.
    pass_criteria:
      - 'All platform-defined expertise categories are visible in the filter panel'
      - 'Selecting one category returns only mentors with that expertise'
      - 'Selecting multiple categories applies OR logic — mentors matching any selected category appear'
      - 'Results update immediately upon category selection without full page reload'
      - 'Deselecting all categories removes the filter and shows all verified mentors'
    automation: 'automated'

  - id: 'SC-E2-005'
    feature_ref: 'F2.1'
    behavior_ref: 'B2.1.3'
    description: 'Price range filter returns mentors with at least one pricing tier in the specified range'
    expected_behavior: >
      A mentee sets a minimum price of $50 and a maximum of $100 in the
      price range filter. Only mentors who have at least one pricing tier
      within that range appear. A mentor with a $40 tier and a $75 tier
      appears (the $75 tier is within range). A mentor with only a $120
      tier does not appear.
    pass_criteria:
      - 'Setting both min and max price returns only mentors with a tier in that range'
      - 'Setting only a minimum price returns mentors with at least one tier at or above that price'
      - 'Setting only a maximum price returns mentors with at least one tier at or below that price'
      - 'Mentors with multiple pricing tiers are included if any tier falls within range'
      - 'Price values display with appropriate currency indication'
    automation: 'automated'

  - id: 'SC-E2-006'
    feature_ref: 'F2.1'
    behavior_ref: 'B2.1.3'
    description: 'Impossibly narrow price range returns empty state with helpful message'
    expected_behavior: >
      A mentee sets a minimum price higher than the maximum price, or sets
      a range so narrow that no mentors match. The system returns zero
      results with a helpful message suggesting the mentee broaden the
      price range.
    pass_criteria:
      - 'Zero results are returned for a range matching no mentors'
      - 'A clear message suggests broadening the price range'
      - 'The filter controls remain functional for adjustment'
    automation: 'hybrid'
    manual_element: 'Verify the empty state message is helpful and suggests broadening the price range'

  - id: 'SC-E2-007'
    feature_ref: 'F2.1'
    behavior_ref: 'B2.1.4'
    description: 'Rating filter returns only mentors meeting the minimum rating threshold'
    expected_behavior: >
      A mentee sets the rating filter to '4 stars and above'. Only
      mentors whose average session rating is 4.0 or higher appear.
      Mentors with no ratings are excluded.
    pass_criteria:
      - 'Only mentors with average rating at or above the threshold appear'
      - 'Mentors with no ratings are excluded when a rating filter is applied'
      - 'The rating threshold can be selected across the 1–5 star range'
      - 'Average rating is based on all completed session ratings for the mentor'
    automation: 'automated'

  - id: 'SC-E2-008'
    feature_ref: 'F2.1'
    behavior_ref: 'B2.1.4'
    description: 'Rating filter gracefully handles pre-E5 state where no ratings exist'
    expected_behavior: >
      Before the ratings feature (E5) ships, a mentee applies a rating
      filter. Since no mentors have ratings yet, the filter returns zero
      results. The system displays a meaningful message indicating that
      ratings are not yet available.
    pass_criteria:
      - 'Rating filter is present but returns no results when no mentors have ratings'
      - 'An appropriate message explains that ratings are not yet available'
      - 'Removing the rating filter restores the full listing'
    automation: 'automated'

  - id: 'SC-E2-009'
    feature_ref: 'F2.1'
    behavior_ref: 'B2.1.5'
    description: 'Multiple filters combine with AND logic across filter types'
    expected_behavior: >
      A mentee applies category filter 'Sport', price range '$50–$100',
      and rating '4+ stars' simultaneously. Only verified mentors matching
      ALL three criteria appear. The mentee then removes the price filter
      — results update to show Sport mentors with 4+ stars at any price.
    pass_criteria:
      - 'Results match ALL active filters simultaneously (AND across filter types)'
      - 'All active filters are displayed to the mentee with clear labels'
      - 'Removing one filter updates results without affecting other active filters'
      - 'Total count of matching mentors is displayed with the results'
    automation: 'automated'

  - id: 'SC-E2-010'
    feature_ref: 'F2.1'
    behavior_ref: 'B2.1.5'
    description: 'Clear all filters resets to default unfiltered state'
    expected_behavior: >
      A mentee has multiple active filters applied. The mentee clicks
      'Clear all filters'. All filters are reset and the full verified
      mentor listing is displayed.
    pass_criteria:
      - "'Clear all filters' action is available when any filter is active"
      - 'All filters are removed simultaneously upon clear action'
      - 'The listing returns to the complete verified mentor set'
      - 'Filter controls reset to their default (empty/unselected) state'
    automation: 'automated'

  # ── F2.2: Category-Based Marketplace Navigation ────────────────────────────

  - id: 'SC-E2-011'
    feature_ref: 'F2.2'
    behavior_ref: 'B2.2.1'
    description: 'Marketplace displays category tabs with accurate mentor counts'
    expected_behavior: >
      A mentee navigates to the marketplace page. Category tabs are
      displayed for all platform-defined expertise categories, each
      showing the count of verified mentors in that category. An 'All'
      tab is present and selected by default, showing the total verified
      mentor count.
    pass_criteria:
      - 'All platform-defined expertise categories appear as navigable tabs'
      - 'Each tab shows the correct count of verified mentors for that category'
      - "The 'All' tab is present and selected by default"
      - 'Category counts reflect only verified mentors — no draft, pending, rejected, or suspended profiles are counted'
      - 'Category counts are consistent with the actual mentor listing when that tab is selected'
    automation: 'automated'

  - id: 'SC-E2-012'
    feature_ref: 'F2.2'
    behavior_ref: 'B2.2.2'
    description: 'Selecting a category tab filters the mentor listing to that category'
    expected_behavior: >
      A mentee clicks the 'Sport' category tab. The listing updates to
      show only mentors with Sport expertise. The 'Sport' tab is visually
      highlighted. Clicking 'All' returns the full listing. Category
      selection is combinable with search and other filters.
    pass_criteria:
      - 'Clicking a category tab filters the listing to mentors in that category'
      - 'The listing updates without a full page reload'
      - 'The selected tab is visually distinguished from unselected tabs'
      - "Clicking 'All' restores the full verified mentor listing"
      - 'Category tab selection works in combination with search queries and other filters'
    automation: 'automated'

  - id: 'SC-E2-013'
    feature_ref: 'F2.2'
    behavior_ref: 'B2.2.3'
    description: 'Empty category displays an informative empty state'
    expected_behavior: >
      A mentee clicks a category tab that has zero verified mentors. The
      system displays an empty state message explaining no mentors are
      available in this category. The message suggests exploring other
      categories. The tab count shows '0'.
    pass_criteria:
      - 'Empty state message is displayed for categories with no verified mentors'
      - 'The message is informative, non-technical, and user-friendly'
      - 'Navigation prompts encourage exploring other populated categories'
      - "The category tab count shows '0' for the empty category"
    automation: 'hybrid'
    manual_element: 'Verify the empty state message tone is encouraging and the suggested alternatives are helpful'

  # ── F2.3: Mentor Public Profile Page ───────────────────────────────────────

  - id: 'SC-E2-014'
    feature_ref: 'F2.3'
    behavior_ref: 'B2.3.1'
    description: 'Profile page displays all public mentor information with correct formatting'
    expected_behavior: >
      A mentee clicks on a mentor card in the listing. The profile page
      loads and displays: full bio, headline, expertise categories, years
      of experience, verified badge, and LinkedIn profile link (if
      provided). No private data (verification artefacts, admin notes,
      financial data) is visible.
    pass_criteria:
      - 'Full bio is displayed with appropriate formatting'
      - 'Headline is displayed prominently'
      - 'Expertise categories are listed'
      - 'Years of experience is shown'
      - 'Verified badge is prominently displayed'
      - 'LinkedIn link opens in a new browser tab when clicked'
      - 'Missing optional fields (e.g., no headline) are handled gracefully with no blank sections or broken layout'
      - 'No private data (verification artefacts, admin notes, financial data) is visible anywhere on the page'
    automation: 'hybrid'
    manual_element: 'Verify visual layout quality, formatting of bio text, and graceful handling of missing optional fields'

  - id: 'SC-E2-015'
    feature_ref: 'F2.3'
    behavior_ref: 'B2.3.2'
    description: 'Profile page displays pricing tiers for all offered session durations'
    expected_behavior: >
      A mentee views a mentor's profile page. The pricing section shows
      all session durations offered by the mentor with their corresponding
      prices and currency symbols (e.g., '30 min — $50', '60 min — $90').
    pass_criteria:
      - 'All pricing tiers defined by the mentor are displayed'
      - 'Each tier shows duration and price with currency symbol'
      - 'Pricing is clearly formatted and easy to compare across durations'
    automation: 'automated'

  - id: 'SC-E2-016'
    feature_ref: 'F2.3'
    behavior_ref: 'B2.3.2'
    description: 'Profile page handles mentor with no pricing tiers configured'
    expected_behavior: >
      A mentee views the profile page of a mentor who has not configured
      any pricing tiers. Instead of blank space or errors, the page
      displays a message indicating pricing is not yet available.
    pass_criteria:
      - 'A clear message indicates pricing is not yet available'
      - 'No broken layout, empty sections, or error states are shown'
      - 'The rest of the profile page remains fully functional'
    automation: 'automated'

  - id: 'SC-E2-017'
    feature_ref: 'F2.3'
    behavior_ref: 'B2.3.3'
    description: 'Profile page displays session count and average rating for active mentors'
    expected_behavior: >
      A mentee views a mentor's profile page. The session statistics
      section shows the total completed session count and average rating
      (as star display with numeric value and review count).
    pass_criteria:
      - 'Completed session count reflects actual sessions delivered through the platform'
      - 'Average rating is displayed as stars with numeric value and review count'
      - "Statistics are accurate and match the mentor's actual session history"
    automation: 'automated'

  - id: 'SC-E2-018'
    feature_ref: 'F2.3'
    behavior_ref: 'B2.3.3'
    description: 'Profile page shows appropriate indicator for new mentors with no sessions'
    expected_behavior: >
      A mentee views the profile page of a mentor with zero completed
      sessions. Instead of '0 sessions' or blank space, the page shows
      a 'New mentor' or equivalent indicator. The pre-E5 state where no
      ratings exist is handled gracefully with a 'No ratings yet' display.
    pass_criteria:
      - "Mentors with no sessions show a 'New mentor' or equivalent indicator"
      - "No '0 sessions' or empty space is displayed"
      - "Pre-E5 state shows 'No ratings yet' instead of an empty or broken rating display"
      - 'The profile page remains visually complete and professional'
    automation: 'hybrid'
    manual_element: "Verify the 'New mentor' indicator and 'No ratings yet' display are visually appropriate and professional"

  - id: 'SC-E2-019'
    feature_ref: 'F2.3'
    behavior_ref: 'B2.3.4'
    description: "Profile page displays mentor's weekly availability schedule"
    expected_behavior: >
      A mentee views a mentor's profile page. The availability section
      shows the mentor's weekly recurring schedule with available days
      and time ranges (e.g., 'Monday: 10:00 AM – 2:00 PM'). Days with
      no availability are shown as 'Not available' or omitted.
    pass_criteria:
      - 'All days with configured availability show day and time range'
      - "Days with no availability are handled clearly (shown as 'Not available' or omitted)"
      - 'Schedule is presented in a clear, scannable format'
      - 'Availability data matches what the mentor configured in their profile'
    automation: 'hybrid'
    manual_element: 'Verify the schedule layout is scannable and time ranges are clearly formatted'

  - id: 'SC-E2-020'
    feature_ref: 'F2.3'
    behavior_ref: 'B2.3.4'
    description: 'Profile page handles mentor with no availability configured'
    expected_behavior: >
      A mentee views the profile page of a mentor who has not set up any
      availability slots. The page displays a message indicating the
      mentor is not currently accepting sessions.
    pass_criteria:
      - 'A clear message indicates the mentor is not currently accepting sessions'
      - 'No broken layout or empty calendar sections are shown'
      - 'The rest of the profile page remains fully functional'
    automation: 'automated'

  - id: 'SC-E2-021'
    feature_ref: 'F2.3'
    behavior_ref: 'B2.3.5'
    description: 'Profile page displays session request call-to-action with correct state'
    expected_behavior: >
      A mentee views a verified mentor's profile page. A prominent
      'Request Session' button is displayed. Before E3 ships, the
      button shows a 'Coming soon' or equivalent placeholder state.
      For unauthenticated visitors, the call-to-action prompts login
      or registration.
    pass_criteria:
      - 'Call-to-action button is visually prominent and positioned above the fold'
      - "Before E3, button shows a placeholder state (e.g., 'Coming soon') rather than a broken link"
      - 'Unauthenticated visitors see a prompt to login or register instead of the session request button'
    automation: 'hybrid'
    manual_element: "Verify the call-to-action button is visually prominent, positioned above the fold, and the 'Coming soon' state is clear"

  - id: 'SC-E2-022'
    feature_ref: 'F2.3'
    behavior_ref: 'B2.3.6'
    description: 'Mentor profile pages are discoverable by external search engines'
    expected_behavior: >
      Each mentor's public profile page is accessible via a stable,
      shareable URL with descriptive page titles and metadata including
      the mentor's name and expertise. Page content renders meaningfully
      for search engine crawlers.
    pass_criteria:
      - 'Profile page has a descriptive page title including mentor name and expertise'
      - 'Profile page is accessible via a stable, shareable URL'
      - 'Page content is rendered server-side or pre-rendered so crawlers can index it'
      - 'URL structure is clean and human-readable'
    automation: 'hybrid'
    manual_element: 'Verify the page title and URL are descriptive and human-readable; confirm content is crawlable'

  - id: 'SC-E2-023'
    feature_ref: 'F2.3'
    behavior_ref: 'B2.3.1'
    description: 'Unverified or rejected mentor profile pages are not accessible'
    expected_behavior: >
      A user attempts to navigate to a profile page URL for a mentor
      who is not admin-verified (draft, pending, rejected, or suspended
      status). The system does not display the profile page and returns
      an appropriate response (e.g., 404 or redirect to marketplace).
    pass_criteria:
      - "Direct URL access to an unverified mentor's profile returns 404 or redirects"
      - 'No profile data for non-verified mentors is exposed through any URL pattern'
      - 'The marketplace listing does not link to non-verified mentor profiles'
    automation: 'automated'

  # ── F2.4: Rule-Based Mentor Recommendations ───────────────────────────────

  - id: 'SC-E2-024'
    feature_ref: 'F2.4'
    behavior_ref: 'B2.4.1'
    description: 'Authenticated mentees with interests see personalised recommendations sorted by category overlap'
    expected_behavior: >
      An authenticated mentee with interests in 'Sport' and 'Business'
      navigates to the marketplace. A 'Recommended for You' section shows
      verified mentors matching those interests. A mentor tagged with both
      'Sport' and 'Business' appears before a mentor tagged with only
      'Sport'. The section shows a bounded number of mentors.
    pass_criteria:
      - "'Recommended for You' section is visible on the marketplace page"
      - "Recommended mentors match at least one of the mentee's stated interests"
      - 'All recommended mentors are admin-verified'
      - 'Mentors are sorted by degree of category overlap (most overlap first)'
      - 'The section displays a bounded number of mentors (e.g., 6–10)'
    automation: 'automated'

  - id: 'SC-E2-025'
    feature_ref: 'F2.4'
    behavior_ref: 'B2.4.2'
    description: 'Each recommended mentor card explains why the mentor was suggested'
    expected_behavior: >
      In the 'Recommended for You' section, each mentor card displays a
      brief explanation of the match (e.g., 'Matches your interest in
      Sport' or 'Matches your interests in Sport, Business'). The
      explanation references the mentee's stated interests, not any
      behavioural tracking.
    pass_criteria:
      - 'Each recommendation card shows the matching interest categories'
      - "The explanation references the mentee's stated interests explicitly"
      - 'No reference to browsing history, tracking, or implicit behaviour appears in the explanation'
      - 'The explanation is concise and fits within the card layout'
    automation: 'hybrid'
    manual_element: 'Verify the recommendation explanation text is concise, correctly references interests, and fits the card layout'

  - id: 'SC-E2-026'
    feature_ref: 'F2.4'
    behavior_ref: 'B2.4.3'
    description: 'Recommendations update when mentee changes their interests'
    expected_behavior: >
      A mentee with interest in 'Sport' sees Sport-related recommendations.
      The mentee updates their profile to add 'Entertainment' and removes
      'Sport'. On the next marketplace visit, recommendations show
      Entertainment mentors. Mentors previously recommended for Sport are
      no longer shown (unless they also have Entertainment expertise).
    pass_criteria:
      - "Recommendations reflect the mentee's current interests, not stale data"
      - 'Adding a new interest surfaces mentors from the newly added category'
      - 'Removing an interest removes mentors who were only matched on that interest'
    automation: 'automated'

  - id: 'SC-E2-027'
    feature_ref: 'F2.4'
    behavior_ref: 'B2.4.3'
    description: 'Removing all interests removes the recommendations section entirely'
    expected_behavior: >
      A mentee removes all stated interests from their profile and
      navigates to the marketplace page. The 'Recommended for You'
      section is not displayed. The standard marketplace listing
      (search, filter, browse) remains fully functional.
    pass_criteria:
      - "'Recommended for You' section is not displayed when the mentee has no interests"
      - 'The marketplace remains fully functional (search, filter, browse all work)'
      - 'No error or empty recommendation section is shown'
    automation: 'automated'

  - id: 'SC-E2-028'
    feature_ref: 'F2.4'
    behavior_ref: 'B2.4.4'
    description: 'Unauthenticated visitors see no recommendations section'
    expected_behavior: >
      An unauthenticated visitor navigates to the marketplace page. No
      'Recommended for You' section is displayed. The visitor sees only
      the standard marketplace listing with category navigation and search.
    pass_criteria:
      - "No 'Recommended for You' section is visible to unauthenticated visitors"
      - 'The marketplace is fully functional without recommendations'
      - 'No login prompt appears in place of the recommendation section'
    automation: 'automated'

  - id: 'SC-E2-029'
    feature_ref: 'F2.4'
    behavior_ref: 'B2.4.4'
    description: 'Authenticated mentees with no interests see no recommendations section'
    expected_behavior: >
      An authenticated mentee who has never set any interests navigates
      to the marketplace page. No 'Recommended for You' section is
      displayed. The mentee sees the standard marketplace listing.
    pass_criteria:
      - "No 'Recommended for You' section is visible when the mentee has an empty interests list"
      - 'The marketplace remains fully functional'
      - 'No broken or empty recommendation section is rendered'
    automation: 'automated'

  # ── F2.5: Search Result Pagination & Sorting ───────────────────────────────

  - id: 'SC-E2-030'
    feature_ref: 'F2.5'
    behavior_ref: 'B2.5.1'
    description: 'Search results are paginated with navigation controls and result count'
    expected_behavior: >
      A mentee searches for a term or browses a category with more mentors
      than the page size. The first page of results is displayed with
      navigation controls (next, previous, page numbers). The total
      matching mentor count and current page position are shown
      (e.g., 'Showing 1–12 of 47 mentors').
    pass_criteria:
      - 'Results are split into pages with a reasonable page size (e.g., 12 or 20)'
      - 'Navigation controls (next, previous, page numbers) are displayed below results'
      - 'Current page number and total pages are visible'
      - 'Total matching mentor count is displayed'
      - 'Navigating to page 2 shows different mentors than page 1'
    automation: 'automated'

  - id: 'SC-E2-031'
    feature_ref: 'F2.5'
    behavior_ref: 'B2.5.1'
    description: 'Pagination handles results that fit on a single page'
    expected_behavior: >
      A mentee searches for a term that returns fewer mentors than the
      page size. All results are displayed on a single page. No pagination
      controls are shown (or they are disabled), since there is only one
      page.
    pass_criteria:
      - 'All results are displayed on a single page when total count is below page size'
      - 'Pagination controls are either hidden or appropriately disabled'
      - 'Total count accurately reflects the number of results shown'
    automation: 'automated'

  - id: 'SC-E2-032'
    feature_ref: 'F2.5'
    behavior_ref: 'B2.5.2'
    description: 'Mentees can sort results by relevance, price, or rating'
    expected_behavior: >
      A mentee performs a search and sees results sorted by relevance
      (default). The mentee selects 'Price: Low to High' — results
      reorder by ascending price using each mentor's lowest pricing tier.
      The mentee selects 'Rating: Highest First' — results reorder by
      descending average rating. The active sort option is visually
      indicated.
    pass_criteria:
      - 'Relevance is the default sort when a search query is active'
      - 'Price (Low–High) sorts mentors by their lowest pricing tier in ascending order'
      - 'Price (High–Low) sorts mentors by their lowest pricing tier in descending order'
      - 'Rating (Highest First) sorts by descending average rating'
      - 'The active sort option is visually indicated in the sort control'
      - 'Changing sort order resets pagination to page 1'
    automation: 'automated'

  - id: 'SC-E2-033'
    feature_ref: 'F2.5'
    behavior_ref: 'B2.5.2'
    description: 'Default sort for category browsing without search query uses a sensible fallback'
    expected_behavior: >
      A mentee browses a category without entering a search query.
      Since relevance sort is only meaningful with a search query, the
      results are ordered by a sensible default (e.g., by rating or
      recency). The sort control reflects the active default sort.
    pass_criteria:
      - 'Category browsing without search does not default to relevance sort'
      - 'A sensible default sort order is applied (e.g., rating or recency)'
      - 'The sort control accurately reflects the active sort order'
      - 'Mentee can change the sort to any other available option'
    automation: 'hybrid'
    manual_element: 'Verify the default sort for non-search browsing is sensible and produces a reasonable mentor ordering'

  - id: 'SC-E2-034'
    feature_ref: 'F2.5'
    behavior_ref: 'B2.5.3'
    description: 'Pagination resets to page 1 when filters or search query change'
    expected_behavior: >
      A mentee is viewing page 3 of results. The mentee applies a new
      category filter. Pagination resets to page 1 with updated results.
      The total result count updates to reflect the filtered set. The
      mentee then changes the search query — pagination again resets to
      page 1.
    pass_criteria:
      - 'Applying a new filter resets pagination to page 1'
      - 'Removing a filter resets pagination to page 1 with updated results'
      - 'Changing the search query resets pagination to page 1'
      - 'Total result count accurately reflects the current filter and search state'
      - 'Empty pages are not accessible — controls adjust to actual result count'
    automation: 'automated'

  # ── F2.6: Mentor Availability Display ──────────────────────────────────────

  - id: 'SC-E2-035'
    feature_ref: 'F2.6'
    behavior_ref: 'B2.6.1'
    description: 'Mentor cards show availability indicator reflecting configured availability'
    expected_behavior: >
      A mentee views the marketplace listing. Mentor cards for mentors with
      at least one availability slot show an 'Available' indicator (e.g.,
      green dot or label). Mentor cards for mentors with no availability
      configured show 'Schedule not set'. The indicator does not show
      specific times.
    pass_criteria:
      - 'Every mentor card in the listing displays an availability indicator'
      - "Mentors with availability slots show an 'Available' or equivalent positive indicator"
      - "Mentors without availability show a 'Schedule not set' or equivalent neutral indicator"
      - 'No specific times or schedule details are shown on the card — indicator is summary only'
      - "Indicator state is consistent with the mentor's actual availability configuration"
    automation: 'automated'

  - id: 'SC-E2-036'
    feature_ref: 'F2.6'
    behavior_ref: 'B2.6.2'
    description: 'Mentor profile page displays detailed weekly availability schedule'
    expected_behavior: >
      A mentee views a mentor's profile page. The availability section
      shows the mentor's weekly schedule with available days and time
      ranges. Each configured slot shows day and time range (e.g.,
      'Monday: 10:00 AM – 2:00 PM'). Days with no availability are
      shown as 'Not available' or omitted.
    pass_criteria:
      - 'All days with configured availability show day and time range'
      - 'Time ranges are clearly formatted and easy to read'
      - 'Days with no availability are handled clearly'
      - 'Availability data matches what the mentor configured in their profile'
    automation: 'hybrid'
    manual_element: 'Verify the weekly schedule layout is visually clear, scannable, and time ranges are well-formatted'

  - id: 'SC-E2-037'
    feature_ref: 'F2.6'
    behavior_ref: 'B2.6.3'
    description: 'Availability filter narrows results to mentors with configured availability'
    expected_behavior: >
      A mentee applies the 'Available mentors only' filter in the search
      and filter panel. Only mentors with at least one availability slot
      configured appear. Mentors without availability are excluded. The
      filter combines correctly with other active filters.
    pass_criteria:
      - 'Availability filter option is present in the filter panel'
      - 'Applying the filter excludes mentors with no availability configured'
      - 'Availability filter combines correctly with category, price, rating, and search filters'
      - 'Removing the availability filter restores mentors without availability to the listing'
    automation: 'automated'

  # ── Cross-Feature Invariant Scenarios ──────────────────────────────────────

  - id: 'SC-E2-038'
    feature_ref: 'F2.1'
    behavior_ref: 'B2.1.1'
    description: 'INV-E2-01: Unverified mentors never appear in any marketplace surface'
    expected_behavior: >
      The marketplace contains mentors in various verification states
      (verified, draft, pending, rejected, suspended). All marketplace
      surfaces — search results, category listings, recommendations, and
      profile page access — show exclusively verified mentors.
    pass_criteria:
      - 'Search results include only admin-verified mentors'
      - 'Category listings include only admin-verified mentors'
      - 'Recommendations include only admin-verified mentors'
      - 'Direct URL access to non-verified mentor profiles is blocked'
      - 'Mentor counts in category tabs count only verified mentors'
    automation: 'automated'

  - id: 'SC-E2-039'
    feature_ref: 'F2.3'
    behavior_ref: 'B2.3.1'
    description: 'INV-E2-02: No private data is exposed across any marketplace surface'
    expected_behavior: >
      A mentee uses search, browses categories, views mentor cards, and
      opens mentor profile pages. At no point are verification artefact
      files, admin-only notes, mentor financial data, raw contact details
      (phone, private email), or internal platform identifiers exposed.
    pass_criteria:
      - 'No verification artefact files are visible in any response or page'
      - 'No admin-only notes appear anywhere in the marketplace'
      - 'No financial data (earnings, payouts) is exposed'
      - 'No raw contact details (phone, private email) appear'
      - 'No internal platform identifiers are visible to mentees'
    automation: 'automated'

  - id: 'SC-E2-040'
    feature_ref: 'F2.3'
    behavior_ref: 'B2.3.1'
    description: 'INV-E2-05: Mentor profile data changes are reflected across all marketplace surfaces'
    expected_behavior: >
      A mentor updates their profile (e.g., changes bio, updates pricing,
      modifies availability). After the update, the marketplace listing
      card, search results, and public profile page all reflect the
      updated data without any manual admin intervention.
    pass_criteria:
      - 'Updated bio is reflected on the profile page and in search results'
      - 'Updated pricing is reflected on the profile page and in price filter results'
      - 'Updated availability is reflected in the availability indicator and profile schedule'
      - 'No manual admin synchronisation is required for data to propagate'
    automation: 'automated'

