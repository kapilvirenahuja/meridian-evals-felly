# ─── Identity ─────────────────────────────────────────────────────────────────

identity:
  name: 'Mentor Marketplace & Discovery'
  purpose: >
    Makes the curated mentor supply visible and searchable, transforming
    Felly Club from a registration system into a discoverable marketplace.
    Without this epic, verified mentors exist in the system but are invisible
    to mentees — there is no way to browse, search, filter, or evaluate
    mentors before deciding whom to book. This epic creates the
    discovery-to-decision journey that connects mentee intent with mentor
    supply across Sport, Entrepreneurship, Business, and Entertainment.
  primary_user: 'Mentee (discovering and evaluating mentors)'
  secondary_users:
    - 'Mentor (public profile visibility and discoverability)'
    - 'Platform Administrator (marketplace health monitoring via mentor listing visibility)'
  value_proposition: >
    Mentees gain a structured discovery experience with search, filtering,
    category navigation, and personalised recommendations — eliminating the
    fragmented word-of-mouth or generic social media searches that
    characterise the current landscape. Mentors gain visibility proportional
    to their verified credentials, expertise, and ratings. The platform
    gains the marketplace surface that enables downstream transactional
    features (session booking, payment).

# ─── Invariants ────────────────────────────────────────────────────────────────
# Rules that must ALWAYS hold true. Violations are system failures.

invariants:
  - id: 'INV-E2-01'
    rule: 'Only mentors with admin-verified status appear in marketplace listings, search results, and recommendations — unverified, rejected, suspended, or draft mentor profiles are never exposed to mentees'
    rationale: >
      Admin curation is Felly Club's primary trust differentiator. Surfacing
      unverified mentors undermines the quality promise and erodes mentee
      confidence in the platform.

  - id: 'INV-E2-02'
    rule: 'Search results and mentor profile pages never expose private data — verification artefact files, admin-only notes, mentor financial data (earnings, payout history), raw contact details (phone, private email), or internal platform identifiers'
    rationale: >
      Privacy is a compliance requirement and a trust obligation. Mentors
      share professional credentials for verification, not public display.
      Leaking private data creates regulatory risk and mentor trust erosion.

  - id: 'INV-E2-03'
    rule: "Marketplace navigation categories are defined exclusively by the platform's expertise category taxonomy — users cannot create, modify, or inject custom categories"
    rationale: >
      Controlled taxonomy ensures consistent categorisation, enables reliable
      filtering, and prevents category pollution that would degrade the
      discovery experience.

  - id: 'INV-E2-04'
    rule: "Rule-based recommendations use only the mentee's explicitly stated interests (from their profile) to match mentor expertise categories — no implicit behavioural tracking, browsing history, or external data sources are used"
    rationale: >
      Transparency in recommendation logic builds mentee trust and simplifies
      compliance (no hidden profiling). The recommendation source is always
      explainable: 'Based on your stated interests.'

  - id: 'INV-E2-05'
    rule: "Every mentor displayed in the marketplace reflects their current verified profile data — changes to a mentor's profile (pricing, availability, bio, verification status) are reflected in search results and listings without requiring manual synchronisation by administrators"
    rationale: >
      Data consistency between the mentor's actual profile and what mentees
      see is essential for trust. Stale data (wrong pricing, outdated
      availability) leads to booking failures and mentee frustration.

# ─── Scope ─────────────────────────────────────────────────────────────────────

scope:
  in:
    - 'Paginated mentor listing with category-based navigation across all platform-defined expertise categories'
    - 'Full-text search across mentor names, bios, headlines, and expertise tags'
    - 'Advanced filtering by expertise category, price range, availability status, rating, and verified badge'
    - 'Detailed mentor public profile page with bio, headline, credentials, verified badge, pricing per session duration, availability calendar preview, and completed session count'
    - 'Rule-based personalised recommendations matching mentee stated interests to mentor expertise categories'
    - 'Search results with relevance ranking, pagination, and sort options (relevance, price, rating)'
    - 'Empty state handling for categories or search queries with no matching mentors'
    - 'Mentor availability calendar preview on profile page showing available time slots'
    - 'Responsive marketplace experience across desktop and mobile web'
    - 'Mentor profile pages discoverable by external search engines for organic acquisition'

  out:
    - 'AI/ML recommendation engine (deferred to Phase 2 — MVP uses rule-based matching only)'
    - 'Mentor comparison tool or side-by-side view'
    - 'Saved or favourite mentors list'
    - 'Session booking from the discovery or profile page (booking workflow is E3)'
    - 'Search analytics or search performance dashboard'
    - 'Autocomplete or typeahead in search input'
    - 'Mentor ranking by revenue, promotion, or featured placement'
    - 'Mentor profile editing from the marketplace view (editing is E1)'
    - 'Reviews or ratings display beyond summary metrics (full reviews are E5)'
    - 'Mentor messaging or contact from the profile page (deferred to Phase 2)'

# ─── Features ──────────────────────────────────────────────────────────────────

features:
  # ── F2.1: Mentor Search & Filtering ─────────────────────────────────────────

  - id: 'F2.1'
    name: 'Mentor Search & Filtering'
    description: >
      Provides mentees with full-text search and advanced multi-criteria
      filtering to find the right mentor from the verified marketplace
      supply. Mentees can search by name, expertise keywords, or bio terms,
      and refine results using category, price range, rating, and
      availability filters. Filters combine with AND logic across types
      and can be applied incrementally.
    intent:
      p1: >
        Mentees visiting the marketplace have diverse and specific needs —
        one mentee wants a sports coach under $80 per session, another wants
        an entrepreneurship mentor available on weekends. Without search and
        filtering, mentees must manually scroll through all mentors, which
        is impractical as the mentor catalog grows. The lack of structured
        search means mentees cannot find the right mentor efficiently,
        leading to abandonment and unmet discovery needs.
      p2: >
        After this feature ships, mentees can enter free-text search queries
        (mentor names, expertise keywords, bio terms) and receive ranked
        results. They can apply filters — expertise category, price range
        (minimum and maximum per session), availability status, rating
        threshold, and verified badge — to narrow results to precisely
        matching mentors. Filters can be combined and applied incrementally.
        Clearing all filters returns the full mentor listing.
      p3: >
        This feature is central to SG-01's marketplace vision. Discovery
        is the primary value unlock — without structured search, verified
        mentors are invisible. The cross-domain coverage (Sport, Business,
        Entrepreneurship, Entertainment and more) requires effective
        filtering to help mentees navigate a diverse mentor supply.
        Competitors like MentorCruise and GrowthMentor offer filtered
        search within narrow verticals; Felly Club's search must work
        across broader categories while remaining intuitive for general
        consumers.
    behaviors:
      - id: 'B2.1.1'
        description: 'Free-text search returns relevant mentors'
        expected_behavior: >
          When a mentee enters a search query (e.g., 'sports coaching' or
          a mentor's name) in the marketplace search bar and submits, the
          system returns a list of verified mentors whose names, bios,
          headlines, or expertise tags match the query, ranked by relevance.
        acceptance_criteria:
          - 'Search results include only mentors with admin-verified status'
          - 'Matching is performed across mentor name, bio, headline, and expertise tags'
          - 'Results are ranked by relevance to the search query'
          - 'An empty query returns all verified mentors (unfiltered listing)'

      - id: 'B2.1.2'
        description: 'Category filter narrows results to selected expertise'
        expected_behavior: >
          When a mentee selects one or more expertise categories from the
          filter panel (e.g., 'Sport' and 'Business'), the system returns
          only verified mentors whose expertise categories include at least
          one of the selected categories.
        acceptance_criteria:
          - 'Filter displays all platform-defined expertise categories'
          - 'Multiple categories can be selected simultaneously (OR logic within category filter)'
          - 'Selecting a category immediately updates the results list'
          - 'Deselecting all categories removes the category filter'

      - id: 'B2.1.3'
        description: 'Price range filter limits results by session cost'
        expected_behavior: >
          When a mentee sets a minimum and/or maximum price in the price
          range filter, the system returns only verified mentors who have
          at least one pricing tier within the specified range.
        acceptance_criteria:
          - 'Price filter accepts minimum price, maximum price, or both'
          - 'Mentors with any pricing tier within the range are included'
          - 'Price values are displayed with appropriate currency indication'
          - 'Setting an impossibly narrow range returns an empty state with a helpful message'

      - id: 'B2.1.4'
        description: 'Rating filter limits results by minimum average rating'
        expected_behavior: >
          When a mentee sets a minimum rating threshold (e.g., 4 stars and
          above), the system returns only verified mentors whose average
          session rating meets or exceeds the threshold.
        acceptance_criteria:
          - 'Rating filter allows selection of minimum rating (1–5 stars)'
          - 'Mentors without any ratings are excluded when a rating filter is applied'
          - 'Average rating is calculated from all completed session ratings for the mentor'

      - id: 'B2.1.5'
        description: 'Combined filters work together with AND logic'
        expected_behavior: >
          When a mentee applies multiple filters simultaneously (e.g.,
          category 'Sport' + price range '$50–$100' + rating '4+ stars'),
          the system returns only verified mentors matching ALL applied
          filter criteria (AND logic across filter types).
        acceptance_criteria:
          - 'All active filters are displayed to the mentee with clear labels'
          - 'Each filter can be removed individually without clearing others'
          - "A 'Clear all filters' action resets all filters to default state"
          - 'The total count of matching mentors is displayed with the results'

    constraints:
      - 'Search and filtering operate exclusively on verified mentor profiles — draft, pending, rejected, or suspended profiles are excluded'
      - 'No autocomplete or typeahead in search input for E2 scope'
      - "Price filtering references the mentor's published pricing tiers — it does not perform currency conversion across currencies"
      - "Rating data depends on E5 (Ratings, Reviews & Dispute Resolution) — until E5 ships, rating filters return no results and mentors display 'No ratings yet'"

    failure_conditions:
      - "A mentee searches for a term that matches a verified mentor's bio but receives zero results — the search index is out of sync with mentor profile data"
      - 'An unverified or rejected mentor appears in search results — the verification status filter is broken (INV-E2-01 violated)'
      - 'Applying a category filter returns mentors from a different category — filter logic does not correctly match expertise categories'
      - 'Private data (verification artefacts, admin notes, financial data) appears in search results — privacy invariant is violated (INV-E2-02)'

    dependencies:
      - source: 'E1'
        provides: 'Verified mentor profiles with expertise categories, pricing tiers, bio, headline, and verified badge status'
      - source: 'E1'
        provides: 'Authentication and role-based access control for mentee identity'
      - source: 'E5 (future)'
        provides: "Session rating data — until E5 ships, rating values default to 'No ratings yet'"

  # ── F2.2: Category-Based Marketplace Navigation ─────────────────────────────

  - id: 'F2.2'
    name: 'Category-Based Marketplace Navigation'
    description: >
      Provides expertise category tabs on the marketplace landing page,
      allowing mentees to browse mentors within specific domains. Each tab
      shows the count of available verified mentors in that category, with
      an 'All' tab as the default view. Categories with no verified mentors
      display an appropriate empty state.
    intent:
      p1: >
        Not all mentees arrive with a specific mentor in mind — many want to
        browse mentors within a domain they are interested in. Without
        category-based navigation, mentees face an undifferentiated list of
        all mentors regardless of expertise area. The cross-domain nature
        of Felly Club (spanning Sport, Entrepreneurship, Business,
        Entertainment, and more) makes category navigation essential for
        mentees to orient themselves within the marketplace.
      p2: >
        After this feature ships, the marketplace landing page presents
        expertise category tabs that mentees can click to browse mentors
        within each category. Each tab shows the number of available
        verified mentors in that category. The default view shows all
        mentors across all categories. Clicking a category tab filters the
        mentor listing to show only mentors with that expertise. Categories
        with no verified mentors display an appropriate empty state
        encouraging the mentee to explore other categories.
      p3: >
        Category navigation is the primary marketplace browse pattern and
        the visual representation of Felly Club's cross-domain differentiator.
        Competitors (MentorCruise, GrowthMentor) are single-vertical — they
        don't need category navigation. Felly Club's multi-vertical model
        requires intuitive category switching to help mentees explore domains
        they might not have considered.
    behaviors:
      - id: 'B2.2.1'
        description: 'Marketplace displays category tabs with mentor counts'
        expected_behavior: >
          When a mentee navigates to the marketplace page, the system
          displays navigation tabs for all platform-defined expertise
          categories, each showing the count of verified mentors in that
          category, plus an 'All' tab showing the total count across all
          categories.
        acceptance_criteria:
          - 'All platform-defined expertise categories are displayed as navigable tabs'
          - 'Each tab displays an accurate count of verified mentors in that category'
          - "An 'All' tab is present and selected by default on initial page load"
          - 'Category counts update to reflect current verified mentor data'

      - id: 'B2.2.2'
        description: 'Selecting a category tab filters the mentor listing'
        expected_behavior: >
          When a mentee clicks a category tab (e.g., 'Sport'), the mentor
          listing updates to show only verified mentors whose expertise
          categories include the selected category. The selected tab is
          visually highlighted.
        acceptance_criteria:
          - 'The mentor listing updates without requiring a full page reload'
          - 'The selected category tab is visually distinguished from unselected tabs'
          - "Selecting 'All' returns the full listing of all verified mentors"
          - 'Category selection is combinable with search and other filters from F2.1'

      - id: 'B2.2.3'
        description: 'Empty category displays helpful empty state'
        expected_behavior: >
          When a mentee selects a category tab that has no verified mentors,
          the system displays an empty state message explaining that no
          mentors are currently available in this category, and suggests
          exploring other categories.
        acceptance_criteria:
          - 'Empty state message is informative and non-technical'
          - 'Empty state includes navigation prompts to explore other populated categories'
          - "The category tab count shows '0' for empty categories"

    constraints:
      - 'Category taxonomy is fixed by the platform — mentees cannot create, rename, or reorder categories'
      - 'Categories display all platform-defined expertise areas, not a subset — mentees can browse any category that has verified mentors'
      - 'Category counts reflect only verified mentors — draft, pending, rejected, or suspended mentors are not counted'

    failure_conditions:
      - "A category tab displays a count of '5' but clicking it shows only 3 mentors — the count is out of sync with the actual listing"
      - "A category that has verified mentors shows a count of '0' or is hidden — mentors are invisible despite being verified"
      - 'Clicking a category tab does not filter the listing — navigation is non-functional'

    dependencies:
      - source: 'E1'
        provides: 'Platform-defined expertise category taxonomy (the complete set of category values)'
      - source: 'E1'
        provides: 'Verified mentor profiles with assigned expertise categories'

  # ── F2.3: Mentor Public Profile Page ────────────────────────────────────────

  - id: 'F2.3'
    name: 'Mentor Public Profile Page'
    description: >
      A detailed, publicly accessible profile page for each verified mentor
      displaying their full bio, headline, expertise categories, years of
      experience, verified badge, LinkedIn link, pricing per session duration,
      availability calendar preview, session count, and average rating. This
      is the decision point where browsing intent converts to booking intent.
    intent:
      p1: >
        After discovering a mentor through search or category browsing, the
        mentee needs to evaluate whether this mentor is the right fit before
        committing to a session. Without a detailed profile page, mentees
        can only see the summary information visible in the listing card
        (name, category, price). They cannot review the mentor's full bio,
        credentials, availability, or session history — information critical
        to making a confident booking decision. This gap forces mentees to
        book blind or leave the platform to research mentors elsewhere.
      p2: >
        After this feature ships, clicking a mentor card in the listing
        navigates the mentee to a detailed mentor profile page showing the
        mentor's full bio, headline, expertise categories, years of
        experience, verified badge, LinkedIn profile link (if provided),
        pricing for each available session duration (30 minutes, 60 minutes),
        availability calendar preview, total completed session count, and
        average rating with review count. The profile page provides enough
        information for the mentee to make an informed booking decision.
        A clear call-to-action invites the mentee to request a session
        (linking to the booking flow in E3).
      p3: >
        The profile page is the conversion point in the discovery journey —
        it transforms browsing intent into booking intent. Competitors like
        ADPList have minimal mentor profiles; Clarity.fm shows per-minute
        rates without session context. Felly Club's detailed profile with
        verified credentials, transparent pricing, and availability preview
        creates the confidence layer that drives session requests. This
        feature directly supports SG-01 by making trust signals (verified
        badge, credentials, session history) prominent and accessible.
    behaviors:
      - id: 'B2.3.1'
        description: 'Profile page displays comprehensive mentor information'
        expected_behavior: >
          When a mentee clicks on a mentor card in the marketplace listing,
          the system navigates to the mentor's public profile page
          displaying: full bio, headline, expertise categories, years of
          experience, verified badge, and LinkedIn profile link (if the
          mentor has provided one).
        acceptance_criteria:
          - 'All public mentor profile fields are displayed with appropriate formatting'
          - 'Verified badge is prominently displayed for verified mentors'
          - 'LinkedIn profile link opens in a new browser tab when clicked'
          - 'Missing optional fields (e.g., no headline) are handled gracefully — no blank sections or broken layout'

      - id: 'B2.3.2'
        description: 'Profile page displays pricing for available session durations'
        expected_behavior: >
          When a mentee views a mentor's profile page, the system displays
          the mentor's pricing for each offered session duration (e.g.,
          30 minutes at $50, 60 minutes at $90), showing the currency and
          amount clearly.
        acceptance_criteria:
          - 'All pricing tiers defined by the mentor are displayed'
          - 'Each pricing tier shows duration and price with currency symbol'
          - 'If a mentor has no pricing tiers configured, a message indicates pricing is not yet available'

      - id: 'B2.3.3'
        description: 'Profile page displays session statistics'
        expected_behavior: >
          When a mentee views a mentor's profile page, the system displays
          the mentor's total completed session count and average rating (if
          sessions have been completed and rated). For mentors with no
          completed sessions, the page displays a 'New mentor' or
          equivalent indicator.
        acceptance_criteria:
          - 'Completed session count reflects actual sessions delivered through the platform'
          - 'Average rating is displayed as a star rating with numeric value and total review count'
          - "Mentors with no sessions show an appropriate 'New mentor' indicator rather than '0 sessions' or empty space"
          - 'Rating display gracefully handles the pre-E5 state where no ratings exist'

      - id: 'B2.3.4'
        description: 'Profile page displays availability preview'
        expected_behavior: >
          When a mentee views a mentor's profile page, the system displays
          a preview of the mentor's availability showing their general
          weekly schedule (available days and time ranges). This gives the
          mentee an indication of whether the mentor's schedule aligns
          with theirs before initiating a session request.
        acceptance_criteria:
          - 'Weekly schedule shows all days with configured availability'
          - "Each available slot shows the day and time range (e.g., 'Monday: 10:00 AM – 2:00 PM')"
          - "Days with no availability are either omitted or shown as 'Not available'"
          - 'If a mentor has no availability configured, a message indicates the mentor is not currently accepting sessions'

      - id: 'B2.3.5'
        description: 'Profile page includes session request call-to-action'
        expected_behavior: >
          When a mentee views a verified mentor's profile page, a prominent
          call-to-action button ('Request Session' or equivalent) is
          displayed. Before session booking is available (E3), the button
          displays a 'Coming soon' state or equivalent placeholder.
        acceptance_criteria:
          - 'Call-to-action is visually prominent and positioned above the fold'
          - 'Button state accurately reflects whether booking is available (placeholder until E3 ships)'
          - 'For unauthenticated visitors, the call-to-action prompts login or registration first'

      - id: 'B2.3.6'
        description: 'Profile page is discoverable by external search engines'
        expected_behavior: >
          When an external search engine indexes the mentor marketplace,
          each mentor's public profile page is indexable with appropriate
          metadata (mentor name, expertise, headline) to support organic
          discovery of Felly Club mentors through web search.
        acceptance_criteria:
          - "Mentor profile pages have descriptive page titles including the mentor's name and expertise"
          - 'Profile pages are accessible via a stable, shareable URL'
          - 'Pages render with meaningful content visible to search engine crawlers'

    constraints:
      - 'Profile page displays only public-facing mentor data — verification artefact files, admin notes, and financial data are never shown'
      - "Session booking from the profile page is not functional until E3 ships — a placeholder or 'coming soon' state is displayed"
      - 'Review and rating details beyond summary metrics (average rating, count) are not displayed until E5 ships'
      - 'Profile page is read-only for mentees — mentors edit their own profiles through the profile management feature (E1)'

    failure_conditions:
      - "A mentee navigates to a mentor's profile page but sees incomplete or outdated data that does not match the mentor's actual profile — data consistency is broken (INV-E2-05 violated)"
      - 'Private data (verification artefact files, admin rejection reasons, financial data) appears on the public profile page — privacy invariant is violated (INV-E2-02)'
      - "An unverified or rejected mentor's profile page is accessible via direct URL — access control for non-verified profiles is missing"
      - 'The profile page fails to load or displays an error for a valid verified mentor — the core profile view is non-functional'

    dependencies:
      - source: 'E1'
        provides: 'Mentor profile data: bio, headline, expertise categories, years of experience, verified badge, LinkedIn URL, pricing tiers, availability slots'
      - source: 'E1'
        provides: 'Verified badge status — only verified mentors have accessible public profile pages'
      - source: 'E3 (future)'
        provides: "Session booking flow — until E3 ships, the 'Request Session' button shows a placeholder state"
      - source: 'E5 (future)'
        provides: "Ratings and reviews data — until E5 ships, rating displays show 'No ratings yet'"

  # ── F2.4: Rule-Based Mentor Recommendations ─────────────────────────────────

  - id: 'F2.4'
    name: 'Rule-Based Mentor Recommendations'
    description: >
      Surfaces a 'Recommended for You' section on the marketplace page for
      authenticated mentees with stated interests. Recommendations are
      generated by matching the mentee's interest categories to verified
      mentors' expertise categories, prioritised by the degree of category
      overlap. No machine learning or behavioural tracking is used.
    intent:
      p1: >
        Not all mentees know exactly who they are looking for. A mentee who
        has set 'Sport' and 'Business' as their interests should see
        relevant mentor suggestions without having to manually search and
        filter each time they visit the marketplace. Without personalised
        recommendations, every mentee sees the same generic listing,
        regardless of their stated preferences. This creates a discovery
        gap — mentees with clear interests must still manually navigate to
        find relevant mentors, reducing engagement and increasing
        time-to-first-booking.
      p2: >
        After this feature ships, authenticated mentees with at least one
        stated interest in their profile see a personalised 'Recommended
        for You' section on the marketplace page. The recommendations are
        generated by matching the mentee's stated interest categories to
        verified mentors' expertise categories. Mentors whose expertise
        overlaps with the mentee's interests are surfaced, prioritised by
        the degree of category overlap. Recommendations update when the
        mentee changes their interests in their profile.
      p3: >
        Personalised recommendations differentiate Felly Club from
        transactional platforms (Clarity.fm, Cameo) that show the same
        listing to everyone. Even with rule-based matching (not AI/ML),
        surfacing interest-aligned mentors reduces friction and signals
        to mentees that the platform understands their goals. This supports
        SG-01 by making the curated supply personally relevant, and
        accelerates SG-02 by shortening the path from discovery to session
        request.
    behaviors:
      - id: 'B2.4.1'
        description: 'Authenticated mentees with interests see personalised recommendations'
        expected_behavior: >
          When an authenticated mentee with at least one stated interest
          navigates to the marketplace page, the system displays a
          'Recommended for You' section showing verified mentors whose
          expertise categories match one or more of the mentee's stated
          interests, sorted by the degree of category overlap (most
          overlapping first).
        acceptance_criteria:
          - 'Recommendations section is visible only to authenticated mentees with at least one interest set'
          - 'Recommended mentors are all admin-verified (INV-E2-01)'
          - 'Sorting prioritises mentors with more overlapping categories'
          - 'The recommendation section displays a bounded number of mentors (e.g., 6–10) to maintain clarity'

      - id: 'B2.4.2'
        description: 'Recommendations explain why a mentor was suggested'
        expected_behavior: >
          When a mentee views the 'Recommended for You' section, each
          recommended mentor card displays a brief explanation of why they
          were recommended (e.g., 'Matches your interest in Sport' or
          'Matches your interests in Sport, Business').
        acceptance_criteria:
          - 'Each recommendation card shows the matching interest categories'
          - "The explanation references the mentee's stated interests, not tracked behaviour"
          - 'The explanation is concise and fits within the mentor card layout'

      - id: 'B2.4.3'
        description: 'Recommendations update when mentee interests change'
        expected_behavior: >
          When a mentee updates their stated interests in their profile
          (e.g., adds 'Entertainment' or removes 'Sport'), the
          'Recommended for You' section on the marketplace page reflects
          the updated interests on their next visit.
        acceptance_criteria:
          - "Recommendations reflect the mentee's current interests, not stale data"
          - "Removing all interests removes the 'Recommended for You' section entirely"
          - 'Adding a new interest surfaces mentors from the newly added category'

      - id: 'B2.4.4'
        description: 'Visitors and mentees without interests see no recommendations'
        expected_behavior: >
          When an unauthenticated visitor or an authenticated mentee with
          no stated interests visits the marketplace page, the 'Recommended
          for You' section is not displayed — they see only the standard
          marketplace listing with category navigation and search.
        acceptance_criteria:
          - 'No recommendation section is shown to unauthenticated visitors'
          - 'No recommendation section is shown to mentees with an empty interests list'
          - 'The marketplace remains fully functional without recommendations (search, filter, browse all work)'

    constraints:
      - 'Recommendations use rule-based category matching only — no machine learning, collaborative filtering, or behavioural tracking (explicit Phase 2 deferral)'
      - "Matching logic is: mentee's stated interests (expertise categories) intersected with mentor's expertise categories"
      - 'Recommendations are limited to a fixed maximum count to maintain page clarity and performance'
      - 'Recommendations are read-only — mentees cannot dismiss, pin, or reorder recommended mentors'

    failure_conditions:
      - "Recommendations show mentors from categories unrelated to the mentee's stated interests — the matching logic is incorrect (INV-E2-04 violated)"
      - 'Recommendations include unverified mentors — the verification filter is bypassed in the recommendation path'
      - "A mentee with stated interests sees no 'Recommended for You' section despite verified mentors existing in matching categories — the recommendation pipeline is disconnected"
      - 'Recommendations persist after a mentee removes all interests — stale data is being used instead of current profile data'

    dependencies:
      - source: 'E1'
        provides: 'Mentee profile with stated interest categories (the input to the matching logic)'
      - source: 'E1'
        provides: 'Verified mentor profiles with expertise categories (the candidate pool for matching)'
      - source: 'E1'
        provides: 'Authentication — recommendations require knowing which mentee is logged in'

  # ── F2.5: Search Result Pagination & Sorting ────────────────────────────────

  - id: 'F2.5'
    name: 'Search Result Pagination & Sorting'
    description: >
      Paginates marketplace search results and category listings with
      navigation controls, and provides sort options (relevance, price low
      to high, price high to low, rating highest first). Current page,
      total result count, and active sort order are clearly displayed.
      Pagination resets when filters or sort criteria change.
    intent:
      p1: >
        As the mentor catalog grows, returning all matching mentors in a
        single unpaginated list becomes impractical — page load times
        increase, the user interface becomes unwieldy, and mentees cannot
        scan results effectively. Without sorting, mentees cannot prioritise
        results by the criteria most important to them (cheapest first,
        highest rated, most relevant). This creates a poor discovery
        experience that scales badly with marketplace growth.
      p2: >
        After this feature ships, search results and filtered listings are
        paginated with a defined number of results per page. Mentees can
        navigate between pages using next, previous, and page number
        controls. Results can be sorted by relevance (default for search
        queries), price (low to high or high to low), and rating (highest
        first). The current page, total results count, and active sort
        order are displayed clearly. Pagination resets to page one when
        filters or sort criteria change.
      p3: >
        Pagination and sorting are foundational marketplace patterns
        required for any platform that expects catalog growth. Without
        them, the marketplace degrades as mentor supply grows — exactly
        the scenario Felly Club's growth model targets. The pagination
        pattern established here will be reused across future epics
        (session history in E9, admin listings in E6), making it a
        reusable platform capability.
    behaviors:
      - id: 'B2.5.1'
        description: 'Search results are paginated with navigation controls'
        expected_behavior: >
          When a mentee performs a search or browses a category that returns
          more mentors than the page size, the system displays the first
          page of results with navigation controls to move between pages
          (next, previous, and page numbers).
        acceptance_criteria:
          - 'Default page size is a reasonable number of mentors per page (e.g., 12 or 20)'
          - 'Page navigation controls are displayed below the results'
          - 'Current page number and total number of pages are visible to the mentee'
          - "Total matching mentor count is displayed (e.g., 'Showing 1–12 of 47 mentors')"

      - id: 'B2.5.2'
        description: 'Mentees can sort results by relevance, price, or rating'
        expected_behavior: >
          When a mentee selects a sort option from the sort control, the
          system reorders the current result set according to the selected
          criterion: relevance (default for search queries), price low to
          high, price high to low (using the mentor's lowest pricing tier),
          or rating highest first.
        acceptance_criteria:
          - 'Sort control displays available options: relevance, price (low–high), price (high–low), rating (highest first)'
          - 'Relevance sort is the default when a search query is active'
          - 'Changing sort order resets pagination to the first page'
          - 'Sort selection is visually indicated as active'

      - id: 'B2.5.3'
        description: 'Pagination resets consistently with filter changes'
        expected_behavior: >
          When a mentee is on page 3 of results and applies a new filter
          or changes the search query, the system resets pagination to
          page 1 and applies the new filter or query. Total result count
          updates to reflect the filtered set.
        acceptance_criteria:
          - 'Applying a filter resets to page 1'
          - 'Removing a filter resets to page 1 with updated results'
          - 'Total result count accurately reflects the current filter and search state'
          - 'Empty pages are not accessible — pagination controls adjust to the actual result count'

    constraints:
      - 'The platform does not require loading the complete mentor catalog to display a single page of results — pagination is efficient regardless of total catalog size'
      - 'Sort by relevance is only meaningful when a search query is active — for category-only browsing without search, the default sort falls back to a sensible order (e.g., by rating or recency)'
      - "Price sort uses the mentor's lowest published pricing tier as the sort key"

    failure_conditions:
      - 'A mentee navigates to page 2 and sees the same mentors as page 1 — pagination offset is not applied correctly'
      - "Total result count shows '47' but the last page has only 2 mentors and navigating further shows more — count is inconsistent with actual results"
      - 'Sorting by price displays mentors in random order rather than ascending or descending price — sort logic is not applied'
      - 'Applying a filter while on page 5 shows zero results even though matching mentors exist — pagination reset to page 1 is not triggered'

    dependencies:
      - source: 'F2.1'
        provides: 'Search results and filtered mentor sets that require pagination and sorting'
      - source: 'F2.2'
        provides: 'Category-filtered listings that require pagination'

  # ── F2.6: Mentor Availability Display ───────────────────────────────────────

  - id: 'F2.6'
    name: 'Mentor Availability Display'
    description: >
      Surfaces mentor availability in two contexts: a compact availability
      indicator on mentor cards in the marketplace listing (showing whether
      the mentor has upcoming available slots), and a detailed weekly
      schedule preview on the mentor's profile page (showing available days
      and time ranges). Also provides an availability filter in the search
      panel to narrow results to mentors with configured availability.
    intent:
      p1: >
        Before requesting a session, a mentee needs to know whether a
        mentor's schedule is compatible with theirs. Without visibility
        into mentor availability, mentees submit session requests blind —
        potentially requesting sessions with mentors who have no overlapping
        available times, leading to declined requests and frustration for
        both parties. This wastes time and creates a poor impression of the
        platform's efficiency.
      p2: >
        After this feature ships, mentor availability is displayed in two
        contexts: a compact availability indicator on mentor cards in the
        listing (showing whether the mentor has upcoming available slots)
        and a detailed availability calendar preview on the mentor's
        profile page (showing the mentor's weekly recurring schedule with
        available days and time ranges). An availability filter in the
        search panel allows mentees to narrow results to mentors with
        configured availability. This allows mentees to quickly assess
        schedule compatibility before initiating a session request.
      p3: >
        Availability transparency reduces wasted session requests and
        increases booking conversion. Competitors like MentorCruise show
        availability only after initiating a booking flow — Felly Club
        surfaces it earlier in the discovery journey, reducing friction.
        The availability data established in E1 (mentor availability slots)
        is surfaced here for the first time, and the booking flow in E3
        will use the same data for actual slot selection.
    behaviors:
      - id: 'B2.6.1'
        description: 'Mentor listing cards show availability indicator'
        expected_behavior: >
          When a mentee views the marketplace mentor listing, each mentor
          card displays a compact availability indicator showing whether
          the mentor has availability configured (e.g., 'Available' with
          a green indicator, or 'Schedule not set' for mentors without
          availability configured).
        acceptance_criteria:
          - 'Availability indicator is visible on every mentor card in the listing'
          - "Mentors with at least one availability slot show an 'Available' indicator"
          - "Mentors with no availability slots configured show a 'Schedule not set' indicator"
          - 'The indicator does not show specific times — it is a summary status only'

      - id: 'B2.6.2'
        description: 'Mentor profile page shows detailed availability schedule'
        expected_behavior: >
          When a mentee views a mentor's profile page, the system displays
          the mentor's weekly recurring availability schedule showing
          which days and time ranges the mentor is generally available for
          sessions. The schedule is presented in a clear, scannable format.
        acceptance_criteria:
          - 'Weekly schedule shows all days with configured availability'
          - "Each available slot shows the day and time range (e.g., 'Monday: 10:00 AM – 2:00 PM')"
          - "Days with no availability are shown as 'Not available' or omitted"
          - 'If a mentor has no availability configured, a message indicates the mentor is not currently accepting sessions'

      - id: 'B2.6.3'
        description: 'Availability filter narrows search results to available mentors'
        expected_behavior: >
          When a mentee applies an availability filter in the search and
          filter panel (e.g., 'Available mentors only'), the system returns
          only verified mentors who have at least one availability slot
          configured.
        acceptance_criteria:
          - 'Availability filter option is available in the filter panel'
          - 'Filtering for available mentors excludes those with no availability configured'
          - 'Availability filter combines correctly with other filters (category, price, rating)'

    constraints:
      - "Availability display shows the mentor's general recurring schedule — it does not show real-time booked or free status (actual slot booking and conflict checking is E3)"
      - 'Availability times are displayed as configured by the mentor — no time zone conversion is applied in E2'
      - "Availability data is read from the mentor's profile configuration established in E1 — E2 does not modify availability data"

    failure_conditions:
      - "A mentor with availability configured shows 'Schedule not set' in the listing — availability data is not being read correctly"
      - 'The availability schedule on the profile page shows different times than what the mentor configured — data inconsistency between profile and marketplace display'
      - 'Applying the availability filter excludes mentors who have availability configured — filter logic is inverted'

    dependencies:
      - source: 'E1'
        provides: 'Mentor availability slot data (day, start time, end time) configured during mentor onboarding'
      - source: 'F2.1'
        provides: 'Filter panel integration — availability filter is part of the search and filtering system'
      - source: 'F2.3'
        provides: 'Mentor profile page — detailed availability display is rendered as a section of the profile page'
