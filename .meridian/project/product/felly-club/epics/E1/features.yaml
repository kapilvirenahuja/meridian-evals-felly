# ─── Identity ─────────────────────────────────────────────────────────────────

identity:
  name: "User Identity & Profile Foundation"
  purpose: >
    Establishes the shared identity layer that every subsequent Felly Club
    capability depends on. Without verified users, there is no marketplace —
    discovery has no mentors to show, booking has no parties to connect, and
    payment has no accounts to debit or credit. This epic creates three
    authenticated personas (mentee, mentor, admin), an admin-curated mentor
    onboarding pipeline with verification, and the profile infrastructure
    that carries trust signals throughout the platform.
  primary_user: "Mentee (self-service registration and profile management)"
  secondary_users:
    - "Mentor (profile management after admin-driven onboarding)"
    - "Platform Administrator (mentor onboarding, verification, and user management)"
  value_proposition: >
    Mentees get a frictionless path from anonymous visitor to authenticated
    user with a personalised dashboard. Mentors get a structured onboarding
    experience with verified credentials visible to potential mentees.
    Administrators get operational control over supply quality through a
    curated verification workflow.

# ─── Invariants ────────────────────────────────────────────────────────────────
# Rules that must ALWAYS hold true. Violations are system failures.

invariants:
  - id: "INV-01"
    rule: "A mentor profile is never visible to mentees until an administrator has explicitly approved it"
    rationale: >
      Admin curation is Felly Club's primary differentiator. Unapproved
      mentors appearing in the marketplace undermines trust and the
      brand promise of quality.

  - id: "INV-02"
    rule: "Every authenticated request is associated with exactly one role — Mentee, Mentor, or Admin — and a user cannot hold multiple roles simultaneously"
    rationale: >
      Role separation prevents privilege escalation and ensures each persona
      sees only the data and actions appropriate to their role. A mentee
      must never access admin functions; a mentor must never see another
      mentor's private data.

  - id: "INV-03"
    rule: "A verified badge is only assigned by an administrator after reviewing verification artefacts — it can never be self-assigned"
    rationale: >
      The verified badge is the trust signal visible across the platform.
      If mentors could self-verify, the badge loses meaning and mentees
      lose confidence in mentor quality.

  - id: "INV-04"
    rule: "Email addresses are unique across all user accounts — no two users can register with the same email"
    rationale: >
      Email uniqueness prevents duplicate accounts, ensures password reset
      delivers to the correct user, and maintains clean referral attribution
      in downstream epics.

  - id: "INV-05"
    rule: "A user's password is never stored in readable form and is never included in any API response, log entry, or notification"
    rationale: >
      Credential security is non-negotiable. Readable passwords in storage,
      responses, or logs create catastrophic breach exposure.

# ─── Scope ─────────────────────────────────────────────────────────────────────

scope:
