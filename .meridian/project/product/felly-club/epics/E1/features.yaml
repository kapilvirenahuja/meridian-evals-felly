# ─── Features ──────────────────────────────────────────────────────────────────

features:

  - id: "F1.1"
    name: "Mentee Registration"
    description: >
      A new visitor can create a mentee account using either email-and-password
      or social login (Google, Apple). After registration, the mentee receives
      an email verification link. Upon verification, the mentee lands on their
      dashboard with prompts to complete their profile (interests, goals).
    behaviors:
      - id: "B1.1.1"
        behavior: >
          When a visitor submits a valid email and password on the registration
          form, the system creates a new mentee account in unverified status
          and sends a verification email to the provided address.
      - id: "B1.1.2"
        behavior: >
          When a visitor clicks the verification link in their email within
          the link's validity period, the system marks the account as verified
          and redirects the user to their mentee dashboard.
      - id: "B1.1.3"
        behavior: >
          When a visitor chooses social login (Google or Apple), the system
          authenticates via the external provider, creates a verified mentee
          account (email pre-verified by the provider), and redirects to
          the mentee dashboard.
      - id: "B1.1.4"
        behavior: >
          When a visitor attempts to register with an email already associated
          with an existing account, the system rejects the registration and
          displays an error indicating the email is already in use.
      - id: "B1.1.5"
        behavior: >
          When a visitor submits a password that does not meet the minimum
          strength requirements (at least 8 characters, at least one letter
          and one number), the system rejects the registration with a
          specific validation message.

  - id: "F1.2"
    name: "User Authentication"
    description: >
      All three personas (mentee, mentor, admin) can log in using their
      credentials. The system issues a short-lived session token upon
      successful authentication and supports automatic token refresh.
      Failed login attempts are rate-limited to prevent brute force attacks.
    behaviors:
      - id: "B1.2.1"
        behavior: >
          When a verified user submits correct credentials (email + password
          or social login), the system authenticates them, issues a session
          token, and redirects to their role-appropriate dashboard (mentee
          dashboard, mentor dashboard, or admin portal).
      - id: "B1.2.2"
        behavior: >
          When a user submits incorrect credentials, the system rejects the
          login with a generic error message that does not reveal whether
          the email exists in the system.
      - id: "B1.2.3"
        behavior: >
          When the same IP address submits more than 10 failed login attempts
          within a 15-minute window, the system temporarily blocks further
          login attempts from that IP and returns a rate-limit error.
      - id: "B1.2.4"
        behavior: >
          When an authenticated user's session token is within 5 minutes of
          expiry and the user makes a request, the system automatically
          issues a new session token without requiring re-authentication.
      - id: "B1.2.5"
        behavior: >
          When a user logs out, the system invalidates their current session
          token and any refresh token, preventing further authenticated
          requests without re-login.

  - id: "F1.3"
    name: "Password Reset & Recovery"
    description: >
      A user who has forgotten their password can request a reset link via
      email. The link is time-limited and single-use. After setting a new
      password, all existing sessions are invalidated.
    behaviors:
      - id: "B1.3.1"
        behavior: >
          When a user requests a password reset with their registered email,
          the system sends a reset link valid for 60 minutes. If the email
          is not registered, the system still shows a success message (to
          prevent email enumeration).
      - id: "B1.3.2"
        behavior: >
          When a user clicks a valid reset link and submits a new password
          meeting strength requirements, the system updates the password,
          invalidates all existing sessions, and redirects to the login
          page with a confirmation message.
      - id: "B1.3.3"
        behavior: >
          When a user clicks an expired or already-used reset link, the
          system displays an error and prompts them to request a new link.

  - id: "F1.4"
    name: "Admin-Driven Mentor Onboarding"
    description: >
      Platform administrators create mentor profiles through a guided
      workflow. The workflow captures the mentor's bio, expertise category
      (Sport, Entrepreneurship, Business, Entertainment), pricing, availability
      schedule, profile photo, and verification artefacts (LinkedIn profile,
      portfolio, proof-of-expertise documents). The mentor profile starts in
      Draft status and moves to Pending Verification when the admin submits it.
    behaviors:
      - id: "B1.4.1"
        behavior: >
          When an admin initiates mentor onboarding and completes all required
          fields (name, email, bio, at least one expertise category, at least
          one pricing tier, at least one availability slot, and at least one
          verification artefact), the system creates the mentor profile in
          Pending Verification status and adds it to the admin review queue.
      - id: "B1.4.2"
        behavior: >
          When an admin saves a partially completed mentor profile without
          submitting, the system stores it in Draft status so the admin can
          return and complete it later.
      - id: "B1.4.3"
        behavior: >
          When an admin uploads a verification artefact (LinkedIn URL,
          portfolio URL, or document file), the system stores the artefact
          and associates it with the mentor profile. The artefact is visible
          only to administrators.
      - id: "B1.4.4"
        behavior: >
          When the admin submits the mentor profile for verification, the
          system generates login credentials for the mentor and holds them
          until the profile is approved.

  - id: "F1.5"
    name: "Mentor Verification & Badge Assignment"
    description: >
      Administrators review pending mentor profiles, inspect verification
      artefacts, and either approve or reject each profile. Approved mentors
      receive a verified badge visible across the platform and receive their
      login credentials. Rejected profiles receive a reason and can be
      re-submitted after corrections.
    behaviors:
      - id: "B1.5.1"
        behavior: >
          When an admin opens the verification review queue, the system
          displays all mentor profiles in Pending Verification status, sorted
          by submission date (oldest first), with a summary showing name,
          expertise category, and number of verification artefacts.
      - id: "B1.5.2"
        behavior: >
          When an admin approves a pending mentor profile, the system changes
          the status to Verified, assigns the verified badge, delivers login
          credentials to the mentor's email, and the mentor profile becomes
          eligible for display in the marketplace (when E2 ships).
      - id: "B1.5.3"
        behavior: >
          When an admin rejects a pending mentor profile, the system changes
          the status to Rejected, records the rejection reason provided by
          the admin, and notifies the original onboarding admin. The profile
          can be edited and re-submitted.
      - id: "B1.5.4"
        behavior: >
          When a rejected mentor profile is edited and re-submitted, the
          system moves it back to Pending Verification status and places
          it at the end of the review queue.

  - id: "F1.6"
    name: "Profile Management"
    description: >
      Mentees and mentors can view and edit their own profiles. Mentees
      manage their interests, goals, and contact information. Mentors manage
      their bio, expertise categories, pricing, availability, and profile
      photo. Both see a profile completeness indicator showing which fields
      are filled and which are missing.
    behaviors:
      - id: "B1.6.1"
        behavior: >
          When a mentee views their profile page, the system displays all
          current profile fields (name, email, avatar, interests, goals)
          and a completeness indicator showing the percentage of optional
          fields that are filled.
      - id: "B1.6.2"
        behavior: >
          When a mentee edits their profile and saves, the system validates
          the input, persists the changes, and updates the completeness
          indicator immediately.
      - id: "B1.6.3"
        behavior: >
          When a mentor views their profile page, the system displays all
          current profile fields (bio, expertise categories, pricing tiers,
          availability schedule, profile photo, verification status) and a
          completeness indicator.
      - id: "B1.6.4"
        behavior: >
          When a mentor edits their pricing or availability and saves, the
          system validates the input and persists the changes. Pricing
          changes are effective for future sessions only (existing bookings
          retain their original pricing — enforced in E3/E4).
      - id: "B1.6.5"
        behavior: >
          When any user attempts to view or edit another user's profile
          (other than the public-facing fields designated for the
          marketplace), the system denies the request and returns an
          authorization error.

  - id: "F1.7"
    name: "Role-Based Access Control"
    description: >
      The platform enforces strict separation between the three personas.
      Mentees can only access mentee functions. Mentors can only access
      mentor functions. Administrators can access admin functions and have
      read-only visibility into mentee and mentor data for operational
      purposes. Every API endpoint and page is protected by role-based
      guards.
    behaviors:
      - id: "B1.7.1"
        behavior: >
          When a mentee attempts to access an admin-only function (such as
          the mentor verification queue or system configuration), the system
          denies the request and returns a forbidden error.
      - id: "B1.7.2"
        behavior: >
          When a mentor attempts to access another mentor's private data
          (such as earnings, verification artefacts, or contact details),
          the system denies the request and returns a forbidden error.
      - id: "B1.7.3"
        behavior: >
          When an administrator accesses the user management section, the
          system displays a list of all mentees and mentors with their
          status (active, pending, rejected), registration date, and
          profile completeness.
      - id: "B1.7.4"
        behavior: >
          When an unauthenticated user attempts to access any protected
          page or endpoint, the system redirects them to the login page
          (for web) or returns an authentication error (for API).
