            action: "new"
          - path: "packages/admin-portal/src/components/users/user-table.tsx"
            action: "new"
      - item: "Profile management tests"
        key_files:
          - path: "packages/backend-api/src/modules/user/__tests__/profile.spec.ts"
            action: "new"
    exit_gate: >
      GET /api/v1/users/me returns profile with completeness percentage.
      PATCH /api/v1/users/me/profile updates profile fields and recalculates completeness.
      GET /api/v1/users/:id/profile by another non-admin user returns 403.
      GET /api/v1/admin/users returns paginated user list with status filters.
      Mentee profile page renders with edit form and completeness indicator.
      Admin user list page renders with filters.
    scenario_gate:
      scenario_ids: ["SC-E1-024", "SC-E1-025", "SC-E1-026", "SC-E1-027", "SC-E1-028"]
