# ─── Execution Order ───────────────────────────────────────────────────────────

execution_order:

  - order: 1
    feature_ref: "F1.1"
    name: "Mentee Registration"
    description: >
      End-to-end mentee registration: email/password signup with validation,
      social login stubs (Google, Apple), email verification, and redirect to
      mentee dashboard. Includes duplicate email detection and password strength
      enforcement.
    scope_items:
      - item: "AuthController registration endpoints"
        key_files:
          - path: "packages/backend-api/src/modules/auth/auth.controller.ts"
            action: "new"
          - path: "packages/backend-api/src/modules/auth/auth.service.ts"
            action: "new"
          - path: "packages/backend-api/src/modules/auth/dto/register.dto.ts"
            action: "new"
          - path: "packages/backend-api/src/modules/auth/dto/verify-email.dto.ts"
            action: "new"
      - item: "UserModule repository for mentee profile creation"
        key_files:
          - path: "packages/backend-api/src/modules/user/user.module.ts"
            action: "new"
          - path: "packages/backend-api/src/modules/user/user.service.ts"
            action: "new"
          - path: "packages/backend-api/src/modules/user/user.repository.ts"
            action: "new"
      - item: "Mentee registration page and form"
        key_files:
          - path: "packages/mentee-web-app/src/app/(auth)/register/page.tsx"
            action: "new"
          - path: "packages/mentee-web-app/src/components/auth/register-form.tsx"
            action: "new"
          - path: "packages/mentee-web-app/src/app/(auth)/verify-email/page.tsx"
            action: "new"
      - item: "Unit + integration tests"
        key_files:
          - path: "packages/backend-api/src/modules/auth/__tests__/auth.service.spec.ts"
            action: "new"
          - path: "packages/backend-api/src/modules/auth/__tests__/auth.controller.spec.ts"
            action: "new"
    exit_gate: >
      POST /api/v1/auth/register with valid email+password returns 201.
      POST /api/v1/auth/register with duplicate email returns 409.
      POST /api/v1/auth/register with weak password returns 400.
      POST /api/v1/auth/verify-email with valid token returns 200.
      Registration page renders at /register with working form.
      All unit tests pass.
    scenario_gate:
      scenario_ids: ["SC-E1-001", "SC-E1-002", "SC-E1-003", "SC-E1-004", "SC-E1-005", "SC-E1-006", "SC-E1-036"]
      count: 7

  - order: 2
    feature_ref: "F1.2"
    name: "User Authentication"
    description: >
      Login for all personas, JWT token issuance and refresh, rate limiting on
      failed attempts, logout with token invalidation, and GET /auth/me endpoint.
    scope_items:
      - item: "AuthController login/logout/refresh/me endpoints"
        key_files:
          - path: "packages/backend-api/src/modules/auth/auth.controller.ts"
            action: "modified"
          - path: "packages/backend-api/src/modules/auth/auth.service.ts"
            action: "modified"
          - path: "packages/backend-api/src/modules/auth/dto/login.dto.ts"
            action: "new"
      - item: "Login page (mentee-web-app + admin-portal)"
        key_files:
          - path: "packages/mentee-web-app/src/app/(auth)/login/page.tsx"
            action: "new"
          - path: "packages/mentee-web-app/src/components/auth/login-form.tsx"
            action: "new"
          - path: "packages/admin-portal/src/app/(auth)/login/page.tsx"
            action: "new"
          - path: "packages/admin-portal/src/components/auth/login-form.tsx"
            action: "new"
      - item: "Auth context and token refresh interceptor"
        key_files:
          - path: "packages/mentee-web-app/src/lib/auth-context.tsx"
            action: "modified"
          - path: "packages/mentee-web-app/src/lib/api-client.ts"
            action: "modified"
      - item: "Tests for login, rate limiting, token refresh"
        key_files:
          - path: "packages/backend-api/src/modules/auth/__tests__/login.spec.ts"
            action: "new"
    exit_gate: >
      POST /api/v1/auth/login with correct credentials returns 200 with JWT tokens.
      POST /api/v1/auth/login with wrong credentials returns 401 with generic error.
      11+ failed logins from same IP within 15 min returns 429.
      POST /api/v1/auth/refresh with valid refresh token returns new access token.
      POST /api/v1/auth/logout invalidates tokens.
      GET /api/v1/auth/me with valid JWT returns user data.
      Login pages render and function on both frontends.
    scenario_gate:
      scenario_ids: ["SC-E1-007", "SC-E1-008", "SC-E1-009", "SC-E1-010", "SC-E1-011", "SC-E1-037"]
      count: 6

  - order: 3
    feature_ref: "F1.7"
    name: "Role-Based Access Control"
    description: >
      RBAC enforcement across all endpoints and pages. RolesGuard + @Roles
      decorator applied to all protected routes. Frontend middleware redirects
      unauthenticated users to login.
    scope_items:
      - item: "RBAC guards applied to all existing controllers"
        key_files:
          - path: "packages/backend-api/src/modules/auth/guards/roles.guard.ts"
            action: "modified"
          - path: "packages/backend-api/src/modules/auth/auth.controller.ts"
            action: "modified"
          - path: "packages/backend-api/src/modules/user/user.controller.ts"
            action: "new"
      - item: "Frontend auth middleware enforcement"
        key_files:
          - path: "packages/mentee-web-app/src/middleware.ts"
            action: "modified"
          - path: "packages/admin-portal/src/middleware.ts"
            action: "modified"
      - item: "RBAC integration tests"
        key_files:
          - path: "packages/backend-api/src/modules/auth/__tests__/rbac.spec.ts"
            action: "new"
    exit_gate: >
      GET /api/v1/admin/* with Mentee token returns 403.
      GET /api/v1/users/me with no token returns 401.
      Mentee accessing /admin/* in browser redirects to login.
      Admin accessing admin portal with valid Admin JWT succeeds.
      All RBAC tests pass.
    scenario_gate:
      scenario_ids: ["SC-E1-029", "SC-E1-030", "SC-E1-031", "SC-E1-032", "SC-E1-034"]
      count: 5

  - order: 4
    feature_ref: "F1.3"
    name: "Password Reset & Recovery"
    description: >
      Forgot password flow: request reset link, validate token, set new password,
      invalidate all existing sessions. Handles expired/used tokens gracefully.
    scope_items:
      - item: "AuthController forgot-password and reset-password endpoints"
        key_files:
          - path: "packages/backend-api/src/modules/auth/auth.controller.ts"
            action: "modified"
          - path: "packages/backend-api/src/modules/auth/auth.service.ts"
            action: "modified"
          - path: "packages/backend-api/src/modules/auth/dto/forgot-password.dto.ts"
            action: "new"
          - path: "packages/backend-api/src/modules/auth/dto/reset-password.dto.ts"
            action: "new"
      - item: "Password reset pages"
        key_files:
          - path: "packages/mentee-web-app/src/app/(auth)/forgot-password/page.tsx"
            action: "new"
          - path: "packages/mentee-web-app/src/app/(auth)/reset-password/page.tsx"
            action: "new"
      - item: "Password reset tests"
        key_files:
          - path: "packages/backend-api/src/modules/auth/__tests__/password-reset.spec.ts"
            action: "new"
    exit_gate: >
      POST /api/v1/auth/forgot-password returns 200 for any email (no enumeration).
      POST /api/v1/auth/reset-password with valid token + strong password returns 200.
      POST /api/v1/auth/reset-password with expired token returns 400.
      After reset, old JWT tokens are invalidated.
      Frontend forms render and submit correctly.
    scenario_gate:
      scenario_ids: ["SC-E1-012", "SC-E1-013", "SC-E1-014", "SC-E1-015"]
      count: 4

  - order: 5
    feature_ref: "F1.4"
    name: "Admin-Driven Mentor Onboarding"
    description: >
      Admin portal workflow for creating mentor profiles: bio, expertise category,
      pricing tiers, availability slots, profile photo, and verification artefact
      upload. Draft save and submit-for-verification flows.
    scope_items:
      - item: "AdminModule controller + service + repository"
        key_files:
          - path: "packages/backend-api/src/modules/admin/admin.module.ts"
            action: "new"
          - path: "packages/backend-api/src/modules/admin/admin.controller.ts"
            action: "new"
          - path: "packages/backend-api/src/modules/admin/admin.service.ts"
            action: "new"
          - path: "packages/backend-api/src/modules/admin/admin.repository.ts"
            action: "new"
          - path: "packages/backend-api/src/modules/admin/dto/create-mentor.dto.ts"
            action: "new"
          - path: "packages/backend-api/src/modules/admin/dto/upload-artefact.dto.ts"
            action: "new"
      - item: "Admin portal mentor onboarding pages"
        key_files:
          - path: "packages/admin-portal/src/app/(dashboard)/mentors/new/page.tsx"
            action: "new"
          - path: "packages/admin-portal/src/components/mentors/mentor-onboarding-form.tsx"
            action: "new"
          - path: "packages/admin-portal/src/components/mentors/artefact-upload.tsx"
            action: "new"
      - item: "Mentor onboarding tests"
        key_files:
          - path: "packages/backend-api/src/modules/admin/__tests__/mentor-onboarding.spec.ts"
            action: "new"
    exit_gate: >
      POST /api/v1/admin/mentors with all required fields returns 201 with PENDING_VERIFICATION status.
      POST /api/v1/admin/mentors with partial fields + save-as-draft returns 201 with DRAFT status.
      POST /api/v1/admin/mentors/:id/artefacts uploads and associates artefact.
      Admin portal onboarding form renders with all fields.
      Artefacts are visible only to admin users.
    scenario_gate:
      scenario_ids: ["SC-E1-016", "SC-E1-017", "SC-E1-018", "SC-E1-019"]
      count: 4

  - order: 6
    feature_ref: "F1.5"
    name: "Mentor Verification & Badge Assignment"
    description: >
      Admin verification review queue, approve/reject actions, verified badge
      assignment, credential delivery on approval, and re-submission flow for
      rejected profiles.
    scope_items:
      - item: "Verification queue + approve/reject endpoints"
        key_files:
          - path: "packages/backend-api/src/modules/admin/admin.controller.ts"
            action: "modified"
          - path: "packages/backend-api/src/modules/admin/admin.service.ts"
            action: "modified"
          - path: "packages/backend-api/src/modules/admin/dto/verify-mentor.dto.ts"
            action: "new"
      - item: "Admin portal verification queue pages"
        key_files:
          - path: "packages/admin-portal/src/app/(dashboard)/mentors/verification/page.tsx"
            action: "new"
          - path: "packages/admin-portal/src/app/(dashboard)/mentors/[id]/page.tsx"
            action: "new"
          - path: "packages/admin-portal/src/components/mentors/verification-actions.tsx"
            action: "new"
      - item: "Verification flow tests"
        key_files:
          - path: "packages/backend-api/src/modules/admin/__tests__/verification.spec.ts"
            action: "new"
    exit_gate: >
      GET /api/v1/admin/mentors/verification returns pending profiles sorted by date.
      POST /api/v1/admin/mentors/:id/approve sets status=VERIFIED, verifiedBadge=true.
      POST /api/v1/admin/mentors/:id/reject sets status=REJECTED with reason.
      Approved mentor receives login credentials via email (mocked in E1).
      Rejected mentor can be edited and re-submitted to PENDING_VERIFICATION.
      Verification queue page renders with approve/reject buttons.
    scenario_gate:
      scenario_ids: ["SC-E1-020", "SC-E1-021", "SC-E1-022", "SC-E1-023", "SC-E1-033", "SC-E1-035"]
      count: 6

  - order: 7
    feature_ref: "F1.6"
    name: "Profile Management"
    description: >
      Mentee and mentor profile view/edit with completeness indicators.
      Authorization enforcement: users can only view/edit their own profiles.
      Mentors cannot change verification-controlled fields.
    scope_items:
      - item: "UserController profile endpoints"
        key_files:
          - path: "packages/backend-api/src/modules/user/user.controller.ts"
            action: "modified"
          - path: "packages/backend-api/src/modules/user/user.service.ts"
            action: "modified"
          - path: "packages/backend-api/src/modules/user/dto/update-mentee-profile.dto.ts"
            action: "new"
          - path: "packages/backend-api/src/modules/user/dto/update-mentor-profile.dto.ts"
            action: "new"
      - item: "Mentee profile pages"
