# Verification Scenarios — E1: User Identity & Profile Foundation
# Generated by: product-strategist (prepare-implementation)
# Audience: validators — no technology references

slug: "felly-club"
epic_id: "E1"
status: "LOCKED"
created_at: "2026-03-26T17:00:00+0530"

# ─── Scenarios ─────────────────────────────────────────────────────────────────

scenarios:

  # ── F1.1 Mentee Registration ─────────────────────────────────────────────────

  - id: "SC-E1-001"
    description: "Verify that submitting a valid email and password creates an unverified mentee account and triggers a verification email"
    feature_ref: "F1.1"
    behavior_ref: "B1.1.1"
    expected_behavior: >
      A new mentee account is created in unverified status and a verification
      email is sent to the provided address.
    pass_criteria: >
      Account exists with unverified status; verification email is received
      at the provided address within a reasonable time window.
    automation: "automated"

  - id: "SC-E1-002"
    description: "Verify that clicking a valid verification link within its validity period marks the account as verified and redirects to the mentee dashboard"
    feature_ref: "F1.1"
    behavior_ref: "B1.1.2"
    expected_behavior: >
      Account status changes from unverified to verified and the user is
      redirected to the mentee dashboard.
    pass_criteria: >
      Account status is verified after link click; user lands on mentee
      dashboard; link is invalidated after use.
    automation: "automated"

  - id: "SC-E1-003"
    description: "Verify that social login via Google creates a verified mentee account and redirects to the mentee dashboard"
    feature_ref: "F1.1"
    behavior_ref: "B1.1.3"
    expected_behavior: >
      The system authenticates via the external provider, creates a verified
      mentee account (email pre-verified by provider), and redirects to the
      mentee dashboard.
    pass_criteria: >
      Mentee account exists with verified status; email matches provider
      email; user lands on mentee dashboard.
    automation: "hybrid"
    manual_element: >
      Validating the end-to-end OAuth flow with a real external provider
      requires human judgment to confirm the consent screen, provider
      branding, and redirect experience are correct.

  - id: "SC-E1-004"
    description: "Verify that social login via Apple creates a verified mentee account and redirects to the mentee dashboard"
    feature_ref: "F1.1"
    behavior_ref: "B1.1.3"
    expected_behavior: >
      The system authenticates via Apple, creates a verified mentee account,
      and redirects to the mentee dashboard.
    pass_criteria: >
      Mentee account exists with verified status; email matches Apple
      provider email; user lands on mentee dashboard.
    automation: "hybrid"
    manual_element: >
      Apple Sign-In requires human interaction with the real provider
      consent flow; automated mocks cannot fully validate the user-facing
      experience.

  - id: "SC-E1-005"
    description: "Verify that registration with an already-used email is rejected with an appropriate error message"
    feature_ref: "F1.1"
    behavior_ref: "B1.1.4"
    expected_behavior: >
      The system rejects the registration and displays an error indicating
      the email is already in use.
    pass_criteria: >
      No duplicate account is created; user sees a clear error message
      about the email being taken; existing account is unaffected.
    automation: "automated"

  - id: "SC-E1-006"
    description: "Verify that a password not meeting minimum strength requirements is rejected with a specific validation message"
    feature_ref: "F1.1"
    behavior_ref: "B1.1.5"
    expected_behavior: >
      The system rejects the registration with a validation message
      specifying the password requirements (at least 8 characters, at
      least one letter and one number).
    pass_criteria: >
      Account is not created; validation message clearly states the
      unmet requirements; user can correct and resubmit.
    automation: "automated"

  # ── F1.2 User Authentication ─────────────────────────────────────────────────

  - id: "SC-E1-007"
    description: "Verify that a verified user with correct credentials is authenticated, issued a session token, and redirected to their role-appropriate dashboard"
    feature_ref: "F1.2"
    behavior_ref: "B1.2.1"
    expected_behavior: >
      The system authenticates the user, issues a session token, and
      redirects to the correct dashboard based on their role (mentee,
      mentor, or admin).
    pass_criteria: >
      Valid session token is issued; user lands on the dashboard matching
      their role; tested for all three persona types.
    automation: "automated"

  - id: "SC-E1-008"
    description: "Verify that incorrect credentials produce a generic error that does not reveal whether the email exists"
    feature_ref: "F1.2"
    behavior_ref: "B1.2.2"
    expected_behavior: >
      The system rejects the login with a generic error message that does
      not indicate whether the email exists in the system.
    pass_criteria: >
      Login fails; error message is identical for non-existent email and
      wrong password cases; no session token is issued.
    automation: "automated"

  - id: "SC-E1-009"
    description: "Verify that more than 10 failed login attempts from the same IP within 15 minutes triggers rate limiting"
    feature_ref: "F1.2"
    behavior_ref: "B1.2.3"
    expected_behavior: >
      The system temporarily blocks further login attempts from the IP
      and returns a rate-limit error.
    pass_criteria: >
      Attempts 1–10 return normal authentication errors; attempt 11+
      returns a rate-limit error; block lifts after the time window.
    automation: "automated"

  - id: "SC-E1-010"
    description: "Verify that a session token nearing expiry is automatically refreshed without requiring re-authentication"
    feature_ref: "F1.2"
    behavior_ref: "B1.2.4"
    expected_behavior: >
      When the session token is within 5 minutes of expiry, the system
      issues a new session token transparently during a request.
    pass_criteria: >
      User continues without interruption; a new valid session token is
      issued; the old token is replaced or invalidated.
    automation: "automated"

  - id: "SC-E1-011"
    description: "Verify that logging out invalidates the current session token and refresh token"
    feature_ref: "F1.2"
    behavior_ref: "B1.2.5"
    expected_behavior: >
      The system invalidates both the session token and any refresh token,
      preventing further authenticated requests.
    pass_criteria: >
      Subsequent requests with the old session token are rejected;
      refresh token cannot be used to obtain a new session; user must
      re-authenticate to access protected resources.
    automation: "automated"

  # ── F1.3 Password Reset & Recovery ───────────────────────────────────────────

  - id: "SC-E1-012"
    description: "Verify that requesting a password reset with a registered email sends a time-limited reset link"
    feature_ref: "F1.3"
    behavior_ref: "B1.3.1"
    expected_behavior: >
      The system sends a reset link valid for 60 minutes to the registered
      email address.
    pass_criteria: >
      Reset email is received; link is functional; link expires after
      60 minutes.
    automation: "automated"

  - id: "SC-E1-013"
    description: "Verify that requesting a password reset with an unregistered email shows the same success message as a registered email"
    feature_ref: "F1.3"
    behavior_ref: "B1.3.1"
    expected_behavior: >
      The system displays a success message identical to the registered-email
      case, preventing email enumeration.
    pass_criteria: >
      Success message is shown; no reset email is sent to the unregistered
      address; response timing does not differ significantly from the
      registered case.
    automation: "automated"

  - id: "SC-E1-014"
    description: "Verify that using a valid reset link with a compliant new password updates the password and invalidates all sessions"
    feature_ref: "F1.3"
    behavior_ref: "B1.3.2"
    expected_behavior: >
      The system updates the password, invalidates all existing sessions,
      and redirects the user to the login page with a confirmation message.
    pass_criteria: >
      New password works for login; old password is rejected; all
      pre-existing sessions are no longer valid; user sees confirmation
      on the login page.
    automation: "automated"

  - id: "SC-E1-015"
    description: "Verify that clicking an expired or already-used reset link displays an error and prompts for a new link"
    feature_ref: "F1.3"
    behavior_ref: "B1.3.3"
    expected_behavior: >
      The system displays an error indicating the link is invalid and
      prompts the user to request a new reset link.
    pass_criteria: >
      Error message is shown; no password change occurs; user is guided
      to request a fresh link.
    automation: "automated"

  # ── F1.4 Admin-Driven Mentor Onboarding ──────────────────────────────────────

  - id: "SC-E1-016"
    description: "Verify that an admin completing all required mentor onboarding fields creates a profile in Pending Verification status"
    feature_ref: "F1.4"
    behavior_ref: "B1.4.1"
    expected_behavior: >
      The system creates the mentor profile in Pending Verification status
      and adds it to the admin review queue.
    pass_criteria: >
      Mentor profile exists with Pending Verification status; all required
      fields (name, email, bio, expertise category, pricing tier,
      availability slot, verification artefact) are persisted; profile
      appears in the review queue.
    automation: "automated"

  - id: "SC-E1-017"
    description: "Verify that an admin can save a partially completed mentor profile as Draft and resume later"
    feature_ref: "F1.4"
    behavior_ref: "B1.4.2"
    expected_behavior: >
      The system stores the partial profile in Draft status so the admin
      can return and complete it.
    pass_criteria: >
      Profile is saved in Draft status; partial data is preserved; admin
      can reopen and continue editing; profile does not appear in the
      verification queue.
    automation: "automated"

  - id: "SC-E1-018"
    description: "Verify that verification artefacts uploaded during mentor onboarding are stored and visible only to administrators"
    feature_ref: "F1.4"
    behavior_ref: "B1.4.3"
    expected_behavior: >
      The system stores the artefact and associates it with the mentor
      profile. The artefact is accessible only to administrators.
    pass_criteria: >
      Artefact is persisted and linked to the correct mentor profile;
      admin can view the artefact; non-admin users cannot access the
      artefact.
    automation: "hybrid"
    manual_element: >
      Verifying that uploaded documents (LinkedIn URL, portfolio URL,
      document files) render correctly and are usable for review
      requires human judgment on content quality and accessibility.

  - id: "SC-E1-019"
    description: "Verify that submitting a mentor profile for verification generates login credentials that are held until approval"
    feature_ref: "F1.4"
    behavior_ref: "B1.4.4"
    expected_behavior: >
      The system generates login credentials for the mentor and holds
      them until the profile is approved.
    pass_criteria: >
      Credentials are generated; mentor cannot log in before approval;
      credentials are delivered only after admin approval (tested in
      SC-E1-022).
    automation: "automated"

  # ── F1.5 Mentor Verification & Badge Assignment ──────────────────────────────

  - id: "SC-E1-020"
    description: "Verify that the admin verification queue displays all Pending Verification profiles sorted by submission date"
    feature_ref: "F1.5"
    behavior_ref: "B1.5.1"
    expected_behavior: >
      The system displays all mentor profiles in Pending Verification
      status, sorted oldest-first, with summary information.
    pass_criteria: >
      All pending profiles are listed; sort order is oldest submission
      first; each entry shows name, expertise category, and artefact
      count; no non-pending profiles appear.
    automation: "automated"

  - id: "SC-E1-021"
    description: "Verify that admin approval of a pending mentor changes status to Verified, assigns the badge, and delivers credentials"
    feature_ref: "F1.5"
    behavior_ref: "B1.5.2"
    expected_behavior: >
      The system changes status to Verified, assigns the verified badge,
      and delivers login credentials to the mentor's email.
    pass_criteria: >
      Mentor status is Verified; verified badge is present on the profile;
      credential email is received by the mentor; mentor can log in with
      delivered credentials.
    automation: "hybrid"
    manual_element: >
      Verifying the credential delivery email content (clarity, branding,
      correct login instructions) requires human review to ensure the
      mentor onboarding experience meets quality standards.

  - id: "SC-E1-022"
    description: "Verify that admin rejection of a pending mentor records the reason and notifies the onboarding admin"
    feature_ref: "F1.5"
    behavior_ref: "B1.5.3"
    expected_behavior: >
      The system changes status to Rejected, records the rejection reason,
      and notifies the original onboarding admin.
    pass_criteria: >
      Mentor status is Rejected; rejection reason is persisted and
      viewable; notification is sent to the onboarding admin; profile
      can still be edited.
    automation: "automated"

  - id: "SC-E1-023"
    description: "Verify that a rejected mentor profile can be edited and re-submitted to the end of the verification queue"
    feature_ref: "F1.5"
    behavior_ref: "B1.5.4"
    expected_behavior: >
      The system moves the re-submitted profile back to Pending Verification
      status and places it at the end of the review queue.
    pass_criteria: >
      Profile status changes from Rejected to Pending Verification;
      profile appears at the end of the queue (after other pending
      profiles); edits are persisted.
    automation: "automated"

  # ── F1.6 Profile Management ──────────────────────────────────────────────────

  - id: "SC-E1-024"
    description: "Verify that a mentee viewing their profile sees all fields and a completeness indicator"
    feature_ref: "F1.6"
    behavior_ref: "B1.6.1"
    expected_behavior: >
      The system displays all current profile fields (name, email, avatar,
      interests, goals) and a completeness indicator showing the percentage
      of optional fields filled.
    pass_criteria: >
      All profile fields are displayed; completeness percentage reflects
      the actual state of optional fields; empty fields are clearly
      indicated.
    automation: "automated"

  - id: "SC-E1-025"
    description: "Verify that a mentee can edit their profile, save changes, and see the completeness indicator update"
    feature_ref: "F1.6"
    behavior_ref: "B1.6.2"
    expected_behavior: >
      The system validates the input, persists the changes, and updates
      the completeness indicator immediately.
    pass_criteria: >
      Changes are saved; profile reflects new values on reload;
      completeness indicator adjusts correctly after adding or removing
      optional field values.
    automation: "automated"

  - id: "SC-E1-026"
    description: "Verify that a mentor viewing their profile sees all fields including verification status and completeness"
    feature_ref: "F1.6"
    behavior_ref: "B1.6.3"
    expected_behavior: >
      The system displays all mentor profile fields (bio, expertise
      categories, pricing tiers, availability schedule, profile photo,
      verification status) and a completeness indicator.
    pass_criteria: >
      All mentor-specific fields are shown; verification status
      (Draft/Pending/Verified/Rejected) is displayed; completeness
      indicator is present and accurate.
    automation: "automated"

  - id: "SC-E1-027"
    description: "Verify that a mentor can edit pricing and availability with changes effective for future sessions only"
    feature_ref: "F1.6"
    behavior_ref: "B1.6.4"
    expected_behavior: >
      The system validates the input and persists the changes. Pricing
      changes apply to future sessions only.
    pass_criteria: >
      Updated pricing and availability are saved and visible on the
      profile; validation rejects invalid input (e.g. negative pricing);
      pricing change is flagged as future-only.
    automation: "automated"

  - id: "SC-E1-028"
    description: "Verify that a user cannot view or edit another user's private profile fields"
    feature_ref: "F1.6"
    behavior_ref: "B1.6.5"
    expected_behavior: >
      The system denies the request and returns an authorization error
      when a user attempts to access another user's private profile data.
    pass_criteria: >
      Request is denied with an authorization error; no private data is
      returned in the response; tested for mentee-to-mentee,
      mentor-to-mentor, and cross-role attempts.
    automation: "automated"

  # ── F1.7 Role-Based Access Control ───────────────────────────────────────────

  - id: "SC-E1-029"
    description: "Verify that a mentee attempting to access admin-only functions receives a forbidden error"
    feature_ref: "F1.7"
    behavior_ref: "B1.7.1"
    expected_behavior: >
      The system denies the request and returns a forbidden error when a
      mentee tries to access admin functions (verification queue, system
      configuration).
    pass_criteria: >
      Request is denied; forbidden error is returned; no admin data is
      exposed; tested against multiple admin-only endpoints.
    automation: "automated"

  - id: "SC-E1-030"
    description: "Verify that a mentor cannot access another mentor's private data"
    feature_ref: "F1.7"
    behavior_ref: "B1.7.2"
    expected_behavior: >
      The system denies the request and returns a forbidden error when a
      mentor tries to access another mentor's earnings, verification
      artefacts, or contact details.
    pass_criteria: >
      Request is denied; forbidden error is returned; no private data
      from the other mentor is included in the response.
    automation: "automated"

  - id: "SC-E1-031"
    description: "Verify that an administrator can view all users with their status, registration date, and profile completeness"
    feature_ref: "F1.7"
    behavior_ref: "B1.7.3"
    expected_behavior: >
      The system displays a list of all mentees and mentors with status
      (active, pending, rejected), registration date, and profile
      completeness.
    pass_criteria: >
      All user accounts appear in the list; status filters work
      correctly; registration dates and completeness percentages are
      accurate.
    automation: "automated"

  - id: "SC-E1-032"
    description: "Verify that an unauthenticated user accessing a protected page is redirected to login or receives an authentication error"
    feature_ref: "F1.7"
    behavior_ref: "B1.7.4"
    expected_behavior: >
      The system redirects unauthenticated web users to the login page
      and returns an authentication error for unauthenticated API
      requests.
    pass_criteria: >
      Web request redirects to login page; API request returns
      authentication error with appropriate status; no protected data
      is leaked in the redirect or error response.
    automation: "automated"

  # ── Invariant Scenarios ──────────────────────────────────────────────────────

  - id: "SC-E1-033"
    description: "Verify that a mentor profile in any non-approved status is never visible to mentees"
    feature_ref: "F1.5"
    invariant_ref: "INV-01"
    expected_behavior: >
      Mentor profiles in Draft, Pending Verification, or Rejected status
      are completely hidden from mentee-facing views and queries.
    pass_criteria: >
      Mentee search, browse, and direct-access requests return no data
      for unapproved mentors; only Verified mentors are visible; tested
      for each non-approved status.
    automation: "automated"

  - id: "SC-E1-034"
    description: "Verify that each authenticated request is associated with exactly one role and a user cannot hold multiple roles"
    feature_ref: "F1.7"
    invariant_ref: "INV-02"
    expected_behavior: >
      Every session is bound to a single role (Mentee, Mentor, or Admin)
      and the system prevents assignment of multiple roles to the same
      user.
    pass_criteria: >
      Session carries exactly one role; attempts to assign a second role
      fail; cross-role access is denied even if manipulating session
      data.
    automation: "automated"

  - id: "SC-E1-035"
    description: "Verify that the verified badge can only be assigned by an administrator and cannot be self-assigned by a mentor"
    feature_ref: "F1.5"
    invariant_ref: "INV-03"
    expected_behavior: >
      Only administrator actions can assign the verified badge. Mentor
      attempts to assign the badge to themselves are rejected.
    pass_criteria: >
      Admin approval assigns the badge successfully; direct mentor
      requests to set their own verified status are rejected; badge
      status cannot be modified through profile edit.
    automation: "automated"

  - id: "SC-E1-036"
    description: "Verify that email uniqueness is enforced across all user accounts regardless of role"
    feature_ref: "F1.1"
    invariant_ref: "INV-04"
    expected_behavior: >
      No two user accounts (mentee, mentor, or admin) can share the same
      email address.
    pass_criteria: >
      Registration with an email already used by any role is rejected;
      admin mentor onboarding with a duplicate email is rejected;
      uniqueness is case-insensitive.
    automation: "automated"

  - id: "SC-E1-037"
    description: "Verify that passwords are never stored in readable form and never appear in any response, log, or notification"
    feature_ref: "F1.2"
    invariant_ref: "INV-05"
    expected_behavior: >
      Passwords are stored using one-way hashing. No API response, log
      entry, error message, or notification ever contains the password
      in readable form.
    pass_criteria: >
      Stored password value is a one-way hash, not plaintext; API
      responses for user profiles and authentication omit the password
      field entirely; log output contains no password values.
    automation: "hybrid"
    manual_element: >
      Reviewing log output, error messages, and notification content
      for accidental credential exposure requires human inspection
      across multiple system components and edge cases.

