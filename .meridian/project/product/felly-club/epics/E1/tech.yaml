        ├── public/
        │   └── felly-logo.svg
        ├── .env.local.example
        ├── next.config.ts                         # Next.js config: allowed image domains (S3 bucket), API rewrites if needed
        ├── tailwind.config.ts                     # Tailwind config: content paths, shadcn/ui theme extension
        ├── postcss.config.mjs
        ├── tsconfig.json
        └── package.json

    - name: "packages/admin-portal"
      type: "nextjs"
      description: "Next.js 15 admin portal — CSR-dominant, mentor onboarding, verification queue, user management"
      directory_tree: |
        packages/admin-portal/
        ├── src/
        │   ├── app/
        │   │   ├── layout.tsx                     # Root layout: QueryProvider, fonts, global CSS
        │   │   ├── page.tsx                       # Root page: redirects authenticated admin → /portal/dashboard, else → /login
        │   │   ├── (auth)/                        # Route group: admin login only
        │   │   │   ├── layout.tsx                 # Auth layout: centered card
        │   │   │   └── login/
        │   │   │       └── page.tsx               # Admin login: email/password only (no social login for admin)
        │   │   ├── (portal)/                      # Route group: all authenticated admin pages
