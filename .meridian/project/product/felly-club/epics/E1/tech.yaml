# ─── Mock-First Acknowledgement ───────────────────────────────────────────────
# Per architecture.yaml mock_first_services:
# KeyCloak is mocked in E1 via IAuthAdapter DI token → MockAuthAdapter.
# The same NestJS guards, decorators, and JWT payload shape used in E1 will
# work unchanged when MockAuthAdapter is swapped for KeyCloakAuthAdapter in E11.
# No real KeyCloak instance is required to run E1 locally or in CI.
mock_first:
  keycloak:
    strategy: "IAuthAdapter interface injected via DI token AUTH_ADAPTER_TOKEN. MockAuthAdapter issues real JWTs (jsonwebtoken) signed with JWT_SECRET, stores user credentials in PostgreSQL (bcrypt-hashed passwords), and validates tokens locally. In E11, KeyCloakAuthAdapter replaces MockAuthAdapter with no guard or decorator changes."
    di_token: "AUTH_ADAPTER_TOKEN"
    provider_class_e1: "MockAuthAdapter"
    provider_class_e11: "KeyCloakAuthAdapter"
    jwt_payload_shape: "{ sub: string, email: string, realm_access: { roles: [UserRole] }, iss: string, aud: string, exp: number, iat: number }"
  stripe:
    notes: "Stripe not applicable to E1 (payment is E4). No Stripe mock needed in E1."

# ─── Project Structure ────────────────────────────────────────────────────────

project_structure:
  root: "felly-club/"
  package_manager: "pnpm 9.x"
  workspace_config: "pnpm-workspace.yaml"
  node_version: "20 LTS"

  root_files:
    - path: "pnpm-workspace.yaml"
      purpose: "Declares packages/* as pnpm workspace packages"
      content_note: |
        packages:
          - 'packages/*'
    - path: "package.json"
      purpose: "Root workspace package.json with shared dev scripts (lint, typecheck, test, build)"
    - path: "tsconfig.base.json"
      purpose: "Base TypeScript config extended by all packages — strict mode, decorators, paths"
      content_note: |
        {
          "compilerOptions": {
            "strict": true,
            "experimentalDecorators": true,
            "emitDecoratorMetadata": true,
            "moduleResolution": "bundler",
            "target": "ES2022",
            "lib": ["ES2022"],
            "paths": { "@felly/shared-types": ["./packages/shared-types/src/index.ts"] }
          }
        }
    - path: "docker-compose.yml"
      purpose: "Local dev services: PostgreSQL 16 and Redis 7 (KeyCloak excluded — mock auth in E1)"
    - path: ".env.local.example"
      purpose: "Template environment file — committed to git, never contains real secrets"
    - path: ".prettierrc"
      purpose: "Prettier config: printWidth 100, singleQuote true, trailingComma es5, tabWidth 2"
    - path: ".eslintrc.json"
      purpose: "Root ESLint config using @typescript-eslint/eslint-plugin strict mode"
    - path: ".husky/pre-commit"
      purpose: "Runs lint-staged (ESLint + Prettier) on staged files before every commit"
    - path: ".github/workflows/ci.yml"
      purpose: "GitHub Actions CI: lint → typecheck → test → build (all packages)"
    - path: "infra/keycloak/realm-export.json"
      purpose: "KeyCloak realm config for E11 (stub file created in E1 for future reference)"
    - path: "docs/adr/ADR-001-modular-monolith.md"
      purpose: "First ADR: decision to use NestJS modular monolith over microservices"

  packages:
    - name: "packages/shared-types"
      type: "typescript-library"
      description: "Shared TypeScript interfaces and enums for API contracts used by all packages"
      directory_tree: |
        packages/shared-types/
        ├── src/
        │   ├── enums/
        │   │   ├── user-role.enum.ts          # UserRole: MENTEE | MENTOR | ADMIN
        │   │   ├── user-status.enum.ts        # UserStatus: PENDING_EMAIL_VERIFICATION | ACTIVE | SUSPENDED
        │   │   ├── mentor-status.enum.ts      # MentorProfileStatus: DRAFT | PENDING_VERIFICATION | VERIFIED | REJECTED
        │   │   ├── expertise-category.enum.ts # ExpertiseCategory: SPORT | ENTREPRENEURSHIP | BUSINESS | ENTERTAINMENT
        │   │   └── artefact-type.enum.ts      # ArtefactType: LINKEDIN_URL | PORTFOLIO_URL | DOCUMENT
        │   ├── types/
        │   │   ├── user.types.ts              # IUser, IMenteeProfile, IMentorProfile
        │   │   ├── auth.types.ts              # IAuthTokens, IJwtPayload, ILoginResponse
        │   │   ├── mentor.types.ts            # IPricingTier, IAvailabilitySlot, IVerificationArtefact
        │   │   └── api-response.types.ts      # IPaginatedResponse<T>, IApiError
        │   └── index.ts                       # Re-exports all types and enums
        ├── tsconfig.json
        └── package.json

    - name: "packages/backend-api"
      type: "nestjs"
      description: "NestJS 10 backend with Fastify adapter — AuthModule, UserModule, AdminModule for E1"
      directory_tree: |
        packages/backend-api/
        ├── src/
        │   ├── main.ts                            # Bootstrap: NestFactory with Fastify, ValidationPipe, global filters
        │   ├── app.module.ts                      # Root module: imports PrismaModule, AuthModule, UserModule, AdminModule, HealthModule
        │   ├── auth/
        │   │   ├── adapters/
        │   │   │   ├── auth-adapter.interface.ts  # IAuthAdapter contract (swappable in E11)
        │   │   │   └── mock-auth.adapter.ts       # MockAuthAdapter: JWT via jsonwebtoken, bcrypt passwords, PG storage
        │   │   ├── decorators/
        │   │   │   ├── current-user.decorator.ts  # @CurrentUser(): extracts JwtPayload from request
        │   │   │   └── roles.decorator.ts         # @Roles(UserRole.ADMIN): sets roles metadata
        │   │   ├── dto/
        │   │   │   ├── register.dto.ts            # RegisterDto: email, password (+ optional role, defaults MENTEE)
        │   │   │   ├── login.dto.ts               # LoginDto: email, password
        │   │   │   ├── forgot-password.dto.ts     # ForgotPasswordDto: email
        │   │   │   ├── reset-password.dto.ts      # ResetPasswordDto: token, newPassword
        │   │   │   └── refresh-token.dto.ts       # RefreshTokenDto: refreshToken
        │   │   ├── guards/
        │   │   │   ├── jwt-auth.guard.ts          # JwtAuthGuard: validates Bearer JWT, sets request.user
        │   │   │   └── roles.guard.ts             # RolesGuard: checks realm_access.roles vs @Roles()
        │   │   ├── interfaces/
        │   │   │   └── jwt-payload.interface.ts   # JwtPayload interface matching KeyCloak shape
        │   │   ├── auth.controller.ts             # Routes: register, login, logout, refresh, verify-email, forgot/reset-password, social
        │   │   ├── auth.service.ts                # Delegates to IAuthAdapter, handles user persistence
        │   │   └── auth.module.ts                 # Provides MockAuthAdapter via AUTH_ADAPTER_TOKEN, exports JwtAuthGuard, RolesGuard
        │   ├── user/
        │   │   ├── dto/
        │   │   │   ├── update-mentee-profile.dto.ts  # UpdateMenteeProfileDto: firstName?, lastName?, interests?, goals?, avatarKey?
        │   │   │   ├── update-mentor-profile.dto.ts  # UpdateMentorProfileDto: bio?, pricingTiers?, availabilitySlots?, photoKey?
        │   │   │   └── user-response.dto.ts          # UserResponseDto: serialized user with profile (no passwordHash)
        │   │   ├── user.controller.ts             # Routes: GET/PATCH /users/me, GET/PATCH /users/me/mentee-profile, GET/PATCH /users/me/mentor-profile
        │   │   ├── user.service.ts                # Business logic: profile updates, completeness calculation
        │   │   ├── user.repository.ts             # Prisma queries: findById, updateMenteeProfile, updateMentorProfile
        │   │   └── user.module.ts                 # Imports PrismaModule, AuthModule; exports UserService
        │   ├── admin/
        │   │   ├── dto/
        │   │   │   ├── create-mentor.dto.ts       # CreateMentorDto: all required mentor onboarding fields
        │   │   │   ├── update-mentor.dto.ts       # UpdateMentorDto: partial mentor fields for draft editing
        │   │   │   ├── reject-mentor.dto.ts       # RejectMentorDto: reason (string, required)
        │   │   │   └── mentor-response.dto.ts     # MentorResponseDto: mentor profile + artefacts (no sensitive data)
        │   │   ├── admin.controller.ts            # Routes: users list/detail, mentor CRUD, submit, verify-queue, approve/reject, artefacts
        │   │   ├── admin.service.ts               # Business logic: mentor onboarding workflow, verification state machine
        │   │   ├── admin.repository.ts            # Prisma queries: mentor profile CRUD, artefact CRUD, user listing
        │   │   └── admin.module.ts                # Imports PrismaModule, AuthModule, UserModule
        │   ├── prisma/
        │   │   ├── prisma.module.ts               # Global module, exports PrismaService
        │   │   └── prisma.service.ts              # Extends PrismaClient, connects on ModuleInit, disconnects on ModuleDestroy
        │   ├── common/
        │   │   ├── filters/
        │   │   │   └── http-exception.filter.ts   # Global filter: maps NestJS HttpExceptions to { statusCode, message, error, timestamp }
        │   │   ├── interceptors/
        │   │   │   └── logging.interceptor.ts     # Logs each request with method, path, duration_ms, status; uses nestjs-pino logger
        │   │   └── constants.ts                   # AUTH_ADAPTER_TOKEN = Symbol('AUTH_ADAPTER_TOKEN')
        │   └── health/
        │       └── health.controller.ts           # GET /health → { status: "ok", timestamp, version }
        ├── prisma/
        │   ├── schema.prisma                      # Full Prisma schema: all E1 entities + enums
        │   └── migrations/                        # Migration files generated by prisma migrate dev
        ├── test/
        │   ├── auth/
        │   │   ├── auth.controller.spec.ts        # Unit tests for AuthController
        │   │   ├── auth.service.spec.ts           # Unit tests for AuthService + MockAuthAdapter
        │   │   └── auth.e2e-spec.ts               # E2e: register → verify-email → login → logout flow
        │   ├── user/
        │   │   ├── user.controller.spec.ts        # Unit tests for UserController
        │   │   └── user.service.spec.ts           # Unit tests for profile update and completeness
        │   └── admin/
        │       ├── admin.controller.spec.ts       # Unit tests for AdminController
        │       ├── admin.service.spec.ts          # Unit tests for mentor onboarding state machine
        │       └── admin.e2e-spec.ts              # E2e: onboard mentor → submit → approve → credentials delivered
        ├── .env.local.example                     # Template with all required env vars and placeholder values
        ├── jest.config.ts                         # Jest config: ts-jest, coverage thresholds (80% auth/admin/user)
        ├── tsconfig.json                          # Extends tsconfig.base.json, adds rootDir src
        └── package.json

    - name: "packages/mentee-web-app"
      type: "nextjs"
      description: "Next.js 15 mentee-facing app — registration, login, email verify, password reset, dashboard, profile management"
      directory_tree: |
        packages/mentee-web-app/
        ├── src/
        │   ├── app/
        │   │   ├── layout.tsx                     # Root layout: QueryProvider, fonts, global CSS
        │   │   ├── page.tsx                       # Root page: redirects authenticated → /dashboard, unauthenticated → /login
        │   │   ├── (auth)/                        # Route group: unauthenticated pages, centered-card layout, no nav
        │   │   │   ├── layout.tsx                 # Auth layout: full-height centered card, Felly Club logo
        │   │   │   ├── login/
        │   │   │   │   └── page.tsx               # Login page: email/password form + social login buttons
        │   │   │   ├── register/
