# ─── Data Model ───────────────────────────────────────────────────────────────

data_model:
  engine: "Prisma ORM 5.x"
  database: "PostgreSQL 16"
  schema_path: "packages/backend-api/prisma/schema.prisma"

  conventions:
    - "All primary keys are UUID strings generated by @default(uuid())"
    - "All monetary amounts stored as integer cents/paise/rappen (no floating point per quality-standards.yaml)"
    - "All timestamps use DateTime with @default(now()) for createdAt and @updatedAt for updatedAt"
    - "Cascade deletes on child records when parent User is deleted (GDPR right-to-deletion)"
    - "PII fields (email, IP addresses) are never logged; IP stored as SHA-256 hash in AuditLog"
    - "All enums defined in Prisma schema and mirrored in shared-types package"

  entities:

    - name: "User"
      purpose: "Core user account for all three personas — single table, role discriminates persona"
      prisma_schema: |
        model User {
          id              String        @id @default(uuid())
          email           String        @unique
          passwordHash    String?       // null for social-login-only users (managed in E11 by KeyCloak)
          role            UserRole
          status          UserStatus    @default(PENDING_EMAIL_VERIFICATION)
          keycloakId      String?       @unique  // null in E1; populated when KeyCloak wired in E11

          createdAt       DateTime      @default(now())
          updatedAt       DateTime      @updatedAt

          menteeProfile   MenteeProfile?
          mentorProfile   MentorProfile?
          auditLogs       AuditLog[]

          @@index([email])
          @@index([role, status])
        }
      fields:
        - { name: "id", type: "String UUID", constraints: "primary key" }
        - { name: "email", type: "String", constraints: "unique, not null" }
        - { name: "passwordHash", type: "String?", constraints: "nullable — null for OAuth users or before mock sets it" }
        - { name: "role", type: "UserRole enum", constraints: "not null — MENTEE | MENTOR | ADMIN" }
        - { name: "status", type: "UserStatus enum", constraints: "not null, default PENDING_EMAIL_VERIFICATION" }
        - { name: "keycloakId", type: "String?", constraints: "unique, nullable — null until E11" }

    - name: "MenteeProfile"
      purpose: "Mentee-specific profile data — one-to-one with User where role = MENTEE"
      prisma_schema: |
        model MenteeProfile {
          id              String    @id @default(uuid())
          userId          String    @unique
          user            User      @relation(fields: [userId], references: [id], onDelete: Cascade)
          firstName       String
          lastName        String
          avatarKey       String?   // S3 object key in felly-artefacts bucket; resolved to presigned URL by UserService
          interests       String[]  @default([])   // free-text interest tags e.g. ["machine learning", "product management"]
          goals           String?   // 1000 char max
          completeness    Int       @default(0)     // 0–100 integer; recomputed by UserService on every profile update

          createdAt       DateTime  @default(now())
          updatedAt       DateTime  @updatedAt
        }
      completeness_calculation:
        description: "completeness is a 0–100 integer recomputed by UserService.computeMenteeCompleteness() on every profile update"
        fields:
          - { field: "firstName", weight: 20, required: true }
          - { field: "lastName", weight: 20, required: true }
          - { field: "avatarKey", weight: 20, required: false }
          - { field: "interests (length > 0)", weight: 20, required: false }
          - { field: "goals", weight: 20, required: false }

    - name: "MentorProfile"
      purpose: "Mentor-specific profile data — one-to-one with User where role = MENTOR; carries verification lifecycle"
      prisma_schema: |
        model MentorProfile {
          id                    String                 @id @default(uuid())
          userId                String                 @unique
          user                  User                   @relation(fields: [userId], references: [id], onDelete: Cascade)
          firstName             String
          lastName              String
          bio                   String                 // 2000 char max
          expertiseCategories   ExpertiseCategory[]    // PostgreSQL array: one or more categories required
          photoKey              String?                // S3 key in felly-artefacts bucket
          status                MentorProfileStatus    @default(DRAFT)
          verifiedBadge         Boolean                @default(false)  // set true only by AdminService.approveMentor()
          rejectionReason       String?                // set by AdminService.rejectMentor()
          submittedAt           DateTime?              // set when admin submits profile for verification
          verifiedAt            DateTime?              // set when admin approves
          completeness          Int                    @default(0)  // 0–100 integer

          pricingTiers          MentorPricingTier[]
          availabilitySlots     MentorAvailabilitySlot[]
          verificationArtefacts VerificationArtefact[]

          createdAt             DateTime               @default(now())
          updatedAt             DateTime               @updatedAt

          @@index([status])
          @@index([userId])
        }
      status_lifecycle:
        states: ["DRAFT", "PENDING_VERIFICATION", "VERIFIED", "REJECTED"]
        transitions:
          - from: "DRAFT"
            to: "PENDING_VERIFICATION"
            trigger: "AdminService.submitMentorForVerification() — validates all required fields and artefact present"
            guard: "firstName, lastName, bio, expertiseCategories (>=1), pricingTiers (>=1), availabilitySlots (>=1), verificationArtefacts (>=1) must all be set"
          - from: "PENDING_VERIFICATION"
            to: "VERIFIED"
            trigger: "AdminService.approveMentor() — only ADMIN role"
            side_effect: "verifiedBadge = true, verifiedAt = now(), mentor User.status = ACTIVE, credential delivery noted in AuditLog"
          - from: "PENDING_VERIFICATION"
            to: "REJECTED"
            trigger: "AdminService.rejectMentor(reason) — only ADMIN role"
            side_effect: "rejectionReason stored, audit log entry created"
          - from: "REJECTED"
            to: "DRAFT"
            trigger: "AdminService.resetRejectedMentor() — allows re-editing; clears rejectionReason"
          - from: "DRAFT"
            to: "PENDING_VERIFICATION"
            trigger: "Re-submission after rejection edit"
      completeness_calculation:
        description: "completeness is a 0–100 integer recomputed by AdminService.computeMentorCompleteness() on every profile update"
        fields:
          - { field: "firstName", weight: 10, required: true }
          - { field: "lastName", weight: 10, required: true }
          - { field: "bio", weight: 15, required: true }
          - { field: "expertiseCategories (length > 0)", weight: 15, required: true }
          - { field: "pricingTiers (length > 0)", weight: 15, required: true }
          - { field: "availabilitySlots (length > 0)", weight: 15, required: true }
          - { field: "photoKey", weight: 10, required: false }
          - { field: "verificationArtefacts (length > 0)", weight: 10, required: true }
      invariant_enforcement:
        INV-01: "verifiedBadge can only be set true by AdminService.approveMentor(). Never set directly in UserService or via API by non-Admin role."
        INV-03: "MentorProfile.status is only changed by AdminService methods. UserService cannot change status."

    - name: "MentorPricingTier"
      purpose: "Each mentor can offer multiple session durations with per-currency pricing"
      prisma_schema: |
        model MentorPricingTier {
          id              String        @id @default(uuid())
          mentorProfileId String
          mentorProfile   MentorProfile @relation(fields: [mentorProfileId], references: [id], onDelete: Cascade)
          durationMinutes Int           // 30 | 45 | 60 | 90 — validated in DTO
          priceInr        Int?          // Amount in paise (1 INR = 100 paise); null means INR not offered
          priceUsd        Int?          // Amount in USD cents; null means USD not offered
          priceChf        Int?          // Amount in CHF rappen; null means CHF not offered
          priceEur        Int?          // Amount in EUR cents; null means EUR not offered

          @@unique([mentorProfileId, durationMinutes])
        }
      notes:
        - "At least one currency price must be non-null per tier (validated in CreateMentorDto)"
        - "Price = 0 is not allowed — minimum 1 unit of the currency (validated in DTO)"
        - "durationMinutes must be one of [30, 45, 60, 90] — validated via @IsIn decorator"

    - name: "MentorAvailabilitySlot"
      purpose: "Weekly recurring availability schedule for a mentor — used in E3 for booking slot selection"
      prisma_schema: |
        model MentorAvailabilitySlot {
          id              String        @id @default(uuid())
          mentorProfileId String
          mentorProfile   MentorProfile @relation(fields: [mentorProfileId], references: [id], onDelete: Cascade)
          dayOfWeek       Int           // 0 = Sunday, 1 = Monday, ..., 6 = Saturday
          startTimeUtc    String        // "HH:MM" format (e.g., "09:00") — UTC always
          endTimeUtc      String        // "HH:MM" format (e.g., "17:00") — UTC always

          @@unique([mentorProfileId, dayOfWeek, startTimeUtc])
        }
      notes:
        - "All times stored in UTC — frontend converts to local timezone for display"
        - "startTimeUtc must be before endTimeUtc — validated in DTO (@IsTimeString custom validator)"
        - "Minimum slot duration: 30 minutes (endTimeUtc − startTimeUtc >= 30 min)"

    - name: "VerificationArtefact"
      purpose: "Documents/URLs submitted by admin as evidence of mentor's credentials — admin-eyes-only"
      prisma_schema: |
        model VerificationArtefact {
          id              String          @id @default(uuid())
          mentorProfileId String
          mentorProfile   MentorProfile   @relation(fields: [mentorProfileId], references: [id], onDelete: Cascade)
          artefactType    ArtefactType    // LINKEDIN_URL | PORTFOLIO_URL | DOCUMENT
          url             String?         // For LINKEDIN_URL and PORTFOLIO_URL types; null for DOCUMENT
          s3Key           String?         // S3 key in felly-artefacts bucket; null for URL types
          fileName        String?         // Original file name (for DOCUMENT type only)
          mimeType        String?         // e.g., "application/pdf", "image/jpeg" (for DOCUMENT type only)

          createdAt       DateTime        @default(now())
        }
      invariant_enforcement:
        INV-03: "VerificationArtefacts are only readable by Admin role — AdminModule guards all artefact endpoints with @Roles(UserRole.ADMIN)"

    - name: "AuditLog"
      purpose: "Security and compliance audit trail for key user and admin actions — retained for compliance review"
      prisma_schema: |
        model AuditLog {
          id              String      @id @default(uuid())
          userId          String?     // null for unauthenticated actions (e.g., failed login attempt)
          user            User?       @relation(fields: [userId], references: [id], onDelete: SetNull)
          action          AuditAction
          ipAddressHash   String?     // SHA-256 hash of IP address — GDPR: never store raw IP
          metadata        Json?       // Additional context — must never include PII (email, name, etc.)

          createdAt       DateTime    @default(now())

          @@index([userId])
          @@index([action])
          @@index([createdAt])
        }
      logged_actions:
        - "USER_REGISTERED — userId, metadata: { role }"
        - "EMAIL_VERIFIED — userId"
        - "USER_LOGGED_IN — userId, ipAddressHash"
        - "USER_LOGGED_OUT — userId"
        - "PASSWORD_RESET_REQUESTED — userId (or null if email not found)"
        - "PASSWORD_RESET_COMPLETED — userId"
        - "MENTOR_PROFILE_CREATED — userId (admin), metadata: { mentorProfileId }"
        - "MENTOR_PROFILE_SUBMITTED — userId (admin), metadata: { mentorProfileId }"
        - "MENTOR_PROFILE_APPROVED — userId (admin), metadata: { mentorProfileId, mentorUserId }"
        - "MENTOR_PROFILE_REJECTED — userId (admin), metadata: { mentorProfileId, reason }"
        - "VERIFICATION_ARTEFACT_UPLOADED — userId (admin), metadata: { mentorProfileId, artefactType }"
        - "USER_PROFILE_UPDATED — userId"

  enums:
    - name: "UserRole"
      values: ["MENTEE", "MENTOR", "ADMIN"]
      usage: "User.role — enforced by INV-02: single role per user, no multiple roles"

    - name: "UserStatus"
      values: ["PENDING_EMAIL_VERIFICATION", "ACTIVE", "SUSPENDED"]
      notes:
        - "PENDING_EMAIL_VERIFICATION: default on registration; transitions to ACTIVE after email verify (B1.1.2) or social login (B1.1.3)"
        - "ACTIVE: fully authenticated and can use the platform"
        - "SUSPENDED: admin-suspended account (not in E1 scope but enum reserved for E6)"

    - name: "MentorProfileStatus"
      values: ["DRAFT", "PENDING_VERIFICATION", "VERIFIED", "REJECTED"]
      notes: "Full lifecycle in MentorProfile.status_lifecycle above"

    - name: "ExpertiseCategory"
      values: ["SPORT", "ENTREPRENEURSHIP", "BUSINESS", "ENTERTAINMENT"]
      notes: "From features.yaml F1.4 definition — exactly these four categories at MVP"

    - name: "ArtefactType"
      values: ["LINKEDIN_URL", "PORTFOLIO_URL", "DOCUMENT"]

    - name: "AuditAction"
      values:
        - "USER_REGISTERED"
        - "EMAIL_VERIFIED"
        - "USER_LOGGED_IN"
        - "USER_LOGGED_OUT"
        - "PASSWORD_RESET_REQUESTED"
        - "PASSWORD_RESET_COMPLETED"
        - "MENTOR_PROFILE_CREATED"
        - "MENTOR_PROFILE_SUBMITTED"
        - "MENTOR_PROFILE_APPROVED"
        - "MENTOR_PROFILE_REJECTED"
        - "VERIFICATION_ARTEFACT_UPLOADED"
        - "USER_PROFILE_UPDATED"

# ─── Components ───────────────────────────────────────────────────────────────

components:

  # ── Backend NestJS Modules ─────────────────────────────────────────────────

  - id: "PrismaModule"
    type: "nestjs-module"
    package: "packages/backend-api"
    responsibility: "Provides a singleton PrismaService (extends PrismaClient) for all repository classes. Manages database connection lifecycle (connect on ModuleInit, graceful disconnect on ModuleDestroy). Declared as @Global() so all modules can inject PrismaService without explicit import."
    key_files:
      - path: "src/prisma/prisma.module.ts"
        purpose: "@Global() @Module({ providers: [PrismaService], exports: [PrismaService] })"
      - path: "src/prisma/prisma.service.ts"
        purpose: "extends PrismaClient; implements OnModuleInit (this.$connect()), OnModuleDestroy (this.$disconnect())"
      - path: "prisma/schema.prisma"
        purpose: "Full Prisma schema — all entities, enums, and relations for E1"
    public_api:
      exports: ["PrismaService"]
    notes: "No direct Prisma calls in controllers or service layers except through PrismaService injected into repository classes"

  - id: "AuthModule"
    type: "nestjs-module"
    package: "packages/backend-api"
    responsibility: "Handles all authentication flows: registration, login (email+password and social), email verification, password reset, token refresh, and logout. Issues JWTs via MockAuthAdapter (DI-swappable for KeyCloakAuthAdapter in E11). Provides JwtAuthGuard and RolesGuard used by all other modules. Enforces INV-02 (single role per user) and INV-04 (unique email) and INV-05 (passwords never in responses)."
    key_files:
      - path: "src/auth/auth.module.ts"
        purpose: "Provides AUTH_ADAPTER_TOKEN → MockAuthAdapter, PassportModule, JwtStrategy; exports JwtAuthGuard, RolesGuard, Roles decorator, CurrentUser decorator"
      - path: "src/auth/auth.controller.ts"
        purpose: "REST routes: POST /auth/register, POST /auth/login, POST /auth/logout, POST /auth/refresh, GET /auth/verify-email, POST /auth/forgot-password, POST /auth/reset-password, GET /auth/social/google, GET /auth/social/google/callback, GET /auth/social/apple, POST /auth/social/apple/callback, GET /auth/me"
      - path: "src/auth/auth.service.ts"
        purpose: "Orchestrates IAuthAdapter calls with User persistence in PostgreSQL. register() → calls adapter.register() + creates User row + creates MenteeProfile/MentorProfile. login() → calls adapter.login(), writes AuditLog. Handles INV-04 (unique email) by catching Prisma P2002 unique constraint error."
      - path: "src/auth/adapters/auth-adapter.interface.ts"
        purpose: "IAuthAdapter interface: register(), login(), socialLogin(), logout(), refresh(), forgotPassword(), resetPassword(), verifyEmail(), validateToken()"
      - path: "src/auth/adapters/mock-auth.adapter.ts"
        purpose: "MockAuthAdapter: bcrypt password hashing, jsonwebtoken JWT signing/validation, in-memory refresh token store (Map<userId, refreshToken>), email verification token store (Map<token, userId>), password reset token store (Map<token, {userId, expires}>). Social login mock: creates/finds user by email, skips real OAuth."
      - path: "src/auth/guards/jwt-auth.guard.ts"
        purpose: "extends AuthGuard('jwt') — validates Bearer token, populates request.user with JwtPayload. All protected routes use @UseGuards(JwtAuthGuard)."
      - path: "src/auth/guards/roles.guard.ts"
        purpose: "Reads @Roles() metadata, checks request.user.realm_access.roles against required roles. Returns 403 if role not present. Applied after JwtAuthGuard."
      - path: "src/auth/decorators/roles.decorator.ts"
        purpose: "@Roles(UserRole.ADMIN) — SetMetadata('roles', roles)"
      - path: "src/auth/decorators/current-user.decorator.ts"
        purpose: "@CurrentUser() — createParamDecorator extracting request.user (JwtPayload) from ExecutionContext"
      - path: "src/auth/interfaces/jwt-payload.interface.ts"
        purpose: "JwtPayload: { sub: string, email: string, realm_access: { roles: UserRole[] }, iss: string, aud: string, exp: number, iat: number } — matches KeyCloak token shape exactly"
      - path: "src/auth/dto/register.dto.ts"
        purpose: "RegisterDto: @IsEmail() email, @IsString() @MinLength(8) @Matches(/[a-zA-Z].*[0-9]|[0-9].*[a-zA-Z]/) password — enforces INV-05 + B1.1.5"
      - path: "src/auth/dto/login.dto.ts"
        purpose: "LoginDto: @IsEmail() email, @IsString() password"
      - path: "src/auth/dto/forgot-password.dto.ts"
        purpose: "ForgotPasswordDto: @IsEmail() email"
      - path: "src/auth/dto/reset-password.dto.ts"
        purpose: "ResetPasswordDto: @IsString() token, @IsString() @MinLength(8) @Matches(password pattern) newPassword"
      - path: "src/auth/dto/refresh-token.dto.ts"
        purpose: "RefreshTokenDto: @IsString() refreshToken"
    public_api:
      exports:
        - "JwtAuthGuard — imported by UserModule and AdminModule for route protection"
        - "RolesGuard — imported by UserModule and AdminModule"
        - "Roles — decorator imported by UserController and AdminController"
        - "CurrentUser — decorator imported by UserController and AdminController"
        - "AuthModule — imported by AppModule"
    invariants_enforced:
      - "INV-02: MockAuthAdapter.register() sets exactly one role per user; socialLogin() infers MENTEE role"
      - "INV-04: AuthService catches Prisma P2002 unique constraint violation on User.email and throws ConflictException"
      - "INV-05: RegisterDto and LoginDto never include passwordHash in responses; UserResponseDto uses @Exclude() on passwordHash"

  - id: "UserModule"
    type: "nestjs-module"
    package: "packages/backend-api"
    responsibility: "Manages user profile reads and updates for authenticated users. Mentees update their own MenteeProfile. Mentors update their own MentorProfile (bio, pricing, availability, photo). Enforces INV-05 (no password in responses). Recomputes profile completeness on every update."
    key_files:
      - path: "src/user/user.module.ts"
        purpose: "@Module: imports PrismaModule, AuthModule; exports UserService"
      - path: "src/user/user.controller.ts"
        purpose: "Routes: GET /users/me, GET /users/me/mentee-profile, PATCH /users/me/mentee-profile, GET /users/me/mentor-profile, PATCH /users/me/mentor-profile, POST /users/me/avatar. All protected with @UseGuards(JwtAuthGuard, RolesGuard)."
      - path: "src/user/user.service.ts"
        purpose: "Business logic: getCurrentUser(userId), updateMenteeProfile(userId, dto), updateMentorProfile(userId, dto), computeMenteeCompleteness(profile), computeMentorCompleteness(profile). Validates that mentor can only update own profile (B1.6.5 enforcement)."
      - path: "src/user/user.repository.ts"
        purpose: "Prisma queries: findUserById(id), findMenteeProfileByUserId(userId), updateMenteeProfile(userId, data), findMentorProfileByUserId(userId), updateMentorProfile(userId, data)"
