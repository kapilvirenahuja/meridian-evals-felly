# ─── Design Decisions ─────────────────────────────────────────────────────────

design_decisions:

  - id: "DD-01"
    name: "mock-auth-di-pattern"
    decision: >
      AuthModule provides a DI token AUTH_ADAPTER_TOKEN mapped to MockAuthAdapter in E1.
      In E11, this single token binding is changed to KeyCloakAuthAdapter — zero other code changes.
    rationale: "Architecture.yaml mock_first_services mandates this pattern. Avoids KeyCloak dependency for E1–E10."
    implementation:
      di_token: "AUTH_ADAPTER_TOKEN = Symbol('AUTH_ADAPTER_TOKEN') defined in src/common/constants.ts"
      module_binding: |
        // auth.module.ts
        @Module({
          providers: [
            { provide: AUTH_ADAPTER_TOKEN, useClass: MockAuthAdapter },
            AuthService,
          ],
          exports: [JwtAuthGuard, RolesGuard],
        })
        export class AuthModule {}
      injection: |
        // auth.service.ts
        constructor(
          @Inject(AUTH_ADAPTER_TOKEN) private readonly authAdapter: IAuthAdapter,
        ) {}
      mock_adapter_internals: >
        MockAuthAdapter stores state in three in-memory Maps:
        (1) refreshTokens: Map<userId, refreshToken> — invalidated on logout
        (2) emailVerificationTokens: Map<token, userId> — token = UUID, 24h TTL
        (3) passwordResetTokens: Map<token, {userId, expiresAt}> — token = UUID, 60min TTL
        User credentials (email, passwordHash) stored in PostgreSQL User table.
        JWTs signed with JWT_SECRET env var, 15min access token, 7d refresh token.
    e11_swap_path: "Replace { provide: AUTH_ADAPTER_TOKEN, useClass: MockAuthAdapter } with { useClass: KeyCloakAuthAdapter } in auth.module.ts. KeyCloakAuthAdapter uses KeyCloak Admin REST API for all operations."

  - id: "DD-02"
    name: "repository-pattern"
    decision: >
      Each NestJS module has a dedicated repository class (UserRepository, AdminRepository) 
      that owns all Prisma queries for that domain. Services inject repositories; controllers 
      inject services. PrismaService is injected into repositories.
    rationale: "quality-standards.yaml design_patterns: 'Repository pattern via Prisma service injection — no direct PrismaClient in controllers or resolvers.'"
    implementation:
      rule: "No Prisma calls in controllers (AuthController, UserController, AdminController) and no Prisma calls in service methods — all data access via repository methods"
      example: |
        // user.repository.ts
        @Injectable()
        export class UserRepository {
          constructor(private readonly prisma: PrismaService) {}

          async findById(id: string): Promise<User | null> {
            return this.prisma.user.findUnique({ where: { id } });
          }

          async updateMenteeProfile(userId: string, data: Partial<MenteeProfile>): Promise<MenteeProfile> {
            return this.prisma.menteeProfile.update({ where: { userId }, data });
          }
        }
      cross_module_data_access: "AdminModule uses AdminRepository for all its queries. When AdminModule needs user data, it injects UserService (exported by UserModule) — not UserRepository directly."

  - id: "DD-03"
    name: "service-layer-ownership"
    decision: >
      Controllers handle HTTP binding only (extract DTO, call service, return result).
      All business logic, validation (beyond DTO structure), authorization checks, and
      side effects (AuditLog writes) live in the service layer.
    rationale: "quality-standards.yaml conventions: 'Service layer owns all business logic — controllers handle HTTP binding only.'"
    implementation:
      controller_responsibility: "Parse DTO from request, call service method, return serialized result via class-transformer. No if/else business logic."
      service_responsibility: "Domain invariant enforcement, AuditLog writes, completeness calculation, status transition validation, cross-entity consistency checks."
      example: |
        // admin.controller.ts
        @Post(':id/approve')
        @UseGuards(JwtAuthGuard, RolesGuard)
        @Roles(UserRole.ADMIN)
        async approveMentor(
          @Param('id') id: string,
          @CurrentUser() admin: JwtPayload,
        ): Promise<MentorResponseDto> {
          const result = await this.adminService.approveMentor(id, admin.sub);
          return plainToInstance(MentorResponseDto, result);
        }

  - id: "DD-04"
    name: "dto-validation-strategy"
    decision: >
      Global ValidationPipe with whitelist: true and forbidNonWhitelisted: true applied in
      main.ts. All controller inputs use class-validator decorated DTOs. DTO instances are
      created via class-transformer plainToInstance before service calls.
    rationale: "quality-standards.yaml: 'DTOs required for all API request and response shapes (class-validator decorators mandatory for request DTOs).'"
    implementation:
      global_pipe: |
        // main.ts
        app.useGlobalPipes(
          new ValidationPipe({
            whitelist: true,
            forbidNonWhitelisted: true,
            transform: true,
            transformOptions: { enableImplicitConversion: true },
          }),
        );
      password_validation: |
        // register.dto.ts — enforces INV-05 (strength) + B1.1.5 (8 chars, letter+number)
        @IsString()
        @MinLength(8)
        @Matches(/^(?=.*[a-zA-Z])(?=.*[0-9]).+$/, {
          message: 'Password must contain at least one letter and one number',
        })
        password: string;

  - id: "DD-05"
    name: "error-handling-strategy"
    decision: >
      Global HttpExceptionFilter catches all NestJS HttpExceptions and formats them as
      { statusCode, message, error, timestamp }. Domain errors are mapped to specific
      HTTP exceptions in the service layer. Unhandled errors are caught as 500s.
      Prisma constraint errors (P2002, P2025) are mapped to 409 Conflict and 404 Not Found.
    rationale: "quality-standards.yaml: 'Error handling complete — no unhandled promise rejections, all Prisma calls in try/catch or wrapped in NestJS HttpException filters.'"
    implementation:
      exception_filter: |
        // http-exception.filter.ts
        @Catch(HttpException)
        export class HttpExceptionFilter implements ExceptionFilter {
          catch(exception: HttpException, host: ArgumentsHost) {
            const response = host.switchToHttp().getResponse<FastifyReply>();
            const status = exception.getStatus();
            const exceptionResponse = exception.getResponse();
            response.status(status).send({
              statusCode: status,
              message: typeof exceptionResponse === 'string'
                ? exceptionResponse
                : (exceptionResponse as any).message,
              error: exception.name,
              timestamp: new Date().toISOString(),
            });
          }
        }
      prisma_error_mapping: |
        // In service methods (catch block pattern)
        try {
          return await this.userRepository.create(data);
        } catch (error) {
          if (error.code === 'P2002') throw new ConflictException('Email already in use'); // INV-04
          if (error.code === 'P2025') throw new NotFoundException('Record not found');
          throw error;
        }

  - id: "DD-06"
    name: "rbac-guard-pattern"
    decision: >
      Two guards always applied together on protected routes:
      (1) JwtAuthGuard — validates JWT Bearer token, populates request.user
      (2) RolesGuard — reads @Roles() metadata, checks request.user.realm_access.roles
      Public routes use @Public() decorator that skips JwtAuthGuard.
    rationale: "Features INV-02 (single role), B1.7.1 (admin-only), B1.7.2 (mentor data), B1.7.4 (unauthenticated)"
    implementation:
      guard_application: |
        // pattern used in all protected controllers
        @UseGuards(JwtAuthGuard, RolesGuard)
        @Roles(UserRole.ADMIN)
        @Post(':id/approve')
        async approveMentor(...) {}
      public_routes: |
        // @Public() decorator marks routes that skip JwtAuthGuard
        // Applied to: POST /auth/register, POST /auth/login, POST /auth/forgot-password,
        //   POST /auth/reset-password, GET /auth/verify-email, GET /auth/social/*, GET /health
      jwt_payload_shape: >
        request.user is populated with JwtPayload: { sub (userId), email, realm_access: { roles: [UserRole] }, iss, aud, exp, iat }.
        RolesGuard reads realm_access.roles[0] for role check.
        This shape matches KeyCloak's token format exactly — no changes needed in E11.

  - id: "DD-07"
    name: "mentor-credential-delivery-on-approval"
    decision: >
      When admin approves a mentor, AdminService generates a temporary random password,
      hashes it via MockAuthAdapter, updates User.status to ACTIVE and User.passwordHash.
      The plain-text temporary password is returned once in the API response for the
      approving admin to relay manually. It is never logged. An AuditLog entry records
      the approval event (no password in metadata).
      In E7, credential delivery will be replaced with SendGrid email — API response
      will no longer include the temporary password.
    rationale: "Email delivery (SendGrid/CommsModule) is E7 scope. E1 needs a working credential delivery mechanism."
    implementation:
      approve_response: |
        // admin.service.ts
        async approveMentor(mentorProfileId: string, adminUserId: string) {
          const tempPassword = this.generateSecurePassword(); // crypto.randomBytes(16).toString('base64url')
          const hashedPassword = await bcrypt.hash(tempPassword, 12);
          // update MentorProfile status, User.status, User.passwordHash
          // write AuditLog(MENTOR_PROFILE_APPROVED)
          return { ...mentorProfile, temporaryCredentials: { email, tempPassword } };
          // tempPassword included in response ONLY — never in logs or AuditLog
        }
      e7_migration_note: "In E7, remove temporaryCredentials from response and fire SendGrid email via CommsModule instead."

  - id: "DD-08"
    name: "token-storage-frontend"
    decision: >
      Access token stored in localStorage (key: 'felly_access_token').
      Refresh token stored in localStorage (key: 'felly_refresh_token').
      Axios interceptor reads access token from localStorage and adds Bearer header.
      On 401 response, interceptor calls POST /auth/refresh and retries original request.
      Tokens cleared on logout.
    rationale: >
      E1 uses a simple localStorage approach for token storage. This is acceptable for the
      mock auth phase (E1–E10) and for the admin portal. A future security enhancement
      (E11 or post-launch) can migrate to httpOnly cookies. Architecture.yaml specifies
      'JWT Bearer token in Authorization header' — localStorage to header is the simplest
      implementation.
    implementation:
      storage_helpers: |
        // lib/auth.ts (both frontends)
        export const saveTokens = (tokens: IAuthTokens) => {
          localStorage.setItem('felly_access_token', tokens.accessToken);
          localStorage.setItem('felly_refresh_token', tokens.refreshToken);
        };
        export const getAccessToken = () => localStorage.getItem('felly_access_token');
        export const clearTokens = () => {
          localStorage.removeItem('felly_access_token');
          localStorage.removeItem('felly_refresh_token');
        };
      axios_interceptor: |
        // lib/api-client.ts
        apiClient.interceptors.request.use((config) => {
          const token = getAccessToken();
          if (token) config.headers.Authorization = `Bearer ${token}`;
          return config;
        });
        // 401 interceptor calls POST /auth/refresh, saves new tokens, retries

# ─── Design Patterns ──────────────────────────────────────────────────────────

design_patterns:

  backend:

    - pattern: "Repository Pattern"
      scope: "All NestJS modules"
      description: >
        Each domain module (auth, user, admin) has a dedicated *Repository class that
        owns all Prisma queries for that domain. Services inject the repository and never
        call PrismaService directly. Repository methods are named after the operation
        they perform (findById, listPending, updateStatus) — not after SQL operations.
      files_pattern: "src/{module}/{module}.repository.ts"
      anti_pattern: "No Prisma calls in controllers. No cross-module Prisma access (AdminModule does not import UserRepository; it calls UserService methods)."

    - pattern: "Service Layer"
      scope: "All NestJS modules"
      description: >
        Service classes own all business logic: invariant enforcement, state machine
        transitions, completeness calculation, AuditLog writes, and cross-entity consistency.
        Controllers are thin HTTP adapters — they extract DTOs, call one service method,
        and return the result via plainToInstance serialization.
      files_pattern: "src/{module}/{module}.service.ts"

    - pattern: "DTO Validation + Serialization"
      scope: "All controllers"
      description: >
        Request DTOs use class-validator decorators. Global ValidationPipe (whitelist, transform).
        Response DTOs use class-transformer @Exclude()/@Expose() to control serialization.
        @ApiProperty decorators on all DTO fields for OpenAPI spec generation.
        plainToInstance(ResponseDto, entity, { excludeExtraneousValues: true }) on all controller returns.
      files_pattern: "src/{module}/dto/*.dto.ts"

    - pattern: "Global Exception Filter"
      scope: "Application-wide"
      description: >
        HttpExceptionFilter registered globally in main.ts catches all HttpExceptions.
        Prisma constraint errors (P2002, P2025) mapped to ConflictException and
        NotFoundException in service methods. All errors return
        { statusCode, message, error, timestamp } shape.
      files_pattern: "src/common/filters/http-exception.filter.ts"

    - pattern: "Guard + Decorator RBAC"
      scope: "All protected routes"
      description: >
        JwtAuthGuard and RolesGuard always applied as a pair. @Roles() decorator sets
        required roles on handler metadata. @CurrentUser() decorator extracts JwtPayload
        from request. @Public() decorator marks routes that skip JWT validation.
        This pattern is KeyCloak-compatible — same guards and decorators work when
        MockAuthAdapter is swapped for KeyCloakAuthAdapter in E11.
      files_pattern: "src/auth/guards/*.guard.ts, src/auth/decorators/*.decorator.ts"

    - pattern: "Module Public API via exports"
      scope: "NestJS module boundaries"
      description: >
        Each module's @Module({ exports: [...] }) declares only what other modules
        may use. No module imports another module's internal service unless it is exported.
        PrismaModule is @Global() and exports PrismaService (exception to avoid repeated imports).
        AuthModule exports guards and decorators only — not AuthService.
      reference: "knowledge/architecture/patterns/modular-monolith.md — 'Module rules: only import via index.ts public API'"

    - pattern: "Prisma Transaction for Multi-Table Writes"
      scope: "All service operations writing to multiple tables"
      description: >
        Any service method that writes to multiple Prisma models within one logical operation
        uses this.prisma.$transaction([...]) or the interactive transactions API.
        Examples: createMentorWithUser() (creates User + MentorProfile atomically),
        approveMentor() (updates MentorProfile + User status + AuditLog atomically).
      reference: "quality-standards.yaml: 'Prisma transactions (@prisma/client.$transaction) required for all writes spanning multiple tables'"

  frontend:

    - pattern: "Next.js App Router Route Groups"
      scope: "Both frontends"
      description: >
        (auth) route group: unauthenticated pages with auth layout (no nav).
        (app) / (portal) route group: authenticated pages with full nav layout.
        Route group name is NOT part of the URL path — (auth)/login renders at /login.
        Each group has its own layout.tsx defining the shared UI wrapper.
      middleware_guard: "middleware.ts runs on all routes to enforce auth — redirects /app/* to /login if no valid token"

    - pattern: "Server Components by Default, 'use client' Where Needed"
      scope: "Both frontends"
      description: >
        Page components (page.tsx) are server components unless they need interactivity.
        Form components, hooks, and anything using useState/useEffect are 'use client'.
        The QueryProvider wrapper is 'use client' wrapping server layouts.
        This minimises client bundle size and maximises SSR for public pages.

    - pattern: "TanStack Query for Server State"
      scope: "Both frontends"
      description: >
        All API data fetching uses TanStack Query hooks (useQuery for reads, useMutation
        for writes). Hook files in src/hooks/ encapsulate query keys, fetcher functions,
        and mutation callbacks. No direct axios calls in page/component files.
        On successful mutations (profile update, approve/reject), invalidate relevant query keys.
      example: |
        // hooks/useProfile.ts
        export const useProfile = () => useQuery({
          queryKey: ['mentee-profile'],
          queryFn: () => apiClient.get<IMenteeProfile>('/users/me/mentee-profile').then(r => r.data),
        });
        export const useUpdateProfile = () => useMutation({
          mutationFn: (data: Partial<IMenteeProfile>) =>
            apiClient.patch('/users/me/mentee-profile', data).then(r => r.data),
          onSuccess: () => queryClient.invalidateQueries({ queryKey: ['mentee-profile'] }),
        });

    - pattern: "react-hook-form + zod Schema Validation"
      scope: "All forms in both frontends"
      description: >
        Forms use react-hook-form with useForm<z.infer<typeof schema>>() and zodResolver.
        Zod schemas defined alongside form components — field-level validation messages
        match the API's validation error messages. Form submission calls TanStack Query
        useMutation — no direct axios in form onSubmit handlers.
      example: |
        const loginSchema = z.object({
          email: z.string().email('Enter a valid email'),
          password: z.string().min(1, 'Password is required'),
        });
        const { register, handleSubmit, formState: { errors } } = useForm<z.infer<typeof loginSchema>>({
          resolver: zodResolver(loginSchema),
        });

    - pattern: "Axios Interceptor for Auth"
      scope: "Both frontends (lib/api-client.ts)"
      description: >
        Single Axios instance configured with base URL from NEXT_PUBLIC_API_BASE_URL.
        Request interceptor adds Bearer token from localStorage.
        Response interceptor handles 401: calls POST /auth/refresh, updates tokens,
        retries original request once. If refresh fails: clears tokens, redirects to /login.
      files: "src/lib/api-client.ts"

    - pattern: "shadcn/ui Component Integration"
      scope: "Both frontends"
      description: >
        Components installed via shadcn CLI (npx shadcn add button input card dialog, etc.)
        into src/components/ui/. These are source files — edit directly if customization needed.
        cn() utility function (clsx + tailwind-merge) used for conditional classes.
        All form inputs use shadcn Input and Label for consistent styling and accessibility.

# ─── Feature Mapping ──────────────────────────────────────────────────────────

feature_mapping:

  F1.1:
    name: "Mentee Registration"
    behaviors: ["B1.1.1", "B1.1.2", "B1.1.3", "B1.1.4", "B1.1.5"]
    implementing_components:
      - component: "AuthModule (backend)"
        contribution: "POST /auth/register (B1.1.1, B1.1.4, B1.1.5), GET /auth/verify-email (B1.1.2), GET /auth/social/google and /apple (B1.1.3)"
        key_files:
          - "src/auth/auth.controller.ts"
          - "src/auth/auth.service.ts"
          - "src/auth/adapters/mock-auth.adapter.ts"
          - "src/auth/dto/register.dto.ts"
      - component: "UserModule (backend)"
        contribution: "Creates MenteeProfile row atomically with User row on registration"
        key_files:
          - "src/user/user.repository.ts"
      - component: "mentee-web-app/(auth) (frontend)"
        contribution: "RegisterForm (B1.1.1, B1.1.5), SocialLoginButtons (B1.1.3), verify-email page (B1.1.2)"
        key_files:
          - "src/app/(auth)/register/page.tsx"
          - "src/components/auth/RegisterForm.tsx"
          - "src/components/auth/SocialLoginButtons.tsx"
          - "src/app/(auth)/verify-email/page.tsx"
    invariants_covered: ["INV-04 (unique email — B1.1.4)", "INV-05 (password never in response)"]

  F1.2:
    name: "User Authentication"
    behaviors: ["B1.2.1", "B1.2.2", "B1.2.3", "B1.2.4", "B1.2.5"]
    implementing_components:
      - component: "AuthModule (backend)"
        contribution: "POST /auth/login (B1.2.1, B1.2.2), POST /auth/refresh (B1.2.4), POST /auth/logout (B1.2.5). Rate limiting (B1.2.3) implemented in MockAuthAdapter using a loginAttempts Map<ip, {count, windowStart}>."
        key_files:
          - "src/auth/auth.controller.ts"
          - "src/auth/auth.service.ts"
          - "src/auth/adapters/mock-auth.adapter.ts"
          - "src/auth/guards/jwt-auth.guard.ts"
      - component: "mentee-web-app/(auth) (frontend)"
        contribution: "LoginForm (B1.2.1, B1.2.2), token refresh via Axios interceptor (B1.2.4), logout on dashboard (B1.2.5)"
        key_files:
          - "src/app/(auth)/login/page.tsx"
          - "src/components/auth/LoginForm.tsx"
          - "src/lib/api-client.ts"
          - "src/lib/auth.ts"
      - component: "admin-portal/(auth) (frontend)"
        contribution: "Admin login page (B1.2.1 for Admin role)"
        key_files:
          - "src/app/(auth)/login/page.tsx"
    invariants_covered: ["INV-02 (single role — JWT realm_access.roles contains exactly one role)"]
    notes: "B1.2.3 rate limiting: MockAuthAdapter tracks failed attempts by IP hash (from request IP header, hashed). 10 failures in 15 minutes triggers 429 response. Redis-backed rate limiting can replace this in E11."

  F1.3:
    name: "Password Reset & Recovery"
    behaviors: ["B1.3.1", "B1.3.2", "B1.3.3"]
    implementing_components:
      - component: "AuthModule (backend)"
        contribution: "POST /auth/forgot-password (B1.3.1), POST /auth/reset-password (B1.3.2, B1.3.3). MockAuthAdapter stores reset tokens in memory with 60min TTL."
        key_files:
          - "src/auth/auth.controller.ts"
          - "src/auth/auth.service.ts"
          - "src/auth/adapters/mock-auth.adapter.ts"
          - "src/auth/dto/forgot-password.dto.ts"
          - "src/auth/dto/reset-password.dto.ts"
      - component: "mentee-web-app/(auth) (frontend)"
        contribution: "ForgotPasswordForm (B1.3.1), ResetPasswordForm via reset-password page (B1.3.2, B1.3.3)"
        key_files:
          - "src/app/(auth)/forgot-password/page.tsx"
          - "src/app/(auth)/reset-password/page.tsx"
    notes: >
      B1.3.1: forgot-password always returns 200 with success message regardless of whether email exists (prevents email enumeration).
      The reset link contains the token as a URL query param: {FRONTEND_URL}/reset-password?token=<uuid>.
      In E1, the reset link URL is returned in the API response (dev convenience) — in E7 this becomes a SendGrid email.
      B1.3.2: On success, MockAuthAdapter invalidates all refresh tokens for the user (calls logout internally).

  F1.4:
    name: "Admin-Driven Mentor Onboarding"
    behaviors: ["B1.4.1", "B1.4.2", "B1.4.3", "B1.4.4"]
    implementing_components:
      - component: "AdminModule (backend)"
        contribution: "POST /admin/mentors (B1.4.1, B1.4.2 — creates DRAFT or PENDING_VERIFICATION), POST /admin/mentors/:id/artefacts (B1.4.3), POST /admin/mentors/:id/submit (B1.4.4)"
        key_files:
          - "src/admin/admin.controller.ts"
          - "src/admin/admin.service.ts"
          - "src/admin/admin.repository.ts"
          - "src/admin/dto/create-mentor.dto.ts"
      - component: "AuthModule (backend)"
        contribution: "User account creation for mentor (credentials generated in B1.4.4 via AdminService.approveMentor)"
        key_files:
          - "src/auth/adapters/mock-auth.adapter.ts"
      - component: "admin-portal/(portal) (frontend)"
        contribution: "MentorOnboardingForm wizard (B1.4.1–B1.4.4), ArtefactUploader (B1.4.3)"
        key_files:
          - "src/app/(portal)/mentors/new/page.tsx"
          - "src/components/mentors/MentorOnboardingForm.tsx"
          - "src/components/mentors/ArtefactUploader.tsx"
          - "src/components/mentors/PricingTierEditor.tsx"
    notes: >
      B1.4.2: POST /admin/mentors with a request body that omits required fields returns DRAFT status.
      The frontend wizard saves each step as a PATCH request, then POSTs /submit only when all steps are complete.
      B1.4.4: Credentials are held (User record created with status=PENDING_EMAIL_VERIFICATION) until B1.5.2 approval.

  F1.5:
    name: "Mentor Verification & Badge Assignment"
    behaviors: ["B1.5.1", "B1.5.2", "B1.5.3", "B1.5.4"]
    implementing_components:
      - component: "AdminModule (backend)"
        contribution: "GET /admin/mentors/verification-queue (B1.5.1), POST /admin/mentors/:id/approve (B1.5.2), POST /admin/mentors/:id/reject (B1.5.3), PATCH /admin/mentors/:id + POST /admin/mentors/:id/submit (B1.5.4)"
        key_files:
          - "src/admin/admin.controller.ts"
          - "src/admin/admin.service.ts"
          - "src/admin/admin.repository.ts"
          - "src/admin/dto/reject-mentor.dto.ts"
      - component: "admin-portal/(portal) (frontend)"
        contribution: "VerificationQueue component (B1.5.1, B1.5.2, B1.5.3), mentor detail page (B1.5.4)"
        key_files:
          - "src/app/(portal)/mentors/verify/page.tsx"
          - "src/components/mentors/VerificationQueue.tsx"
          - "src/app/(portal)/mentors/[id]/page.tsx"
    invariants_covered:
      - "INV-01: verifiedBadge only set via AdminService.approveMentor() — see DD-07"
      - "INV-03: AdminService.approveMentor() is the only path to set verifiedBadge = true"
    notes: >
      B1.5.1: verification-queue returns profiles sorted by submittedAt ASC (oldest first) per feature spec.
      B1.5.2: approval sets verifiedBadge = true, changes User.status to ACTIVE, returns temporary credentials in response (DD-07).
      B1.5.4: rejected profile can be re-edited (status REJECTED → admin patches fields → submits → PENDING_VERIFICATION).

  F1.6:
    name: "Profile Management"
    behaviors: ["B1.6.1", "B1.6.2", "B1.6.3", "B1.6.4", "B1.6.5"]
    implementing_components:
      - component: "UserModule (backend)"
        contribution: "GET /users/me (B1.6.1, B1.6.3), PATCH /users/me/mentee-profile (B1.6.2), PATCH /users/me/mentor-profile (B1.6.4). B1.6.5 enforced by UserController using @CurrentUser() — only own profile accessible."
        key_files:
          - "src/user/user.controller.ts"
          - "src/user/user.service.ts"
          - "src/user/user.repository.ts"
          - "src/user/dto/update-mentee-profile.dto.ts"
          - "src/user/dto/update-mentor-profile.dto.ts"
      - component: "mentee-web-app/(app) (frontend)"
        contribution: "ProfileCompleteness (B1.6.1 indicator), MenteeProfileForm (B1.6.2)"
        key_files:
          - "src/app/(app)/profile/page.tsx"
          - "src/components/profile/MenteeProfileForm.tsx"
          - "src/components/profile/ProfileCompleteness.tsx"
      - component: "admin-portal/(portal) (frontend)"
        contribution: "Mentor detail page with edit form (B1.6.3, B1.6.4)"
        key_files:
          - "src/app/(portal)/mentors/[id]/page.tsx"
    invariants_covered:
      - "INV-05: UserResponseDto uses @Exclude() on passwordHash"
    notes: "B1.6.4: pricing/availability changes update MentorProfile immediately. Future sessions (E3) will lock pricing at booking time — not enforced in E1."

  F1.7:
    name: "Role-Based Access Control"
    behaviors: ["B1.7.1", "B1.7.2", "B1.7.3", "B1.7.4"]
    implementing_components:
      - component: "AuthModule (backend)"
        contribution: "JwtAuthGuard (B1.7.4 — unauthenticated blocked), RolesGuard (B1.7.1, B1.7.2 — wrong role blocked)"
        key_files:
          - "src/auth/guards/jwt-auth.guard.ts"
          - "src/auth/guards/roles.guard.ts"
          - "src/auth/decorators/roles.decorator.ts"
          - "src/auth/decorators/current-user.decorator.ts"
      - component: "UserModule (backend)"
        contribution: "UserController applies @Roles(UserRole.MENTEE) on mentee routes, @Roles(UserRole.MENTOR) on mentor routes. @CurrentUser() injection prevents accessing other users' data (B1.7.2)."
        key_files:
          - "src/user/user.controller.ts"
      - component: "AdminModule (backend)"
        contribution: "All admin routes apply @Roles(UserRole.ADMIN) — satisfies B1.7.1, B1.7.3"
        key_files:
          - "src/admin/admin.controller.ts"
      - component: "mentee-web-app middleware (frontend)"
        contribution: "B1.7.4: redirects unauthenticated users from (app)/* to /login"
        key_files:
          - "src/middleware.ts"
      - component: "admin-portal middleware (frontend)"
        contribution: "B1.7.4: redirects non-admin users to /login"
        key_files:
          - "src/middleware.ts"
    invariants_covered: ["INV-02: JwtAuthGuard rejects tokens with multiple roles (validator in MockAuthAdapter ensures only one role per JWT)"]

# ─── Dev Environment ──────────────────────────────────────────────────────────

dev_environment:

  docker_compose:
    file: "docker-compose.yml"
    description: "Local development services — PostgreSQL 16 and Redis 7 only. KeyCloak excluded (mock auth in E1). OpenSearch excluded (marketplace search is E2)."
    content: |
      version: '3.9'
      services:
        postgres:
          image: postgres:16-alpine
          container_name: felly-postgres
          ports:
            - "5432:5432"
          environment:
            POSTGRES_DB: felly_club_dev
            POSTGRES_USER: felly
            POSTGRES_PASSWORD: fellydev
          volumes:
            - postgres_data:/var/lib/postgresql/data
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U felly -d felly_club_dev"]
            interval: 10s
            timeout: 5s
            retries: 5

        redis:
          image: redis:7-alpine
          container_name: felly-redis
          ports:
            - "6379:6379"
          command: redis-server --save 60 1 --loglevel warning
          volumes:
            - redis_data:/data
          healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

      volumes:
        postgres_data:
        redis_data:

  ports:
    - service: "PostgreSQL"
      port: 5432
      local_url: "localhost:5432"
      container_name: "felly-postgres"
    - service: "Redis"
      port: 6379
      local_url: "localhost:6379"
      container_name: "felly-redis"
    - service: "backend-api (NestJS)"
      port: 3000
      local_url: "http://localhost:3000"
      configured_via: "API_PORT env var"
    - service: "mentee-web-app (Next.js)"
      port: 3001
      local_url: "http://localhost:3001"
      configured_via: "next dev -p 3001"
    - service: "admin-portal (Next.js)"
      port: 3002
      local_url: "http://localhost:3002"
      configured_via: "next dev -p 3002"

  env_vars:
    "packages/backend-api/.env.local.example":
      - name: "DATABASE_URL"
        value_example: "see .env.example for connection string format"
        required: true
        description: "Prisma primary database connection string"
      - name: "REDIS_URL"
        value_example: "redis://localhost:6379"
        required: true
        description: "Redis connection string for BullMQ and cache"
      - name: "AUTH_ADAPTER"
        value_example: "mock"
        required: true
        description: "Auth adapter selector: 'mock' for E1, 'keycloak' for E11"
      - name: "JWT_SECRET"
        value_example: "dev-jwt-secret-min-32-chars-please-change"
        required: true
        description: "Secret for MockAuthAdapter JWT signing — minimum 32 characters"
      - name: "JWT_ACCESS_EXPIRY"
        value_example: "15m"
        required: true
        description: "JWT access token expiry — 15 minutes per architecture.yaml NFR"
      - name: "JWT_REFRESH_EXPIRY"
        value_example: "7d"
        required: true
        description: "JWT refresh token expiry — 7 days"
      - name: "JWT_ISSUER"
        value_example: "felly-club-mock"
        required: true
        description: "JWT iss claim — in E11 replaced with KeyCloak realm URL"
      - name: "JWT_AUDIENCE"
        value_example: "felly-club-api"
        required: true
        description: "JWT aud claim — must match what guards validate"
      - name: "API_PORT"
        value_example: "3000"
        required: false
        description: "NestJS HTTP server port — default 3000"
      - name: "FRONTEND_URL"
        value_example: "http://localhost:3001"
        required: true
        description: "Mentee web app URL — used for email verification link and OAuth callbacks"
      - name: "ADMIN_PORTAL_URL"
        value_example: "http://localhost:3002"
        required: true
        description: "Admin portal URL — used for admin OAuth callbacks"
      - name: "AWS_REGION"
        value_example: "us-east-1"
        required: true
        description: "AWS region for S3 operations"
      - name: "S3_ARTEFACTS_BUCKET"
        value_example: "felly-artefacts-dev"
        required: true
        description: "S3 bucket for mentor verification artefacts and profile photos"
      - name: "AWS_ACCESS_KEY_ID"
        value_example: "localstack"
        required: false
        description: "AWS credentials for local dev — use LocalStack or stub. Production: ECS task role (no static credentials)"
      - name: "AWS_SECRET_ACCESS_KEY"
        value_example: "localstack"
        required: false
        description: "AWS credentials for local dev. Production: ECS task role"
      - name: "S3_ENDPOINT"
        value_example: "http://localhost:4566"
        required: false
        description: "S3 endpoint override — set to LocalStack endpoint for local dev. Leave unset in production."
      - name: "LOG_LEVEL"
        value_example: "debug"
        required: false
        description: "Pino log level — debug (dev), info (production)"
      - name: "NODE_ENV"
        value_example: "development"
        required: true
        description: "Node environment — development | staging | production"

    "packages/mentee-web-app/.env.local.example":
      - name: "NEXT_PUBLIC_API_BASE_URL"
        value_example: "http://localhost:3000/api/v1"
        required: true
        description: "Backend API base URL for all API client calls"
      - name: "NEXT_PUBLIC_APP_URL"
        value_example: "http://localhost:3001"
        required: true
        description: "This app's URL — used for OAuth redirect URIs and canonical URL construction"

    "packages/admin-portal/.env.local.example":
      - name: "NEXT_PUBLIC_API_BASE_URL"
        value_example: "http://localhost:3000/api/v1"
        required: true
        description: "Backend API base URL for admin portal API calls"
      - name: "NEXT_PUBLIC_APP_URL"
        value_example: "http://localhost:3002"
        required: true
        description: "This portal's URL"

  local_commands:
    setup:
      - command: "pnpm install"
        cwd: "felly-club/"
        description: "Install all workspace dependencies"
      - command: "docker-compose up -d"
        cwd: "felly-club/"
        description: "Start PostgreSQL and Redis containers"
      - command: "pnpm --filter backend-api prisma:migrate"
        cwd: "felly-club/"
        description: "Run Prisma migrations against local PostgreSQL (alias: npx prisma migrate dev)"
      - command: "pnpm --filter backend-api prisma:generate"
        cwd: "felly-club/"
        description: "Regenerate Prisma client after schema changes"

    dev:
      - command: "pnpm --filter backend-api dev"
        cwd: "felly-club/"
        description: "Start NestJS backend in watch mode (nodemon) on port 3000"
      - command: "pnpm --filter mentee-web-app dev"
        cwd: "felly-club/"
        description: "Start mentee web app Next.js dev server on port 3001"
      - command: "pnpm --filter admin-portal dev"
        cwd: "felly-club/"
        description: "Start admin portal Next.js dev server on port 3002"

    test:
      - command: "pnpm --filter backend-api test"
        cwd: "felly-club/"
        description: "Run Jest unit and integration tests for backend-api with coverage"
      - command: "pnpm --filter backend-api test:e2e"
        cwd: "felly-club/"
        description: "Run NestJS e2e tests (Supertest against in-memory NestJS app)"
      - command: "pnpm --filter mentee-web-app test"
        cwd: "felly-club/"
        description: "Run React Testing Library tests for mentee-web-app"
      - command: "pnpm test"
        cwd: "felly-club/"
        description: "Run all tests across all packages"

    quality:
      - command: "pnpm lint"
        cwd: "felly-club/"
        description: "Run ESLint across all packages"
      - command: "pnpm format"
        cwd: "felly-club/"
        description: "Run Prettier format check across all packages"
      - command: "pnpm typecheck"
        cwd: "felly-club/"
        description: "Run tsc --noEmit across all packages"

    database:
      - command: "npx prisma studio"
        cwd: "packages/backend-api/"
        description: "Open Prisma Studio GUI for local database browsing at http://localhost:5555"
      - command: "npx prisma migrate reset"
        cwd: "packages/backend-api/"
        description: "Drop and recreate database with all migrations applied (destructive — dev only)"

    package_scripts:
      prisma_package_json:
        "prisma:migrate": "prisma migrate dev"
        "prisma:generate": "prisma generate"
        "prisma:studio": "prisma studio"
        "prisma:reset": "prisma migrate reset"
        "build": "nest build"
        "dev": "nest start --watch"
        "test": "jest --coverage"
        "test:e2e": "jest --config jest-e2e.config.ts --coverage"
        "lint": "eslint src --ext .ts"
        "format": "prettier --check \"src/**/*.ts\""
        "typecheck": "tsc --noEmit"

# ─── API Endpoints ────────────────────────────────────────────────────────────
# All endpoints prefixed /api/v1. Backend runs on port 3000.
# Auth: "none" = no JWT required. "jwt" = JWT required (any role). "admin" = ADMIN role required.

api_endpoints:

  # ── Auth Endpoints ─────────────────────────────────────────────────────────

  - id: "E1-API-01"
    method: "POST"
    path: "/api/v1/auth/register"
    auth: "none"
    feature: "F1.1"
    behaviors: ["B1.1.1", "B1.1.4", "B1.1.5"]
    description: "Register a new mentee account with email and password"
    request_body:
      content_type: "application/json"
      schema:
        email: "string (valid email) — INV-04: must be unique"
        password: "string (min 8 chars, at least 1 letter and 1 number) — B1.1.5"
    responses:
      201:
        description: "Registration accepted — verification email sent (in E7; link returned in E1 response)"
        schema:
          userId: "string (UUID)"
          email: "string"
          message: "Verification email sent. Please verify your email to activate your account."
          verificationLink: "string (URL) — dev convenience only; removed in production (E7 sends email)"
      409:
        description: "Email already in use — INV-04"
        schema: { statusCode: 409, message: "Email already in use", error: "Conflict" }
      422:
        description: "Validation failed — B1.1.5 (weak password) or invalid email"
        schema: { statusCode: 422, message: ["password is too short", "..."], error: "Unprocessable Entity" }

  - id: "E1-API-02"
    method: "POST"
    path: "/api/v1/auth/login"
    auth: "none"
    feature: "F1.2"
    behaviors: ["B1.2.1", "B1.2.2", "B1.2.3"]
    description: "Authenticate with email and password. Returns JWT access + refresh tokens."
    request_body:
      content_type: "application/json"
      schema:
        email: "string"
        password: "string"
    responses:
      200:
        description: "Login successful"
        schema:
          accessToken: "string (JWT, 15min expiry)"
          refreshToken: "string (JWT, 7d expiry)"
          user:
            id: "string (UUID)"
            email: "string"
            role: "UserRole (MENTEE | MENTOR | ADMIN)"
            status: "UserStatus"
      401:
        description: "Invalid credentials — B1.2.2: generic message, does not reveal if email exists"
        schema: { statusCode: 401, message: "Invalid email or password", error: "Unauthorized" }
      403:
        description: "Unverified email — email not yet verified via verification link"
        schema: { statusCode: 403, message: "Email not verified. Please verify your email before logging in.", error: "Forbidden" }
      429:
        description: "Rate limit exceeded — B1.2.3: 10 failures in 15 minutes"
        schema: { statusCode: 429, message: "Too many login attempts. Try again in 15 minutes.", error: "Too Many Requests" }

  - id: "E1-API-03"
    method: "POST"
    path: "/api/v1/auth/logout"
    auth: "jwt"
    feature: "F1.2"
    behaviors: ["B1.2.5"]
    description: "Invalidate session — clears refresh token in MockAuthAdapter's in-memory store"
    request_body:
      content_type: "application/json"
      schema:
        refreshToken: "string"
    responses:
      200:
        description: "Logged out successfully"
        schema: { message: "Logged out successfully" }
      401:
        description: "Invalid or expired access token"

  - id: "E1-API-04"
    method: "POST"
    path: "/api/v1/auth/refresh"
    auth: "none"
    feature: "F1.2"
    behaviors: ["B1.2.4"]
    description: "Refresh access token using refresh token. Returns new access + refresh token pair."
    request_body:
      content_type: "application/json"
      schema:
        refreshToken: "string"
    responses:
      200:
        description: "New token pair issued"
        schema:
          accessToken: "string (JWT, 15min)"
          refreshToken: "string (JWT, 7d)"
      401:
        description: "Invalid or expired refresh token"
        schema: { statusCode: 401, message: "Invalid or expired refresh token", error: "Unauthorized" }

  - id: "E1-API-05"
    method: "GET"
    path: "/api/v1/auth/verify-email"
    auth: "none"
    feature: "F1.1"
    behaviors: ["B1.1.2"]
    description: "Verify user's email using the token from the verification email link"
    query_params:
      - name: "token"
        type: "string"
        required: true
        description: "Email verification token (UUID) from the verification link"
    responses:
      200:
        description: "Email verified — User.status changed to ACTIVE. MenteeProfile created if not exists."
        schema:
          message: "Email verified successfully. You can now log in."
      400:
        description: "Token expired or already used — B1.1.2 validity period check"
        schema: { statusCode: 400, message: "Verification token is invalid or has expired.", error: "Bad Request" }

  - id: "E1-API-06"
    method: "POST"
    path: "/api/v1/auth/forgot-password"
    auth: "none"
    feature: "F1.3"
    behaviors: ["B1.3.1"]
    description: "Request a password reset link. Always returns 200 regardless of whether email exists (prevents email enumeration — B1.3.1)."
    request_body:
      content_type: "application/json"
      schema:
        email: "string (valid email)"
    responses:
      200:
        description: "Always returns success — B1.3.1 email enumeration prevention"
        schema:
          message: "If this email is registered, a reset link has been sent."
          resetLink: "string (URL) — dev convenience only; included when NODE_ENV=development; omitted in production"

  - id: "E1-API-07"
    method: "POST"
    path: "/api/v1/auth/reset-password"
    auth: "none"
    feature: "F1.3"
    behaviors: ["B1.3.2", "B1.3.3"]
    description: "Reset password using the token from the reset email link. Invalidates all existing sessions on success."
    request_body:
      content_type: "application/json"
      schema:
        token: "string (UUID from reset link)"
        newPassword: "string (min 8 chars, letter+number)"
    responses:
      200:
        description: "Password reset — all refresh tokens invalidated (B1.3.2)"
        schema: { message: "Password reset successfully. Please log in with your new password." }
      400:
        description: "Token expired or already used — B1.3.3"
        schema: { statusCode: 400, message: "Reset token is invalid or has expired. Please request a new link.", error: "Bad Request" }
      422:
        description: "Password does not meet strength requirements"

  - id: "E1-API-08"
    method: "GET"
    path: "/api/v1/auth/me"
    auth: "jwt"
    feature: "F1.2"
    behaviors: ["B1.2.1"]
    description: "Get current authenticated user info from JWT claims"
    responses:
      200:
        description: "Current user info"
        schema:
          id: "string (UUID)"
          email: "string"
          role: "UserRole"
          status: "UserStatus"
      401:
        description: "No valid JWT Bearer token"

  - id: "E1-API-09"
    method: "GET"
    path: "/api/v1/auth/social/google"
    auth: "none"
    feature: "F1.1"
    behaviors: ["B1.1.3"]
    description: "Initiate Google OAuth flow. In production (E11): redirects to KeyCloak Google IDP. In E1 mock: returns a simulated OAuth URL or directly issues tokens for a test user."
    responses:
      302:
        description: "Redirect to OAuth provider (KeyCloak in E11; mock endpoint in E1)"
      notes: "In E1 mock mode, accepting a query param ?email=user@example.com allows simulating social login without real OAuth roundtrip (dev convenience only — guarded by NODE_ENV=development check)"

  - id: "E1-API-10"
    method: "GET"
    path: "/api/v1/auth/social/google/callback"
    auth: "none"
    feature: "F1.1"
    behaviors: ["B1.1.3"]
    description: "Google OAuth callback. Creates or retrieves user, issues tokens, redirects to frontend dashboard."
    responses:
      302:
        description: "Redirect to {FRONTEND_URL}/dashboard with tokens in query params or via cookie (implementation choice per DD-08)"
      200:
        description: "In mock mode: returns token pair directly"
        schema:
          accessToken: "string"
          refreshToken: "string"
          user: { id: "string", email: "string", role: "MENTEE" }

  - id: "E1-API-11"
    method: "GET"
    path: "/api/v1/auth/social/apple"
    auth: "none"
    feature: "F1.1"
    behaviors: ["B1.1.3"]
    description: "Initiate Apple Sign In flow. Same pattern as Google OAuth — KeyCloak-brokered in E11."
    responses:
      302:
        description: "Redirect to Apple Sign In (via KeyCloak in E11; mock in E1)"

  - id: "E1-API-12"
    method: "POST"
    path: "/api/v1/auth/social/apple/callback"
    auth: "none"
    feature: "F1.1"
    behaviors: ["B1.1.3"]
    description: "Apple Sign In callback (Apple uses POST for callbacks, not GET). Creates or retrieves user, issues tokens."
    responses:
      302:
        description: "Redirect to frontend with tokens"

  # ── User Endpoints ─────────────────────────────────────────────────────────

  - id: "E1-API-13"
    method: "GET"
    path: "/api/v1/users/me"
    auth: "jwt"
    feature: "F1.6"
    behaviors: ["B1.6.1", "B1.6.3"]
    description: "Get current user with their profile (MenteeProfile or MentorProfile based on role)"
    responses:
      200:
        description: "User with nested profile"
        schema:
          id: "string"
          email: "string"
          role: "UserRole"
          status: "UserStatus"
          menteeProfile: "MenteeProfile | null (present if role=MENTEE)"
          mentorProfile: "MentorProfile | null (present if role=MENTOR; excludes s3Keys)"
      401:
        description: "No valid JWT"
      notes: "passwordHash, keycloakId NEVER included in response — enforced by UserResponseDto @Exclude()"

  - id: "E1-API-14"
    method: "GET"
    path: "/api/v1/users/me/mentee-profile"
    auth: "jwt — role: MENTEE"
    feature: "F1.6"
    behaviors: ["B1.6.1"]
    description: "Get current mentee's profile with completeness score"
    responses:
      200:
        schema:
          id: "string"
          userId: "string"
          firstName: "string"
          lastName: "string"
          avatarUrl: "string | null (presigned S3 URL, 1h expiry — generated from avatarKey)"
          interests: "string[]"
          goals: "string | null"
          completeness: "integer 0–100"
      403:
        description: "Not a MENTEE role"

  - id: "E1-API-15"
    method: "PATCH"
    path: "/api/v1/users/me/mentee-profile"
    auth: "jwt — role: MENTEE"
    feature: "F1.6"
    behaviors: ["B1.6.2"]
    description: "Update current mentee's profile. Recomputes and saves completeness score."
    request_body:
      content_type: "application/json"
      schema:
        firstName: "string (optional)"
        lastName: "string (optional)"
        interests: "string[] (optional)"
        goals: "string (optional, max 1000 chars)"
        avatarKey: "string (optional, S3 key from pre-signed upload)"
    responses:
      200:
        description: "Updated profile with new completeness score"
        schema: "same as GET /users/me/mentee-profile"
      422:
        description: "Validation error"

  - id: "E1-API-16"
    method: "GET"
    path: "/api/v1/users/me/mentor-profile"
    auth: "jwt — role: MENTOR"
    feature: "F1.6"
    behaviors: ["B1.6.3"]
    description: "Get current mentor's profile"
    responses:
      200:
        schema:
          id: "string"
          userId: "string"
          firstName: "string"
          lastName: "string"
          bio: "string"
          expertiseCategories: "ExpertiseCategory[]"
          photoUrl: "string | null (presigned S3 URL)"
          status: "MentorProfileStatus"
          verifiedBadge: "boolean"
          pricingTiers: "IPricingTier[]"
          availabilitySlots: "IAvailabilitySlot[]"
          completeness: "integer 0–100"
          notes: "verificationArtefacts NOT included — admin-only view"
      403:
        description: "Not a MENTOR role"

  - id: "E1-API-17"
    method: "PATCH"
    path: "/api/v1/users/me/mentor-profile"
    auth: "jwt — role: MENTOR"
    feature: "F1.6"
    behaviors: ["B1.6.4"]
    description: "Update current mentor's bio, pricing, availability, and photo. Recomputes completeness."
    request_body:
      content_type: "application/json"
      schema:
        bio: "string (optional, max 2000 chars)"
        expertiseCategories: "ExpertiseCategory[] (optional)"
        photoKey: "string (optional, S3 key)"
        pricingTiers: "PricingTier[] (optional, replaces all existing tiers)"
        availabilitySlots: "AvailabilitySlot[] (optional, replaces all existing slots)"
    responses:
      200:
        description: "Updated mentor profile"
        schema: "same as GET /users/me/mentor-profile"
      422:
        description: "Validation error"

  # ── Admin Endpoints ─────────────────────────────────────────────────────────

  - id: "E1-API-18"
    method: "GET"
    path: "/api/v1/admin/users"
    auth: "jwt — role: ADMIN"
    feature: "F1.7"
    behaviors: ["B1.7.3"]
    description: "List all users with status filters. Admin user management view."
    query_params:
      - name: "role"
        type: "UserRole (optional)"
        description: "Filter by role: MENTEE | MENTOR | ADMIN"
      - name: "status"
        type: "UserStatus (optional)"
        description: "Filter by status: PENDING_EMAIL_VERIFICATION | ACTIVE | SUSPENDED"
      - name: "page"
        type: "integer (optional, default 1)"
      - name: "limit"
        type: "integer (optional, default 20, max 100)"
    responses:
      200:
        schema:
          data: "IUser[] with basic profile (firstName, lastName, completeness)"
          total: "integer"
          page: "integer"
          limit: "integer"

  - id: "E1-API-19"
    method: "GET"
    path: "/api/v1/admin/users/:id"
    auth: "jwt — role: ADMIN"
    feature: "F1.7"
    behaviors: ["B1.7.3"]
    description: "Get a single user's full detail (no passwordHash)"
    responses:
      200:
        schema: "Full user with menteeProfile or mentorProfile (for MENTOR: includes verificationArtefacts)"
      404:
        description: "User not found"

  - id: "E1-API-20"
    method: "POST"
    path: "/api/v1/admin/mentors"
    auth: "jwt — role: ADMIN"
    feature: "F1.4"
    behaviors: ["B1.4.1", "B1.4.2"]
    description: "Create a new mentor profile (and associated User account). If all required fields provided and artefact uploaded, status = PENDING_VERIFICATION. Otherwise DRAFT."
    request_body:
      content_type: "application/json"
      schema:
        firstName: "string (required)"
        lastName: "string (required)"
        email: "string (required, unique) — new User account email"
        bio: "string (required, max 2000 chars)"
        expertiseCategories: "ExpertiseCategory[] (required, min 1)"
        pricingTiers: "PricingTier[] (required, min 1)"
        availabilitySlots: "AvailabilitySlot[] (required, min 1)"
    responses:
      201:
        description: "Mentor profile created (DRAFT or PENDING_VERIFICATION based on completeness)"
        schema:
          id: "string (MentorProfile UUID)"
          userId: "string (User UUID)"
          status: "MentorProfileStatus"
          completeness: "integer"
          email: "string"
          firstName: "string"
          lastName: "string"
          bio: "string"
          expertiseCategories: "ExpertiseCategory[]"
          pricingTiers: "MentorPricingTier[]"
          availabilitySlots: "MentorAvailabilitySlot[]"
          verificationArtefacts: "[] (empty on creation)"
      409:
        description: "Email already in use — INV-04"

  - id: "E1-API-21"
    method: "GET"
    path: "/api/v1/admin/mentors"
    auth: "jwt — role: ADMIN"
    feature: "F1.5"
    behaviors: ["B1.5.1"]
    description: "List mentor profiles with optional status filter"
    query_params:
      - name: "status"
        type: "MentorProfileStatus (optional)"
      - name: "page"
        type: "integer (optional, default 1)"
      - name: "limit"
        type: "integer (optional, default 20, max 100)"
    responses:
      200:
        schema:
          data: "MentorResponseDto[]"
          total: "integer"
          page: "integer"
          limit: "integer"

  - id: "E1-API-22"
    method: "GET"
    path: "/api/v1/admin/mentors/verification-queue"
    auth: "jwt — role: ADMIN"
    feature: "F1.5"
    behaviors: ["B1.5.1"]
    description: "List all mentors in PENDING_VERIFICATION status, sorted oldest submittedAt first"
    query_params:
      - name: "page"
        type: "integer (optional, default 1)"
      - name: "limit"
        type: "integer (optional, default 20)"
    responses:
      200:
        schema:
          data: "MentorResponseDto[] — sorted by submittedAt ASC"
          total: "integer"
          page: "integer"
    notes: "Route /admin/mentors/verification-queue must be registered BEFORE /admin/mentors/:id in the controller to avoid param collision — Express/Fastify routes match in order."

  - id: "E1-API-23"
    method: "GET"
    path: "/api/v1/admin/mentors/:id"
    auth: "jwt — role: ADMIN"
    feature: "F1.5"
    behaviors: ["B1.5.1"]
    description: "Get a single mentor profile with all verification artefacts"
    responses:
      200:
        description: "Full mentor profile including artefacts list"
        schema:
          id: "string"
          userId: "string"
          email: "string (from User)"
          firstName: "string"
          lastName: "string"
          bio: "string"
          expertiseCategories: "ExpertiseCategory[]"
          status: "MentorProfileStatus"
          verifiedBadge: "boolean"
          rejectionReason: "string | null"
          submittedAt: "ISO8601 | null"
          verifiedAt: "ISO8601 | null"
          completeness: "integer"
          pricingTiers: "MentorPricingTier[]"
          availabilitySlots: "MentorAvailabilitySlot[]"
          verificationArtefacts:
            - id: "string"
              artefactType: "ArtefactType"
              url: "string | null"
              artefactUrl: "string | null (presigned S3 URL for DOCUMENT type, 1h expiry)"
              fileName: "string | null"
              mimeType: "string | null"
              createdAt: "ISO8601"
      404:
        description: "Mentor profile not found"

  - id: "E1-API-24"
    method: "PATCH"
    path: "/api/v1/admin/mentors/:id"
    auth: "jwt — role: ADMIN"
    feature: "F1.4"
    behaviors: ["B1.4.2"]
    description: "Update a mentor profile in DRAFT or REJECTED status. Recomputes completeness."
    request_body:
      content_type: "application/json"
      schema: "Partial MentorProfile fields — same as CreateMentorDto but all optional"
    responses:
      200:
        description: "Updated mentor profile"
      400:
        description: "Cannot edit a VERIFIED or PENDING_VERIFICATION mentor profile via this endpoint"
      404:
        description: "Mentor profile not found"

  - id: "E1-API-25"
    method: "POST"
    path: "/api/v1/admin/mentors/:id/submit"
    auth: "jwt — role: ADMIN"
    feature: "F1.4"
    behaviors: ["B1.4.1", "B1.4.4"]
    description: "Submit a DRAFT mentor profile for verification. Validates completeness guard: all required fields and at least one artefact must be present."
    responses:
      200:
        description: "Status changed to PENDING_VERIFICATION, submittedAt set"
        schema: "MentorResponseDto with status=PENDING_VERIFICATION"
      400:
        description: "Completeness guard failed — missing required fields or no artefact"
        schema: { statusCode: 400, message: "Cannot submit: profile is missing required fields or has no verification artefacts", error: "Bad Request", missingFields: ["bio", "pricingTiers"] }
      409:
        description: "Profile is already PENDING_VERIFICATION or VERIFIED"

  - id: "E1-API-26"
    method: "POST"
    path: "/api/v1/admin/mentors/:id/approve"
    auth: "jwt — role: ADMIN"
    feature: "F1.5"
    behaviors: ["B1.5.2"]
    description: "Approve a PENDING_VERIFICATION mentor profile. Sets verifiedBadge=true, User.status=ACTIVE. Returns temporary credentials for manual relay to mentor (E7 will replace with email)."
    responses:
      200:
        description: "Mentor approved — INV-01 and INV-03 satisfied"
        schema:
          mentor: "MentorResponseDto (status=VERIFIED, verifiedBadge=true)"
          temporaryCredentials:
            email: "string"
            temporaryPassword: "string — one-time plain-text password; log as audit event but never store in plaintext"
      400:
        description: "Mentor is not in PENDING_VERIFICATION status"
      404:
        description: "Mentor profile not found"
    security_note: "temporaryCredentials.temporaryPassword is returned ONCE in API response only. It is NEVER written to logs or AuditLog metadata. AuditLog records MENTOR_PROFILE_APPROVED event without password."

  - id: "E1-API-27"
    method: "POST"
    path: "/api/v1/admin/mentors/:id/reject"
    auth: "jwt — role: ADMIN"
    feature: "F1.5"
    behaviors: ["B1.5.3"]
    description: "Reject a PENDING_VERIFICATION mentor profile with a reason."
    request_body:
      content_type: "application/json"
      schema:
        reason: "string (min 10, max 500 chars)"
    responses:
      200:
        description: "Status changed to REJECTED, rejectionReason stored"
        schema: "MentorResponseDto (status=REJECTED)"
      400:
        description: "Mentor is not in PENDING_VERIFICATION status"
      422:
        description: "Reason is too short or too long"

  - id: "E1-API-28"
    method: "POST"
    path: "/api/v1/admin/mentors/:id/artefacts"
    auth: "jwt — role: ADMIN"
    feature: "F1.4"
    behaviors: ["B1.4.3"]
    description: "Upload a verification artefact to a mentor profile. Accepts URL types (JSON body) or document files (multipart)."
    request_body:
      content_type: "multipart/form-data OR application/json"
      schema:
        artefactType: "ArtefactType (required)"
        url: "string (required for LINKEDIN_URL and PORTFOLIO_URL types)"
        file: "binary (required for DOCUMENT type — uploaded to S3)"
    responses:
      201:
        description: "Artefact created and associated with mentor profile"
        schema:
          id: "string"
          artefactType: "ArtefactType"
          url: "string | null"
          fileName: "string | null"
          mimeType: "string | null"
          createdAt: "ISO8601"
      400:
        description: "Invalid artefact type or missing URL/file for the given type"
      404:
        description: "Mentor profile not found"
    notes: "For DOCUMENT uploads, backend receives multipart via @fastify/multipart, uploads to S3 felly-artefacts bucket, stores S3 key. s3Key is never returned to API consumers — only presigned URL (E1-API-23)."

  - id: "E1-API-29"
    method: "DELETE"
    path: "/api/v1/admin/mentors/:id/artefacts/:artefactId"
    auth: "jwt — role: ADMIN"
    feature: "F1.4"
    behaviors: ["B1.4.3"]
    description: "Delete a verification artefact. For DOCUMENT type, also deletes S3 object."
    responses:
      204:
        description: "Artefact deleted (no body)"
      404:
        description: "Artefact not found or does not belong to mentor profile"

  # ── Health Endpoint ─────────────────────────────────────────────────────────

  - id: "E1-API-30"
    method: "GET"
    path: "/health"
    auth: "none"
    feature: "infrastructure"
    description: "ECS Fargate health check endpoint — returns 200 when app is healthy"
    responses:
      200:
        schema:
          status: "ok"
          timestamp: "ISO8601"
          version: "string (from package.json)"
