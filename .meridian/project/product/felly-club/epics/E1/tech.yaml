      - "B1.6.5 (auth enforcement): UserController only returns current user data via @CurrentUser() — no userId param exposed"

  - id: "AdminModule"
    type: "nestjs-module"
    package: "packages/backend-api"
    responsibility: "Admin operations scoped to E1: mentor onboarding workflow (create draft, edit, upload artefacts, submit for verification), verification queue management (approve/reject), and user list view. All routes require Admin role. Enforces INV-01 (mentor not visible until approved), INV-03 (verified badge admin-only)."
