        │   │   │   ├── ProfileCompleteness.tsx    # Progress bar showing completeness percentage + missing fields list
        │   │   │   └── AvatarUpload.tsx           # Avatar file picker with preview (uploads to /api/v1/users/me/avatar)
        │   │   ├── layout/
        │   │   │   ├── AppNav.tsx                 # Top navigation with user menu + logout
        │   │   │   └── AppSidebar.tsx             # Sidebar navigation links
        │   │   └── ui/                            # Re-exported shadcn/ui components (Button, Input, Card, Dialog, etc.)
        │   ├── hooks/
