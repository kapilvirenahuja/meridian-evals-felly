# ─── Libraries ────────────────────────────────────────────────────────────────
# All versions pinned as semver ranges. Use exact versions in lockfile.

libraries:

  "packages/shared-types":
    dependencies:
      - name: "typescript"
        version: "^5.4.0"
        purpose: "TypeScript compiler — types only package, no runtime dependencies"

  "packages/backend-api":
    dependencies:
      # NestJS core
      - name: "@nestjs/common"
        version: "^10.3.10"
        purpose: "NestJS decorators, pipes, guards, interceptors, exception filters"
      - name: "@nestjs/core"
        version: "^10.3.10"
        purpose: "NestJS application bootstrap and DI container"
      - name: "@nestjs/platform-fastify"
        version: "^10.3.10"
        purpose: "Fastify HTTP adapter for NestJS — replaces default Express for performance"
      - name: "@nestjs/config"
        version: "^3.2.3"
        purpose: "Environment variable configuration module with .env file support"
      - name: "@nestjs/passport"
        version: "^10.0.3"
        purpose: "NestJS Passport.js integration for JWT auth strategy binding to guards"
      - name: "@nestjs/swagger"
        version: "^7.3.1"
        purpose: "OpenAPI 3.1 spec auto-generation from decorators; Swagger UI at /api/docs"
      - name: "fastify"
        version: "^4.27.0"
        purpose: "HTTP server — faster than Express (2-3x throughput), NestJS Fastify adapter dep"
      # Prisma ORM
      - name: "@prisma/client"
        version: "^5.14.0"
        purpose: "Auto-generated Prisma type-safe database client"
      # Validation
      - name: "class-validator"
        version: "^0.14.1"
        purpose: "DTO validation decorators — @IsEmail, @IsString, @MinLength, @IsEnum, etc."
      - name: "class-transformer"
        version: "^0.5.1"
        purpose: "plainToInstance and Exclude/Expose for DTO serialisation; used by ValidationPipe"
      # Auth (mock adapter dependencies)
      - name: "jsonwebtoken"
        version: "^9.0.2"
        purpose: "JWT signing and verification in MockAuthAdapter — same payload shape as KeyCloak JWTs"
      - name: "bcryptjs"
        version: "^2.4.3"
        purpose: "Password hashing in MockAuthAdapter — bcrypt rounds 12 for password storage"
      - name: "passport"
        version: "^0.7.0"
        purpose: "Passport.js core — authentication middleware wired to NestJS guards"
      - name: "passport-jwt"
        version: "^4.0.1"
        purpose: "Passport JWT strategy — extracts and validates Bearer tokens"
      # Logging
      - name: "nestjs-pino"
        version: "^4.1.0"
        purpose: "NestJS integration for Pino structured JSON logger"
      - name: "pino"
        version: "^9.0.0"
        purpose: "Fast structured JSON logger — replaces console.log in all modules"
      - name: "pino-http"
        version: "^10.2.0"
        purpose: "HTTP request/response logging middleware for Fastify with Pino"
      # Shared types
      - name: "@felly/shared-types"
        version: "workspace:*"
        purpose: "Shared TypeScript enums and interfaces (UserRole, MentorProfileStatus, etc.)"
      # NestJS RxJS
      - name: "rxjs"
        version: "^7.8.1"
        purpose: "Reactive extensions — required by NestJS core pipes and interceptors"
      - name: "reflect-metadata"
        version: "^0.1.14"
        purpose: "TypeScript decorator metadata reflection — required by NestJS DI"

    devDependencies:
      - name: "prisma"
        version: "^5.14.0"
        purpose: "Prisma CLI — npx prisma migrate dev, npx prisma generate, npx prisma studio"
      - name: "@nestjs/testing"
        version: "^10.3.10"
        purpose: "NestJS testing utilities — Test.createTestingModule for unit/integration tests"
      - name: "jest"
        version: "^29.7.0"
        purpose: "Test runner for all unit and integration tests"
      - name: "ts-jest"
        version: "^29.1.5"
        purpose: "TypeScript preprocessor for Jest — runs .spec.ts files without compilation step"
      - name: "@types/jest"
        version: "^29.5.12"
        purpose: "TypeScript types for Jest"
      - name: "supertest"
        version: "^7.0.0"
        purpose: "HTTP assertion library for NestJS e2e/controller integration tests"
      - name: "@types/supertest"
        version: "^6.0.2"
        purpose: "TypeScript types for Supertest"
      - name: "@types/jsonwebtoken"
        version: "^9.0.6"
        purpose: "TypeScript types for jsonwebtoken"
      - name: "@types/bcryptjs"
