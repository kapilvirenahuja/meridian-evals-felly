slug: felly-club
type: product
status: LOCKED
domain: "mentorship-marketplace"
created_at: "2026-03-25"
updated_at: "2026-03-25T22:42:00+0530"

market_context:
  problem_statement: >
    The global mentorship landscape is fragmented and opaque. Aspiring individuals
    struggle to identify credible, accessible mentors, while accomplished professionals
    lack a structured, trustworthy channel to offer guidance. Key pain points include
    no standardized discovery mechanism for domain-specific mentors, absence of
    transparent pricing and quality indicators, high friction in scheduling and payment,
    limited accountability and dispute resolution, and no data-driven insights for
    participants. The niche of Sport and Entertainment mentorship is particularly
    underserved — existing platforms focus heavily on tech, business, and design,
    leaving athletes, performers, and creative professionals without a curated
    marketplace for domain-verified mentors.

  target_users:
    - persona: "Ambitious Mentee"
      goal: "Find and book sessions with credible, domain-verified mentors in Sport, Entrepreneurship, Business, or Entertainment"
      frustration: "Cannot discover quality mentors in niche domains; existing platforms are tech/business-centric with no curation for sport or entertainment verticals"
      context: "Early-to-mid career professionals, aspiring athletes, entrepreneurs, and creatives in India, Switzerland, USA, and Germany seeking structured guidance"

    - persona: "Domain-Expert Mentor"
      goal: "Monetize expertise through a structured, trustworthy channel with minimal operational overhead"
      frustration: "No platform offers verified credentialing, transparent pricing bands, and reliable payout mechanisms for niche domain experts"
      context: "Accomplished professionals, athletes, entrepreneurs, and entertainers willing to mentor but lacking a frictionless channel"

    - persona: "Platform Administrator"
      goal: "Curate mentor quality, manage disputes, oversee financial operations, and ensure regulatory compliance across multiple geographies"
      frustration: "Multi-geography compliance (GDPR, TPDP, PCI DSS) and escrow/payout operations are complex and error-prone without dedicated tooling"
      context: "Operations team managing a four-country marketplace with commission-based revenue model"

  competitors:
    - name: "MentorCruise"
      description: "Online mentorship marketplace with 6,200+ vetted mentors across 130+ countries. Focuses on tech, data science, AI, and design."
      pricing: "Monthly plans $50-$400/month; one-off sessions from $39 (30 min) to $99 (60 min). Platform takes ~20% markup on mentor fees."
      strengths:
        - "Rigorous vetting — less than 5% mentor acceptance rate"
        - "Long-term mentorship model with 7-day trial"
        - "Async messaging included between sessions"
        - "Large mentor pool across 130+ countries"
      weaknesses:
        - "Tech and design focused — no Sport or Entertainment verticals"
        - "No video session delivery built-in (relies on external tools)"
        - "No escrow or dispute resolution mechanism"
        - "No multi-currency or multi-geography compliance"

    - name: "Clarity.fm"
      description: "Per-minute expert call marketplace. Connects users with experts via phone bridge for paid consultations."
      pricing: "Per-minute billing: $2-$30/minute ($120-$960/hour effective). Platform takes 15% service fee."
      strengths:
        - "High-profile expert roster (CEOs, investors)"
        - "Simple per-minute billing model"
        - "Established brand in startup advisory space"
      weaknesses:
        - "Phone-only sessions — no video capability"
        - "Very expensive for longer sessions"
        - "No ongoing mentorship relationship support"
        - "No domain verification or curation beyond self-reported profiles"
        - "No Sport or Entertainment verticals"

    - name: "GrowthMentor"
      description: "Subscription-based mentorship platform for startup founders and marketers. Less than 3% mentor acceptance rate."
      pricing: "Light plan $50/month (3 calls); Pro plan $75/month (unlimited calls). Flat subscription model."
      strengths:
        - "Extremely selective vetting — less than 3% acceptance"
        - "Unlimited calls on Pro plan — predictable cost"
        - "Strong startup and growth marketing focus"
      weaknesses:
        - "Narrow focus on startup growth and marketing only"
        - "No Sport, Entertainment, or general Business verticals"
        - "Subscription model limits mentor earnings potential"
        - "No built-in video delivery or recording"

    - name: "ADPList"
      description: "Free mentorship platform with 38,000+ mentors and 600,000+ sessions completed. Primarily serves design, product, and engineering communities."
      pricing: "Free for 1:1 mentoring. ADPList Advance (paid, closed beta) around $599 for 3-session packages."
      strengths:
        - "Massive scale — 38,000+ mentors, 310M+ mentorship minutes"
        - "Free model drives high mentee acquisition"
        - "Group sessions and townhall formats"
        - "Strong community and feedback mechanisms"
      weaknesses:
        - "Free model means mentors cannot effectively monetize"
        - "Design and tech focused — no Sport or Entertainment"
        - "Paid tier still in closed beta — unclear monetization path"
        - "Quality control challenges at scale with volunteer mentors"

    - name: "MentorPass"
      description: "Subscription mentorship platform for startup founders. Positioned as 'ClassPass for mentorship' with credit-based booking."
      pricing: "Lite $300/month; Standard $600/month; Premium $1,200/month (120 credits, VIP mentors)."
      strengths:
        - "Credit-based model offers flexibility"
        - "Structured mentoring journeys on specific topics"
        - "Focus on founder-to-advisor relationships"
      weaknesses:
        - "Very expensive — entry at $300/month"
        - "Startup/business only — no Sport or Entertainment"
        - "Small mentor pool compared to MentorCruise or ADPList"
        - "No built-in video session delivery"

    - name: "SCORE"
      description: "Largest volunteer mentor network in the US for small businesses. Mentors matched by zip code."
      pricing: "Completely free — all mentors are volunteers."
      strengths:
        - "Free and accessible"
        - "Large volunteer network across the US"
        - "Backed by SBA (Small Business Administration)"
      weaknesses:
        - "US-only — no international coverage"
        - "Volunteer model means inconsistent availability and quality"
        - "Small business focus only — no Sport or Entertainment"
        - "No tech platform for video sessions or scheduling"

    - name: "Voice In Sport (VIS)"
      description: "Sports-focused mentorship platform connecting female athletes with professional and college athlete mentors."
      pricing: "Membership-based. 1:1 and group virtual sessions."
      strengths:
        - "Only major platform with explicit sports mentorship focus"
        - "Professional and college athlete mentors"
        - "Virtual 1:1 and group session formats"
      weaknesses:
        - "Female athletes only — limited audience"
        - "Sports-only — no Business, Entrepreneurship, or Entertainment"
        - "Small scale compared to general mentorship platforms"
        - "No marketplace pricing or commission model"

  market_size:
    tam: "USD 1.5-3.4 billion — Global mentoring software market (2025-2033 projections vary by source; consensus estimates place 2025 at USD 850M-1.5B with CAGR of 14-22%)"
    sam: "USD 200-400 million — Mentorship marketplace segment (B2C/B2B2C platforms connecting individual mentors with mentees, excluding enterprise-only mentoring software like Chronus, MentorCliQ)"
    som: "USD 5-15 million — Curated mentorship in Sport, Entertainment, Business, and Entrepreneurship across India, Switzerland, USA, and Germany within first 3 years"
    note: >
      Market size estimates vary significantly across research firms due to differing
      definitions (mentoring software vs. mentoring marketplace vs. coaching platforms).
      The mentoring software market was valued at approximately USD 850M-1.5B in 2025
      (sources: 360iResearch, Business Research Insights, Research Nester). Growth is
      driven by remote work trends, AI-powered matching, and increasing demand for
      personalized professional development. The Sport and Entertainment mentorship
      niche is notably underserved by existing platforms, representing a greenfield
      opportunity.

  differentiators:
    - "Multi-vertical curation across Sport, Entrepreneurship, Business, and Entertainment — no existing platform covers all four with domain-verified mentors"
    - "Domain-verified mentor badges with structured credentialing — goes beyond self-reported profiles used by most competitors"
    - "Built-in video session delivery (30/60 min) with optional recording — eliminates dependency on external tools like Zoom or Skype"
    - "Transparent pricing bands with platform-enforced min/max ranges and 10-20% commission — contrasts with opaque per-minute billing (Clarity.fm) or flat subscriptions (GrowthMentor)"
    - "Escrow-based payment with structured refund and dispute resolution — addresses a gap in MentorCruise, ADPList, and most competitors"
    - "Multi-geography compliance by design (GDPR, India TPDP, PCI DSS) — enables operation in India, Switzerland, USA, and Germany from day one"
    - "Sport and Entertainment verticals are a greenfield opportunity — existing platforms focus almost exclusively on tech, design, and startup advisory"
    - "Referral-driven acquisition model targeting mentee network effects within niche communities"

  risks:
    - "Cold-start problem: Attracting sufficient high-quality mentors in Sport and Entertainment verticals before mentee demand materializes — chicken-and-egg marketplace challenge"
    - "Budget constraint: EUR 50K budget and 16-week timeline limits MVP scope significantly compared to well-funded competitors (ADPList raised $1.3M seed; MentorCruise is established and profitable)"
    - "Multi-geography compliance complexity: GDPR (EU/Switzerland), India TPDP, PCI DSS across four countries increases legal and engineering cost disproportionate to early-stage revenue"
    - "Mentor monetization expectations: Domain experts in Sport and Entertainment may have higher earning expectations than the platform's commission model can sustain at low volume"
    - "Video infrastructure cost: Built-in video delivery (vs. redirecting to Zoom) adds significant infrastructure cost and reliability burden for an MVP"
    - "Trust and safety: Recording mentorship sessions raises privacy concerns and may deter mentors, especially high-profile individuals in Entertainment and Sport"
    - "Market education: Mentees in Sport and Entertainment may not yet associate online platforms with mentorship — demand generation requires category creation, not just capture"
    - "Competition from free alternatives: ADPList's free model and SCORE's volunteer network set low price anchors that complicate willingness-to-pay for a new entrant"
    - "Regulatory variance: Payment processing (escrow, cross-border payouts, refunds) across India, Switzerland, USA, and Germany involves multiple payment rails and regulatory regimes"

vision:
  statement: >
    To establish Felly Club as the premier tech-enabled mentorship ecosystem for Sport,
    Entrepreneurship, Business, and Entertainment — connecting aspiring individuals with
    domain-verified mentors through a transparent, trust-driven marketplace. Felly Club
    bridges the gap between raw ambition and structured guidance by delivering curated
    discovery, frictionless scheduling, secure payments, and quality-assured sessions
    across four countries, all within a EUR 50K budget and 16-week delivery window.

value_proposition:
  - persona: "Ambitious Mentee"
    proposition: >
      Discover credible, domain-verified mentors in Sport, Entertainment, Business, and
      Entrepreneurship — verticals ignored by existing platforms. Book sessions with
      transparent pricing, built-in video delivery, and quality guarantees backed by
      ratings, refund policies, and dispute resolution. No more guessing if a mentor is
      legitimate or overpaying through opaque billing models.
  - persona: "Domain-Expert Mentor"
    proposition: >
      Monetize your expertise through a structured channel that handles scheduling,
      payments, and compliance. Receive domain-verified badges that signal credibility,
      set your own rates within transparent pricing bands, and get reliable payouts with
      escrow protection. Focus on mentoring — the platform handles the operational
      overhead.
  - persona: "Platform Administrator"
    proposition: >
      Manage a multi-geography mentorship marketplace with purpose-built tooling for
      mentor curation, dispute resolution, financial operations, and compliance
      monitoring. Role-based access, audit trails, and dashboard analytics reduce manual
      oversight and enable confident decision-making across India, Switzerland, USA,
      and Germany.

strategic_goals:
  - id: "SG-01"
    goal: "Launch a functional mentorship marketplace MVP covering mentor onboarding, mentee discovery, session booking, and payment processing across four verticals within 16 weeks"
    success_metric: "Platform live with end-to-end flow (signup to session completion to payout) operational in at least 2 of 4 target countries within 16 weeks of development start"

  - id: "SG-02"
    goal: "Establish mentor supply in underserved verticals (Sport and Entertainment) through domain-verified credentialing and curated onboarding"
    success_metric: "Minimum 50 domain-verified mentors onboarded across Sport and Entertainment verticals within 8 weeks of platform launch"

  - id: "SG-03"
    goal: "Deliver trust and transparency as core platform differentiators through escrow payments, structured dispute resolution, and quality ratings"
    success_metric: "Less than 5% dispute rate on completed sessions; greater than 80% of mentees rate sessions 4+ stars within first 3 months of operation"

  - id: "SG-04"
    goal: "Achieve multi-geography regulatory compliance (GDPR, India TPDP, PCI DSS) as a built-in platform capability, not a retrofit"
    success_metric: "Zero compliance violations or data protection incidents across all four operating countries in the first 6 months post-launch"

  - id: "SG-05"
    goal: "Build a referral-driven acquisition engine that leverages niche community network effects to reduce customer acquisition cost"
    success_metric: "Greater than 30% of new mentee signups originating from referral links within 3 months of launch; CAC below EUR 15 per mentee"

scope:
  in_scope:
    - epic: "Authentication and Authorization"
      description: "KeyCloak-based SSO, MFA, RBAC for mentee/mentor/admin roles"
    - epic: "Mentor Discovery and Search"
      description: "Elasticsearch-powered search with filters by domain, rating, pricing, availability, and language"
    - epic: "Session Management"
      description: "Booking flow for 30/60-min sessions, calendar integration, scheduling, rescheduling, and cancellation policies"
    - epic: "Payment Processing"
      description: "PayU integration with escrow, multi-currency support, commission calculation, mentor payouts, and refund workflows"
    - epic: "Quality and Ratings"
      description: "Post-session rating system, mentor badges, domain verification, and quality scoring"
    - epic: "Analytics Dashboard"
      description: "Platform metrics for admin (revenue, sessions, disputes), mentor (earnings, ratings, bookings), and mentee (session history, spending)"
    - epic: "Admin Panel"
      description: "Mentor approval workflow, dispute management, financial oversight, user management, and compliance monitoring"
    - epic: "Communications"
      description: "SendGrid email notifications, FCM push notifications, in-app messaging between mentor and mentee"
    - epic: "Acquisition and Referrals"
      description: "Referral link generation, tracking, reward mechanics, and attribution analytics"
    - epic: "Video Sessions"
      description: "Zoom SDK integration for in-platform video delivery with optional session recording"
    - epic: "Compliance and Data Protection"
      description: "GDPR consent flows, India TPDP compliance, data export/deletion, audit logging, and PCI DSS scope management via payment gateway"
    - epic: "Platform Configuration"
      description: "Pricing band management, commission rate settings, category/vertical management, and feature flags"
  out_of_scope:
    - "Group mentorship sessions and cohort-based programs"
    - "AI-powered mentor-mentee matching algorithms"
    - "Native mobile applications (React Native) — MVP targets responsive web; mobile apps deferred to Phase 2"
    - "Marketplace for digital products (courses, templates, guides)"
    - "White-label or B2B2C enterprise licensing"
    - "Advanced analytics with ML-based predictions (churn, LTV)"
    - "Multi-language platform UI localization beyond English"
    - "Mentor-led content publishing (blogs, articles, podcasts)"
    - "Integration with external calendar providers beyond Google Calendar"
    - "Custom video infrastructure — MVP uses Zoom SDK; proprietary video deferred to Phase 2"

success_metrics:
  - metric: "Platform Activation Rate"
    target: "Greater than 40% of registered mentees complete at least one session within 30 days of signup"
    measurement: "Ratio of mentees with 1+ completed sessions to total registered mentees, measured monthly"
  - metric: "Mentor Utilization Rate"
    target: "Greater than 25% of onboarded mentors conduct at least one session per month"
    measurement: "Ratio of active mentors (1+ sessions/month) to total approved mentors, measured monthly"
  - metric: "Session Completion Rate"
    target: "Greater than 85% of booked sessions are completed (not cancelled or no-showed)"
    measurement: "Ratio of completed sessions to total booked sessions, measured weekly"
  - metric: "Net Promoter Score (Mentee)"
    target: "NPS greater than 40 within first 3 months"
    measurement: "Post-session NPS survey to mentees, aggregated monthly"
  - metric: "Revenue per Session"
    target: "Average platform commission of EUR 8-15 per completed session"
    measurement: "Total commission revenue divided by completed sessions, measured monthly"
  - metric: "Time to First Session"
    target: "Median time from mentee signup to first completed session under 7 days"
    measurement: "Median elapsed time between account creation and first session completion, measured weekly"

assumptions:
  - "Domain experts in Sport and Entertainment are willing to mentor through an online platform at price points of EUR 30-150 per session"
  - "Mentees in Sport and Entertainment verticals will pay for structured mentorship when discovery, credentialing, and quality assurance reduce uncertainty"
  - "Zoom SDK integration provides sufficient video quality and reliability for MVP — custom video infrastructure is not needed at launch"
  - "PayU supports escrow-like hold-and-release payment flows across India, Switzerland, USA, and Germany without requiring a full escrow banking license"
  - "KeyCloak can be configured for multi-tenant RBAC with social login within the 16-week timeline without excessive customization"
  - "EUR 50K budget is sufficient for a 3-person engineering team over 16 weeks, covering infrastructure, third-party service costs, and contingency"
  - "Initial mentor supply (50+ mentors) can be seeded through founder networks and targeted outreach before paid acquisition is needed"
  - "GDPR and India TPDP compliance can be achieved at MVP level through consent management and data handling policies without dedicated legal counsel on retainer"
  - "Responsive web application provides adequate mobile experience for MVP — native mobile apps are not required for initial market validation"
  - "A 10-20% platform commission rate is competitive and acceptable to mentors given the value of discovery, scheduling, payment, and quality infrastructure"

profiles:
  product_profile:
    - dimension: "PP-1"
      name: "User Sophistication"
      level: 4
      label: "General Consumer"
      rationale: "Mentees are general consumers seeking mentorship — expect zero learning curve, mobile-first UX, and intuitive flows without onboarding friction"

    - dimension: "PP-2"
      name: "UX Maturity"
      level: 3
      label: "Multi-Channel Responsive"
      rationale: "MVP targets responsive web with Zoom SDK integration; React Native mobile apps deferred to Phase 2 but responsive design must support mobile browsers from day one"

    - dimension: "PP-3"
      name: "Persona Complexity"
      level: 5
      label: "Multi-Sided Platform"
      rationale: "Three distinct personas (mentee, mentor, admin) with different flows, permissions, and value propositions — classic multi-sided marketplace dynamics with supply-demand interdependency"

    - dimension: "PP-4"
      name: "Geographic Scope"
      level: 3
      label: "Multi-Country"
      rationale: "Operations across India, Switzerland, USA, and Germany — four countries spanning three regulatory regimes (EU/GDPR, India/TPDP, US state-level) and multiple currencies"

    - dimension: "PP-5"
      name: "Integration Density"
      level: 3
      label: "Bidirectional"
      rationale: "Six external integrations (Zoom, PayU, SendGrid, FCM, KeyCloak, Elasticsearch) requiring bidirectional data flow — webhooks, callbacks, and event-driven sync"

    - dimension: "PP-6"
      name: "Delivery Ambition"
      level: 3
      label: "Market-Ready v1"
      rationale: "Production-grade MVP within 16 weeks and EUR 50K budget — must handle real payments, real users, and real compliance obligations from launch"

    - dimension: "PP-7"
      name: "Industry Vertical"
      level: 4
      label: "Regulated Commerce"
      rationale: "Financial transactions (escrow, payouts, refunds) trigger PCI DSS scope; cross-border operations require GDPR and India TPDP compliance; marketplace model adds consumer protection obligations"

  nfr_profile:
    - dimension: "NFR-1"
      name: "Risk"
      level: 3
      label: "Significant"
      rationale: "Customer-facing marketplace with financial transactions (PP-7: Regulated Commerce) and multi-sided platform dynamics (PP-3: Level 5) — failures impact real money and trust"

    - dimension: "NFR-2"
      name: "Security"
      level: 3
      label: "Hardened"
      rationale: "PP-7 (Regulated Commerce) mandates PCI DSS scope via payment gateway; PP-3 (Multi-Sided Platform) requires RBAC and tenant isolation; MFA, encryption at rest and in transit, and session security are baseline requirements"

    - dimension: "NFR-3"
      name: "Performance"
      level: 3
      label: "Optimized"
      rationale: "PP-1 (General Consumer) expects sub-500ms API response and under 3-second page loads; PP-4 (Multi-Country) means latency across geographies must be managed; search (Elasticsearch) and video (Zoom) are latency-sensitive"

    - dimension: "NFR-4"
      name: "Availability"
      level: 3
      label: "Resilient"
      rationale: "PP-6 (Market-Ready v1) with real payment flows requires 99.5% uptime; PP-3 (Multi-Sided Platform) means downtime affects both supply and demand sides simultaneously; session booking is time-sensitive"

    - dimension: "NFR-5"
      name: "Compliance"
      level: 4
      label: "Multi-Regime"
      rationale: "PP-4 (Multi-Country across 4 nations) combined with PP-7 (Regulated Commerce) creates multi-regime compliance burden — GDPR, India TPDP, PCI DSS, and potentially consumer protection laws in each jurisdiction"

    - dimension: "NFR-6"
      name: "Scalability"
      level: 2
      label: "Moderate"
      rationale: "PP-6 (Market-Ready v1) at MVP stage with EUR 50K budget — initial user base is modest (target: 50 mentors, hundreds of mentees); architecture should not preclude scaling but premature optimization is wasteful"

    - dimension: "NFR-7"
      name: "Data Sensitivity"
      level: 4
      label: "Highly Sensitive"
      rationale: "PP-7 (Regulated Commerce) involves financial transaction data and payment credentials; session recordings contain personal conversations; PII across four jurisdictions with varying data protection requirements"

  quality_profile:
    - dimension: "QP-1"
      name: "Testing Depth"
      level: 3
      label: "Layered"
      rationale: "PP-6 (Market-Ready v1) demands production-grade reliability; NFR-1 (Significant Risk) with financial transactions means defects have real monetary impact — unit, integration, and E2E testing required for critical paths"

    - dimension: "QP-2"
      name: "Code Quality Standards"
      level: 3
      label: "Enforced"
      rationale: "PP-6 (Market-Ready v1) with NFR-2 (Hardened Security) requires consistent code standards — linting, static analysis, and code review gates to prevent security regressions in payment and auth flows"

    - dimension: "QP-3"
      name: "Documentation Level"
      level: 3
      label: "Comprehensive"
      rationale: "PP-5 (Bidirectional Integration) across six external services requires integration documentation; PP-3 (Multi-Sided Platform) needs API documentation for each persona's flow; NFR-5 (Multi-Regime Compliance) requires compliance documentation"

    - dimension: "QP-4"
      name: "CI/CD Maturity"
      level: 3
      label: "Continuous Delivery"
      rationale: "PP-6 (Market-Ready v1) within 16-week timeline requires automated build, test, and deploy pipelines; GitHub Actions with staging and production environments; NFR-4 (Resilient Availability) requires zero-downtime deployment capability"

    - dimension: "QP-5"
      name: "Observability Maturity"
      level: 3
      label: "Monitored"
      rationale: "NFR-4 (Resilient Availability at 99.5%) requires uptime monitoring and alerting; NFR-1 (Significant Risk) with financial transactions demands transaction tracing; PP-5 (Bidirectional Integration) needs health checks across six external dependencies"

    - dimension: "QP-6"
      name: "Accessibility Standard"
      level: 2
      label: "Basic"
      rationale: "PP-1 (General Consumer) requires usable interfaces but PP-6 (Market-Ready v1) with EUR 50K budget constrains accessibility investment; mobile-responsive design and semantic HTML as baseline; WCAG AA deferred to Phase 2"

    - dimension: "QP-7"
      name: "Security Testing"
      level: 3
      label: "Proactive"
      rationale: "NFR-2 (Hardened Security) with PP-7 (Regulated Commerce) requires SAST in CI pipeline and dependency vulnerability scanning; PCI DSS scope (even via gateway) mandates documented security testing; penetration testing recommended pre-launch"
