market_context:
  problem: |
    The mentorship landscape is fragmented across informal networks, LinkedIn DMs, and niche platforms
    that rarely span beyond tech and business domains. Individuals seeking guidance in Sport,
    Entertainment, Entrepreneurship, and Business face several systemic friction points:

    1. Discovery gap: No single marketplace aggregates verified mentors across Sport, Entertainment,
       Business, and Entrepreneurship verticals. Existing platforms (MentorCruise, GrowthMentor, ADPList)
       are tech/startup-centric. Sports mentorship is scattered across NGO programs (Living Sport,
       WeCOACH) and informal networks with no transactional layer.

    2. Trust deficit: Mentor credentials are self-reported on most platforms. There is no standardized
       domain-verification process, leaving mentees unable to distinguish credentialed experts from
       self-proclaimed coaches.

    3. Pricing opacity: Rates range from free (ADPList) to $960/hour (Clarity.fm) with no
       standardization. Per-minute billing (Clarity.fm) creates anxiety; flat monthly subscriptions
       (MentorCruise at $200-400/month) lock mentees into commitments before trust is established.

    4. Payment risk: Most platforms lack escrow mechanisms. Mentors risk non-payment for completed
       sessions; mentees risk paying for no-shows or subpar sessions with limited recourse.

    5. Multi-geography compliance: Platforms operating across India, EU (Germany), Switzerland, and
       USA must navigate GDPR, India's DPDP Act (formerly TPDP), PCI DSS for payments, and Germany's
       FernUSG (Distance Learning Protection Act) which now applies to online mentoring/coaching.

    6. Session accountability: No mainstream mentorship platform offers session recordings for
       dispute resolution, creating a he-said/she-said dynamic when quality disputes arise.

  target_users:
    - persona: "Ambitious Mentee"
      goal: "Find a verified, domain-specific mentor and book a focused 1-on-1 video session to accelerate career or skill development"
      frustration: "Cannot find credible mentors in Sport or Entertainment verticals; existing platforms are tech-only; pricing is opaque; no recourse for bad sessions"
      context: "Early-to-mid career professionals or aspiring athletes/entertainers in India, Switzerland, USA, or Germany seeking structured mentorship outside their immediate network"

    - persona: "Domain-Expert Mentor"
      goal: "Monetize expertise through structured sessions with a reliable payment guarantee and minimal administrative overhead"
      frustration: "Informal mentoring yields no income; existing platforms either pay nothing (ADPList) or take high commissions (Clarity.fm 15%, MentorCruise 16-20%); no protection against mentee no-shows"
      context: "Accomplished professionals, former athletes, entrepreneurs, or entertainment industry veterans with verifiable credentials who want a side-income channel"

    - persona: "Platform Administrator"
      goal: "Manage mentor verification, content moderation, dispute resolution, compliance, and marketplace health"
      frustration: "Manual mentor vetting does not scale; cross-jurisdiction compliance is complex; dispute resolution without session evidence is subjective"
      context: "Felly Club operations team responsible for marketplace integrity across four geographies with different regulatory requirements"

  competitors:
    - name: "MentorCruise"
      type: "Direct competitor - paid mentorship marketplace"
      strengths:
        - "5,500+ vetted mentors with <5% acceptance rate"
        - "23,700+ successful matches across 130+ countries"
        - "Long-term mentorship model with monthly subscriptions ($200-400/month)"
        - "$506K revenue in 2024, growing from $288K in 2023 (76% YoY growth)"
      weaknesses:
        - "Tech/startup-centric - no Sport or Entertainment verticals"
        - "16-20% platform commission is high for mentors"
        - "No escrow or session recording for dispute resolution"
        - "Monthly subscription model creates commitment friction before trust is established"

    - name: "ADPList"
      type: "Direct competitor - freemium mentorship platform"
      strengths:
        - "38,024 mentors, 602,934 sessions, 310M+ mentorship minutes (2025)"
        - "Free tier drives massive adoption and network effects"
        - "Strong brand in design and product management communities"
        - "Backed by Sequoia Capital India (Surge program, $1.3M seed)"
      weaknesses:
        - "Free model limits mentor monetization - no transactional layer for paid sessions"
        - "Heavily skewed toward design/UX and product management verticals"
        - "No payment infrastructure, escrow, or session-based commerce"
        - "Mentor quality is inconsistent due to low barriers to entry"

    - name: "GrowthMentor"
      type: "Direct competitor - subscription mentorship platform"
      strengths:
        - "750+ curated mentors focused on startup growth"
        - "Flat subscription ($50-75/month) makes sessions affordable"
        - "Session recordings with AI summaries (Pro plan)"
        - "Fully bootstrapped, lean operation"
      weaknesses:
        - "Narrow vertical focus: growth, marketing, fundraising only"
        - "Mentors are not directly compensated - limits supply-side growth"
        - "Single-session model discourages long-term mentor-mentee relationships"
        - "Small mentor pool compared to MentorCruise and ADPList"

    - name: "Clarity.fm"
      type: "Direct competitor - per-minute expert call platform"
      strengths:
        - "Established brand with high-profile entrepreneurs as experts"
        - "Per-minute pricing ($2-30/min) allows flexible session lengths"
        - "Low barrier to entry for mentors"
      weaknesses:
        - "Per-minute billing creates anxiety and rushed conversations ($120-960/hour effective rate)"
        - "15% service fee on every call"
        - "Transactional, single-call model with no relationship continuity"
        - "Limited vetting of expert credentials"
        - "No vertical specialization in Sport or Entertainment"

    - name: "MicroMentor"
      type: "Indirect competitor - free nonprofit mentoring platform"
      strengths:
        - "World's largest free business mentoring platform (500,000+ users, 180 countries)"
        - "Strong institutional partnerships (corporations, governments, foundations)"
        - "Multilingual platform with global reach"
        - "Pioneering Mentoring-as-a-Service (MaaS) for enterprise clients"
      weaknesses:
        - "Nonprofit model - no monetization for individual mentors"
        - "Business-only focus, no Sport or Entertainment verticals"
        - "No video conferencing or session management built in"
        - "Matching quality varies due to open access model"

    - name: "Sports Mentorship Hub / SC Mentor Hub"
      type: "Niche competitor - sports-specific mentoring"
      strengths:
        - "Domain-specific focus on sports performance and careers"
        - "Expert mentors in sports industry"
      weaknesses:
        - "Limited scale and technology platform"
        - "No marketplace transaction layer or payment processing"
        - "Geographic reach is limited"
        - "No cross-vertical coverage (Sport only, no Entertainment or Business)"

    - name: "SCORE.org"
      type: "Indirect competitor - free small business mentoring"
      strengths:
        - "Backed by SBA (U.S. Small Business Administration)"
        - "Large volunteer mentor network (10,000+ mentors)"
        - "Free mentoring for entrepreneurs"
      weaknesses:
        - "U.S.-only, no international coverage"
        - "Volunteer model - no mentor monetization"
        - "Business-only, no Sport or Entertainment"
        - "Limited technology platform - primarily matching, no video or payments"

  market_size:
    tam: "USD 849M - 1.53B (2025 global mentoring software market, varying by research firm methodology)"
    sam: "USD 200-350M (online mentorship marketplace segment - consumer/SMB platforms excluding enterprise-only mentoring software; estimated at ~25% of total mentoring software market)"
    som: "USD 5-15M (achievable within 3 years across India, Switzerland, USA, Germany in Sport/Entrepreneurship/Business/Entertainment verticals; assumes 2-4% capture of SAM in target geographies and verticals)"
    note: |
      Market growing at 14.9% CAGR, projected to reach USD 2.25B by 2032. North America holds
      40-45% of global revenue, Europe 25-30%, Asia-Pacific is fastest growing with high-teens
      annual growth. An estimated 25-30 million active mentors and mentees on digital platforms
      globally. The Sport and Entertainment mentorship sub-segments are largely undigitized,
      representing greenfield opportunity. Sources: 360iResearch, Research and Markets,
      Market Growth Reports (2025-2026 estimates).

  differentiators:
    - "Vertical breadth beyond tech: Sport and Entertainment verticals are unserved by existing marketplace platforms - Felly Club is the first curated marketplace spanning Sport, Entrepreneurship, Business, and Entertainment"
    - "Domain-verified mentors: Structured credential verification process (not self-reported) with <10% target acceptance rate, ensuring trust before first session"
    - "Escrow-backed payments: Session fees held in escrow until session completion, protecting both mentors (guaranteed payment) and mentees (recourse for no-shows or disputes)"
    - "Session recordings for dispute resolution: Video sessions can be recorded and used as evidence in quality disputes - no other mentorship marketplace offers this"
    - "Multi-geography compliance by design: Built for GDPR (EU/Germany), DPDP Act (India), Swiss data protection (nFADP), PCI DSS, and German FernUSG from day one"
    - "Per-session transactional model: No monthly lock-in subscriptions - mentees pay per session, reducing commitment friction and enabling trust-building before repeat booking"
    - "Referral-driven growth: Built-in referral program to drive organic acquisition in network-effect-dependent marketplace"

  risks:
    - category: "Supply-side / Cold start"
      description: "Recruiting verified mentors in Sport and Entertainment is harder than tech - these professionals are less digitally native and less accustomed to platform-mediated mentoring"
      severity: "HIGH"
      mitigation: "Seed supply through partnerships with sports academies, entertainment industry guilds, and entrepreneur networks in target geographies; offer early mentors favorable commission rates"

    - category: "Marketplace liquidity"
      description: "Two-sided marketplace chicken-and-egg problem - mentees won't join without mentors, mentors won't join without mentees"
      severity: "HIGH"
      mitigation: "Launch vertical-by-vertical (Entrepreneurship first where supply is most available), concentrate on 1-2 geographies initially, use referral program to bootstrap demand"

    - category: "Regulatory complexity"
      description: "Operating across India, Germany, Switzerland, and USA requires compliance with GDPR, DPDP Act, nFADP, PCI DSS, and Germany's FernUSG (which now applies to online mentoring). Non-compliance carries significant fines."
      severity: "HIGH"
      mitigation: "GDPR-first architecture with data residency controls; engage local legal counsel per geography; FernUSG classification review before Germany launch"

    - category: "Budget and timeline"
      description: "EUR 125,000 fixed budget for 16-week delivery across web, iOS, Android, and admin portal is aggressive for a multi-geography marketplace with payment escrow, video integration, and regulatory compliance"
      severity: "HIGH"
      mitigation: "Strict MVP scoping - defer non-essential features; use third-party services (Zoom for video, Stripe for payments) to reduce custom build; prioritize web app, defer native mobile to post-MVP if needed"

    - category: "Competitive response"
      description: "MentorCruise or ADPList could add Sport/Entertainment verticals or launch in target geographies, leveraging existing network effects"
      severity: "MEDIUM"
      mitigation: "First-mover advantage in underserved verticals; deep domain verification creates a defensible quality moat; curated approach is harder to replicate than horizontal expansion"

    - category: "Payment processing"
      description: "Escrow payments across four jurisdictions involve different payment regulations, tax withholding requirements, and currency conversion complexities"
      severity: "MEDIUM"
      mitigation: "Use Stripe Connect or equivalent with built-in multi-currency and compliance features; start with primary currencies (EUR, USD, INR, CHF) only"

    - category: "Mentor quality control"
      description: "Verification of credentials in Sport and Entertainment lacks standardized credentialing bodies compared to tech certifications"
      severity: "MEDIUM"
      mitigation: "Develop domain-specific verification rubrics; partner with industry bodies for credential validation; use session ratings as ongoing quality signal"

    - category: "Video platform dependency"
      description: "Reliance on Zoom for video conferencing creates vendor lock-in and limits control over session recording, quality, and user experience"
      severity: "LOW"
      mitigation: "Abstract video provider behind an integration layer; evaluate alternatives (Daily.co, Whereby) for future flexibility"

vision:
  mission: "Democratize access to world-class mentorship by connecting ambitious individuals with domain-verified experts across Sport, Entrepreneurship, Business, and Entertainment through a trust-first, technology-enabled marketplace."
  tagline: "Verified mentors. Trusted sessions. Real growth."

value_proposition: |
  Felly Club is the first curated mentorship marketplace that spans beyond tech into Sport,
  Entrepreneurship, Business, and Entertainment verticals. Unlike platforms where credentials
  are self-reported and payment is uncertain, Felly Club verifies every mentor's domain expertise,
  holds session fees in escrow until completion, and records sessions for dispute resolution.
  Mentees get guaranteed quality and financial protection. Mentors get guaranteed payment and
  professional credibility. The platform operates across India, Switzerland, USA, and Germany
  with compliance built in from day one — not bolted on later.

strategic_goals:
  - id: "SG-1"
    title: "Establish a Trusted Mentor Supply"
    description: "Build a curated, domain-verified mentor network across Sport, Entrepreneurship, Business, and Entertainment with a target acceptance rate below 10%, creating a quality moat that competitors cannot easily replicate."
    success_metrics:
      - "100+ verified mentors onboarded within 90 days of launch"
      - "Mentor acceptance rate maintained below 10%"
      - "At least 2 verticals (Entrepreneurship + 1 other) with 25+ active mentors each"
      - "Mentor credential verification completed within 5 business days of application"

  - id: "SG-2"
    title: "Deliver a Friction-Free Session Experience"
    description: "Enable mentees to discover, book, and complete 1-on-1 video mentorship sessions in under 5 minutes of decision-to-booking, with escrow-backed payments and session recording for accountability."
    success_metrics:
      - "Average discovery-to-booking time under 5 minutes"
      - "Session completion rate above 90%"
      - "Escrow payment release within 24 hours of session completion"
      - "Dispute resolution achieved within 48 hours using session evidence"

  - id: "SG-3"
    title: "Achieve Marketplace Liquidity in Target Geographies"
    description: "Reach sufficient mentor-mentee density in at least 2 of the 4 target geographies (India, Switzerland, USA, Germany) so that mentees can find a relevant mentor within their first search session."
    success_metrics:
      - "500+ completed sessions within 6 months of launch"
      - "Mentee-to-mentor ratio between 5:1 and 15:1 in active geographies"
      - "70% of mentee searches return 3+ relevant mentor results"
      - "20% of mentees book a second session within 30 days of first session"

  - id: "SG-4"
    title: "Build a Sustainable Revenue Engine"
    description: "Establish a commission-based revenue model (10-20% per transaction) with per-session pricing that enables sustainable unit economics while keeping the platform attractive to both sides of the marketplace."
    success_metrics:
      - "Gross merchandise value (GMV) of EUR 50,000+ within 6 months"
      - "Platform take rate averaging 15% across all transactions"
      - "Payment processing cost below 3% of GMV"
      - "Mentor payout reliability at 100% (zero missed or delayed payouts)"

  - id: "SG-5"
    title: "Launch Compliant Across Four Jurisdictions"
    description: "Deliver a platform that meets GDPR (EU/Germany), DPDP Act (India), Swiss nFADP, PCI DSS, and German FernUSG requirements from launch day, avoiding regulatory risk that could shut down operations in any target geography."
    success_metrics:
      - "Zero regulatory violations or data breaches in first 12 months"
      - "Data subject access requests fulfilled within 30 days (GDPR requirement)"
      - "Payment data handling PCI DSS Level 4 compliant (via payment processor)"
      - "FernUSG classification review completed before Germany launch"

