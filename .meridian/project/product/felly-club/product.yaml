scope:
  in_scope:
    - "Mentor discovery and search with filters (vertical, geography, rating, price, availability)"
    - "Mentor profile pages with verified credentials, bio, session pricing, and availability"
    - "Session booking with 30-min and 60-min duration options"
    - "Escrow-based payment processing via PayU with multi-currency support (EUR, USD, INR, CHF)"
    - "1-on-1 video mentorship sessions via Zoom integration"
    - "Session recording for dispute resolution (opt-in with consent)"
    - "Mentor application and domain verification workflow"
    - "Mentee and mentor registration with KeyCloak IAM"
    - "Rating and review system for completed sessions"
    - "Referral program for organic growth"
    - "Admin portal for mentor verification, dispute resolution, and platform management"
    - "Email notifications via Twilio SendGrid (booking confirmations, reminders, payouts)"
    - "Web app (Next.js) as primary platform"
    - "iOS and Android apps (React Native)"
    - "GDPR, DPDP Act, and PCI DSS compliance foundations"

  out_of_scope:
    - "Group mentorship sessions (1-on-many)"
    - "Subscription or membership-based pricing models"
    - "AI-powered mentor matching or recommendation engine"
    - "In-app messaging or chat between mentors and mentees outside sessions"
    - "Mentor-created content (courses, articles, resources)"
    - "White-label or B2B enterprise mentorship programs"
    - "Advanced analytics dashboards for mentors (earnings trends, audience insights)"
    - "Multi-language interface (English-only for MVP)"
    - "Offline session support or in-person mentorship coordination"
    - "Integration with third-party calendars (Google Calendar, Outlook) beyond basic scheduling"
    - "Custom video infrastructure (using Zoom as managed service for MVP)"

assumptions:
  - "Mentors in Sport and Entertainment verticals are willing to adopt a digital platform for paid mentorship sessions"
  - "Per-session pricing (vs. subscription) is preferred by the target mentee demographic for initial trust-building"
  - "Zoom's video API provides sufficient quality and recording capabilities for MVP session delivery"
  - "PayU can handle escrow-like payment flows across India, EU, Switzerland, and USA without requiring separate payment processor per geography"
  - "KeyCloak provides adequate IAM capabilities including social login, MFA, and RBAC without significant customization"
  - "A 10-20% commission rate is competitive enough to attract mentors while sustaining platform operations"
  - "English-only MVP is sufficient for initial launch across all four target geographies"
  - "16-week delivery timeline is achievable with strict MVP scope and third-party service integrations"
  - "FernUSG classification will not require Felly Club to obtain distance learning approval for 1-on-1 mentorship sessions (as distinct from structured courses)"
  - "Session recordings with explicit consent are legally permissible for dispute resolution across all target jurisdictions"

success_metrics:
  - metric: "Mentor Supply Health"
    target: "100+ verified mentors across 3+ verticals within 90 days"
    measurement: "Count of mentors with verified status in platform database"

  - metric: "Session Volume"
    target: "500+ completed sessions within 6 months of launch"
    measurement: "Count of sessions with status=completed in booking system"

  - metric: "Marketplace Liquidity"
    target: "70% of mentee searches return 3+ relevant results"
    measurement: "Search result count analytics, sampled weekly"

  - metric: "Revenue Traction"
    target: "EUR 50,000+ GMV within 6 months"
    measurement: "Sum of all completed transaction values in payment system"

  - metric: "Session Completion Rate"
    target: "Above 90%"
    measurement: "Completed sessions / booked sessions ratio, excluding cancellations >24h in advance"

  - metric: "Mentee Retention"
    target: "20% of mentees book a second session within 30 days"
    measurement: "Cohort analysis on first-session mentees tracked over 30-day window"

  - metric: "Platform Trust"
    target: "Zero unresolved disputes beyond 48 hours"
    measurement: "Dispute resolution time tracking in admin portal"

  - metric: "Regulatory Compliance"
    target: "Zero regulatory violations or data breaches in first 12 months"
    measurement: "Compliance audit log and incident tracking"

profiles:
  product_profile:
    - id: "PP-1"
      dimension: "User Sophistication"
      level: 2
      label: "Power User"
      rationale: "Primary mentee demographic is Gen Z digital natives who are highly comfortable with app-based interactions, social login, and mobile-first workflows. Mentors are accomplished professionals with strong digital literacy. Both sides expect modern UX patterns without hand-holding. Adjusted from Level 4 based on stakeholder input on target demographic."

    - id: "PP-2"
      dimension: "UX Maturity"
      level: 3
      label: "Multi-Channel Responsive"
      rationale: "Felly Club delivers across web (Next.js) and mobile (React Native iOS/Android) with shared state. A design system with component library is needed for consistency across channels. Accessibility AA compliance is appropriate for a consumer marketplace. Full omni-channel continuity (Level 4) is deferred post-MVP."

    - id: "PP-3"
      dimension: "Persona Complexity"
      level: 5
      label: "Multi-Sided Platform"
      rationale: "Three distinct personas (Mentee, Mentor, Platform Admin) with fundamentally different journeys, incentives, and feature access. Mentees browse and book; mentors manage availability and earnings; admins verify credentials and resolve disputes. This is a classic multi-sided marketplace."

    - id: "PP-4"
      dimension: "Geographic Scope"
      level: 3
      label: "Multi-Country"
      rationale: "Operating across 4 countries (India, Switzerland, USA, Germany) requiring multi-currency support (EUR, USD, INR, CHF), GDPR compliance for EU, DPDP Act for India, and nFADP for Switzerland. Not continental-scale (Level 4) since it targets specific countries rather than entire trade blocs."

    - id: "PP-5"
      dimension: "Integration Density"
      level: 4
      label: "Event-Driven Ecosystem"
      rationale: "6+ integration points (Zoom webhooks, PayU escrow callbacks, KeyCloak OIDC, SendGrid event tracking, Elasticsearch, FCM) with complex bidirectional event flows including escrow state machines, session recording lifecycle, and multi-provider payment callbacks. The escrow-based payment flow alone involves multiple async state transitions across PayU and the platform. Elevated from Level 3 based on stakeholder assessment of integration complexity."

    - id: "PP-6"
      dimension: "Delivery Ambition"
      level: 3
      label: "Market-Ready v1"
      rationale: "16-week fixed-price engagement targeting a production-ready marketplace with payment processing, video integration, and multi-geography compliance. This goes beyond MVP (Level 2) into market-ready territory with full primary flows, error handling, and production-grade infrastructure. Not yet competitive product (Level 4) as it serves primary persona flows only."

    - id: "PP-7"
      dimension: "Industry Vertical"
      level: 3
      label: "Professional Services"
      rationale: "Mentorship falls under professional services/education with moderate domain rules. Payment processing triggers PCI DSS and Germany's FernUSG applies to online mentoring. However, it is not regulated commerce (Level 4) since mentorship sessions are not financial products and the platform does not hold or manage funds beyond escrow pass-through."

  nfr_profile:
    - id: "NFR-1"
      dimension: "Risk"
      level: 2
      label: "Low Risk"
      rationale: "Escrow mechanism limits direct financial exposure. Session delivery failures are contained to individual sessions with clear refund policies. Platform does not hold funds long-term or make financial decisions. Derived from PP-7=3 (professional services, not regulated finance) and stakeholder assessment that escrow pass-through keeps risk profile low."

    - id: "NFR-2"
      dimension: "Security"
      level: 3
      label: "Business Grade"
      rationale: "MFA via KeyCloak, RBAC for three persona types, API key management for integrations (Zoom, PayU, SendGrid), and encryption in transit are required. Payment card data is handled by PayU (not stored on platform), so enterprise-grade (Level 4) encryption at rest for PCI is not needed on-platform. Derived from PP-7=3 and PP-3=5 (multi-sided platform with sensitive role boundaries)."

    - id: "NFR-3"
      dimension: "Performance"
      level: 3
      label: "Balanced"
      rationale: "Gen Z users (PP-1=2) expect snappy interactions — sub-second API responses and smooth search/filter experiences. Elasticsearch-powered mentor discovery needs tuned query performance. Booking and payment flows require responsive UX to avoid cart abandonment. Video latency is Zoom's responsibility but session join flow must be instant. Elevated from Level 2 based on stakeholder input that balanced performance is expected for the target demographic."

    - id: "NFR-4"
      dimension: "Availability"
      level: 3
      label: "Standard"
      rationale: "Customer-facing platform where downtime during booked sessions would cause trust damage and financial disputes. 99.9% uptime target with automated failover and health checks is appropriate. High availability (Level 4) with 99.99% is not justified for MVP scale. Derived from PP-4=3 (multi-country operations across time zones) and NFR Guidance (PP-5>=3)."

    - id: "NFR-5"
      dimension: "Compliance"
      level: 3
      label: "Standard"
      rationale: "GDPR compliance with data subject rights and consent management is mandatory for EU/Germany operations. India's DPDP Act and Switzerland's nFADP add additional requirements. PCI DSS is handled through PayU's compliance (Level 4 not needed on-platform). Privacy by design is essential. Derived from PP-4=3 (multi-country triggers NFR-5>=2 per guidance) elevated to 3 due to GDPR and DPDP explicit requirements."

    - id: "NFR-6"
      dimension: "Scalability"
      level: 3
      label: "Growth-Oriented"
      rationale: "Multi-sided marketplace needs to handle growth in both mentor and mentee populations across 4 geographies. Horizontal scaling, load balancing, and database read replicas should be architected for 10x growth. Not high scale (Level 4) at MVP since initial user base will be in thousands, not hundreds of thousands. Derived from PP-3=5 (multi-sided platform triggers NFR-6>=3 per guidance)."

    - id: "NFR-7"
      dimension: "Data Sensitivity"
      level: 3
      label: "Confidential"
      rationale: "Platform stores PII (names, emails, professional credentials), session recordings, and user-generated reviews. Payment card data is tokenized through PayU and not stored on-platform, avoiding Level 4. Session recordings contain personal conversations requiring encryption at rest recommendation and access logging. Derived from PP-7=3 (professional services with PII) and the presence of session recordings as sensitive personal content."

  quality_profile:
    - id: "QP-1"
      dimension: "Testing Depth"
      level: 3
      label: "Layered Testing"
      rationale: "Market-ready product (PP-6=3) with multi-sided platform complexity (PP-3=5) requires unit + integration tests and basic e2e for critical paths (booking flow, payment escrow, mentor verification). CI must run tests on every PR. Coverage target 60-80%. Per PP+NFR guidance: PP-6>=3 suggests QP-1>=3, PP-3>=4 suggests QP-1>=3."

    - id: "QP-2"
      dimension: "Code Quality Standards"
      level: 3
      label: "Enforced Standards"
      rationale: "16-week delivery with multiple integration points and multi-geography compliance requires disciplined code quality. Linter + formatter + pre-commit hooks, static analysis, PR review with checklist, and documented coding conventions are essential to maintain velocity without accumulating debt. Per PP+NFR guidance: PP-6>=3 market-ready products need maintainable codebases."

    - id: "QP-3"
      dimension: "Documentation Level"
      level: 3
      label: "Comprehensive"
      rationale: "Multi-geography compliance (NFR-5=3) requires comprehensive documentation including API specs, architecture overview, and compliance-relevant decision records. Multiple integrations (PP-5=3) need documented API contracts. Per PP+NFR guidance: NFR-5>=3 suggests QP-3>=3."

    - id: "QP-4"
      dimension: "CI/CD Maturity"
      level: 3
      label: "Continuous Delivery"
      rationale: "Market-ready product (PP-6=3) with standard availability (NFR-4=3) requires automated build + test + deploy to staging with production deploy via manual approval. Multiple environments (dev, staging, prod) and automated database migrations are essential for 16-week delivery cadence. Per PP+NFR guidance: PP-6>=3 suggests QP-4>=3, NFR-4>=3 suggests QP-4>=3."

    - id: "QP-5"
      dimension: "Observability Maturity"
      level: 3
      label: "Monitored"
      rationale: "Customer-facing marketplace (NFR-1=2) with standard availability (NFR-4=3) needs structured logging, application metrics (request latency, error rates, booking throughput), alerting on key thresholds, and operational dashboards. Distributed tracing (Level 4) is not justified at MVP scale. Per PP+NFR guidance: NFR-4>=3 suggests QP-5>=3."

    - id: "QP-6"
      dimension: "Accessibility Standard"
      level: 2
      label: "Basic"
      rationale: "Gen Z digital natives (PP-1=2) are comfortable with standard web patterns. Semantic HTML, alt text, and keyboard navigation for primary flows are sufficient. Full WCAG AA (Level 3) is not justified for MVP given EUR 50K budget constraint. No regulatory mandate for accessibility compliance in the target verticals (mentorship is not government or healthcare). Can be elevated post-MVP based on user feedback."

    - id: "QP-7"
      dimension: "Security Testing"
      level: 3
      label: "SAST + Dependencies"
      rationale: "Business-grade security (NFR-2=3) with payment processing and PII handling requires static application security testing in CI, dependency vulnerability scanning, security-focused PR review, and secret scanning. Annual pen testing (Level 4) is deferred to post-MVP given budget constraints but should be planned for within 6 months of launch. Per PP+NFR guidance: NFR-2>=3 suggests QP-7>=3."
