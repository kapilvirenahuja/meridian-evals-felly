# ─── Vision ───────────────────────────────────────────────────────────────────
vision: >
  To establish Felly Club as the premier tech-enabled mentorship ecosystem,
  empowering individuals to connect with accomplished mentors, gain personalized
  guidance, and accelerate progress in their chosen fields. By leveraging advanced
  analytics and fostering trust, the platform delivers meaningful mentor–mentee
  experiences and builds a scalable community that supports long-term personal
  and professional growth.

# ─── Value Proposition ────────────────────────────────────────────────────────
value_proposition: |
  Felly Club is the first cross-domain, admin-curated mentorship marketplace
  spanning Sport, Entrepreneurship, Business, and Entertainment — verticals that
  established competitors (MentorCruise, GrowthMentor, ADPList) do not serve.
  Unlike transactional platforms (Clarity.fm, Cameo) or free models with
  inconsistent quality (ADPList), Felly Club delivers a full session lifecycle —
  from mentor discovery and domain-verified trust signals through escrow-backed
  booking, integrated video delivery, post-session ratings, and admin-mediated
  dispute resolution with session recordings.

  For mentees, this means a single platform to find credible, vetted mentors
  across niche domains with transparent pricing, multi-currency support (INR,
  USD, CHF, EUR), and structured scheduling — eliminating the fragmentation
  and opacity that defines the current landscape. For mentors, it provides a
  trustworthy monetisation channel with flexible pricing, automated payouts,
  and data-driven performance insights. For the platform, the admin-curated
  supply model ensures quality over quantity while the commission-based revenue
  model (10–20%) aligns platform success with mentor and mentee outcomes.

# ─── Market Context ───────────────────────────────────────────────────────────
market_context:
  problem: >
    The global mentorship landscape is fragmented and opaque — aspiring
    individuals across Sport, Entrepreneurship, Business, and Entertainment
    struggle to identify credible, accessible mentors through standardised
    discovery mechanisms, while accomplished professionals lack a structured,
    trustworthy channel to monetize their expertise with transparent pricing,
    scheduling, and quality assurance.

  target_users:
    - persona: "Mentee — Ambitious Individual"
      goal: "Discover domain-verified mentors, book one-on-one video sessions, and receive personalized guidance to accelerate personal and professional growth"
      frustration: "No standardised discovery for domain-specific mentors; opaque pricing and quality indicators; high friction in scheduling, payment, and session delivery"
      context: "Individuals in India, Switzerland, USA, and Germany seeking mentorship in Sport, Entrepreneurship, Business, or Entertainment via web or mobile"

    - persona: "Mentor — Accomplished Professional"
      goal: "Monetize expertise through structured one-on-one video mentorship sessions with flexible pricing and availability management"
      frustration: "No trustworthy platform to offer guidance at scale; lack of structured scheduling, payment collection, and reputation-building tools; no data-driven insights on session performance"
      context: "Domain-verified professionals onboarded by platform admin, managing availability calendars and accepting session requests across multiple time zones"

    - persona: "Platform Admin — Operations Manager"
      goal: "Curate a high-quality mentor marketplace by managing onboarding, quality assurance, dispute resolution, financial operations, and platform analytics"
      frustration: "Manual processes for mentor verification, dispute handling, and payout management; no unified dashboard for platform-wide KPIs and operational oversight"
      context: "Felly Club operations team using web-based admin portal to manage all platform activities including user lifecycle, sessions, payments, and content"

  competitors:
    - name: "MentorCruise"
      strengths:
        - "Established subscription-based model with 1000+ vetted mentors"
        - "Strong in tech, business, and career development verticals"
        - "Structured long-term mentorship with ongoing chat and session support"
      weaknesses:
        - "Focused primarily on tech and business — no coverage for Sport or Entertainment"
        - "Subscription model limits casual or one-off session seekers"
        - "Limited multi-geography and multi-currency support"

    - name: "Clarity.fm"
      strengths:
        - "Pay-per-minute model lowers entry barrier for quick consultations"
        - "Wide range of business and startup experts"
        - "Instant scheduling without complex booking workflows"
      weaknesses:
        - "No domain verification or curated quality assurance framework"
        - "Per-minute billing discourages deeper mentorship relationships"
        - "No session recording, dispute resolution, or trust mechanisms"

    - name: "GrowthMentor"
      strengths:
        - "Vetted growth and marketing mentors with community-driven quality signals"
        - "Unlimited 1:1 calls under subscription plan"
        - "Active Slack community for peer networking"
      weaknesses:
        - "Narrow focus on growth marketing and product — no Sport or Entertainment"
        - "Subscription-only model with no pay-per-session option"
        - "Limited to English-speaking markets; no multi-currency support"

    - name: "ADPList"
      strengths:
        - "Free mentorship platform with 20,000+ mentors in design and tech"
        - "Strong community engagement and accessibility"
        - "Low barrier to entry for mentees"
      weaknesses:
        - "Free model creates sustainability concerns and inconsistent mentor commitment"
        - "Focused on design and tech — no coverage for Sport, Business, or Entertainment"
        - "No payment infrastructure, escrow, or structured revenue model for mentors"

    - name: "Cameo (adjacent competitor)"
      strengths:
        - "Strong brand in celebrity and entertainment interactions"
        - "Large roster of public figures across sports and entertainment"
        - "Proven monetization of personal brand"
      weaknesses:
        - "Transactional, not mentorship — short video messages, not structured sessions"
        - "No scheduling, session management, or ongoing mentor-mentee relationships"
        - "No quality assurance, ratings-based matching, or dispute resolution"

  market_size:
    tam: "~$1.53B (global mentoring software market, 2025) growing to ~$4.92B by 2035 at 12.4% CAGR"
    sam: "~$970M (mentorship marketplace and platform segment, 2026) — platforms enabling 1:1 paid mentorship sessions with booking, payment, and video infrastructure"
    som: "~$5–15M achievable within 3 years — targeting curated mentorship in Sport, Entrepreneurship, Business, and Entertainment across India, Switzerland, USA, and Germany"
    note: >
      Market sizing derived from Research Nester (2025) and Research & Markets (2026) reports
      on the global mentoring software market. SAM scoped to marketplace platforms (excluding
      enterprise mentoring software). SOM estimated based on target geography penetration
      (4 countries) and niche category focus (4 verticals) with admin-curated supply model
      constraining initial growth rate.

  differentiators:
    - "Cross-domain coverage spanning Sport, Entrepreneurship, Business, and Entertainment — most competitors focus narrowly on tech and business verticals"
    - "Admin-curated, domain-verified mentor marketplace with verified badges, LinkedIn/portfolio validation, and proof-of-expertise documentation ensuring trust and quality"
    - "Full session lifecycle management — from discovery through booking, escrow payment, video session delivery, ratings, and dispute resolution with session recordings"
    - "Multi-geography and multi-currency support (INR, USD, CHF, EUR) targeting India, Switzerland, USA, and Germany from MVP launch"

  risks:
    - "Mentor supply constraints — admin-curated onboarding creates a quality-gated supply bottleneck; early marketplace liquidity depends on Felly Club's ability to attract accomplished professionals in 4 niche verticals"
    - "Marketplace cold-start problem — two-sided marketplace requires simultaneous mentor supply and mentee demand; achieving critical mass in each geography and category is the primary growth risk"
    - "Competitive pressure from free platforms (ADPList) and established subscription players (MentorCruise, GrowthMentor) who already have network effects and mentor ecosystems"
    - "Regulatory complexity — operating across 4 jurisdictions (EU/GDPR, India/TPDP, USA, Switzerland) with multi-currency payments requires significant compliance investment"
    - "Fixed-budget delivery risk — €125,000 budget for a full-stack marketplace (web, mobile, admin portal, video, payments, analytics) creates scope-quality tension across 16-week delivery timeline"

# ─── Strategic Goals ──────────────────────────────────────────────────────────
strategic_goals:
  - id: SG-01
    goal: "Build a trusted, admin-curated mentor marketplace with domain verification and quality signals"
    success_metric: "100% of active mentors have admin-verified profiles with verified badges; mentor profiles display LinkedIn/portfolio validation and proof-of-expertise documentation"
    target_audience: "Mentees, Mentors, Platform Admin"

  - id: SG-02
    goal: "Deliver seamless end-to-end session lifecycle from discovery through post-session engagement"
    success_metric: "End-to-end booking-to-video-session workflow operational within platform; session request, acceptance, slot selection, video delivery, and post-session review all functional"
    target_audience: "Mentees, Mentors"

  - id: SG-03
    goal: "Establish transparent multi-currency financial operations with escrow-backed payments"
    success_metric: "Automated payment capture, escrow hold, commission deduction (10–20%), and mentor payout processing across INR, USD, CHF, and EUR"
    target_audience: "Mentees, Mentors, Platform Admin"

  - id: SG-04
    goal: "Ensure platform trust through ratings, dispute resolution, and quality monitoring"
    success_metric: "Post-session rating system operational; ratings below 3 stars auto-flagged for admin review; dispute resolution supported by 3-day session recording retention with admin-only access"
    target_audience: "Mentees, Mentors, Platform Admin"

  - id: SG-05
    goal: "Drive mentee acquisition through referral programme and deliver actionable analytics to all personas"
    success_metric: "Referral programme live with tracking and reward on first completed session; mentor earnings dashboard, mentee activity dashboard, and platform KPI dashboard operational"
    target_audience: "Mentees, Mentors, Platform Admin"

  - id: SG-06
    goal: "Achieve regulatory and security compliance across all target geographies"
    success_metric: "GDPR (EU), TPDP (India), and PCI DSS compliance validated; cookie consent, data export, right-to-deletion workflows, and tokenised payment processing operational"
    target_audience: "Platform Admin, Mentees, Mentors"

# ─── Success Metrics ──────────────────────────────────────────────────────────
success_metrics:
  - strategic_goal_ref: SG-01
    metric: "Mentor verification rate"
    target: "100% of listed mentors are admin-verified with verified badge"
    measurement_method: "Admin portal audit — count of verified mentors divided by total listed mentors"

  - strategic_goal_ref: SG-01
    metric: "Mentor profile completeness"
    target: "All active mentor profiles include bio, expertise category, pricing, availability, and at least one verification artefact"
    measurement_method: "Automated profile completeness check against required field list"

  - strategic_goal_ref: SG-02
    metric: "Session completion rate"
    target: "85% or higher of accepted sessions completed without cancellation or no-show"
    measurement_method: "Platform analytics — completed sessions divided by accepted sessions over rolling 30-day window"

  - strategic_goal_ref: SG-02
    metric: "Booking workflow completion"
    target: "End-to-end flow from request through acceptance, slot selection, to session delivery operational with under 3% drop-off at each stage"
    measurement_method: "Funnel analytics across session lifecycle stages"

  - strategic_goal_ref: SG-03
    metric: "Payment processing success rate"
    target: "99% or higher of payment transactions processed successfully across all 4 currencies"
    measurement_method: "Payment gateway transaction logs — successful divided by attempted transactions"

  - strategic_goal_ref: SG-03
    metric: "Mentor payout timeliness"
    target: "100% of earned payouts processed within defined payout schedule post-session completion"
    measurement_method: "Admin financial dashboard — payout processing date versus session completion date"

  - strategic_goal_ref: SG-04
    metric: "Dispute resolution timeliness"
    target: "100% of submitted disputes reviewed by admin within 72 hours"
    measurement_method: "Admin dispute queue — time-to-first-review tracking"

  - strategic_goal_ref: SG-04
    metric: "Quality flagging automation"
    target: "All ratings below 3 stars auto-flagged; all mentors with 3 or more cancellations auto-flagged"
    measurement_method: "Quality monitoring dashboard — auto-flagged items versus manual review queue"

  - strategic_goal_ref: SG-05
    metric: "Referral programme activation"
    target: "Referral link generation and reward fulfilment operational at launch"
    measurement_method: "Referral tracking — generated links, referred sign-ups, first-session completions, rewards issued"

  - strategic_goal_ref: SG-05
    metric: "Analytics dashboard coverage"
    target: "Mentor, mentee, and admin dashboards live with all BRD-defined KPIs"
    measurement_method: "Dashboard feature audit against BRD-defined KPI requirements"

  - strategic_goal_ref: SG-06
    metric: "Regulatory compliance coverage"
    target: "GDPR consent management, TPDP compliance, PCI DSS tokenisation, and right-to-deletion workflows operational"
    measurement_method: "Compliance checklist audit — each regulatory requirement mapped to implemented feature"

# ─── Scope ────────────────────────────────────────────────────────────────────
scope:
  in_scope:
    - "User Registration, Authentication & Profile Management — mentee self-registration, admin-driven mentor onboarding, social and email login via KeyCloak"
    - "Mentor Discovery & Marketplace Navigation — mentor listing, advanced search and filtering, detailed profile view, rule-based personalised recommendations"
    - "Session Request & Scheduling Management — full session request workflow, mentor acceptance/decline, slot selection, reminders, cancellation and rescheduling policy enforcement"
    - "Payment Processing & Revenue Management — payment gateway integration, escrow, commission (10–20%), refund processing, multi-currency (INR, USD, CHF, EUR), mentor payout management"
    - "Quality Assurance & Trust Framework — ratings and reviews, dispute resolution with session recordings (3-day retention, admin-only access), quality monitoring, mentor verification, abuse reporting"
    - "Business Intelligence & Performance Analytics — mentor performance dashboard, mentee activity dashboard, platform-level analytics and reporting"
    - "Administrative Controls & Platform Operations — full admin portal with user, mentor, mentee, session, financial, and content management"
    - "User Communication & Engagement — email via Twilio SendGrid and in-app notification centre"
    - "User Acquisition & Retention — referral programme with incentives, post-session engagement prompts"
    - "Video Conferencing & Session Infrastructure — Zoom/Google Meet integration, auto-session recording (3-day retention), virtual session room"
    - "Regulatory Compliance & Data Security — GDPR, TPDP, PCI DSS, platform security (AES-256, TLS 1.2+, JWT)"
    - "System Configuration & Content Management — platform configuration (commission, pricing bands, cancellation policy), communication templates, help centre"

  out_of_scope:
    - category: "Mentor self-registration"
      rationale: "BRD explicitly defers to Phase 2 — MVP uses admin-driven onboarding only to maintain quality-gated supply"
    - category: "AI/ML recommendation engine"
      rationale: "BRD explicitly defers to Phase 2 — MVP uses simple rule-based matching (string match of mentee interests to mentor expertise)"
    - category: "Session recording user playback"
      rationale: "BRD explicitly defers to Phase 2 — MVP recordings stored for admin-only dispute resolution with 3-day auto-deletion"
    - category: "Mobile admin access"
      rationale: "BRD explicitly defers to Phase 2 — admin portal is web-only in MVP"
    - category: "Multi-language support"
      rationale: "BRD explicitly defers to Phase 2 — English-only in MVP"
    - category: "Subscription and bundle pricing"
      rationale: "BRD explicitly defers to Phase 2 — MVP supports pay-per-session model only; bundles, subscriptions, and membership tiers deferred"
    - category: "Academia category"
      rationale: "BRD explicitly defers to Phase 2 — MVP categories limited to Sport, Entrepreneurship, Business, and Entertainment"
    - category: "Advanced analytics beyond MVP dashboards"
      rationale: "BRD explicitly defers to Phase 2 — cohort analysis, retention metrics, revenue forecasting, LTV, churn prediction deferred"
    - category: "In-platform messaging and chat"
      rationale: "BRD explicitly defers to Phase 2 — MVP uses email and in-app notifications only"
    - category: "Group mentoring sessions"
      rationale: "BRD explicitly defers to Phase 2 — MVP supports one-on-one sessions only"
    - category: "Corporate and enterprise accounts"
      rationale: "BRD explicitly defers to Phase 2 — B2B offering with bulk licenses deferred"
    - category: "Long-term mentorship programs"
      rationale: "BRD explicitly defers to Phase 2 — workflow to be defined post-MVP"
    - category: "Community forums"
      rationale: "BRD explicitly defers to Phase 2 — peer networking features deferred"
    - category: "Advanced support ticket system and live chat"
      rationale: "BRD explicitly defers to Phase 2 — FAQ and help centre only in MVP"
    - category: "SMS communication"
      rationale: "BRD source file explicitly marks MVP Phase as No — email notifications cover all transactional communication in MVP"
    - category: "Complex referral tiers"
      rationale: "BRD explicitly defers to Phase 2 — MVP uses simple flat-reward referral only"

# ─── Decision Points ──────────────────────────────────────────────────────────
decision_points:
  - id: I-01
    title: "Mobile technology conflict — deferred to architecture"
    original_requirement: "TechStack Excel specifies Swift (iOS) + Kotlin (Android) for native apps"
    proposed_alternative: "PDF Proposal specifies React Native for cross-platform development; RN Estimate sheet confirms React Native with detailed effort breakdown (60 PD)"
    rationale: "Not a vision-level decision. Technology selection deferred to architecture phase."
    deferred_to: "architecture"

  - id: I-02
    title: "Backend framework conflict — deferred to architecture"
    original_requirement: "TechStack Excel lists Next.js under Backend Services"
    proposed_alternative: "PDF Proposal specifies Node.js as the backend framework"
    rationale: "Next.js is a frontend framework (SSR/SSG) and is not interchangeable with Node.js as a backend runtime. Technology selection deferred to architecture phase."
    deferred_to: "architecture"

  - id: I-03
    title: "API gateway vendor — deferred to architecture"
    original_requirement: "TechStack Excel specifies Azure / AWS API Gateway"
    proposed_alternative: "PDF Proposal specifies CloudFlare / Cloud-Platform API Gateway"
    rationale: "API gateway is needed but vendor selection deferred to architecture phase."
    deferred_to: "architecture"

  - id: I-04
    title: "Payment provider — RESOLVED"
    original_requirement: "TechStack Excel specifies Stripe; PDF Proposal specifies PayU; Epics file references Stripe/Razorpay"
    proposed_alternative: "Stripe confirmed as single payment provider for MVP"
    rationale: "Stripe selected — supports all 4 target currencies (INR, USD, CHF, EUR), provides escrow-compatible payment intents, and has mature multi-geography compliance. Resolved at vision stage."
    resolved: true
    resolution: "Stripe"

  - id: I-05
    title: "Session recording consent and access model"
    original_requirement: "BRD states mandatory auto-recording on session start for legal and dispute purposes with admin-only access and 3-day auto-deletion"
    proposed_alternative: "No alternative proposed — but the mandatory auto-recording without explicit user consent mechanism may conflict with GDPR requirements in EU markets (Germany, Switzerland)"
    rationale: "The BRD mandates automatic recording for all sessions but does not specify the consent mechanism. GDPR requires explicit consent for recording. The admin-only access clause limits playback but does not address the consent-at-recording question. Needs clarification on whether recording consent is captured at session start, at registration via terms and conditions, or requires per-session opt-in."

