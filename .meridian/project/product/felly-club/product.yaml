# ─── Project Profiles (Three-Axis Model) ─────────────────────────────────────
# Derived from BRD analysis using PP → NFR → QP cascade.
# Each dimension is 1–5 with label and rationale.
# PP informs NFR defaults; PP + NFR inform QP defaults.

profiles:
  product_profile:
    pp1_user_sophistication:
      level: 4
      label: "General Consumer"
      rationale: "Primary user (mentee) is a general consumer seeking mentorship with expectations of intuitive, mobile-first UX, onboarding flows, and progressive disclosure. Mentors are professionals but interact through simplified session management. Admin uses a guided web portal."
    pp2_ux_maturity:
      level: 3
      label: "Multi-Channel Responsive"
      rationale: "Platform delivers across three channels — responsive web app (Next.js/Vercel), mobile app (React Native iOS and Android), and admin portal (web). BRD Sprint 1 explicitly includes design system and component library creation. Accessibility at browser and mobile version compatibility level."
    pp3_persona_complexity:
      level: 5
      label: "Multi-Sided Platform"
      rationale: "Two-sided marketplace with three distinct personas (Mentee, Mentor, Admin) each having different journeys, incentives, dashboards, and feature access. Mentees discover and book; mentors manage availability and receive payouts; admin curates supply and resolves disputes. Maps directly to marketplace pattern (buyer, seller, ops)."
    pp4_geographic_scope:
      level: 3
      label: "Multi-Country"
      rationale: "Targets 4 countries from MVP launch (India, Switzerland, USA, Germany). Requires multi-currency support (INR, USD, CHF, EUR), GDPR compliance (EU), TPDP compliance (India), and timezone management for cross-border session scheduling."
    pp5_integration_density:
      level: 3
      label: "Bidirectional"
      rationale: "Consumes and coordinates 7+ external services: Zoom (video), PayU or Stripe (payments), KeyCloak (IAM), Twilio SendGrid (email), FCM (push), Strapi (CMS), Elasticsearch (search). Bidirectional flows for session recording callbacks, payment webhooks, and calendar events."
    pp6_delivery_ambition:
      level: 3
      label: "Market-Ready v1"
      rationale: "Full primary flows for all 3 personas, production-grade with error handling, analytics, and compliance. 16-week delivery targeting paying customers across 4 geographies. Not a POC or MVP stub — this is a market-launch product with real payment processing and regulatory compliance."
    pp7_industry_vertical:
      level: 3
      label: "Professional Services"
      rationale: "EdTech and mentorship marketplace in the professional services vertical. Moderate domain rules — session lifecycle management, mentor credentialing, professional standards for expertise verification. Not as heavily regulated as BFSI or healthcare but has PCI DSS (payments) and GDPR/TPDP (data privacy) obligations."

  nfr_profile:
    nfr1_risk:
      level: 3
      label: "Balanced Risk"
      rationale: "Customer-facing marketplace with real financial transactions (escrow, payouts, refunds). Failure impacts user experience, financial operations, and platform trust. PP-3 level 5 (multi-sided platform) means failure affects multiple stakeholder groups simultaneously. Monitoring, alerting, and incident response needed."
    nfr2_security:
      level: 3
      label: "Business Grade"
      rationale: "BRD specifies KeyCloak for centralised IAM with MFA capability, RBAC, JWT-based API access, AES-256 encryption at rest, TLS 1.2+ in transit, and PCI DSS compliance via gateway tokenisation. Matches Business Grade security posture. PP-7 level 3 does not trigger enterprise-grade requirements."
    nfr3_performance:
      level: 3
      label: "Fast"
      rationale: "BRD NFR-01 targets under 3 second page load; NFR-02 targets under 500ms API response at 95th percentile. Redis caching for session and search, Elasticsearch for mentor discovery. PP-6 level 3 (Market-Ready) confirms need for performance optimisation for competitive UX."
    nfr4_availability:
      level: 3
      label: "Standard"
      rationale: "BRD NFR-05 targets 99.5% uptime (excluding scheduled maintenance). Horizontal scaling on Vercel and cloud infrastructure. Blue-green deployments via GitHub Actions CI/CD. PP-4 level 3 (multi-country) confirms need for standard availability across timezones."
    nfr5_compliance:
      level: 3
      label: "Standard"
      rationale: "BRD explicitly requires GDPR (EU — Switzerland, Germany), TPDP (India), PCI DSS (payments), cookie consent, privacy policy, data export, and right-to-deletion. PP-4 level 3 (multi-country) triggers NFR-5 at least 2; actual BRD requirements push to level 3."
    nfr6_scalability:
      level: 3
      label: "Growth-Oriented"
      rationale: "BRD NFR-04 requires horizontal scaling. PP-3 level 5 (multi-sided platform) triggers NFR-6 at least 3. Initial target is thousands of users across 4 countries with 4 expertise categories. Designed for 10x growth with load balancing and read replicas."
    nfr7_data_sensitivity:
      level: 4
      label: "Sensitive"
      rationale: "Platform handles financial data (payment transactions, escrow balances, payout amounts), PII (names, emails, professional credentials), and session recordings (video content with admin-only access). PCI DSS tokenisation required. Field-level access control for recordings (admin-only). Encryption at rest mandatory per BRD NFR-07."

  quality_profile:
    qp1_testing_depth:
      level: 3
      label: "Layered Testing"
      rationale: "PP-6 level 3 (Market-Ready) triggers QP-1 at least 3. PP-3 level 5 (multi-sided platform with complex permissions) reinforces need for thorough testing. Multi-currency payments, session lifecycle, and dispute workflows require unit plus integration plus e2e for critical paths. CI runs tests on every PR."
    qp2_code_quality:
      level: 3
      label: "Enforced Standards"
      rationale: "PP-6 level 3 (Market-Ready) with a 16-week delivery by an external team (Nagarro) necessitates enforced standards — linter, formatter, pre-commit hooks, static analysis, PR review with checklist, documented coding conventions. Technical debt management critical given fixed-price engagement."
    qp3_documentation:
      level: 3
      label: "Comprehensive"
      rationale: "NFR-5 level 3 (Standard Compliance) triggers QP-3 at least 3. Multi-service architecture (7+ integrations) requires OpenAPI specs, architecture overview, ADRs, and runbooks. External delivery team handover requires comprehensive onboarding documentation."
    qp4_ci_cd_maturity:
      level: 3
      label: "Continuous Delivery"
      rationale: "PP-6 level 3 (Market-Ready) and NFR-4 level 3 (Standard Availability) both trigger QP-4 at least 3. BRD explicitly specifies GitHub Actions CI/CD, Docker containerisation, and managed hosting on Vercel. Multiple environments (dev, staging, prod) with automated database migrations."
    qp5_observability:
      level: 3
      label: "Monitored"
      rationale: "NFR-4 level 3 (Standard Availability) triggers QP-5 at least 3. BRD NFR-16 specifies centralised logging, monitoring, tracing, and alerting via cloud-native tooling. Payment processing, session lifecycle, and cross-timezone scheduling require operational visibility dashboards."
    qp6_accessibility:
      level: 2
      label: "Basic"
      rationale: "BRD specifies browser compatibility (last 2 versions of Chrome, Safari, Firefox, Edge) and mobile compatibility (last 2 major iOS and Android versions) but does not mention WCAG compliance or formal accessibility standards. PP-1 level 4 (General Consumer) benefits from good accessibility but no regulatory mandate exists in the BRD."
    qp7_security_testing:
      level: 3
      label: "SAST + Dependencies"
      rationale: "NFR-2 level 3 (Business Grade) triggers QP-7 at least 3. NFR-5 level 3 (Standard Compliance) reinforces need for security scanning. PCI DSS compliance requires dependency auditing and secure coding practices. SAST in CI with secret scanning for API keys (Zoom, payment provider, SendGrid, Firebase)."
