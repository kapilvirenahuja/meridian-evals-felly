coverage_check:
  slug: felly-club
  checked_at: "2026-03-25"
  checked_by: "judge"
  check_type: "problem-to-vision"
  input_path: ".meridian/project/product/felly-club/product.yaml (market_context.problem_statement + problem statement brief)"
  output_path: ".meridian/project/product/felly-club/product.yaml"

  summary:
    total_input_elements: 18
    covered: 14
    partial: 3
    dropped: 1
    drifted: 0

  facets:
    - facet: "Platform type — curated, tech-enabled mentorship marketplace"
      source: "problem_statement"
      status: "covered"
      trace: "vision.statement explicitly describes 'premier tech-enabled mentorship ecosystem'; scope.in_scope epics cover the marketplace mechanics (discovery, booking, payment, admin)"

    - facet: "Mentee persona — ambitious individuals seeking mentorship"
      source: "problem_statement"
      status: "covered"
      trace: "market_context.target_users[0]: persona 'Ambitious Mentee' with goal of finding domain-verified mentors; value_proposition[0] mirrors this persona; SG-02 references mentee demand"

    - facet: "Mentor persona — accomplished, domain-verified mentors"
      source: "problem_statement"
      status: "covered"
      trace: "market_context.target_users[1]: persona 'Domain-Expert Mentor'; market_context.differentiators[1]: 'Domain-verified mentor badges with structured credentialing'; SG-02 goal explicitly covers domain-verified credentialing; scope.in_scope 'Quality and Ratings' epic"

    - facet: "Verticals — Sport, Entrepreneurship, Business, Entertainment (all four)"
      source: "problem_statement"
      status: "covered"
      trace: "market_context.target_users[0].goal, market_context.differentiators[0], SG-02.goal, vision.statement, scope.in_scope 'Platform Configuration' (category/vertical management) all reference all four verticals explicitly"

    - facet: "Mentee capabilities — discover, book, attend one-on-one video sessions"
      source: "problem_statement"
      status: "covered"
      trace: "scope.in_scope: 'Mentor Discovery and Search' epic (discover), 'Session Management' epic (book), 'Video Sessions' epic (attend); value_proposition[0] references 'Book sessions with transparent pricing, built-in video delivery'"

    - facet: "Mentor capability — structured channel to monetize expertise"
      source: "problem_statement"
      status: "covered"
      trace: "market_context.target_users[1].goal: 'Monetize expertise through a structured, trustworthy channel'; value_proposition[1]: 'Monetize your expertise through a structured channel'; scope.in_scope 'Payment Processing' epic with mentor payouts"

    - facet: "Target geographies — India, Switzerland, USA, Germany"
      source: "problem_statement"
      status: "covered"
      trace: "market_context.target_users[0].context and target_users[2].context both name all four countries; SG-04 references 'all four operating countries'; market_context.differentiators[5] names all four; market_context.som names all four; profiles.product_profile PP-4 'Multi-Country' names all four"

    - facet: "Platform commission — 10-20% per transaction"
      source: "problem_statement"
      status: "covered"
      trace: "market_context.differentiators[3]: '10-20% commission'; assumptions[-1]: 'A 10-20% platform commission rate is competitive'; scope.in_scope 'Platform Configuration' (commission rate settings); success_metrics 'Revenue per Session' target EUR 8-15 per session implicitly reflects commission economics"

    - facet: "Session durations — 30 and 60 minutes supported"
      source: "problem_statement"
      status: "covered"
      trace: "market_context.differentiators[2]: 'Built-in video session delivery (30/60 min)'; scope.in_scope 'Session Management': 'Booking flow for 30/60-min sessions'; assumptions[0]: 'EUR 30-150 per session' (implying both durations)"

    - facet: "MVP delivery channel — Web App (Next.js)"
      source: "problem_statement"
      status: "partial"
      trace: "scope.out_of_scope[-2] defers 'Custom video infrastructure' and scope.in_scope 'Video Sessions' references Zoom SDK. The responsive web app is implied by scope.out_of_scope[2] ('Native mobile applications — MVP targets responsive web') and assumptions[8] ('Responsive web application provides adequate mobile experience for MVP'). However, Next.js is NOT explicitly named anywhere in product.yaml — the technology choice is present in assumptions/out_of_scope by inference but the framework name is absent."
      note: "Web app as MVP channel is addressed; Next.js specifically is not named in product.yaml"

    - facet: "MVP delivery channel — iOS and Android (React Native mobile apps)"
      source: "problem_statement"
      status: "dropped"
      trace: "scope.out_of_scope[2] explicitly defers 'Native mobile applications (React Native) — MVP targets responsive web; mobile apps deferred to Phase 2'. The problem statement lists iOS and Android as MVP delivery channels, but product.yaml explicitly removes them from MVP scope."
      note: "This is a deliberate scope decision captured in out_of_scope, but the input problem statement called these out as MVP channels. Flagged as dropped because the input claim is not honored in the MVP scope — it is deferred, not covered."

    - facet: "MVP delivery channel — Admin Portal"
      source: "problem_statement"
      status: "covered"
      trace: "scope.in_scope 'Admin Panel' epic: 'Mentor approval workflow, dispute management, financial oversight, user management, and compliance monitoring'; value_proposition[2] addresses Platform Administrator persona"

    - facet: "Pain point — no standardized discovery mechanism for mentors"
      source: "problem_statement"
      status: "covered"
      trace: "market_context.problem_statement names this explicitly; market_context.differentiators[0] ('Multi-vertical curation with domain-verified mentors'); scope.in_scope 'Mentor Discovery and Search' epic (Elasticsearch-powered search with filters); SG-02 goal targets mentor supply in underserved verticals"

    - facet: "Pain point — absence of transparent pricing and quality indicators"
      source: "problem_statement"
      status: "covered"
      trace: "market_context.differentiators[3]: 'Transparent pricing bands with platform-enforced min/max ranges'; market_context.differentiators[1]: 'Domain-verified mentor badges'; scope.in_scope 'Quality and Ratings' epic; SG-03 goal targets trust and transparency; value_proposition[0] references 'transparent pricing'"

    - facet: "Pain point — high friction in scheduling, payment, and session delivery"
      source: "problem_statement"
      status: "covered"
      trace: "scope.in_scope 'Session Management' (scheduling/rescheduling/cancellation), 'Payment Processing' (escrow, PayU, multi-currency), 'Video Sessions' (Zoom SDK in-platform delivery); market_context.differentiators[2] addresses built-in video; SG-01 goal covers end-to-end flow from signup to session to payout"

    - facet: "Pain point — limited accountability and dispute resolution"
      source: "problem_statement"
      status: "covered"
      trace: "market_context.differentiators[4]: 'Escrow-based payment with structured refund and dispute resolution'; scope.in_scope 'Admin Panel' (dispute management); SG-03.success_metric targets less than 5% dispute rate; value_proposition[0] references 'refund policies, and dispute resolution'"

    - facet: "Pain point — no data-driven insights for participants"
      source: "problem_statement"
      status: "partial"
      trace: "scope.in_scope 'Analytics Dashboard': admin metrics (revenue, sessions, disputes), mentor metrics (earnings, ratings, bookings), mentee metrics (session history, spending). This addresses the data-driven insights pain point. However, no strategic goal directly targets this capability, and success_metrics do not include a participant-facing insight adoption metric — coverage exists in scope but is not elevated to a strategic objective."
      note: "Scope epic exists but lacks a corresponding strategic goal or success metric — partial elevation"

    - facet: "Market framing — global mentorship landscape is fragmented and opaque"
      source: "problem_statement"
      status: "partial"
      trace: "market_context.problem_statement reproduces and expands this framing. market_context.competitors documents seven competitors. market_context.differentiators contrast Felly Club against specific competitor weaknesses. However, no strategic goal is explicitly framed around 'fragmentation' or 'opacity' as a problem to solve — the framing informs the vision but does not map to a measurable SG."
      note: "Present as market context and competitive framing; not elevated to a falsifiable strategic objective"

  drifted_elements: []

  notes:
    - "The iOS and Android (React Native) MVP delivery channel is explicitly deferred to Phase 2 in product.yaml out_of_scope. This is a substantive divergence from the problem statement which names them as MVP channels. Whether this is a valid scope reduction or a gap depends on stakeholder alignment — flagged here for visibility."
    - "Next.js as the web framework is referenced in the problem statement but absent from product.yaml. The web app is implied as the MVP channel but no technology commitment is made in the product artifact. This may be intentional (technology decisions belong in architecture.yaml) but creates a traceability gap."
    - "No drifted elements detected — all strategic goals, scope epics, and success metrics in product.yaml trace to at least one facet of the problem statement."
