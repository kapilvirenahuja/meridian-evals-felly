pre_lock_resolutions:
  slug: "felly-club"
  resolved_at: "2026-03-26T14:00:00+0530"
  critical_blockers:
    - blocker: "CB-1: GDPR session recording consent (I-05)"
      resolution: "Follow GDPR guidelines — implement per-session explicit consent mechanism at session start. Users must consent before recording begins. Update E3 session join flow and E8 compliance scope accordingly."
    - blocker: "CB-2: Stripe India account structure"
      resolution: "Assume different Stripe accounts will be needed — separate Stripe India entity for INR domestic transactions and a global Stripe account for USD/CHF/EUR. Architecture must support dual-account routing in E4."
    - blocker: "CB-3: Stripe Connect scope gap (E1/E4)"
      resolution: "Keep Stripe Connect mentor onboarding out of E1 scope. Handle as part of E4 or as a separate setup step. E1 remains focused on identity and profile foundation only."
  open_questions:
    - question: "OQ-1: GDPR recording consent legal basis"
      answer: "Follow GDPR guidelines — per-session explicit consent required."
    - question: "OQ-2: Technology stack decisions (mobile, backend, API gateway)"
      answer: "Keep mobile out of scope for MVP. Backend and API gateway decisions deferred to architecture phase. MVP is web-only (mentee web app + admin portal)."
    - question: "OQ-3: Stripe India vs Stripe Global"
      answer: "Assume different Stripe accounts will be needed for India vs global markets."
    - question: "OQ-4: Stripe Connect mentor onboarding scope"
      answer: "Keep it out of E1. Handle separately as part of E4 payment epic or as a distinct setup step."
    - question: "OQ-5: Configuration effective-date semantics"
      answer: "Config changes (commission rates, cancellation policies) apply only to NEW sessions booked after the change. In-flight sessions (already booked) retain the rates/policies under which they were booked, even after the cutoff time."
    - question: "OQ-6: TPDP compliance scope"
      answer: "Use the key default values — treat GDPR-equivalent controls (consent, deletion, portability) as sufficient for India operations. No additional India-specific data localisation needed at MVP."
    - question: "OQ-7: Session recording dispute extension"
      answer: "Put in a disclaimer that disputes must be filed within the recording retention period (3 days). No recording preservation/TTL extension mechanism needed — users are informed that recordings expire and disputes must be submitted before expiry."
  scope_changes:
    - change: "Mobile app removed from MVP scope"
      impact: "E1-E10 affected — all mobile-specific references should be removed. MVP delivers web app + admin portal only. React Native decision (I-01) no longer relevant for MVP."
