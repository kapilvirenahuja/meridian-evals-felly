pre_lock_resolutions:
  slug: "felly-club"
  resolved_at: "2026-03-25T23:55:00+0530"
  resolution_mode: "assumptions — user directed to assume and proceed"
  critical_blockers:
    - blocker: "Zoom SDK license and API credentials procurement"
      resolution: "ASSUMED: Felly Club procures Zoom Pro/Business account and SDK credentials before Sprint 4 (E4 development). Budget is Felly Club's responsibility per BRD Section 10.2 (third-party costs excluded). Fallback: Google Meet API if Zoom procurement delays."
    - blocker: "PayU escrow capability per geography"
      resolution: "ASSUMED: Use Stripe Connect instead of PayU for MVP. Stripe Connect supports hold-and-release (escrow-equivalent) across all four geographies (India, Switzerland, USA, Germany) via a single API. BRD's own Gap Analysis I-04 flags PayU as unconfirmed. Stripe Connect is the safer bet for multi-geo escrow."
    - blocker: "Legal/financial structure for holding funds in escrow"
      resolution: "ASSUMED: Stripe Connect's connected accounts model means Felly Club does not hold funds directly — Stripe acts as the payment facilitator. This sidesteps RBI payment aggregator licensing and FINMA requirements. Legal counsel should validate before launch but this is not a development blocker."
    - blocker: "Payment institution qualification under RBI/FINMA"
      resolution: "ASSUMED: Same as above — Stripe Connect model delegates payment institution obligations to Stripe. Felly Club operates as a platform, not a payment institution. Legal review recommended pre-launch but does not block development."
  open_questions:
    - question: "Does PayU support escrow across all 4 geographies?"
      answer: "RESOLVED: Switching to Stripe Connect which confirmed supports all four geographies. PayU decision deferred."
    - question: "Legal/regulatory status for escrow model?"
      answer: "ASSUMED: Stripe Connect connected-accounts model mitigates most licensing concerns. Pre-launch legal review recommended but not a dev blocker."
    - question: "KeyCloak self-hosted or managed?"
      answer: "ASSUMED: Managed KeyCloak via cloud-hosted offering (e.g., Phase Two or Keycloak Cloud). Self-hosting adds operational burden incompatible with EUR 50K budget and 16-week timeline. Monthly SaaS cost is Felly Club's responsibility."
    - question: "Zoom SDK licensing tier and budget?"
      answer: "ASSUMED: Zoom Pro account ($13.33/mo) sufficient for MVP volumes. SDK costs are Felly Club's responsibility per BRD. If Zoom costs exceed expectations, fallback to Jitsi (open-source, self-hosted) or Daily.co."
    - question: "Multi-currency pricing display vs charge?"
      answer: "ASSUMED: Mentors set prices in their preferred currency. Mentees see converted amount in their local currency (display). Actual charge is in mentee's local currency via Stripe's automatic currency conversion. Stripe handles FX; platform stores prices in mentor's base currency."
