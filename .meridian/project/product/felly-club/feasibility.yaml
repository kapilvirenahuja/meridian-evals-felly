feasibility:
  slug: "felly-club"
  assessed_at: "2026-03-26T08:30:00Z"
  codebase_state: "greenfield — no existing code in repository"
  budget_context: "€125,000 fixed-price, 16-week delivery (8 sprints), external partner Nagarro"

  epics:
    # ─── E1: User Identity & Profile Foundation ─────────────────────────────
    - epic_ref: "E1"
      epic_name: "User Identity & Profile Foundation"
      risk_level: "medium"
      technical_risks:
        - risk: >
            KeyCloak integration complexity — KeyCloak is a full IAM system requiring
            dedicated infrastructure setup, realm configuration, client registration,
            and RBAC role mapping for 3 distinct personas (mentee, mentor, admin).
            Misconfiguration risks silent auth bypasses and broken session management.
          severity: "medium"
          affected_systems: "Authentication service, API gateway, all persona-specific dashboards"
          mitigation: >
            Use KeyCloak's official SDKs and Docker Compose for local dev, provision
            a managed cloud KeyCloak instance (or Keycloak-as-a-Service) for prod.
            Define realm, roles, and client scopes in IaC from day one. E2E auth
            tests covering all 3 persona login paths on every PR.
        - risk: >
            Social login OAuth flow (Google and Apple) adds 2 external OAuth provider
            integrations on top of KeyCloak's identity brokering. Apple's Sign In
            requires a paid Apple Developer account and is more restrictive than Google.
            Token bridging between OAuth providers and KeyCloak's internal token system
            adds implementation surface area.
          severity: "medium"
          affected_systems: "KeyCloak identity brokering, registration flow, session JWT"
          mitigation: >
            Implement Google first and validate the KeyCloak identity broker pattern.
            Apple's OAuth requirements (server-side token exchange) must be validated
            in Sprint 1 — defer if Apple Developer account is not provisioned by kick-off.
        - risk: >
            Admin-driven mentor onboarding is a multi-step workflow with file uploads
            (LinkedIn, portfolio, proof-of-expertise artefacts). Verification artefact
            storage (S3 or equivalent), upload validation, and admin review queue all
            need to be built from scratch in a greenfield environment. File upload
            handling, virus scanning, and storage cost are often underestimated.
          severity: "low"
          affected_systems: "Admin portal, file storage, mentor profile service"
          mitigation: >
            Use cloud-provider managed object storage (AWS S3 or GCS). Implement
            file-type and size validation on upload. Add a lightweight virus scan
            hook (ClamAV or cloud-native service). Mock file storage in dev/test.
      blockers: []
      sequencing_constraints: >
        E1 is the mandatory foundation — no other epic can begin implementation until
        E1's auth, profile, and RBAC layers are stable. E2 (mentor data), E3 (session
        participants), E4 (payment payer/payee identity), E6 (admin portal access),
        E7 (notification recipients), E8 (identity-tied compliance) all depend on
        authenticated, role-assigned users from E1. E1 must ship in Sprint 1–2.
      architecture_impact: >
        Establishes the IAM foundation: KeyCloak server, JWT token strategy, RBAC
        role definitions, API gateway auth middleware, and persona routing. All
        subsequent epics inherit this auth layer. Introduces file storage infrastructure
        (mentor verification artefacts) that will be reused by E3 (session recordings)
        and E8 (compliance document management). Data model decisions for user,
        mentor_profile, and admin_user entities set the schema that all other services
        reference — a correction post-E1 is expensive.

    # ─── E2: Mentor Marketplace & Discovery ─────────────────────────────────
    - epic_ref: "E2"
      epic_name: "Mentor Marketplace & Discovery"
      risk_level: "medium"
      technical_risks:
        - risk: >
            Elasticsearch setup, index design, and sync pipeline are non-trivial
            in a greenfield environment. The mentor search index must stay in sync
            with the relational database (profile updates, verification status changes,
            pricing changes). A broken sync pipeline produces stale search results —
            a critical UX failure for a trust-based marketplace (see E2 FC-1).
          severity: "high"
          affected_systems: "Elasticsearch cluster, mentor profile service, search API"
          mitigation: >
            Use a managed Elasticsearch service (AWS OpenSearch or Elastic Cloud)
            to reduce operational overhead. Implement event-driven sync via database
            change events or async message queue — not polling. Add a reconciliation
            job that runs nightly to detect and fix index drift. Dedicated search
            integration tests on every PR.
        - risk: >
            Rule-based recommendation matching (mentee interests → mentor expertise
            categories) is simple but can silently return poor results if category
            taxonomy is inconsistent (e.g., "sport" vs "Sport" vs "sports"). Category
            normalisation must be enforced at the data layer, not at query time.
          severity: "low"
          affected_systems: "Recommendation service, mentor profile data model"
          mitigation: >
            Enforce expertise categories as an enum at the database and API validation
            layer — no free-text categories. Seed the taxonomy (Sport, Entrepreneurship,
            Business, Entertainment) as immutable values. Add a test covering the
            recommendation logic for each category match.
        - risk: >
            Empty-state handling for new marketplace with low mentor supply —
            search returning zero results will feel broken if the platform launches
            with a thin mentor catalog. This is an operational concern but has technical
            implications for how pagination and empty states are designed.
          severity: "low"
          affected_systems: "Search API, frontend pagination"
          mitigation: >
            Implement explicit empty-state UI with actionable copy. Consider a
            minimum viable mentor catalog requirement before public launch as an
            operational gate, documented in the launch checklist.
      blockers: []
      sequencing_constraints: >
        Depends on E1 for verified mentor profiles — search index can only be
        populated after E1's mentor data model and verification workflow are stable.
        E3 (session booking) depends on E2 — mentees must discover a mentor before
        requesting a session. Elasticsearch infrastructure established here can
        also serve E9 (analytics queries for mentor discovery stats) with careful
        separation of concerns.
      architecture_impact: >
        Introduces Elasticsearch as a search infrastructure component — a second
        data store alongside the relational database. Requires an index sync
        strategy (event-driven or ETL). The mentor profile entity's searchable
        fields (name, bio, expertise tags, pricing, verified status) are defined
        here and must remain consistent with E1's profile model. API response
        pagination pattern established here will be reused across E9 analytics views.

    # ─── E3: Session Lifecycle & Video Delivery ──────────────────────────────
    - epic_ref: "E3"
      epic_name: "Session Lifecycle & Video Delivery"
      risk_level: "high"
      technical_risks:
        - risk: >
            Zoom and Google Meet API integrations are both complex and different —
            the epic must commit to one or offer both, but the API surface is
            distinct. Zoom's server-side SDK requires registering a Marketplace app
            and handling OAuth, meeting creation, recording callbacks, and webhook
            delivery. Google Meet's API (Meet REST API) is newer and has less
            documentation. Either path involves async webhook handling for recording
            completion events. Third-party video provider outages directly prevent
            session delivery — the core product is broken.
          severity: "high"
          affected_systems: "Video integration service, session state machine, recording store"
          mitigation: >
            Select ONE video provider for MVP — Zoom is the lower-risk choice given
            its more mature SDK and wider enterprise use. Register the Zoom Marketplace
            app in Sprint 1 and validate the meeting creation → join → recording →
            webhook pipeline in Sprint 2 before committing to full session lifecycle
            integration. Abstract the video provider behind an interface to enable
            future swap. Add a session fallback state ("video provider unavailable")
            with a direct meeting link as degraded-mode option.
        - risk: >
            Session state machine has 8 states (requested, accepted, scheduled,
            in-progress, completed, cancelled, no-show) with multiple transition
            triggers (user actions, time events, video webhook callbacks). State
            transition bugs are hard to detect and can leave sessions in inconsistent
            states — e.g., a session marked "in-progress" that never completed
            because the recording webhook was missed. This directly breaks E4's
            payment release trigger.
          severity: "high"
          affected_systems: "Session service, payment escrow release, recording service"
          mitigation: >
            Model the state machine explicitly using a state machine library (e.g.,
            XState for Node.js or equivalent). Implement idempotent webhook handlers
            with duplicate event detection. Add a reconciliation job that detects
            sessions stuck in "in-progress" beyond the maximum session duration and
            transitions them to an "admin-review" state rather than auto-completing.
            Integration tests covering all state transitions on every PR.
        - risk: >
            Auto-recording with 3-day retention and admin-only access creates a
            storage, lifecycle, and access control obligation. Recording files from
            video providers (Zoom/Meet) must be downloaded (or streamed via signed URL),
            stored securely, time-bounded for deletion, and access-controlled such
            that only admin API endpoints can retrieve them. Missing a deletion on
            day 3 is a GDPR violation.
          severity: "medium"
          affected_systems: "Recording store, admin portal, compliance / data lifecycle service"
          mitigation: >
            Store recordings in cloud object storage with server-side encryption.
            Use object lifecycle rules (S3 TTL or GCS Object Lifecycle) to auto-delete
            after 72 hours — do not rely on application-layer deletion jobs. Admin
            access via signed time-limited URLs only — no public URLs. Add a daily
            audit job that verifies no recordings exist beyond the 72-hour threshold.
        - risk: >
            Recording consent for GDPR (decision point I-05 in product.yaml) is
            unresolved — mandatory auto-recording without an explicit consent mechanism
            at session start may violate GDPR Article 7 requirements in Germany and
            Switzerland. If consent must be captured per-session, the UI/UX and
            flow for both parties (mentee and mentor) must be designed. If consent
            is captured at registration (ToS), the legal review must confirm this
            sufficiency for EU markets.
          severity: "high"
          affected_systems: "Session join flow, GDPR compliance (E8), terms of service"
          mitigation: >
            This is the critical blocker for E3. Resolve I-05 before architecture
            begins: confirm with legal counsel whether per-session consent or ToS
            consent suffices for EU markets. If per-session consent is required,
            add a consent gate to the "Join Session" flow for both parties. Unresolved,
            this risks post-launch regulatory action in Germany and Switzerland.
      blockers:
        - >
          I-05 (product.yaml decision_point): Session recording consent mechanism
          for GDPR compliance is unresolved. Mandatory auto-recording without
          an explicit consent mechanism at session start may violate GDPR Article 7
          (Germany, Switzerland). Must be resolved before E3 detailed design begins —
          the join-session flow and terms-of-service design depend on this decision.
          Options: (a) per-session consent gate for all parties, (b) blanket ToS
          consent at registration confirmed legally sufficient for EU markets.
      sequencing_constraints: >
        Depends on E1 (authenticated session participants with correct roles) and
        E2 (verified mentor profiles for session requests). E4 (payment capture)
        is triggered by session booking confirmation and therefore cannot be
        fully integrated until E3's booking workflow is stable. E5 (ratings and
        disputes) depends on E3's session completion state. E6 (admin session
        management) depends on E3's session data model. E7 (notifications) mocks
        are used during E3 and replaced after E7 ships — E3 must be designed
        with a notification interface that E7 can implement without refactoring
        the session service.
      architecture_impact: >
        Introduces the session state machine as the central orchestration component
        of the platform. Creates a webhook ingestion layer for video provider events.
        Establishes the recording storage infrastructure (cloud object storage
        with TTL lifecycle policies) reused by E5 (dispute resolution recording access)
        and audited by E8 (compliance). The notification interface mocked here is
        the contract that E7 must implement. The calendar/availability model defined
        here is tightly coupled to the mentor profile from E1 — schema changes
        after E3 are expensive.

    # ─── E4: Payment Processing & Financial Operations ───────────────────────
    - epic_ref: "E4"
      epic_name: "Payment Processing & Financial Operations"
      risk_level: "high"
      technical_risks:
        - risk: >
            Stripe escrow implementation using Payment Intents with capture-on-completion
            is non-trivial. The escrow model requires creating a PaymentIntent at
            booking (status: requires_capture), holding the funds, and capturing
            (releasing) only on session completion — a delayed capture pattern.
            Stripe limits delayed capture to 7 days. If a session is scheduled more
            than 7 days out, the delayed capture window will expire, requiring a
            re-authorisation flow. This edge case is easy to miss and causes payment
            failures for sessions scheduled far in advance.
          severity: "high"
          affected_systems: "Payment service, session booking flow, Stripe integration"
          mitigation: >
            Validate Stripe delayed capture (7-day limit) against maximum session
            scheduling horizon in E3. If mentors can schedule sessions more than
            7 days ahead, implement a re-authorisation strategy: notify mentee
            and re-capture at T-7 days. Alternatively, constrain the booking
            horizon to ≤7 days for MVP. Document this constraint explicitly in
            the booking UX. Add a payment reconciliation job that detects
            expired PaymentIntents and surfaces them for admin review.
        - risk: >
            Stripe Connect for mentor payouts (platform → mentor fund transfers)
            requires each mentor to complete Stripe Connect onboarding (identity
            verification, bank account linking). This adds a required onboarding
            step to E1's mentor setup that is not explicitly modelled in the current
            E1 or E4 scope. If mentors skip Connect onboarding, payouts queue
            indefinitely and mentor satisfaction suffers. The admin needs visibility
            into Connect onboarding status.
          severity: "high"
          affected_systems: "Mentor onboarding (E1), payment service, admin financial operations"
          mitigation: >
            Add Stripe Connect onboarding as a required step in E1's mentor profile
            setup (not E4 alone — this is a cross-epic dependency that must be
            surfaced in E1's implementation scope). Expose Connect onboarding status
            in the admin portal (E6). Block session acceptance by mentors who have
            not completed Connect onboarding — cannot receive payouts if not onboarded.
        - risk: >
            Multi-currency handling (INR, USD, CHF, EUR) with Stripe requires
            understanding whether the platform operates with a "settlement currency"
            model (mentors receive in a fixed currency) or a "presentment currency"
            model (mentors receive in their configured currency with Stripe handling
            conversion). INR transactions require Stripe India (Stripe's separate
            Indian entity) which has different onboarding, reporting, and banking
            requirements than Stripe's global platform. This may require two
            separate Stripe accounts (India and global) with different settlement
            rails.
          severity: "high"
          affected_systems: "Payment service, Stripe account setup, mentor payout rails"
          mitigation: >
            Clarify currency architecture with Stripe India and Stripe Global before
            Sprint 1: confirm whether a single Stripe account can handle INR
            domestic payments alongside USD, CHF, EUR, or whether a dual-account
            setup (Stripe India + Stripe Global) is required. This is a critical
            pre-implementation decision — the payment service architecture differs
            materially between the two models.
        - risk: >
            Webhook reliability for asynchronous Stripe events (payment confirmation,
            payout completion, dispute notification) is critical. Missing or
            duplicate webhook processing causes payment inconsistencies, stuck
            escrow releases, or double-credited payouts. Webhook signature
            validation, idempotent processing, and dead-letter queuing for
            failed events are non-trivial to implement correctly.
          severity: "medium"
          affected_systems: "Payment webhook handler, escrow service, payout service"
          mitigation: >
            Implement Stripe webhook signature validation on every event. Store
            all received webhook events in a log table before processing (idempotency
            via event ID deduplication). Add a dead-letter queue for failed
            webhook processing with alerting. Test webhook flows using Stripe's
            CLI webhook forwarder in dev/CI environments.
      blockers:
        - >
          Stripe India vs Stripe Global account structure must be resolved before
          implementation begins. INR domestic payment routing may require a separate
          Stripe India account with different onboarding, API endpoints, and
          settlement rails than the global account handling USD, CHF, EUR.
          This decision changes the payment service architecture — a wrong initial
          choice requires significant rework.
        - >
          Stripe Connect mentor onboarding scope gap — the current E1 scope does
          not include Stripe Connect identity verification and bank account linking
          as a mentor setup step. This must be added to E1's implementation scope
          before E1 detailed design is locked, or E4 will be blocked by mentors
          who have not completed Connect onboarding.
      sequencing_constraints: >
        Depends on E3 for session booking trigger (payment capture fires on booking
        confirmation) and session completion trigger (escrow release fires on
        completion). E5 (refunds for disputes) depends on E4's refund API being
        implemented. E6 (admin financial operations) depends on E4's transaction
        and payout data model. E9 (analytics) reads E4's financial records.
        The Stripe Connect onboarding dependency on E1 must be resolved before
        E1 development begins — a retro-fit is costly.
      architecture_impact: >
        Introduces Stripe as the payment processing backbone with Payment Intents
        (escrow), Stripe Connect (mentor payouts), and webhook ingestion. Establishes
        the financial data model (transactions, escrow records, payout queue, commission
        ledger) that E5 (refunds), E6 (admin financial view), and E9 (analytics)
        read from. The delayed-capture escrow pattern constrains session scheduling
        horizon. Multi-currency architecture decisions here (single vs dual Stripe
        account) affect all payment flows and admin reporting.

    # ─── E5: Ratings, Reviews & Dispute Resolution ──────────────────────────
    - epic_ref: "E5"
      epic_name: "Ratings, Reviews & Dispute Resolution"
      risk_level: "medium"
      technical_risks:
        - risk: >
            Auto-flagging triggers (ratings below 3 stars, 3+ cancellations) must
            fire reliably and without duplication. If the flagging job runs more
            than once or processes the same rating event twice, the admin queue
            fills with duplicate alerts. If it misses a trigger, quality monitoring
            fails silently (see FC-2). The flagging logic must be idempotent.
          severity: "medium"
          affected_systems: "Rating service, quality monitoring queue, admin dashboard"
          mitigation: >
            Implement flagging as an idempotent database trigger or event handler
            that checks whether a flag already exists for the given session/mentor
            before creating a new one. Add a scheduled reconciliation job that
            scans for unflagged sessions meeting the criteria and creates flags
            retroactively if missed. Test flagging logic with explicit boundary
            cases (exactly 3 cancellations, exactly 3-star rating edge).
        - risk: >
            Session recording access for dispute resolution has a hard 3-day TTL.
            The admin dispute resolution interface must surface recording availability
            status (available or expired) and gracefully handle the case where the
            recording has been auto-deleted before the dispute is resolved. If a
            dispute is filed on day 2 and the recording auto-deletes on day 3
            before the admin reviews it, the dispute is unresolvable with evidence.
          severity: "medium"
          affected_systems: "Admin dispute interface, recording storage (E3), dispute service"
          mitigation: >
            Display recording expiry countdown in the admin dispute view. Add
            an automated alert to admin when a dispute is filed against a session
            whose recording expires within 24 hours. Consider extending recording
            retention when a dispute is filed (admin action to "preserve recording"
            that pauses TTL deletion), subject to GDPR constraints — this requires
            a legal review decision.
        - risk: >
            Abuse reporting scope is broad ("inappropriate behaviour") but the
            resolution workflow is not explicitly designed. Without a structured
            triage process, abuse reports may conflict with or duplicate dispute
            resolution workflows, causing confusion in the admin queue.
          severity: "low"
          affected_systems: "Abuse report service, admin portal"
          mitigation: >
            Treat abuse reports as a separate admin queue with a simpler workflow
            (open, acknowledged, resolved) distinct from the dispute workflow.
            Ensure they share no state machine logic to avoid coupling. Abuse
            reports do not trigger refunds — disputes do.
      blockers: []
      sequencing_constraints: >
        Depends on E3 (completed session state as the prerequisite for rating
        and dispute filing) and E4 (dispute resolution may trigger refund processing
        via E4's refund API). E5 must be designed with the recording access interface
        from E3 as a dependency — recordings are stored and TTL-managed by E3's
        infrastructure, E5 only consumes them. Sequenced to mid-bucket (after E3
        and E4 are stable) to ensure the full session and payment data is available
        for testing dispute resolution end-to-end.
      architecture_impact: >
        Introduces the rating and review data model (tied to session and mentor entities),
        the auto-flagging event processing pipeline, and the dispute management state
        machine. Reads session recordings from E3's storage infrastructure — no new
        storage layer added. Triggers refund API from E4 on dispute resolution.
        The admin portal module built here feeds quality monitoring data to E9
        (analytics) and the admin KPI dashboard (E6).

    # ─── E6: Platform Administration & Operations ───────────────────────────
    - epic_ref: "E6"
      epic_name: "Platform Administration & Operations"
      risk_level: "medium"
      technical_risks:
        - risk: >
            Strapi CMS integration for communication templates and help centre adds
            a third persistent data store (alongside relational DB and Elasticsearch)
            and requires a CMS hosting decision (cloud or self-hosted). Keeping the
            CMS in sync with the main application's templates (E7 SendGrid templates)
            creates a dual-management surface where template changes in Strapi may
            not propagate to SendGrid automatically.
          severity: "medium"
          affected_systems: "Strapi CMS, SendGrid template service (E7), admin portal"
          mitigation: >
            Use a managed Strapi Cloud instance to reduce operational burden. Define
            a clear ownership boundary: Strapi manages help centre content and
            the source of truth for email template copy; E7's SendGrid integration
            pulls from Strapi on template update events (webhook or periodic sync),
            not a manual dual-update. Integration test the Strapi → SendGrid sync.
        - risk: >
            System configuration changes (commission rates, pricing bands, cancellation
            policies) affect live production transactions. A commission rate change
            must be applied only to new transactions without retroactively altering
            escrowed payments. Without strict version-at-capture semantics, a
            commission rate change could corrupt in-flight payment records.
          severity: "high"
          affected_systems: "System config service, payment service (E4), session service (E3)"
          mitigation: >
            Store commission rate at the transaction level at booking time (snapshotted
            value, not a reference to the current config). Configuration changes must
            be applied with a "effective from" timestamp — new transactions after the
            timestamp use the new rate, transactions before retain the original rate.
            This is a critical data integrity requirement. Add an admin confirmation
            step before commission rate changes take effect on live traffic.
        - risk: >
            Platform-wide search across users, sessions, and transactions is a
            performance-sensitive feature in the admin portal. Ad-hoc queries against
            production tables without indexes or query limits will degrade performance
            for all platform users — a particularly high-severity risk per E9 FC-3.
          severity: "medium"
          affected_systems: "Admin search API, production database, platform performance"
          mitigation: >
            Implement admin search against indexed columns only (name, email, status,
            date ranges). Add query timeout limits and result caps. Use read replicas
            for admin-facing queries that may be slow. Separate admin search from
            mentee-facing Elasticsearch search to avoid resource contention.
      blockers: []
      sequencing_constraints: >
        Admin portal's session management module depends on E3 (session data model),
        financial operations module depends on E4 (payment and payout data), and
        dispute resolution UI depends on E5 (dispute workflow). The admin portal
        is developed in mid-bucket after these core capabilities are stable.
        However, the system configuration module (commission rates, cancellation
        policies) is needed before E4 and E3 reach their final implementation
        — a chicken-and-egg risk that requires stubbed configuration defaults
        in E3/E4 that are later replaced by E6's dynamic config.
      architecture_impact: >
        Adds Strapi CMS as a third persistence layer. Establishes the system
        configuration service as a shared dependency across E3, E4, and E10
        (referral reward configuration). The version-at-capture pattern for commission
        rates sets a precedent for all price-sensitive configuration. Admin read
        replicas for performance-sensitive queries affect the database architecture.
        The admin portal is a separate frontend application (web-only) with its
        own auth flow through E1's KeyCloak RBAC admin role.

    # ─── E7: Communications & Notification Centre ───────────────────────────
    - epic_ref: "E7"
      epic_name: "Communications & Notification Centre"
      risk_level: "low"
      technical_risks:
        - risk: >
            Replacing mock email notifications from E3 and E4 with SendGrid-delivered
            emails risks introducing regressions if the mock interface contract
            (E3's notification interface) is not cleanly abstracted. If E3 hard-coded
            mock notification calls rather than using an interface, E7's de-mocking
            effort becomes a refactor rather than a plug-in replacement.
          severity: "medium"
          affected_systems: "Notification service, session service (E3), payment service (E4)"
          mitigation: >
            Define the notification interface in E3 and E4 as a proper dependency
            inversion — a NotificationService interface that mock and SendGrid
            implementations both satisfy. E3 and E4 development must be told this
            requirement upfront. E7 then only needs to provide the SendGrid implementation.
            Regression tests for E3 and E4 flows must run post-E7 integration.
        - risk: >
            Firebase Cloud Messaging (FCM) for mobile push notifications requires
            device token registration and management. Tokens are device-specific,
            expire, and must be refreshed. Managing a token registry adds a
            persistent data concern. Push delivery is not guaranteed — silent
            failures require observability tooling.
          severity: "low"
          affected_systems: "FCM integration, notification service, device token registry"
          mitigation: >
            Implement device token registration at mobile app launch (store token
            in user profile). Handle FCM token refresh events to update the registry.
            Use FCM's send-to-token delivery with logging for failed sends. Track
            delivery success rate in observability tooling. For MVP, email is the
            primary channel — push is supplementary; a missed push notification
            that is covered by email is not critical.
        - risk: >
            SendGrid transactional email deliverability (landing in inbox vs spam)
            depends on domain authentication (SPF, DKIM, DMARC), sending reputation,
            and template quality. A new domain with no sending history is higher
            risk for initial spam filtering. This is an operational concern with
            technical prerequisites (DNS records, domain verification) that must
            be completed before first email delivery.
          severity: "low"
          affected_systems: "SendGrid account, DNS configuration, email deliverability"
          mitigation: >
            Set up SendGrid domain authentication (SPF, DKIM, DMARC records) in
            Sprint 1 as part of infrastructure provisioning — do not defer to E7's
            implementation sprint. Use a dedicated sending subdomain (e.g.,
            mail.fellyclub.com). Start with low-volume warmup. Monitor SendGrid
            deliverability dashboard from first send.
      blockers: []
      sequencing_constraints: >
        Depends on E1 for user notification preferences (opt-in/opt-out) and
        authenticated user profiles. E7 de-mocks E3 and E4 notifications — it
        should ship before E3 and E4 reach production to avoid running mocked
        notifications in a live environment. Sequenced to mid-bucket but should
        be treated as high-priority within that bucket to avoid shipping mocked
        notifications to real users.
      architecture_impact: >
        Introduces Twilio SendGrid and Firebase Cloud Messaging as communication
        infrastructure. Establishes the notification service as a shared platform
        component that all epics can dispatch events through. The in-app notification
        centre adds a new data model (notifications table, read status) and a
        real-time or polling delivery mechanism. The notification interface contract
        must be established in E3/E4 and fulfilled here — the interface design is
        shared architecture across 3 epics.

    # ─── E8: Regulatory Compliance & Data Security ──────────────────────────
    - epic_ref: "E8"
      epic_name: "Regulatory Compliance & Data Security"
      risk_level: "high"
      technical_risks:
        - risk: >
            Right-to-deletion (GDPR Article 17) with cascading data removal across
            all platform data is technically complex in a multi-service, multi-store
            architecture. User data exists in: relational DB (profile, sessions,
            payments), Elasticsearch (mentor search index), Strapi CMS (if user
            content is referenced), cloud object storage (verification artefacts,
            session recordings), notification service (email delivery logs), and
            SendGrid (contact lists). A deletion job that misses any store results
            in a GDPR violation. The cascading order also matters — deleting the
            user record before de-indexing from Elasticsearch can leave orphaned
            search records.
          severity: "high"
          affected_systems: "All data stores: relational DB, Elasticsearch, S3, SendGrid, notification service"
          mitigation: >
            Implement a deletion orchestrator service that executes deletion in a
            documented sequence: (1) deactivate user account, (2) cascade soft-delete
            across relational data, (3) remove from Elasticsearch index, (4) delete
            cloud storage artefacts, (5) remove from SendGrid contact list, (6)
            mark hard delete as complete. Use a deletion audit log that records
            which stores have been cleared per user. Add integration tests that
            verify data absence across all stores post-deletion. Legal review
            required on data retention exceptions (e.g., financial records for
            tax obligations — may need to be retained in anonymised form).
        - risk: >
            TPDP (India's Digital Personal Data Protection Act, 2023) is still
            in a partially notified state — implementing regulations (rules) were
            not fully published as of early 2026. Building compliance features for
            TPDP requirements that may change before MVP launch creates rework risk.
            The compliance posture for India is less defined than for GDPR (EU).
          severity: "medium"
          affected_systems: "Compliance service, data handling policies, privacy policy"
          mitigation: >
            Engage a qualified data protection counsel in India to review TPDP
            obligations as they apply to Felly Club's India operations before
            compliance implementation begins. At minimum, implement GDPR-equivalent
            controls (consent, deletion, portability) as a baseline — these are
            unlikely to conflict with TPDP and provide a safe floor. Monitor
            TPDP rule publications and plan a compliance review sprint post-launch
            if rules change materially.
        - risk: >
            AES-256 encryption at rest for sensitive data fields (PII, financial data)
            requires field-level encryption or database-level encryption. Field-level
            encryption (encrypting individual columns) is more granular but requires
            key management infrastructure (AWS KMS or HashiCorp Vault). Database-level
            encryption (transparent data encryption) is simpler but provides coarser
            granularity. The wrong choice creates either operational complexity
            (field-level without proper key management) or insufficient protection
            (database-level without field encryption for especially sensitive fields
            like payment tokens, SSNs, or passport numbers).
          severity: "medium"
          affected_systems: "Database, key management service, financial data store"
          mitigation: >
            Use database-level encryption (AWS RDS encryption at rest) as the baseline.
            Apply field-level encryption via AWS KMS only for the most sensitive fields
            (raw payment metadata if any, verification artefact content). Document the
            encryption boundaries in an ADR. Avoid encrypting fields used in WHERE
            clauses without tokenisation (encrypted fields cannot be indexed for search).
        - risk: >
            Recording consent ambiguity (I-05) creates a direct compliance risk for E8.
            If E3 ships auto-recording without a legal consent mechanism and E8 is
            implemented in mid-bucket, there is a window where production sessions
            are auto-recorded without a compliant consent mechanism. This violates
            GDPR Article 7 in EU markets.
          severity: "high"
          affected_systems: "Session recording (E3), GDPR compliance, cookie consent flows"
          mitigation: >
            I-05 must be resolved before E3 and E8 begin implementation — see E3
            blocker. E8 must include explicit consent audit coverage for auto-recording
            as part of its GDPR compliance checklist. If per-session consent is required,
            E3 and E8 must be co-implemented with the consent gate.
      blockers:
        - >
          I-05 (product.yaml decision_point): Session recording consent for GDPR
          compliance is shared between E3 and E8 and remains unresolved. E8 cannot
          complete its GDPR compliance assessment without a determination on whether
          blanket ToS consent or per-session consent is required for auto-recording.
          Legal counsel review required before either E3 or E8 implementation begins.
        - >
          TPDP rule clarification: India's DPDP Act implementing rules were not
          fully published as of March 2026. Engage qualified Indian data protection
          counsel to confirm the compliance obligations applicable to Felly Club's
          India operations before E8 implementation begins. Without this, E8's
          TPDP compliance implementation is speculative and may require rework.
      sequencing_constraints: >
        Depends on E1 (user identity for right-to-deletion scope) and E4 (PCI DSS
        audit of payment tokenisation implemented in E4). Sequenced to mid-bucket
        but must not be the last epic — compliance controls must be validated in
        staging before production launch. Security hardening (TLS, JWT security,
        secure headers) should ideally be in place from Sprint 1 as part of
        infrastructure provisioning — not deferred entirely to E8.
      architecture_impact: >
        Adds the deletion orchestrator service as a cross-cutting compliance component.
        The cookie consent mechanism requires frontend changes across all pages
        (web app and mobile app). JWT token security audit may require changes
        to E1's auth implementation. AES-256 encryption at rest affects database
        configuration and key management infrastructure. The compliance audit trail
        (admin action logging, data access logging) adds a logging infrastructure
        requirement shared with E9 (observability).

    # ─── E9: Analytics & Performance Dashboards ─────────────────────────────
    - epic_ref: "E9"
      epic_name: "Analytics & Performance Dashboards"
      risk_level: "low"
      technical_risks:
        - risk: >
            Dashboard queries running against production tables without proper
            read optimisation can degrade platform performance for concurrent users
            (see E9 FC-3). Aggregate queries (GMV, session volume, rating distribution)
            are expensive without pre-computation or materialised views.
          severity: "medium"
          affected_systems: "Production database, API performance, all user-facing features"
          mitigation: >
            Route all dashboard queries to a read replica — never the primary
            write database. Pre-compute expensive aggregates (GMV, session counts,
            rating averages) as scheduled jobs that write to summary tables. Dashboard
            API reads from summary tables, not ad-hoc aggregate queries. Add query
            timeout limits on all dashboard endpoints. Performance test dashboard
            queries under simulated concurrent load before shipping.
        - risk: >
            Analytics data consistency depends on the accuracy of E1 (user records),
            E3 (session records), and E4 (payment records). If those epics have
            data bugs or race conditions in state transitions, analytics dashboards
            will surface misleading data. A mentor's earnings dashboard showing an
            incorrect amount (E9 FC-1) is a trust-breaking bug even if the underlying
            payment was correct.
          severity: "low"
          affected_systems: "Analytics API, mentor earnings dashboard, admin KPI dashboard"
          mitigation: >
            Define a data contract for each dashboard data source (which fields from
            which tables, with which status filter). Integration tests that verify
            dashboard values against known fixture data. Cross-reference dashboard
            totals against ledger-level records in automated tests.
        - risk: >
            E9 is sequenced to the "long" bucket and depends on E1, E3, and E4.
            If those upstream epics deliver late, E9 has no data to read. This is
            primarily a schedule risk rather than a technical risk — the feature
            itself is low complexity (read-only dashboards from existing data).
          severity: "low"
          affected_systems: "E9 delivery schedule"
          mitigation: >
            Use test fixtures and synthetic data in development and QA to validate
            E9 without waiting for real production data from upstream epics.
            Dashboard development can proceed in parallel using mocked API responses.
      blockers: []
      sequencing_constraints: >
        Depends on E1 (user data), E3 (session data), and E4 (payment data) being
        stable in data model and state transitions before meaningful analytics can
        be implemented. Sequenced to long bucket appropriately. Read replicas and
        summary tables should be considered in database architecture from day one
        to avoid retrofitting infrastructure when E9 is implemented.
      architecture_impact: >
        No new infrastructure if read replicas are provisioned from day one.
        Introduces summary tables (pre-computed aggregates) as a new database concern.
        Dashboard API is a new service module (or set of endpoints in the existing
        backend) that must be isolated from write-path APIs to prevent performance
        interference. The admin KPI dashboard shares infrastructure with E6's admin
        portal — no separate deployment needed.

    # ─── E10: Referral Programme & User Acquisition ─────────────────────────
    - epic_ref: "E10"
      epic_name: "Referral Programme & User Acquisition"
      risk_level: "low"
      technical_risks:
        - risk: >
            Referral attribution requires tracking the referral link parameter through
            the registration flow without losing it if the user closes the browser
            and returns later, or registers via social login (which redirects to
            an OAuth provider). Client-side cookie or localStorage storage of the
            referral parameter can be cleared by the browser or lost in the OAuth
            redirect flow. Attribution failures mean referrers do not receive rewards
            (E10 FC-1).
          severity: "medium"
          affected_systems: "Registration flow (E1), referral tracking service, OAuth flow"
          mitigation: >
            Store the referral parameter server-side at the earliest possible point
            — on first visit with the referral link, before registration begins.
            Set a referral cookie with a 30-day TTL. Carry the referral parameter
            through the OAuth redirect state parameter. Validate attribution logic
            across all registration paths (email, Google, Apple) in integration tests.
        - risk: >
            Reward fulfilment on the referred user's first completed paid session
            requires a pipeline from session completion (E3) → payment confirmation
            (E4) → referral attribution check → reward creation. If any step in
            this pipeline fails silently, the referrer is not rewarded (E10 FC-2).
            The reward mechanism (account credit, discount voucher, etc.) is
            admin-configurable via E6 — the implementation must be flexible enough
            to support multiple reward types without code changes.
          severity: "low"
          affected_systems: "Referral service, session completion hook (E3), payment hook (E4)"
          mitigation: >
            Implement reward fulfilment as a decoupled event consumer triggered by
            session completion events. Make the reward type and value read from E6's
            system configuration at dispatch time (not at referral tracking time).
            Add observability for reward dispatch events — log success/failure per
            referral. Test reward fulfilment with explicit end-to-end integration
            tests covering the referral link → registration → first session →
            reward pipeline.
        - risk: >
            Referral fraud is explicitly deferred in scope, but basic referral abuse
            (self-referral, disposable email abuse) is still a risk that could
            undermine reward economics if not minimally addressed in MVP without
            a full fraud detection system.
          severity: "low"
          affected_systems: "Referral tracking service"
          mitigation: >
            Apply minimal fraud guards without a full system: block self-referral
            (referral link owner cannot be the referred user, checked by email match),
            require email verification before referral attribution is counted, and
            use admin-configurable reward cap (max rewards per referrer per period).
            Full fraud detection is deferred per scope.
      blockers: []
      sequencing_constraints: >
        Depends on E1 (user registration to attach referral attribution) and E4
        (first paid session payment confirmation to trigger reward). The referral
        registration integration must be built into E1's registration flow as
        a hook — retrofitting referral tracking into a completed registration
        flow later adds risk. Referral parameter handling during OAuth (Google,
        Apple) login must be validated with E1's social login implementation.
        Sequenced to long bucket correctly.
      architecture_impact: >
        Adds a referral tracking service (referral link generation, attribution
        store, reward ledger) and an event consumer for session completion events.
        Minimal new infrastructure — referral links are short UUIDs stored in
        the relational database. The event consumer pattern established here
        (listening to session completion) will be a reusable pattern for post-
        session engagement triggers (E7's engagement prompts). E10's reward
        configuration hook into E6's system configuration sets a precedent for
        admin-configurable operational parameters across epics.

  open_questions:
    - question: >
        I-05: What is the legal basis for auto-recording all sessions in GDPR
        markets (Germany, Switzerland)? Does blanket ToS consent at registration
        suffice, or is per-session explicit consent required under GDPR Article 7?
        This is an unresolved decision point in product.yaml that directly affects
        E3 (session join flow) and E8 (GDPR compliance implementation).
      affected_epics: ["E3", "E8"]

    - question: >
        I-01 / I-02 / I-03: Technology stack decisions (React Native vs Swift/Kotlin
        for mobile; Node.js vs Next.js for backend; API gateway vendor) are deferred
        to architecture phase per product.yaml. These decisions must be finalised
        before E1 implementation begins — the mobile stack affects E1's social login
        (Apple OAuth on iOS), E3's video join flow (Zoom/Meet SDK behaviour on
        React Native vs native), and E7's push notification infrastructure (FCM
        on React Native vs native SDKs).
      affected_epics: ["E1", "E2", "E3", "E7"]

    - question: >
        Stripe India vs Stripe Global: Can a single Stripe account handle INR
        domestic transactions alongside USD, CHF, EUR transactions? Or does the
        India market require a separate Stripe India account with different onboarding
        and settlement rails? This must be resolved before E4 implementation begins.
      affected_epics: ["E4"]

    - question: >
        Stripe Connect mentor onboarding scope: The current E1 scope does not include
        Stripe Connect identity verification and bank account linking as a mentor
        setup step, but mentors cannot receive payouts (E4) without completing
        Connect onboarding. Should Stripe Connect onboarding be added to E1's
        in_scope or E4's? This cross-epic dependency must be assigned an explicit
        epic owner before E1 implementation begins.
      affected_epics: ["E1", "E4"]

    - question: >
        Configuration effective-date semantics: How should system configuration
        changes (commission rates, cancellation policies) behave for in-flight
        sessions — sessions that have been booked under the old rate but have
        not yet completed? The product.yaml and epics do not specify the rule
        for in-flight session rate treatment. This must be defined before E4 and
        E6 implementation begins.
      affected_epics: ["E4", "E6"]

    - question: >
        TPDP compliance scope: What specific obligations does India's DPDP Act
        (2023, partially notified as of early 2026) impose on Felly Club's India
        operations? Are the GDPR-equivalent controls (consent, deletion, portability)
        sufficient, or are there India-specific requirements (data localisation,
        data fiduciary registration) that affect the E8 compliance implementation?
      affected_epics: ["E8"]

    - question: >
        Session recording dispute extension: If a dispute is filed against a session
        whose recording will expire within 24 hours, can the admin "preserve" the
        recording (pausing TTL deletion) for the duration of the dispute resolution?
        This requires a legal review of whether extended retention for dispute
        purposes is permissible under GDPR. The answer affects E5's dispute workflow
        design and E8's compliance model.
      affected_epics: ["E5", "E8"]

  critical_blockers:
    - id: "CB-1"
      description: >
        I-05 — Session recording consent for GDPR: Unresolved decision point in
        product.yaml. Mandatory auto-recording without an explicit GDPR-compliant
        consent mechanism at session start may violate GDPR Article 7 in Germany
        and Switzerland. Must be resolved (legal counsel review) before E3
        architecture begins. Options: per-session consent gate or confirmed
        ToS-consent sufficiency.
      affected_epics: ["E3", "E8"]
      resolution_path: >
        Engage legal counsel in EU markets to confirm consent mechanism. Update
        E3's success scenarios and E8's compliance scope based on the decision.

    - id: "CB-2"
      description: >
        Stripe India account structure: INR domestic payment routing may require
        a separate Stripe India entity with different API endpoints, onboarding,
        and settlement rails than the global Stripe account. This is an architecture-
        defining decision for E4 — a wrong initial choice requires significant
        rework. Must be resolved before E4 implementation begins.
      affected_epics: ["E4"]
      resolution_path: >
        Direct consultation with Stripe India sales/solutions team before
        architecture phase. Confirm single-account vs dual-account requirement
        and document in ADR.

    - id: "CB-3"
      description: >
        Stripe Connect scope gap: Mentor payout infrastructure (E4) requires
        mentors to complete Stripe Connect onboarding (identity verification,
        bank account linking), but this step is not included in E1's current
        in_scope. Mentors who have not completed Connect onboarding cannot receive
        payouts, blocking E4's core function. This dependency must be assigned
        to E1 before E1 implementation begins.
      affected_epics: ["E1", "E4"]
      resolution_path: >
        Update E1's in_scope to include Stripe Connect mentor onboarding as
        a required mentor setup step. Validate that this does not scope-creep E1
        beyond its 'M' effort estimate. If effort impact is significant, evaluate
        whether Connect onboarding can be deferred to a post-E1 mentor settings
        step.

