feasibility:
  slug: "felly-club"
  assessed_at: "2026-03-25T23:15:00+0530"

  epics:
    - epic_ref: "E1"
      epic_name: "Identity and Access Foundation"
      risk_level: "medium"
      technical_risks:
        - risk: "KeyCloak is an operationally heavyweight IdP — it requires a dedicated JVM process, a PostgreSQL backing store, and non-trivial initial configuration for realm setup, client registration, and RBAC policy authoring. For a 3-person team under a EUR 50K budget, the operational footprint of KeyCloak may consume disproportionate infrastructure spend and setup time compared to a managed SaaS IdP alternative."
          severity: "medium"
          affected_systems: "Authentication layer, infrastructure budget, deployment pipeline"
          mitigation: "Containerize KeyCloak with Docker Compose for local dev and a managed Kubernetes/Railway deployment for production. Pre-configure realm, clients, and roles as Infrastructure-as-Code (IaC) templates. Budget 3-4 days for initial KeyCloak setup before other epics begin."
        - risk: "Social login integration (Google, Apple) via KeyCloak requires registering OAuth2 clients in each provider's developer console and configuring identity provider federation inside KeyCloak. Apple's Sign In requires additional App Store developer account setup and callback URL HTTPS enforcement. Any misconfiguration silently breaks the auth flow without clear error messages."
          severity: "low"
          affected_systems: "Registration and login flows, KeyCloak identity provider config"
          mitigation: "Implement email/password auth first and validate the full registration-to-RBAC flow before adding social login. Treat social login as additive once the core auth pipeline is stable."
        - risk: "Multi-tenant RBAC configuration in KeyCloak is non-trivial for teams unfamiliar with the platform. KeyCloak's role model (realm roles vs. client roles, role composites) is powerful but easy to misconfigure in ways that produce incorrect access control behaviour — roles that appear to work in dev but fail in production due to client-level vs realm-level scoping differences."
          severity: "medium"
          affected_systems: "RBAC enforcement, all downstream epics that depend on role-gated access"
          mitigation: "Define all three roles (mentee, mentor, admin) and their client-level scopes as code before any UI development begins. Write integration tests that assert role-specific access denial (403s) for all protected routes from day one. Do not rely on manual KeyCloak UI configuration — use KeyCloak's admin REST API or Terraform provider to version-control role definitions."
      blockers: []
      sequencing_constraints: "E1 is the hard prerequisite for the entire platform. No other epic can begin integration testing until E1 delivers working authentication tokens and role assignments. E7 (Compliance) shares the registration flow — coordinate consent collection injection point before E1's registration form is finalized to avoid rework."
      architecture_impact: "KeyCloak introduces a dedicated identity service requiring its own database (PostgreSQL), container, health checks, and network policy. Every backend service must validate JWT tokens issued by KeyCloak — this mandates a shared token validation middleware that all epics consume. The RBAC model defined in E1 governs access control across the entire platform — changes to roles after E1 ships require coordinated updates to KeyCloak config and all gated API routes."

    - epic_ref: "E2"
      epic_name: "Mentor Onboarding and Credentialing"
      risk_level: "medium"
      technical_risks:
        - risk: "Credential file upload (certifications, portfolio documents) requires a storage backend (S3-compatible object store) with secure signed URL access — files must not be publicly accessible but must be viewable by the submitting mentor and the admin reviewer. Implementing this correctly (pre-signed URLs, upload size limits, MIME type validation, virus scanning) under time pressure often leads to overly permissive bucket policies or missing input validation."
          severity: "medium"
          affected_systems: "File storage infrastructure, admin review panel, mentor profile"
          mitigation: "Use a managed object storage service (AWS S3 or equivalent) with bucket policies that deny public access. Generate pre-signed upload URLs server-side with 15-minute expiry. Enforce MIME type and file size server-side, not just client-side. Defer virus scanning for MVP — note it as a post-launch security hardening item."
        - risk: "Pricing band enforcement requires server-side validation against admin-configured pricing ranges. If the pricing band configuration is stored as application-level config rather than in the database, updating pricing bands requires a deployment. If stored in DB, the admin needs a UI to manage them — which is part of E10 (not yet built when E2 ships). This creates a chicken-and-egg dependency on platform configuration."
          severity: "low"
          affected_systems: "Mentor profile service, admin configuration, pricing validation"
          mitigation: "Seed initial pricing bands as database fixtures at deployment time. Build the admin pricing band management UI as part of E10. For E2, validate against DB-stored bands. Document the seeded values so they can be updated via DB migration until the admin UI is available."
        - risk: "The mentor approval state machine (applied → under_review → approved | rejected | request_more_info) must be persisted correctly and transitions must be idempotent. Without careful implementation, concurrent admin actions on the same application (two admins reviewing simultaneously) can produce inconsistent state."
          severity: "low"
          affected_systems: "Mentor application service, admin queue"
          mitigation: "Apply optimistic locking on application state transitions. Admin review actions should check current state before transitioning — reject transitions from unexpected states with a 409 Conflict. Implement application-level locking with a short TTL if concurrent review is anticipated at launch."
      blockers: []
      sequencing_constraints: "Depends on E1 for authentication and role assignment. The mentor approval workflow creates the supply-side data (approved mentor profiles) that E3 (Discovery) indexes. E3's Elasticsearch index cannot be populated or tested meaningfully until E2 delivers at least a small set of approved mentor profiles. Target 5-10 seeded test mentor profiles at end of E2 to unblock E3 integration testing."
      architecture_impact: "Introduces a file storage subsystem (object store) as new infrastructure. The mentor profile entity is the central data model that E3 (search index), E4 (booking availability), E10 (admin queue) all read from — schema changes to this model after E2 ships will cascade across multiple consumers. Define the mentor profile schema as a formal contract before finalising E2."

    - epic_ref: "E3"
      epic_name: "Mentor Discovery and Search"
      risk_level: "medium"
      technical_risks:
        - risk: "Elasticsearch introduces significant operational complexity: cluster setup (even single-node for MVP), index mapping design, index lifecycle management, and keeping the search index in sync with the primary database. Index-database synchronisation is a common failure mode — if an approved mentor's profile update is not propagated to Elasticsearch within the 5-minute SLA, search results become stale and mentors may not appear after approval."
          severity: "high"
          affected_systems: "Elasticsearch cluster, mentor profile service, search sync pipeline"
          mitigation: "Use a change-data-capture (CDC) or event-driven sync pattern: when a mentor profile transitions to approved or is updated, publish a profile_updated event that a sync worker consumes to re-index. Do not use synchronous dual-writes (API writes to DB and Elasticsearch in the same request) — this creates partial failure scenarios. For MVP, a simple async queue-based sync with retry is sufficient."
        - risk: "Elasticsearch index mapping must be designed upfront for the faceted filter requirements (vertical, sub-domain, rating, price, availability, language, country). Changing field types or adding nested mappings after the index is populated requires a full re-index operation, which is operationally disruptive. Incorrect mapping (e.g., keyword vs text for vertical fields, or missing sort field for price) will produce silent search quality degradation."
          severity: "medium"
          affected_systems: "Elasticsearch index, search API, faceted filter UI"
          mitigation: "Design and document the Elasticsearch index mapping before writing any indexing code. Include all filter fields as keyword type for exact-match facets. Include rating and price as numeric fields with sort capability. Validate the mapping against real test data before production indexing begins."
        - risk: "Autocomplete (typeahead) requires either a separate Elasticsearch completion suggester index or a prefix query on the main index. The completion suggester requires a separate input field structure in the mapping and must be populated at index time — it cannot be retrofitted onto an existing mapping without re-indexing. If autocomplete is bolted on after the main search is built, it will require mapping changes and a full re-index."
          severity: "low"
          affected_systems: "Elasticsearch index mapping, search API, UI"
          mitigation: "Include the completion suggester field in the initial index mapping design even if autocomplete is implemented after the core search. This avoids a re-index operation later."
      blockers: []
      sequencing_constraints: "Depends on E2 for approved mentor profiles to populate the search index. Cannot produce meaningful search results without at least minimal mentor supply. Elasticsearch cluster must be provisioned and validated before E4 (Session Booking) begins, since E4's mentor availability display depends on correct mentor data availability — though E4 reads from the primary DB, not Elasticsearch."
      architecture_impact: "Adds Elasticsearch as a new infrastructure component requiring provisioning, monitoring, and operational runbooks. Introduces an async sync pipeline between the primary database and the search index — this is new infrastructure (queue + worker) that must be provisioned alongside Elasticsearch. The sync pipeline's health must be observable (lag metrics, dead-letter queue alerting) to catch index drift early."

    - epic_ref: "E4"
      epic_name: "Session Booking and Video Delivery"
      risk_level: "high"
      technical_risks:
        - risk: "The Zoom SDK integration for in-platform video delivery is the highest-risk technical component in the MVP. Zoom's Web SDK requires a valid JWT signature (SDK key + secret) and a valid meeting ID created via the Zoom Meetings API. The in-browser SDK has known constraints: it requires specific browser versions, does not support all browsers equally (Safari has ongoing WebRTC limitations), and requires HTTPS in production. SDK version updates from Zoom can break existing integrations silently."
          severity: "high"
          affected_systems: "Video session delivery, session join flow, browser compatibility"
          mitigation: "Prototype the Zoom Web SDK integration in isolation before building the booking flow around it. Validate browser compatibility matrix (Chrome, Firefox, Safari, Edge) against target user geographies. Pin the Zoom SDK version and establish a controlled upgrade process. Implement a fallback: if the in-browser SDK fails to load, surface a Zoom join link as an escape hatch. Test on mobile browsers explicitly — the SDK's mobile browser experience is materially different from desktop."
        - risk: "Double-booking prevention requires atomic slot reservation. If two mentees simultaneously attempt to book the same time slot, a naive implementation that checks availability then creates a booking (check-then-act) will fail under concurrent load. This is a classic race condition in booking systems."
          severity: "high"
          affected_systems: "Session booking service, availability management, database"
          mitigation: "Implement slot reservation using a database-level unique constraint on (mentor_id, slot_datetime) or a SELECT FOR UPDATE lock during booking transaction. Do not rely on application-level checks alone. Test concurrent booking scenarios explicitly in the integration test suite."
        - risk: "Timezone handling across India (IST), Switzerland (CET/CEST), USA (multiple zones), and Germany (CET/CEST) is a persistent source of bugs in booking systems. Storing all times as UTC and displaying in user's local timezone is the correct approach, but it requires consistent timezone-aware handling in the backend, the frontend, and the calendar invite generation. A single point of timezone conversion error (e.g., calendar invite generated in server timezone instead of user timezone) causes missed sessions."
          severity: "medium"
          affected_systems: "Session booking service, calendar invite generation, UI date display"
          mitigation: "Store all session datetimes as UTC in the database. Accept user timezone as a required field during booking. Display times in user timezone in all UI surfaces. Generate calendar invites with explicit TZID fields. Write integration tests that assert correct UTC storage and correct per-timezone display for all four target geographies."
        - risk: "Session recording with mutual consent requires storing consent flags at booking time, controlling Zoom recording start/stop via API at session boundaries, and handling stored recording access securely. Recording storage on Zoom's cloud adds ongoing cost per session. Privacy concerns from high-profile mentors in Sport and Entertainment (noted in product.yaml market risks) may increase opt-out rates, making recording a contested feature."
          severity: "low"
          affected_systems: "Zoom API integration, consent management, E7 compliance"
          mitigation: "Implement recording consent as a simple boolean flag stored on the booking entity. Default to opt-out. Recording start/stop can be triggered via Zoom Webhook events (meeting.started, meeting.ended). For MVP, defer recording playback and access management — capture the consent flag and Zoom recording ID but leave playback UI to a post-launch iteration."
      blockers:
        - "Zoom SDK license and API credentials must be obtained before integration development begins. The Zoom Marketplace approval process for apps using the Meeting SDK can take 3-7 business days. This is a procurement blocker that can delay E4 if not started early."
      sequencing_constraints: "E4 is a critical path epic — E5 (Payment) depends on the session lifecycle state machine defined in E4. E6 (Quality/Ratings) triggers on session completion events from E4. E8 (Communications) sends session notifications triggered by E4 state transitions. E4's session state machine must be formally defined and documented before E5 and E8 begin implementation, even if they develop in parallel with E4."
      architecture_impact: "Introduces Zoom as an external real-time dependency — session delivery reliability is now partially outside the platform's control. Session state machine is a shared contract that E5, E6, and E8 all depend on. Requires a webhook endpoint to receive Zoom events (meeting.started, meeting.ended, recording.completed) — this webhook must be authenticated and idempotent. Google Calendar invite generation requires a server-side calendar library or Google Calendar API integration."

    - epic_ref: "E5"
      epic_name: "Payment Processing and Escrow"
      risk_level: "high"
      technical_risks:
        - risk: "PayU's escrow capability varies significantly by geography. PayU India (LazyPay, BharatPe backend) has different API contracts from PayU LATAM or PayU international. The product.yaml assumption that PayU supports escrow-like hold-and-release across India, Switzerland, USA, and Germany in a single integration is the single most consequential technical assumption in the entire roadmap. If PayU does not support hold-and-release across all four countries in a unified API, the escrow model requires either a different payment provider for some geographies or a manual escrow simulation (hold funds in platform account, pay out on completion) which creates regulatory and financial liability."
          severity: "high"
          affected_systems: "Payment processing, escrow workflow, multi-currency support, regulatory compliance"
          mitigation: "Validate PayU's escrow capability per geography BEFORE any E5 development begins. Contact PayU business development for a technical discovery call. If PayU cannot support escrow in all four countries, evaluate Stripe Connect (split payments + payouts across geographies) or Adyen Marketplace as alternatives — both have documented escrow-equivalent flows for marketplace platforms. This validation should happen in parallel with E1-E3 development to avoid a late-stage blocker."
        - risk: "Webhook handling for payment lifecycle events (payment.captured, payment.failed, refund.processed, payout.completed) must be idempotent. PayU (and most payment gateways) deliver webhooks at-least-once — duplicate events will be received. A non-idempotent webhook handler that processes a payment.captured event twice will release escrow twice, creating double-credit to the mentor."
          severity: "high"
          affected_systems: "Payment webhook handler, escrow service, mentor payout service"
          mitigation: "Implement an idempotency key store for all incoming payment webhooks. Before processing any webhook, check if the event ID has been seen before — if yes, return 200 OK without reprocessing. Use the payment gateway's event ID as the idempotency key. Store processed event IDs in a database table with a TTL of 30 days."
        - risk: "Multi-currency payment flows (EUR, USD, CHF, INR) require consistent currency handling throughout the payment stack. A common failure mode is mixing integer (minor units: cents, paise) and decimal (major units: EUR, USD) representations across services, leading to commission calculation errors (10% of EUR 75 calculated as 0.075 instead of 7.50 EUR). Under the EUR 50K budget, this type of financial bug can cause real monetary loss."
          severity: "medium"
          affected_systems: "Payment service, commission calculation, payout processing, financial reporting"
          mitigation: "Adopt a single convention across the entire codebase: store and transmit all monetary values in minor currency units (integer cents/paise). Never use floating-point for money calculations — use integer arithmetic or a Decimal library. Establish this as a code standard enforced by linting rules and code review."
        - risk: "PCI DSS compliance scope, even when using a payment gateway, requires the platform to never log, store, or transmit raw card data. If any logging framework captures request bodies on the payment endpoint, card numbers could end up in application logs. This is a PCI DSS violation that can result in card network fines."
          severity: "medium"
          affected_systems: "Payment endpoint, application logging, request middleware"
          mitigation: "Implement a global request logging middleware that masks or excludes the payment endpoint request body from all logs. Perform a log scanning audit before launch to confirm no PAN (Primary Account Number) patterns appear in log output. Include payment endpoint log exclusion in the QP-7 security testing checklist."
      blockers:
        - "PayU escrow capability per geography must be validated before E5 development begins. If PayU cannot provide escrow-equivalent across all four target countries, an alternative gateway must be selected. This validation is on the critical path."
        - "A platform legal/financial structure for holding funds in escrow must be confirmed. In some jurisdictions, holding customer funds (even briefly) may require a payment institution license. Legal counsel should confirm the regulatory status before launch."
      sequencing_constraints: "Depends on E4 for the session lifecycle state machine — escrow release is triggered by session.completed events from E4. E9 (Referral rewards as platform credit) depends on E5's payment balance model. E10 (Financial dashboard) depends on E5's transaction records. E5 must define and document its transaction data model before E10 begins dashboard development."
      architecture_impact: "Payment processing must be implemented as an isolated module with strict input/output boundaries — no other module should access the payment database tables directly. Webhook endpoint must be exposed on a separate, authenticated path distinct from the main API. Escrow state must be tracked in a dedicated payment ledger table, not inferred from session state. Financial data requires field-level encryption at rest for sensitive payment metadata."

    - epic_ref: "E6"
      epic_name: "Quality Assurance and Ratings"
      risk_level: "low"
      technical_risks:
        - risk: "The review moderation flow (admin approval queue for all reviews) introduces latency between review submission and public visibility. If the admin team is small (as expected for an MVP-stage platform), the review queue could back up, delaying the appearance of reviews on mentor profiles and undermining the real-time quality signal. A review that takes 48+ hours to appear after session completion loses relevance for the next mentee's booking decision."
          severity: "low"
          affected_systems: "Review moderation service, mentor profile display, admin operations"
          mitigation: "Implement a basic automated profanity filter as a first-pass gate — reviews that pass the filter can be auto-approved for display while simultaneously queued for admin review. Only flagged reviews (profanity filter triggered, or dispute-related) require mandatory admin approval before display. This reduces admin queue load while maintaining editorial control."
        - risk: "Dispute initiation workflow must not be conflated with the refund trigger in E5. If the dispute API is accessible without proper authentication, or if the dispute submission handler does not verify that the submitting mentee has a completed session with the disputed mentor, bad actors can file spurious disputes that clog the admin queue and trigger unnecessary investigation cycles."
          severity: "medium"
          affected_systems: "Dispute service, payment service (E5), admin operations (E10)"
          mitigation: "Validate dispute eligibility server-side: only mentees with a completed session against the specified mentor can submit a dispute. Enforce a time window (e.g., 24 hours post-session for no-show disputes). Rate-limit dispute submissions per user. Disputes must not trigger any payment action — they route to the admin queue only. Financial resolution is an admin-initiated action in E10."
        - risk: "NPS survey delivery via email (triggered 15 minutes post-session) depends on the E8 notification infrastructure. If E6 is delivered before E8's SendGrid integration is complete, the post-session rating prompt has no delivery channel. E6's trigger mechanism must be designed as an event that E8 can consume, not a direct email send from the rating service."
          severity: "low"
          affected_systems: "Rating prompt trigger, E8 notification service"
          mitigation: "Design E6's rating prompt as a published event (session.completed → rating_prompt.triggered event). E8 subscribes to this event and handles delivery via SendGrid. This decoupling means E6 can be implemented and integration-tested independently of E8's email delivery."
      blockers: []
      sequencing_constraints: "Depends on E4 (session completion state) and E5 (payment confirmation — ratings only valid after payment is processed). Should be integrated with E8 (Communications) for email delivery of rating prompts. Dispute data feeds E10's admin dispute management panel — E6's dispute data model must be defined before E10's dispute management UI development begins."
      architecture_impact: "Rating aggregation (average score, review count) must be maintained as a materialised value on the mentor profile entity, not computed on read. Recomputing average ratings from all reviews on every mentor profile load will degrade at scale and violate NFR-3 (Optimised Performance). Use an increment-aggregate pattern: update the mentor's aggregate rating atomically when a new review is approved."

    - epic_ref: "E7"
      epic_name: "Compliance and Data Protection"
      risk_level: "high"
      technical_risks:
        - risk: "Data deletion (right to be forgotten) in a distributed system with multiple data stores is significantly more complex than a single-table DELETE. Felly Club's data landscape includes: the primary PostgreSQL database, KeyCloak's user store, the Elasticsearch search index, SendGrid email logs, Zoom session recording metadata (if recordings are enabled), and future backup/archive storage. A data deletion request must reach ALL of these stores. Missing any one store constitutes a GDPR violation. Mapping and implementing a complete deletion chain across all these systems is often underestimated in effort."
          severity: "high"
          affected_systems: "PostgreSQL (all user tables), KeyCloak, Elasticsearch index, SendGrid, Zoom API, backup systems"
          mitigation: "Create a Data Asset Register at the start of E7 — enumerate every system that stores personal data and the deletion API or mechanism for each. Implement data deletion as a choreographed workflow: delete from primary DB → publish deletion event → downstream services (Elasticsearch sync worker, Zoom API client, SendGrid cleanup) consume the event and delete their copies. Verify deletion completeness with a post-deletion audit query. For backups, implement a data masking/purging schedule with documented retention windows."
        - risk: "Immutable audit log implementation is often confused with a standard database table. A standard table can be updated or deleted — it is not audit-evidence-grade. True immutability requires either a write-only append log (no UPDATE/DELETE permissions on the audit table for the application database user), a cryptographic chain (each log entry hashes the previous entry to detect tampering), or an external audit log service. Without genuine immutability, the audit log fails its compliance purpose."
          severity: "medium"
          affected_systems: "Audit log storage, database permissions model, compliance reporting"
          mitigation: "Create a dedicated audit_log table accessible only via INSERT from the application service user — revoke UPDATE and DELETE permissions on this table from the application role. Grant SELECT access only to the admin/compliance role. For additional tamper-evidence, include a SHA-256 hash of the previous entry in each log record (hash chain). This provides defence-in-depth without requiring an external service."
        - risk: "India TPDP (Digital Personal Data Protection Act, 2023) has nuances that differ from GDPR: the consent requirement applies to all personal data processing (not just special categories), data fiduciaries must maintain a record of consent, and the right to erasure applies unless retention is required by law. The TPDP is relatively new (implemented 2023-2025 phased rollout) and implementation guidance is still evolving. Building TPDP compliance features based on current incomplete guidance may require rework when regulations are finalised."
          severity: "medium"
          affected_systems: "Consent management, data processing records, user data deletion"
          mitigation: "Align TPDP implementation with GDPR consent architecture — GDPR consent granularity meets or exceeds TPDP requirements in most respects. Implement a jurisdiction-aware consent renderer that shows GDPR consent for EU/Swiss users and TPDP consent for Indian users. Flag TPDP-specific requirements as a tracked item for legal review post-launch. Do not block the MVP on final TPDP interpretation — implement best-effort compliance and plan a post-launch regulatory review."
      blockers:
        - "Confirming whether the platform qualifies as a 'payment institution' under local financial regulations (particularly RBI in India and FINMA in Switzerland) given the escrow payment model is a legal question that must be answered before launch. This overlaps with E5's escrow compliance blocker."
      sequencing_constraints: "E7 shares the registration flow with E1 — consent collection must be integrated into E1's signup form. E7 must be treated as a parallel development track alongside E1, not a sequential dependency. E7's audit logging must be instrumented in E5 (payment events), E2 (admin approval actions), and E10 (admin operations) — E7's audit event schema must be defined before these epics finalise their data models."
      architecture_impact: "Introduces a compliance data layer: consent records table, audit log table, data deletion workflow orchestrator. The consent service becomes a read dependency for marketing communications (E8 must check consent before sending marketing emails). The audit log writer is a cross-cutting concern that must be instrumented in every module that performs a compliance-relevant action. Data deletion workflow requires a choreography mechanism (event bus or workflow engine) to coordinate deletion across multiple services."

    - epic_ref: "E8"
      epic_name: "Platform Communications"
      risk_level: "low"
      technical_risks:
        - risk: "SendGrid transactional email delivery requires domain authentication (DKIM/SPF/DMARC records on the sender domain) to achieve high deliverability rates. Without proper DNS configuration, transactional emails (booking confirmations, session reminders) land in spam, directly impacting session completion rates. DNS propagation can take 24-48 hours, making this a setup step that cannot be left to the last minute."
          severity: "medium"
          affected_systems: "Email deliverability, SendGrid setup, DNS configuration"
          mitigation: "Configure DKIM/SPF/DMARC records during infrastructure setup, not during E8 feature development. Verify deliverability with test sends to major email providers (Gmail, Outlook, Apple Mail) before launch. Use SendGrid's email activity dashboard to monitor bounce rates and spam reports from launch day."
        - risk: "FCM push notification delivery requires device token registration and management. Device tokens expire, change when users reinstall the app, and require graceful handling of stale tokens (FCM returns errors for expired tokens). For a web app using FCM Web Push, the service worker registration and push permission request UI are additional integration surfaces that can fail silently in certain browser configurations."
          severity: "low"
          affected_systems: "FCM integration, device token management, service worker"
          mitigation: "Treat FCM push notifications as a best-effort channel — all critical notifications (booking confirmation, session reminder) must also be delivered via email as the authoritative channel. If FCM delivery fails, do not retry indefinitely — log the failure and rely on the email channel. Prune stale FCM tokens automatically when FCM returns a token_not_registered error."
        - risk: "In-app messaging threading must enforce that only the matched mentor-mentee pair for a specific booking can exchange messages in that thread. A naive implementation that looks up message threads by user IDs without booking context could allow a mentee who previously booked a mentor to continue messaging after their session relationship has ended, or expose message threads to the wrong parties if IDs are guessable."
          severity: "medium"
          affected_systems: "In-app messaging service, message thread access control, E1 RBAC"
          mitigation: "Anchor each message thread to a specific booking_id, not just to user IDs. Server-side thread access validation must verify that the requesting user (mentor or mentee) is a party to the booking referenced by the thread. Thread IDs should be UUIDs (not sequential integers) to prevent enumeration."
      blockers: []
      sequencing_constraints: "Depends on E4 for session lifecycle events that trigger notifications (booking confirmed, session starting). Should be developed concurrently with E4 but the notification triggers are defined by E4's state machine. E8 provides the delivery channel for E6's post-session rating prompt — E6 and E8 must coordinate on event schema for the rating_prompt.triggered event."
      architecture_impact: "Introduces an asynchronous notification pipeline: session lifecycle events → notification service → SendGrid/FCM delivery. This queue-based architecture is new infrastructure (message queue or event bus) that other epics also benefit from (E6 rating events, E9 referral events). The notification template system must support variable substitution with per-user timezone-localised datetimes — a non-trivial rendering requirement for session reminder emails."

    - epic_ref: "E9"
      epic_name: "Referral and Acquisition Engine"
      risk_level: "low"
      technical_risks:
        - risk: "Referral attribution across the signup funnel requires maintaining a referral context through multiple stateless HTTP requests: the initial link click, the signup form, the email verification redirect, and the first session completion. If any step in this chain fails to persist the referral code (cookie expiry, cross-origin redirect, ad blocker stripping query parameters), attribution is lost and the referrer receives no credit. This is a subtle but common implementation failure."
          severity: "medium"
          affected_systems: "Referral tracking, signup flow, session completion webhook"
          mitigation: "Persist the referral code in a first-party cookie on link click (not just a URL parameter) with a 30-day TTL. Read the cookie during signup and attach the referral_code to the new user's account record. At first session completion, look up the user's stored referral_code to attribute the reward. This cookie-based persistence survives multi-step redirects and email verification flows."
        - risk: "Anti-fraud measures (self-referral prevention, duplicate referral detection) require careful definition of what constitutes fraud. Self-referral is detectable by comparing the referrer user ID with the referred user ID — straightforward. Duplicate referral detection (same person creating multiple accounts to claim referral rewards) requires additional signals: same email domain, same device fingerprint, same IP address. Over-aggressive fraud detection blocks legitimate referrals; under-aggressive detection enables reward abuse."
          severity: "low"
          affected_systems: "Referral service, fraud detection logic, reward disbursement"
          mitigation: "For MVP, implement only deterministic fraud checks: same-account self-referral prevention and same-email duplicate detection. Defer device fingerprinting and IP-based fraud detection to a post-launch iteration. Accept that some reward abuse will occur at MVP scale — the cost is bounded and the engineering overhead of sophisticated fraud detection is disproportionate at this stage."
        - risk: "Referral reward disbursement as platform credit must integrate with E5's payment balance model. Platform credit must be denominated in a specific currency — for a multi-currency platform, this introduces an FX question (is credit EUR always, or in the user's preferred currency?). If credit is in EUR but a user's session is priced in USD, the redemption conversion logic can introduce rounding errors and accounting complexity."
          severity: "low"
          affected_systems: "Referral reward service, E5 payment balance, multi-currency handling"
          mitigation: "Denominate all referral credit in EUR as the platform's base currency for MVP. Apply the current exchange rate at redemption time. Keep referral credit as a separate balance line item distinct from session escrow funds to avoid accounting confusion."
      blockers: []
      sequencing_constraints: "Depends on E5 for payment balance infrastructure (referral credit as platform credit). Should be developed after E5 delivers its payment balance model. Reward disbursement events feed E10's financial dashboard — E9's reward transaction data model must be documented before E10 builds the financial overview."
      architecture_impact: "Referral tracking introduces a new data model (referral_links, referral_events, referral_rewards) that is largely self-contained. The referral code persistence via first-party cookie requires coordination with the registration flow (E1). Attribution analytics dashboard (for admin, in E10) is a read-only reporting view over E9's referral_events table — no new infrastructure required beyond the data model."

    - epic_ref: "E10"
      epic_name: "Admin Operations and Analytics"
      risk_level: "medium"
      technical_risks:
        - risk: "Financial dashboard accuracy requires that all aggregation queries (revenue totals, commission amounts, payout summaries) produce results that exactly match the underlying transaction records. Discrepancies arise when: (a) dashboard queries use eventually-consistent read replicas that lag behind the primary, (b) aggregation logic differs between the dashboard query and the transaction processing logic (different rounding rules, different commission rate lookups), or (c) refunded transactions are not correctly excluded from revenue totals. Financial inaccuracies in the admin dashboard erode operational trust."
          severity: "medium"
          affected_systems: "Financial dashboard, reporting queries, E5 transaction data"
          mitigation: "Compute financial aggregates from the same transaction ledger table that E5 uses for payment processing — do not derive financial figures from session records or secondary tables. If a read replica is used for dashboard queries, implement a staleness indicator showing the replica lag. Reconcile dashboard totals against payment gateway records in a nightly batch job and alert on discrepancies above a threshold."
        - risk: "The admin panel aggregates real-time operational data from multiple upstream epics: E2 (mentor approval queue), E5 (financial data), E6 (dispute queue), E9 (referral rewards). If E10 directly queries each of these modules' databases across module boundaries, it creates tight coupling and performance risk — a slow query in E5's payment tables can block E10's dashboard load. This is the 'god module reads everything' anti-pattern."
          severity: "medium"
          affected_systems: "Admin panel, E2 mentor data, E5 payment data, E6 dispute data, E9 referral data"
          mitigation: "Build E10's dashboard queries on read-optimised reporting tables or materialised views that are updated asynchronously from upstream module events. E10 should not cross module boundaries at the database layer — each upstream module should publish its aggregate metrics to a shared reporting schema that E10 reads. For MVP, a simple reporting schema with scheduled refresh (every 5 minutes) is sufficient."
        - risk: "Role-gating of the admin panel is critical — if any API route in the admin panel fails to enforce the admin role check, it exposes sensitive financial and user data. With KeyCloak RBAC, the risk is not just missing a role check but implementing it inconsistently (e.g., checking role in middleware for some routes but ad-hoc in handlers for others). Inconsistent enforcement creates gaps."
          severity: "medium"
          affected_systems: "Admin panel API routes, E1 RBAC, data privacy"
          mitigation: "Implement role enforcement as a mandatory middleware applied to all admin panel routes at the router level — not as per-handler logic. Write an integration test that asserts every admin panel endpoint returns 403 when called with a mentee or mentor JWT. This test should be part of the CI pipeline and block deployment if any admin route is ungated."
      blockers: []
      sequencing_constraints: "Depends on E2, E4, E5, and E6 for the data that powers its dashboards. Cannot deliver meaningful operational dashboards until these upstream epics are functional. The mentor approval and dispute management panels can be built as shells with empty data early, then connected to live data as upstream epics ship. Financial dashboard should not go live until E5 is in production with real transaction data."
      architecture_impact: "Introduces a reporting layer — either a reporting schema with materialised views or an async event-driven aggregation pipeline. The admin panel is the highest data-breadth component in the platform, consuming data from the widest range of upstream modules. The reporting architecture chosen here determines whether E10 can scale independently of operational data stores. A well-designed reporting schema also serves as the foundation for future analytics features (ML-based predictions deferred to Phase 2)."

  open_questions:
    - question: "Does PayU support escrow-equivalent hold-and-release payment flows (capture at booking, release at session completion, refund on cancellation) across all four target geographies — India, Switzerland, USA, and Germany — in a single unified API integration? The entire E5 payment model depends on this assumption. If PayU cannot support this, which alternative gateway (Stripe Connect or Adyen Marketplace) should be used for which geographies?"
      affected_epics: ["E5", "E4", "E9"]

    - question: "What is the platform's legal/regulatory status for holding funds in escrow? In India, holding customer funds may require RBI registration as a payment aggregator. In Switzerland, FINMA has specific requirements for payment intermediaries. Has legal counsel confirmed that the escrow model is achievable under the current business entity structure without additional licensing?"
      affected_epics: ["E5", "E7"]

    - question: "Will KeyCloak be self-hosted (adding operational overhead and a dedicated database) or deployed via a managed cloud offering (Keycloak-as-a-Service via Red Hat SSO, Phase2ID, or cloud-hosted)? The choice has direct cost and timeline implications under the EUR 50K budget. A self-hosted KeyCloak requires 2-3 days of infrastructure setup and ongoing ops. A managed offering costs more per month but reduces setup risk."
      affected_epics: ["E1", "E7"]

    - question: "What is the Zoom SDK licensing tier required for the session volumes expected at MVP? Zoom's Web SDK usage above the free tier threshold requires a paid Zoom account and SDK licensing agreement. Session recording storage on Zoom Cloud is an additional per-recording-minute cost. Has the Zoom SDK cost been factored into the EUR 50K budget?"
      affected_epics: ["E4"]

    - question: "How will the platform handle multi-currency session pricing display vs. actual charge currency? If a mentor sets their rate in EUR, and a mentee in India books the session, will the mentee be charged in INR (with real-time conversion) or in EUR? The currency mismatch between mentor pricing (EUR/USD) and mentee payment currency (INR) affects both E5's payment flow and E3's search/filter display of prices."
      affected_epics: ["E5", "E3"]

